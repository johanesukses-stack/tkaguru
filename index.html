    const cw = 92, gap = 34, W = items.length * cw + (items.length - 1) * gap + 4, H = 116;
    let body = '';
    items.forEach((it, i) => {
      const x = 2 + i * (cw + gap);
      if (i === o.missing) {
        body += rect(x, 6, cw, 100, { rx: 10, fill: '#FFF8E1', stroke: '#E3A008', sw: 1.6, dash: '5 4' }) + t(x + cw / 2, 52, o.tag || '(X)', { size: 18, weight: 'bold', fill: '#B7791F' }) + t(x + cw / 2, 92, '?', { size: 16, fill: '#B7791F' });
      } else {
        body += rect(x, 6, cw, 100, { rx: 10, fill: '#FFFFFF', stroke: '#C5CEDD', sw: 1.4 }) + drawItem(it, x + cw / 2, 44, 38) + t(x + cw / 2, 92, it.cap || '', { size: 11.5 });
      }
      if (i < items.length - 1) body += arrow(x + cw + 4, 56, x + cw + gap - 4, 56, { stroke: C.ink, sw: 2 });
    });
    return wrap(W, H, body, 'Rantai makanan');
  }
  // nodes: [{id, icon, cap, lv}] (lv 0 = produsen di bawah), edges: [[mangsa, pemangsa]]
  function web(nodes, edges, o = {}) {
    const lvs = Array.from(new Set(nodes.map((n) => n.lv))).sort((a, b) => a - b);
    const W = o.w || 460, rowH = 96, H = o.h || lvs.length * rowH + 10;
    const pos = {};
    lvs.forEach((lv, li) => {
      const row = nodes.filter((n) => n.lv === lv);
      row.forEach((n, i) => { pos[n.id] = n.x != null ? [n.x, n.y] : [((i + 1) * W) / (row.length + 1), H - 50 - li * rowH]; });
    });
    let body = '';
    const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
    // kotak nama simpul: ujung panah digeser keluar dari kotak ini agar arah panah tetap terlihat
    const capBox = (n) => { const [x, y] = pos[n.id], cw = String(n.cap).length * 7 + 10, cy = n.top ? y - 42 : y + 37; return [x - cw / 2 - 3, cy - 14, x + cw / 2 + 3, cy + 7]; };
    const inBox = (bx, px, py) => px > bx[0] && px < bx[2] && py > bx[1] && py < bx[3];
    edges.forEach(([a, b]) => {
      const [x1, y1] = pos[a], [x2, y2] = pos[b];
      const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
      const bA = capBox(byId[a]), bB = capBox(byId[b]);
      let d1 = 30, d2 = 30;
      while (d1 < L / 2 && inBox(bA, x1 + ux * d1, y1 + uy * d1)) d1 += 2;
      while (d2 < L / 2 && inBox(bB, x2 - ux * d2, y2 - uy * d2)) d2 += 2;
      body += arrow(x1 + ux * d1, y1 + uy * d1, x2 - ux * d2, y2 - uy * d2, { stroke: '#5B6678', sw: 1.6 });
    });
    nodes.forEach((n) => {
      const [x, y] = pos[n.id];
      const cy = n.top ? y - 42 : y + 37, cw = String(n.cap).length * 7 + 10;
      // latar putih di belakang nama agar tidak tertutup garis panah
      body += circ(x, y - 4, 27, { fill: '#FFFFFF', stroke: '#C5CEDD', sw: 1.4 }) + drawItem(n, x, y - 6, 30) + rect(x - cw / 2, cy - 11, cw, 15, { rx: 4, fill: '#FFFFFF', stroke: 'none', sw: 0 }) + t(x, cy, n.cap, { size: 11.5, weight: 'bold' });
    });
    return wrap(W, H, body, 'Jaring-jaring makanan');
  }

  /* ----------------------------------------------------- Daur hidup */
  // stages: [{icon|draw, cap, tag}] diletakkan melingkar searah jarum jam.
  function cycle(stages, o = {}) {
    const W = 400, H = 282, cx = 200, cy = 132, rx = 132, ry = 88;
    const n = stages.length;
    const P = stages.map((s, i) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / n; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
    let body = '';
    P.forEach((p, i) => {
      const q = P[(i + 1) % n];
      const a1 = Math.atan2(q[1] - p[1], q[0] - p[0]);
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      const ox = (mx - cx) * 0.18, oy = (my - cy) * 0.18;
      const sx = p[0] + 40 * Math.cos(a1), sy = p[1] + 34 * Math.sin(a1), ex = q[0] - 40 * Math.cos(a1), ey = q[1] - 34 * Math.sin(a1);
      body += path(`M${n2(sx)} ${n2(sy)} Q ${n2(mx + ox)} ${n2(my + oy)} ${n2(ex)} ${n2(ey)}`, { stroke: '#7B8798', sw: 2 });
      const ang = Math.atan2(ey - (my + oy), ex - (mx + ox));
      body += poly([[ex, ey], [ex - 9 * Math.cos(ang - 0.45), ey - 9 * Math.sin(ang - 0.45)], [ex - 9 * Math.cos(ang + 0.45), ey - 9 * Math.sin(ang + 0.45)]], { fill: '#7B8798', stroke: '#7B8798', sw: 1 });
    });
    stages.forEach((s, i) => {
      const [x, y] = P[i];
      body += circ(x, y, 32, { fill: '#FFFFFF', stroke: '#C5CEDD', sw: 1.4 }) + drawItem(s, x, y - 2, s.size || 34);
      if (s.tag) body += tag(x + 30, y - 28, s.tag, { fill: '#FFF8E1' });
      if (s.cap) body += t(x, y + 46, s.cap, { size: 11.5, weight: 'bold' });
    });
    return wrap(W, H, body, o.label || 'Daur hidup');
  }

  /* --------------------------------------------------- Otot & sendi */
  function muscles(order) {
    // order: [{kind:'polos'|'lurik'|'jantung', tag}]
    const pw = 128, ph = 132, gap = 12, W = order.length * (pw + gap) - gap + 4, H = ph + 4;
    const draw = {
      polos: (x, y) => [[18, 30], [62, 22], [34, 58], [80, 52], [20, 86], [66, 84], [42, 108]].map(([dx, dy]) => path(`M${x + dx} ${y + dy} Q ${x + dx + 22} ${y + dy - 9} ${x + dx + 44} ${y + dy} Q ${x + dx + 22} ${y + dy + 9} ${x + dx} ${y + dy} Z`, { fill: '#F6B7B7', stroke: '#B85C5C', sw: 1.2 }) + ell(x + dx + 22, y + dy, 4, 2.6, { fill: '#6A1B9A', stroke: 'none', sw: 0 })).join(''),
      lurik: (x, y) => [24, 52, 80, 108].map((dy) => rect(x + 10, y + dy - 11, 108, 22, { rx: 9, fill: '#F6B7B7', stroke: '#B85C5C', sw: 1.2 }) + Array.from({ length: 20 }, (_, k) => line(x + 16 + k * 5, y + dy - 10, x + 16 + k * 5, y + dy + 10, { stroke: '#C77', sw: 0.9 })).join('') + [30, 70, 104].map((nx) => ell(x + nx, y + dy - 9, 4, 2.2, { fill: '#6A1B9A', stroke: 'none', sw: 0 })).join('')).join(''),
      jantung: (x, y) => path(`M${x + 8} ${y + 34} L${x + 52} ${y + 30} L${x + 70} ${y + 14} L${x + 120} ${y + 18} L${x + 120} ${y + 36} L${x + 78} ${y + 34} L${x + 62} ${y + 52} L${x + 120} ${y + 60} L${x + 120} ${y + 78} L${x + 56} ${y + 72} L${x + 40} ${y + 92} L${x + 120} ${y + 98} L${x + 120} ${y + 116} L${x + 8} ${y + 112} L${x + 8} ${y + 94} L${x + 30} ${y + 76} L${x + 8} ${y + 72} L${x + 8} ${y + 54} L${x + 40} ${y + 52} L${x + 8} ${y + 50} Z`, { fill: '#F6B7B7', stroke: '#B85C5C', sw: 1.2 }) + Array.from({ length: 22 }, (_, k) => line(x + 12 + k * 5, y + 20, x + 12 + k * 5, y + 112, { stroke: '#D99', sw: 0.6 })).join('') + [[30, 42], [92, 26], [86, 66], [70, 104], [24, 102]].map(([dx, dy]) => ell(x + dx, y + dy, 4, 3, { fill: '#6A1B9A', stroke: 'none', sw: 0 })).join('') + [[60, 32], [98, 70], [52, 108]].map(([dx, dy]) => line(x + dx, y + dy - 7, x + dx, y + dy + 7, { stroke: '#7B1F1F', sw: 2.4 })).join(''),
    };
    const body = order.map((m, i) => { const x = 2 + i * (pw + gap); return rect(x, 2, pw, ph, { rx: 10, fill: '#FFFFFF', stroke: '#C5CEDD', sw: 1.4 }) + `<g>${draw[m.kind](x, 2)}</g>` + tag(x + 20, 18, m.tag); }).join('');
    return wrap(W, H, body, 'Jenis otot');
  }
  function joints(order) {
    // order: [{kind:'engsel'|'peluru'|'putar'|'pelana', tag}]
    const pw = 112, ph = 150, gap = 12, W = order.length * (pw + gap) - gap + 4, H = ph + 4;
    const bone = '#F5EBD8', bs = '#8D7B5A';
    const draw = {
      engsel: (x, y) => rect(x + 46, y + 14, 20, 52, { rx: 6, fill: bone, stroke: bs, sw: 1.6 }) + circ(x + 56, y + 70, 14, { fill: bone, stroke: bs, sw: 1.6 }) + path(`M${x + 40} ${y + 92} Q ${x + 56} ${y + 76} ${x + 72} ${y + 92} L${x + 68} ${y + 136} L${x + 44} ${y + 136} Z`, { fill: bone, stroke: bs, sw: 1.6 }) + path(`M${x + 86} ${y + 104} A 30 30 0 0 0 ${x + 86} ${y + 50}`, { stroke: C.blue, sw: 2 }) + SVG.arrow(x + 86, y + 56, x + 86, y + 48, { stroke: C.blue, sw: 2 }),
      peluru: (x, y) => path(`M${x + 30} ${y + 52} A 26 26 0 0 0 ${x + 82} ${y + 52}`, { fill: '#EDE3CF', stroke: bs, sw: 3 }) + circ(x + 56, y + 58, 18, { fill: bone, stroke: bs, sw: 1.6 }) + rect(x + 47, y + 72, 18, 62, { rx: 6, fill: bone, stroke: bs, sw: 1.6 }) + [[-1, 0], [1, 0], [0, 1]].map(([dx, dy]) => SVG.arrow(x + 56 + dx * 30, y + 112 + dy * 22, x + 56 + dx * 46, y + 112 + dy * 34, { stroke: C.blue, sw: 2 })).join(''),
      putar: (x, y) => rect(x + 50, y + 12, 14, 124, { rx: 6, fill: bone, stroke: bs, sw: 1.6 }) + ell(x + 57, y + 62, 24, 8, { fill: 'none', stroke: bs, sw: 6 }) + path(`M${x + 24} ${y + 88} A 34 12 0 0 0 ${x + 90} ${y + 88}`, { stroke: C.blue, sw: 2 }) + SVG.arrow(x + 84, y + 93, x + 92, y + 86, { stroke: C.blue, sw: 2 }),
      pelana: (x, y) => path(`M${x + 30} ${y + 18} L${x + 82} ${y + 18} L${x + 82} ${y + 60} Q ${x + 56} ${y + 76} ${x + 30} ${y + 60} Z`, { fill: bone, stroke: bs, sw: 1.6 }) + path(`M${x + 30} ${y + 70} Q ${x + 56} ${y + 86} ${x + 82} ${y + 70} L${x + 82} ${y + 136} L${x + 30} ${y + 136} Z`, { fill: '#EFE3CB', stroke: bs, sw: 1.6 }) + SVG.arrow(x + 16, y + 74, x + 6, y + 74, { stroke: C.blue, sw: 2 }) + SVG.arrow(x + 96, y + 74, x + 106, y + 74, { stroke: C.blue, sw: 2 }) + SVG.arrow(x + 56, y + 142, x + 56, y + 150, { stroke: C.blue, sw: 2 }),
    };
    const body = order.map((m, i) => { const x = 2 + i * (pw + gap); return rect(x, 2, pw, ph, { rx: 10, fill: '#FFFFFF', stroke: '#C5CEDD', sw: 1.4 }) + draw[m.kind](x, 2) + tag(x + 20, 18, m.tag); }).join('');
    return wrap(W, H, body, 'Jenis sendi');
  }

  /* ----------------------------------------------- Perubahan wujud */
  // arrows: { mencair: '1', membeku: '2', ... } → nomor pada setiap panah.
  function wujud(nums) {
    const W = 380, H = 250;
    const box = (x, y, label, ic) => rect(x - 50, y - 26, 100, 52, { rx: 12, fill: '#EEF3FE', stroke: C.blue, sw: 1.8 }) + emo(x - 26, y, ic, 22) + t(x + 14, y + 5, label, { size: 15, weight: 'bold' });
    const P = { padat: [190, 40], cair: [70, 206], gas: [310, 206] };
    const A = [
      ['mencair', 'padat', 'cair', -1], ['membeku', 'cair', 'padat', -1], ['menguap', 'cair', 'gas', 1], ['mengembun', 'gas', 'cair', 1],
      ['menyublim', 'padat', 'gas', 1], ['mengkristal', 'gas', 'padat', 1],
    ];
    let body = '';
    const ORD = ['padat', 'cair', 'gas'];
    A.forEach(([proc, a, b]) => {
      const [p0, p1] = ORD.indexOf(a) < ORD.indexOf(b) ? [a, b] : [b, a];
      const cdx = P[p1][0] - P[p0][0], cdy = P[p1][1] - P[p0][1], CL = Math.hypot(cdx, cdy);
      const side = a === p0 ? 1 : -1, nx = (-cdy / CL) * 9 * side, ny = (cdx / CL) * 9 * side;
      const [x1, y1] = P[a], [x2, y2] = P[b];
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const sx = x1 + ux * 54 + nx, sy = y1 + uy * 36 + ny, ex = x2 - ux * 54 + nx, ey = y2 - uy * 36 + ny;
      body += arrow(sx, sy, ex, ey, { stroke: C.ink, sw: 1.8 });
      const mx = (sx + ex) / 2 + nx * 2.6, my = (sy + ey) / 2 + ny * 2.6;
      if (nums[proc]) body += tag(mx, my, nums[proc], { fill: '#FFF8E1' });
    });
    body += box(P.padat[0], P.padat[1], 'padat', '🧊') + box(P.cair[0], P.cair[1], 'cair', '💧') + box(P.gas[0], P.gas[1], 'gas', '♨️');
    return wrap(W, H, body, 'Bagan perubahan wujud');
  }

  /* ------------------------------------------------------------ Cahaya */
  // Pembiasan/pemantulan: berkas datang + beberapa berkas pilihan bernomor.
  function rays(kind, cands) {
    const W = 380, H = kind === 'bias' ? 250 : 176, X = 190, Y = 125;
    let body = '';
    if (kind === 'bias') {
      body += rect(20, Y, 340, 110, { fill: '#DCEEFF', stroke: 'none', sw: 0 }) + line(20, Y, 360, Y, { stroke: '#1E88E5', sw: 2 }) + t(40, 40, 'udara', { size: 13, anchor: 'start', fill: C.muted }) + t(40, Y + 96, 'air', { size: 13, anchor: 'start', fill: '#1565C0' });
    } else {
      body += line(40, Y, 340, Y, { stroke: '#455A64', sw: 4 }) + Array.from({ length: 15 }, (_, k) => line(48 + k * 20, Y + 3, 38 + k * 20, Y + 15, { stroke: '#90A4AE', sw: 1.4 })).join('') + t(330, Y + 30, 'cermin datar', { size: 12, anchor: 'end', fill: C.muted });
    }
    body += line(X, 16, X, kind === 'bias' ? 236 : Y, { stroke: '#7B8798', sw: 1.4, dash: '6 5' }) + t(X - 6, 26, 'garis normal', { size: 11, anchor: 'end', fill: C.muted });
    body += arrow(70, 20, X, Y, { stroke: '#E3A008', sw: 3 }) + t(66, 16, 'sinar datang', { size: 11.5, anchor: 'end', fill: '#B7791F' });
    cands.forEach((c) => {
      const [ex, ey] = c.end, a = Math.atan2(ey - Y, ex - X);
      body += arrow(X, Y, ex, ey, { stroke: '#E0664B', sw: 2.4 }) + tag(ex + 17 * Math.cos(a), ey + 17 * Math.sin(a), c.tag, { fill: '#FFF3E0' });
    });
    return wrap(W, H, body, kind === 'bias' ? 'Pembiasan cahaya' : 'Pemantulan cahaya');
  }

  /* ------------------------------------------------------------- Bunyi */
  function bars(lens, tags, o = {}) {
    const W = 380, H = 200;
    let body = rect(30, 150, 320, 18, { rx: 4, fill: '#8D6E63', stroke: '#5D4037', sw: 1.6 }) + rect(40, 168, 300, 14, { rx: 3, fill: '#6D4C41', stroke: '#4E342E', sw: 1.4 });
    const n = lens.length, step = 300 / n;
    lens.forEach((L, i) => {
      const x = 46 + i * step, w = step - 14;
      body += rect(x, 146 - L, w, L, { rx: 3, fill: '#D4AF37', stroke: '#8D6E1F', sw: 1.6 }) + circ(x + w / 2, 146 - L + 10, 3, { fill: '#8D6E1F', stroke: 'none', sw: 0 }) + tag(x + w / 2, 146 - L - 18, tags[i]);
    });
    if (o.cap) body += t(190, 196, o.cap, { size: 11.5, fill: C.muted });
    return wrap(W, H, body, 'Bilah alat musik');
  }
  function bottles(levels, tags, o = {}) {
    const W = 380, H = 226;
    let body = '';
    levels.forEach((lv, i) => {
      const x = 40 + i * 84, top = 62, bot = 202, h = bot - top;
      const wy = bot - (h - 26) * lv;
      body += rect(x + 2, wy, 52, bot - wy, { rx: 6, fill: '#90CAF9', stroke: 'none', sw: 0 });
      body += path(`M${x + 18} ${top - 28} L${x + 18} ${top - 4} C ${x + 4} ${top + 4}, ${x} ${top + 14}, ${x} ${top + 24} L${x} ${bot - 6} Q ${x} ${bot} ${x + 6} ${bot} L${x + 50} ${bot} Q ${x + 56} ${bot} ${x + 56} ${bot - 6} L${x + 56} ${top + 24} C ${x + 56} ${top + 14}, ${x + 52} ${top + 4}, ${x + 38} ${top - 4} L${x + 38} ${top - 28} Z`, { stroke: '#455A64', sw: 2 });
      body += tag(x + 28, bot + 14, tags[i]);
    });
    if (o.cap) body += t(190, 14, o.cap, { size: 12, fill: C.muted });
    return wrap(W, H + 12, body, 'Botol berisi air');
  }

  /* -------------------------------------------------------- Tata surya */
  const PLANETS = [
    ['Merkurius', 3.5, '#9E9E9E'], ['Venus', 5.5, '#E8C07D'], ['Bumi', 6, '#4A90D9'], ['Mars', 4.5, '#D2603A'],
    ['Jupiter', 13, '#D9A066'], ['Saturnus', 11, '#E6C98A'], ['Uranus', 8, '#8FD3D8'], ['Neptunus', 7.5, '#4B6FD8'],
  ];
  function solar(tags) {
    // tags: { indexPlanet(0..7): 'label' }
    const W = 480, H = 230, sx = -64, sy = 115;
    let body = rect(0, 0, W, H, { fill: '#0F1B3D', stroke: 'none', sw: 0 }) + circ(sx, sy, 80, { fill: '#FFC107', stroke: '#FF9800', sw: 3 });
    const R = [94, 120, 148, 176, 236, 300, 372, 434];
    const ANG = [-0.55, 0.42, -0.2, 0.5, -0.32, 0.28, -0.12, 0.2];
    R.forEach((r, i) => { body += path(`M${n2(sx + r * Math.cos(-0.82))} ${n2(sy + r * Math.sin(-0.82))} A ${r} ${r} 0 0 1 ${n2(sx + r * Math.cos(0.82))} ${n2(sy + r * Math.sin(0.82))}`, { stroke: '#5C6B99', sw: 1, dash: '3 4' }); });
    PLANETS.forEach(([nm, pr, col], i) => {
      const a = ANG[i] * (i < 4 ? 1 : 0.6), x = sx + R[i] * Math.cos(a), y = sy + R[i] * Math.sin(a);
      if (nm === 'Saturnus') body += ell(x, y, pr * 1.9, pr * 0.55, { stroke: '#F3E2B3', sw: 2.4 });
      body += circ(x, y, pr, { fill: col, stroke: 'none', sw: 0 });
      if (tags[i]) body += `${line(x, y - pr - 2, x, y - pr - 16, { stroke: '#FFFFFF', sw: 1.2 })}${tag(x, y - pr - 28, tags[i])}`;
    });
    return wrap(W, H, body, 'Susunan tata surya');
  }

  /* ----------------------------------------------------------- Gerhana */
  // kind 'matahari' | 'bulan'; marks: { posisiBenda: label } atau wilayah umbra/penumbra
  function eclipse(kind, o = {}) {
    const W = 460, H = 220, cy = 110;
    let body = rect(0, 0, W, H, { fill: '#0F1B3D', stroke: 'none', sw: 0 });
    const sun = [50, cy, 46];
    if (kind === 'matahari') {
      const moon = [230, cy, 11], earth = [390, cy, 42];
      body += poly([[moon[0], cy - 11], [earth[0] - 40, cy - 34], [earth[0] - 40, cy + 34], [moon[0], cy + 11]], { fill: '#5C6B99', stroke: 'none', sw: 0 });
      body += poly([[moon[0], cy - 11], [earth[0] - 40, cy - 6], [earth[0] - 40, cy + 6], [moon[0], cy + 11]], { fill: '#1A1A1A', stroke: 'none', sw: 0 });
      body += circ(...sun, { fill: '#FFC107', stroke: '#FF9800', sw: 3 }) + circ(...earth, { fill: '#4A90D9', stroke: '#2E6DB5', sw: 2 }) + circ(...moon, { fill: '#BDBDBD', stroke: '#757575', sw: 1.4 });
      if (o.region) {
        body += pointer(earth[0] - 41, cy, earth[0] - 6, cy + 66, o.region.umbra, '#FFFFFF');
        body += pointer(earth[0] - 36, cy - 26, earth[0] - 6, cy - 72, o.region.penumbra, '#FFFFFF');
      }
    } else {
      const earth = [240, cy, 34], moon = [400, cy, 12];
      body += poly([[earth[0], cy - 34], [430, cy - 14], [430, cy + 14], [earth[0], cy + 34]], { fill: '#1A1A1A', stroke: 'none', sw: 0 });
      body += poly([[earth[0], cy - 34], [430, cy - 52], [430, cy - 14]], { fill: '#3B4675', stroke: 'none', sw: 0 }) + poly([[earth[0], cy + 34], [430, cy + 52], [430, cy + 14]], { fill: '#3B4675', stroke: 'none', sw: 0 });
      body += circ(...sun, { fill: '#FFC107', stroke: '#FF9800', sw: 3 }) + circ(...earth, { fill: '#4A90D9', stroke: '#2E6DB5', sw: 2 }) + circ(...moon, { fill: '#8D6E63', stroke: '#5D4037', sw: 1.4 });
    }
    const names = o.names || {};
    const pos = kind === 'matahari' ? { matahari: 50, bulan: 230, bumi: 390 } : { matahari: 50, bumi: 240, bulan: 400 };
    Object.entries(pos).forEach(([b, x]) => { if (names[b]) body += t(x, H - 14, names[b], { size: 13, weight: 'bold', fill: '#FFFFFF' }); });
    return wrap(W, H, body, 'Posisi matahari, bumi, dan bulan');
  }

  /* -------------------------------------------------- Rotasi bumi */
  function rotation(o = {}) {
    const W = 420, H = 220, ex = 270, ey = 110, r = 70;
    let body = rect(0, 0, W, H, { fill: '#0F1B3D', stroke: 'none', sw: 0 }) + circ(-30, ey, 80, { fill: '#FFC107', stroke: '#FF9800', sw: 3 });
    [-50, -20, 10, 40].forEach((dy) => { body += arrow(66, ey + dy, 180, ey + dy * 0.6, { stroke: '#FFE082', sw: 1.6 }); });
    body += circ(ex, ey, r, { fill: '#4A90D9', stroke: '#2E6DB5', sw: 2 });
    body += path(`M${ex} ${ey - r} A ${r} ${r} 0 0 1 ${ex} ${ey + r} Z`, { fill: '#0B1330', stroke: 'none', sw: 0, op: 0.72 });
    body += path(`M${ex - 40} ${ey - 30} q 14 -10 24 4 q 10 14 -4 26 q -16 6 -20 -14 z M${ex + 10} ${ey + 20} q 18 -8 26 6 q -4 16 -22 10 z`, { fill: '#7CB342', stroke: 'none', sw: 0 });
    body += line(ex - 18, ey - r - 22, ex + 18, ey + r + 22, { stroke: '#FFFFFF', sw: 1.6, dash: '5 4' });
    body += path(`M${ex - 66} ${ey + 40} A 80 26 0 0 0 ${ex + 66} ${ey + 40}`, { stroke: '#FFFFFF', sw: 2 }) + SVG.arrow(ex + 58, ey + 50, ex + 68, ey + 38, { stroke: '#FFFFFF', sw: 2 });
    if (o.marks) Object.entries(o.marks).forEach(([side, lab]) => { const px = side === 'siang' ? ex - 40 : ex + 40; body += circ(px, ey - 6, 4, { fill: '#FFFFFF', stroke: '#000', sw: 1 }) + tag(px, ey - 30, lab); });
    body += t(ex, H - 8, 'arah rotasi', { size: 11, fill: '#FFFFFF' });
    return wrap(W, H, body, 'Rotasi bumi');
  }

  /* ---------------------------------------- Percobaan bidang miring (gaya) */
  function ramp(surfaces) {
    const W = 420, H = 170;
    let body = poly([[20, 40], [20, 140], [160, 140]], { fill: '#D7CCC8', stroke: '#6D4C41', sw: 1.8 }) + rect(160, 136, 250, 10, { fill: '#BCAAA4', stroke: '#6D4C41', sw: 1.4 });
    body += emo(48, 50, '🚗', 26) + t(112, 72, 'mobil mainan dilepas', { size: 11, anchor: 'start', fill: C.muted });
    body += t(285, 128, `lintasan: ${surfaces.join(' / ')}`, { size: 11.5, fill: C.muted }) + arrow(170, 158, 400, 158, { stroke: C.muted, sw: 1.4 }) + t(285, 168, 'jarak tempuh diukur', { size: 10.5, fill: C.muted });
    return wrap(W, H + 6, body, 'Percobaan mobil mainan pada bidang miring');
  }

  /* ----------------------------------------------- Kacamata/penglihatan */
  function focus(kind) {
    // titik fokus bayangan jatuh di depan (miopi) atau di belakang (hipermetropi) retina
    const W = 380, H = 190, cx = 220, cy = 95, R = 70;
    let body = circ(cx, cy, R, { fill: '#F4F9FF', stroke: C.line, sw: 2.6 }) + path(`M${cx + 40} ${cy - 57} A 70 70 0 0 1 ${cx + 40} ${cy + 57}`, { stroke: '#D9534F', sw: 4 }) + ell(cx - 52, cy, 9, 22, { fill: '#CDE6FA', stroke: C.line, sw: 1.4 });
    const fx = kind === 'miopi' ? cx + 30 : cx + 110;
    [-14, 14].forEach((dy) => { body += line(20, cy + dy, cx - 52, cy + dy, { stroke: '#E3A008', sw: 2 }) + line(cx - 52, cy + dy, fx, cy, { stroke: '#E3A008', sw: 2 }); });
    if (kind === 'miopi') [-14, 14].forEach((dy) => { body += line(fx, cy, cx + 66, cy - dy * 0.9, { stroke: '#E3A008', sw: 2, dash: '4 3' }); });
    body += circ(fx, cy, 3.5, { fill: '#C8352B', stroke: 'none', sw: 0 }) + t(fx, cy + (kind === 'miopi' ? 22 : -14), 'titik bayangan', { size: 11, fill: '#C8352B' }) + t(cx + 66, cy + R + 18, 'retina', { size: 11, fill: C.muted });
    return wrap(W, H + 8, body, 'Jatuhnya bayangan pada mata');
  }

  return { organ, ORG, panel, chain, web, cycle, muscles, joints, wujud, rays, bars, bottles, solar, PLANETS, eclipse, rotation, ramp, focus, DRAW, emo, tag, pointer };
})();

/* ===== 35_ipa_bio.js ===== */
/* ==========================================================================
   35_ipa_bio.js — bank template soal IPAS (muatan IPA) bagian Biologi.
   Setiap template menghasilkan soal mandiri bergambar; label gambar, opsi,
   dan kunci dibangkitkan bersama sehingga kunci selalu sesuai gambar.
   Soal disusun orisinal berdasarkan cakupan CP Fase B–C (BSKAP 46/2025).
   ========================================================================== */
const IPA = (() => {
  const { pg, pgk, tab, GE } = MATH;
  const T = [];
  const L4 = ['A', 'B', 'C', 'D', 'E'];
  const NUM = ['1', '2', '3', '4', '5', '6', '7', '8'];
  const nb = (i) => `(${NUM[i]})`;
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const svgV = (svg) => [{ type: 'svg', svg }];
  const join = (arr) => (arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + (arr.length > 2 ? ', dan ' : ' dan ') + arr[arr.length - 1]);
  // Opsi kombinasi nomor, mis. "(1) dan (3)".
  const combo = (idx) => join(idx.slice().sort((a, b) => a - b).map(nb));
  function comboWrongs(r, correct, n, k, need = 3) {
    const out = new Set(); const key = combo(correct);
    let g = 0;
    while (out.size < need && g++ < 200) {
      const c = r.sample(Array.from({ length: n }, (_, i) => i), k);
      const s = combo(c); if (s !== key) out.add(s);
    }
    if (out.size < need) throw new GE('kombinasi kurang');
    return Array.from(out);
  }
  // Pernyataan benar/salah dari daftar fakta: [{t: teks benar, f: teks salah, why}]
  function tfItems(r, facts, n = 4) {
    const pick = r.sample(facts, Math.min(n, facts.length));
    const k = Math.max(1, Math.min(pick.length - 1, r.int(1, pick.length - 1)));
    const trueIdx = new Set(r.sample(pick.map((_, i) => i), k));
    return pick.map((f, i) => (trueIdx.has(i) || !f.f ? { text: f.t, ans: 0, why: f.why || '' } : { text: f.f, ans: 1, why: f.why || '' }));
  }
  const reg = (tpl) => { tpl.subj = 'ipas'; tpl.qs.forEach((m) => { if (!m.ind) m.ind = tpl.ind || ''; }); T.push(tpl); };
  const LEAD = { gambar: 'Perhatikan gambar berikut!', tabel: 'Perhatikan tabel berikut!' };

  /* ======================================================================
     1. ORGAN BERLABEL (mata, telinga, pernapasan, pencernaan, jantung)
     ====================================================================== */
  const PARTS = {
    mata: { code: 'IPA-01', fig: 'mata', nama: 'mata', items: {
      kornea: { n: 'kornea', f: 'melindungi bagian depan mata dan meneruskan cahaya yang masuk' },
      iris: { n: 'iris (selaput pelangi)', f: 'memberi warna pada mata dan mengatur lebar pupil' },
      pupil: { n: 'pupil', f: 'mengatur banyaknya cahaya yang masuk ke mata' },
      lensa: { n: 'lensa mata', f: 'memfokuskan cahaya agar bayangan jatuh tepat di retina' },
      retina: { n: 'retina (selaput jala)', f: 'tempat terbentuknya bayangan benda' },
      'saraf mata': { n: 'saraf mata', f: 'meneruskan rangsang cahaya ke otak' },
      sklera: { n: 'sklera (selaput putih)', f: 'melindungi bola mata dan memberi bentuk pada mata' },
    }, near: [['pupil', 'iris'], ['kornea', 'sklera']], seq: ['kornea', 'pupil', 'lensa', 'retina', 'saraf mata'], seqTxt: 'cahaya dari benda masuk ke mata hingga rangsangnya sampai ke otak' },
    telinga: { code: 'IPA-02', fig: 'telinga', nama: 'telinga', items: {
      'daun telinga': { n: 'daun telinga', f: 'menangkap dan mengumpulkan gelombang bunyi' },
      'saluran telinga': { n: 'saluran telinga', f: 'menyalurkan gelombang bunyi menuju gendang telinga' },
      'gendang telinga': { n: 'gendang telinga', f: 'menerima gelombang bunyi sehingga ikut bergetar' },
      'tulang pendengaran': { n: 'tulang-tulang pendengaran', f: 'memperkuat getaran dan meneruskannya ke telinga bagian dalam' },
      'saluran setengah lingkaran': { n: 'saluran setengah lingkaran', f: 'menjaga keseimbangan tubuh' },
      'rumah siput': { n: 'rumah siput (koklea)', f: 'mengubah getaran menjadi rangsang yang diteruskan ke saraf' },
      'saraf pendengaran': { n: 'saraf pendengaran', f: 'meneruskan rangsang bunyi ke otak' },
      'saluran eustachius': { n: 'saluran eustachius', f: 'menyamakan tekanan udara di telinga tengah dengan udara luar' },
    }, near: [['rumah siput', 'saraf pendengaran']], seq: ['daun telinga', 'saluran telinga', 'gendang telinga', 'tulang pendengaran', 'rumah siput', 'saraf pendengaran'], seqTxt: 'bunyi dari luar sampai rangsangnya diteruskan ke otak' },
    pernapasan: { code: 'IPA-06', fig: 'pernapasan', nama: 'organ pernapasan', items: {
      'rongga hidung': { n: 'rongga hidung', f: 'menyaring, menghangatkan, dan melembapkan udara yang masuk' },
      laring: { n: 'pangkal tenggorokan (laring)', f: 'tempat pita suara yang menghasilkan suara' },
      trakea: { n: 'batang tenggorokan (trakea)', f: 'menyalurkan udara dari pangkal tenggorokan ke cabang tenggorokan' },
      bronkus: { n: 'cabang tenggorokan (bronkus)', f: 'menyalurkan udara ke paru-paru kanan dan paru-paru kiri' },
      bronkiolus: { n: 'bronkiolus', f: 'menyalurkan udara dari bronkus ke gelembung paru-paru (alveolus)' },
      'paru-paru': { n: 'paru-paru', f: 'tempat pertukaran oksigen dan karbon dioksida' },
      diafragma: { n: 'diafragma', f: 'sekat rongga dada dan rongga perut yang membantu proses menghirup dan menghembuskan napas' },
    }, near: [['bronkus', 'bronkiolus']], seq: ['rongga hidung', 'laring', 'trakea', 'bronkus', 'bronkiolus', 'paru-paru'], seqTxt: 'udara dihirup dari luar sampai ke tempat pertukaran gas' },
    pencernaan: { code: 'IPA-07', fig: 'pencernaan', nama: 'organ pencernaan', items: {
      mulut: { n: 'mulut', f: 'mencerna makanan secara mekanis dengan gigi dan secara kimiawi dengan enzim ptialin' },
      kerongkongan: { n: 'kerongkongan', f: 'menyalurkan makanan ke lambung dengan gerak peristaltik' },
      hati: { n: 'hati', f: 'menghasilkan cairan empedu yang membantu mencerna lemak' },
      lambung: { n: 'lambung', f: 'mencerna makanan dengan bantuan asam lambung (HCl) dan enzim pepsin' },
      pankreas: { n: 'pankreas', f: 'menghasilkan enzim amilase, lipase, dan tripsin' },
      'usus halus': { n: 'usus halus', f: 'menyerap sari-sari makanan ke dalam darah' },
      'usus besar': { n: 'usus besar', f: 'menyerap air dan tempat pembusukan sisa makanan oleh bakteri E. coli' },
      anus: { n: 'anus', f: 'tempat keluarnya sisa pencernaan (feses)' },
    }, seq: ['mulut', 'kerongkongan', 'lambung', 'usus halus', 'usus besar', 'anus'], seqTxt: 'makanan masuk sampai sisa pencernaan dikeluarkan' },
    jantung: { code: 'IPA-08', fig: 'jantung', nama: 'jantung', items: {
      'serambi kanan': { n: 'serambi kanan', f: 'menerima darah yang banyak mengandung karbon dioksida dari seluruh tubuh' },
      'bilik kanan': { n: 'bilik kanan', f: 'memompa darah yang banyak mengandung karbon dioksida ke paru-paru' },
      'serambi kiri': { n: 'serambi kiri', f: 'menerima darah yang banyak mengandung oksigen dari paru-paru' },
      'bilik kiri': { n: 'bilik kiri', f: 'memompa darah yang banyak mengandung oksigen ke seluruh tubuh' },
      aorta: { n: 'aorta (pembuluh nadi besar)', f: 'mengalirkan darah kaya oksigen dari bilik kiri ke seluruh tubuh' },
      'arteri pulmonalis': { n: 'pembuluh nadi paru-paru', f: 'mengalirkan darah kaya karbon dioksida dari bilik kanan ke paru-paru' },
      'vena cava': { n: 'pembuluh balik besar (vena cava)', f: 'mengalirkan darah kaya karbon dioksida dari seluruh tubuh ke serambi kanan' },
      'vena pulmonalis': { n: 'pembuluh balik paru-paru', f: 'mengalirkan darah kaya oksigen dari paru-paru ke serambi kiri' },
    }, near: [['bilik kanan', 'arteri pulmonalis'], ['bilik kiri', 'aorta'], ['serambi kanan', 'vena cava'], ['serambi kiri', 'vena pulmonalis']], seq: ['bilik kanan', 'arteri pulmonalis', 'vena pulmonalis', 'serambi kiri'], seqTxt: 'darah pada peredaran darah kecil (dari jantung ke paru-paru dan kembali ke jantung)' },
  };
  const tagLine = (P, p) => p.marks.map(([part, lab]) => `${lab} = ${P.items[part].n}`).join('; ');
  Object.entries(PARTS).forEach(([key, P]) => {
    const names = Object.keys(P.items);
    // bagian yang fungsinya mirip (mis. bilik kanan dan pembuluh nadi paru-paru) tidak dipakai sebagai pengecoh satu sama lain
    const near = (pt) => new Set([pt, ...(P.near || []).filter((g) => g.includes(pt)).flat()]);
    const others = (pt) => names.filter((x) => !near(pt).has(x));
    // a) Bagian-bagian berlabel huruf
    reg({
      id: 'ipa-organ-' + key, fam: 'organ-' + key, codes: [P.code], ind: `Mengidentifikasi bagian ${P.nama} beserta fungsinya berdasarkan gambar`,
      params: (r) => {
        const parts = [];
        r.shuffle(names).forEach((x) => { if (parts.length < 4 && !parts.some((y) => near(y).has(x))) parts.push(x); });
        return { marks: parts.map((pt, i) => [pt, L4[i]]) };
      },
      stimulus: (p) => ({ title: '', kind: 'Gambar', text: `Perhatikan gambar ${P.nama} berikut!`, visuals: svgV(IPF.organ(P.fig, p.marks)) }),
      qs: [
        { id: 'fn2tag', code: P.code, level: 'Pemahaman', type: 'pg', ind: `Menentukan bagian ${P.nama} berdasarkan fungsinya`, make: (p, r) => {
          const [pt, lab] = r.pick(p.marks);
          return pg(r, { text: `Bagian yang berfungsi ${P.items[pt].f} ditunjukkan huruf … .`, correct: lab, wrong: p.marks.filter((m) => m[1] !== lab).map((m) => m[1]), order: 'text', layout: 'grid',
            explain: `Bagian yang berfungsi ${P.items[pt].f} adalah ${P.items[pt].n}, ditunjukkan huruf **${lab}**.\n\nKeterangan gambar: ${tagLine(P, p)}.` });
        } },
        { id: 'tag2fn', code: P.code, level: 'Penerapan', type: 'pg', ind: `Menjelaskan fungsi bagian ${P.nama} yang ditunjuk pada gambar`, make: (p, r) => {
          const [pt, lab] = r.pick(p.marks);
          const oth = r.sample(others(pt), 3);
          return pg(r, { text: `Fungsi bagian yang ditunjuk huruf ${lab} adalah … .`, correct: P.items[pt].f, wrong: oth.map((x) => P.items[x].f),
            explain: `Huruf ${lab} menunjukkan ${P.items[pt].n} yang berfungsi **${P.items[pt].f}**.\n\nPilihan lain adalah fungsi ${join(oth.map((x) => P.items[x].n))}.` });
        } },
        { id: 'tagbs', code: P.code, level: 'Penerapan', type: 'bs', ind: `Menilai kebenaran pernyataan tentang bagian ${P.nama} dan fungsinya`, make: (p, r) => {
          const items = p.marks.map(([pt, lab], i) => {
            const ok = r.chance(0.5);
            if (ok) return { text: `Bagian ${lab} adalah ${P.items[pt].n} yang berfungsi ${P.items[pt].f}.`, ans: 0, why: '' };
            const wrongPt = r.pick(others(pt));
            return r.chance(0.5)
              ? { text: `Bagian ${lab} adalah ${P.items[pt].n} yang berfungsi ${P.items[wrongPt].f}.`, ans: 1, why: `${cap(P.items[pt].n)} berfungsi ${P.items[pt].f}` }
              : { text: `Bagian ${lab} adalah ${P.items[wrongPt].n} yang berfungsi ${P.items[wrongPt].f}.`, ans: 1, why: `huruf ${lab} menunjukkan ${P.items[pt].n}, bukan ${P.items[wrongPt].n}` };
          });
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut berdasarkan gambar!', items, shuffle: false, intro: `Keterangan gambar: ${tagLine(P, p)}.` });
        } },
        { id: 'tagpgk', code: P.code, level: 'Penerapan', type: 'pgk', ind: `Memasangkan bagian ${P.nama} dengan fungsinya`, make: (p, r) => {
          const k = r.int(2, 3);
          const ok = r.sample(p.marks, k), bad = p.marks.filter((m) => !ok.includes(m));
          const correct = ok.map(([pt, lab]) => `${lab}: ${P.items[pt].n}, berfungsi ${P.items[pt].f}`);
          const wrong = bad.map(([pt, lab]) => { const w = r.pick(others(pt)); return `${lab}: ${P.items[pt].n}, berfungsi ${P.items[w].f}`; });
          if (!wrong.length) throw new GE('pgk kurang');
          return pgk(r, { text: 'Pasangan huruf, nama bagian, dan fungsinya yang tepat adalah … .', correct, wrong,
            explain: `Pasangan yang tepat: ${correct.map((c) => '**' + c + '**').join('; ')}.\n\nKeterangan gambar: ${tagLine(P, p)}. Fungsi pada pilihan lainnya tidak sesuai dengan bagiannya.` });
        } },
      ],
    });
    // b) Urutan proses (penalaran)
    reg({
      id: 'ipa-urut-' + key, fam: 'organ-' + key, codes: [P.code], ind: `Menentukan urutan proses pada ${P.nama} berdasarkan gambar`,
      params: (r) => {
        const seq = P.seq.length > 4 ? (() => { const keep = r.sample(P.seq.map((_, i) => i).slice(1), 3).concat([0]).sort((a, b) => a - b); return keep.map((i) => P.seq[i]); })() : P.seq.slice();
        const labs = r.shuffle(L4.slice(0, 4));
        return { marks: seq.map((pt, i) => [pt, labs[i]]) };
      },
      stimulus: (p) => ({ title: '', kind: 'Gambar', text: `Perhatikan gambar ${P.nama} berikut!`, visuals: svgV(IPF.organ(P.fig, p.marks)) }),
      qs: [
        { id: 'urut', code: P.code, level: 'Penalaran', type: 'pg', ind: `Menentukan urutan proses pada ${P.nama}`, make: (p, r) => {
          const right = p.marks.map((m) => m[1]);
          const wrong = new Set();
          let g = 0;
          while (wrong.size < 3 && g++ < 60) { const w = r.shuffle(right).join(' → '); if (w !== right.join(' → ')) wrong.add(w); }
          return pg(r, { text: `Urutan bagian yang dilalui ${P.seqTxt} sesuai huruf pada gambar adalah … .`, correct: right.join(' → '), wrong: Array.from(wrong),
            explain: `Urutannya: ${p.marks.map(([pt, lab]) => `${P.items[pt].n} (${lab})`).join(' → ')}. Jadi, jawabannya **${right.join(' → ')}**.` });
        } },
      ],
    });
  });

  /* ======================================================================
     2. PANCAINDRA: gangguan & kesehatan mata dan telinga (IPA-01, IPA-02)
     ====================================================================== */
  const EYE = [
    { k: 'miopi', n: 'rabun jauh (miopi)', g: 'tidak dapat melihat benda yang jauh dengan jelas, tetapi dapat melihat benda dekat dengan jelas', lens: 'kacamata berlensa cekung (negatif)', fig: 'miopi', why: 'bayangan benda jatuh di depan retina' },
    { k: 'hipermetropi', n: 'rabun dekat (hipermetropi)', g: 'tidak dapat membaca tulisan pada jarak baca normal (sekitar 30 cm) dengan jelas, tetapi dapat melihat benda jauh dengan jelas', lens: 'kacamata berlensa cembung (positif)', fig: 'hipermetropi', why: 'bayangan benda jatuh di belakang retina' },
    { k: 'presbiopi', n: 'mata tua (presbiopi)', g: 'sudah lanjut usia dan kesulitan melihat benda dekat maupun benda jauh dengan jelas', lens: 'kacamata berlensa rangkap', why: 'daya akomodasi lensa mata berkurang karena usia' },
    { k: 'astigmatisma', n: 'silindris (astigmatisma)', g: 'melihat benda tampak kabur dan garis-garisnya tampak berbayang', lens: 'kacamata berlensa silindris', why: 'kelengkungan kornea atau lensa tidak rata' },
  ];
  const NAMES = ['Dimas', 'Laras', 'Fajar', 'Nadia', 'Raka', 'Salma', 'Bima', 'Putri', 'Arif', 'Citra'];
  reg({
    id: 'ipa-mata-gangguan', codes: ['IPA-01'], ind: 'Mengidentifikasi gangguan mata dan cara mengatasinya',
    params: (r) => ({ d: r.pick(EYE), who: r.pick(NAMES) }),
    stimulus: (p) => ({ title: '', kind: 'Teks', text: `${p.d.k === 'presbiopi' ? `Kakek ${p.who}` : p.who} ${p.d.g}. Setelah diperiksa, dokter mata mengatakan bahwa ${p.d.k === 'presbiopi' ? 'Kakek' : p.who} mengalami gangguan mata ${p.d.n}.`, visuals: [] }),
    qs: [
      { id: 'lensa', code: 'IPA-01', level: 'Penerapan', type: 'pg', ind: 'Menentukan cara mengatasi gangguan mata', make: (p, r) => pg(r, {
        text: 'Upaya yang tepat agar dapat melihat dengan jelas adalah memakai … .', correct: p.d.lens, wrong: EYE.filter((x) => x !== p.d).map((x) => x.lens).concat(['kacamata hitam saat membaca']).slice(0, 3),
        explain: `Gangguan ${p.d.n} terjadi karena ${p.d.why}. Gangguan ini dibantu dengan **${p.d.lens}**.` }) },
    ],
  });
  reg({
    id: 'ipa-mata-fokus', codes: ['IPA-01'], ind: 'Menganalisis gangguan penglihatan berdasarkan gambar jatuhnya bayangan',
    params: (r) => ({ d: r.pick(EYE.slice(0, 2)) }),
    stimulus: (p) => ({ title: '', kind: 'Gambar', text: 'Gambar berikut menunjukkan jatuhnya bayangan benda pada mata seseorang.', visuals: svgV(IPF.focus(p.d.fig)) }),
    qs: [
      { id: 'fokus', code: 'IPA-01', level: 'Penalaran', type: 'pg', ind: 'Menganalisis gangguan mata dan cara mengatasinya berdasarkan gambar', make: (p, r) => {
        const o = EYE[0] === p.d ? EYE[1] : EYE[0];
        return pg(r, { text: 'Berdasarkan gambar, gangguan mata yang dialami dan cara mengatasinya adalah … .', correct: `${p.d.n}, ditolong dengan ${p.d.lens}`,
          wrong: [`${o.n}, ditolong dengan ${o.lens}`, `${p.d.n}, ditolong dengan ${o.lens}`, `${o.n}, ditolong dengan ${p.d.lens}`],
          explain: `Pada gambar, ${p.d.why}. Itu ciri **${p.d.n}**, yang ditolong dengan **${p.d.lens}**.` });
      } },
      { id: 'fokusbs', code: 'IPA-01', level: 'Penalaran', type: 'bs', ind: 'Menilai pernyataan tentang gangguan mata berdasarkan gambar', make: (p, r) => {

          { text: `Orang tersebut mengalami ${m ? 'rabun dekat (hipermetropi)' : 'rabun jauh (miopi)'}.`, ans: 1, why: `yang benar ${p.d.n}` },
          { text: `Gangguan tersebut dapat dibantu dengan ${p.d.lens}.`, ans: 0 },
          { text: `Orang tersebut ${m ? 'sulit melihat benda yang jauh' : 'sulit membaca tulisan pada jarak dekat'}.`, ans: 0 },

  const CARE = {
    mata: { code: 'IPA-01', good: ['membaca di tempat dengan cahaya yang cukup', 'membaca dengan jarak sekitar 30 cm dari mata', 'mengistirahatkan mata setelah lama menatap layar gawai', 'makan sayur dan buah yang mengandung vitamin A, seperti wortel', 'memakai kacamata pelindung saat berkendara'],
      bad: ['membaca sambil berbaring di tempat yang redup', 'menatap layar gawai berjam-jam tanpa istirahat', 'melihat matahari secara langsung', 'mengucek mata dengan tangan yang kotor', 'membaca di dalam kendaraan yang bergerak'], nama: 'mata' },
    telinga: { code: 'IPA-02', good: ['membersihkan daun telinga secara hati-hati', 'menghindari suara yang sangat keras', 'memeriksakan telinga ke dokter bila terasa sakit', 'memakai penutup telinga di tempat yang sangat bising', 'mengatur volume earphone agar tidak terlalu keras'],

  Object.entries(CARE).forEach(([k, C]) => reg({

          explain: `Kebiasaan yang menjaga kesehatan ${C.nama}: ${c.map((x) => '**' + x + '**').join('; ')}. Kebiasaan lainnya justru dapat merusak ${C.nama}.` });

  /* ======================================================================
     3. DAUR HIDUP (IPA-03)
     ====================================================================== */
  const CYC = {
    'kupu-kupu': { type: 'sempurna', st: [{ draw: 'telur', cap: 'telur' }, { icon: '🐛', cap: 'ulat (larva)' }, { draw: 'kepompong', cap: 'kepompong (pupa)' }, { icon: '🦋', cap: 'kupu-kupu' }],
      fact: ['ulat (larva)', 'memakan daun sehingga dapat merusak tanaman'], rest: 'kepompong (pupa)' },
    nyamuk: { type: 'sempurna', st: [{ draw: 'telur', cap: 'telur' }, { draw: 'jentik', cap: 'jentik (larva)' }, { draw: 'pupa nyamuk', cap: 'pupa' }, { icon: '🦟', cap: 'nyamuk' }],
      fact: ['jentik (larva)', 'hidup di dalam air, misalnya di genangan atau bak mandi'], rest: 'pupa' },
    belalang: { type: 'tidak sempurna', st: [{ draw: 'telur', cap: 'telur' }, { icon: '🦗', cap: 'nimfa', size: 24 }, { icon: '🦗', cap: 'belalang dewasa' }],
      fact: ['nimfa', 'bentuknya mirip belalang dewasa, tetapi tubuhnya kecil dan sayapnya belum sempurna'] },
    katak: { type: 'katak', st: [{ draw: 'telur katak', cap: 'telur' }, { draw: 'berudu', cap: 'berudu' }, { icon: '🐸', cap: 'katak muda', size: 24 }, { icon: '🐸', cap: 'katak dewasa' }],
      fact: ['berudu', 'hidup di dalam air dan bernapas dengan insang'] },
  };
  reg({
    id: 'ipa-daur', codes: ['IPA-03'], ind: 'Menganalisis tahapan daur hidup hewan berdasarkan gambar',
    params: (r) => { const a = r.pick(Object.keys(CYC)); const C0 = CYC[a]; const fi = C0.st.findIndex((s) => s.cap === C0.fact[0]); return { a, x: fi }; },
    stimulus: (p) => ({ title: '', kind: 'Gambar', text: `Perhatikan gambar daur hidup ${p.a} berikut!`, visuals: svgV(IPF.cycle(CYC[p.a].st.map((s, i) => Object.assign({}, s, i === p.x ? { cap: '', tag: 'X' } : {})))) }),
    qs: [
      { id: 'nama', code: 'IPA-03', level: 'Pemahaman', type: 'pg', ind: 'Menentukan nama tahap daur hidup hewan', make: (p, r) => {
        const C0 = CYC[p.a]; const ans = C0.st[p.x].cap;
        const pool = ['telur', 'ulat (larva)', 'kepompong (pupa)', 'jentik (larva)', 'pupa', 'nimfa', 'berudu', 'imago', 'katak muda'].filter((x) => x !== ans && !C0.st.some((s) => s.cap === x && s.cap === ans));
        return pg(r, { text: 'Tahap yang ditunjuk huruf X disebut … .', correct: ans, wrong: r.sample(pool.filter((x) => x !== ans), 3), explain: `Pada daur hidup ${p.a}, tahap X adalah **${ans}**; tahap itu ${C0.fact[1]}.` });
      } },
      { id: 'ciri', code: 'IPA-03', level: 'Penerapan', type: 'pg', ind: 'Menjelaskan ciri tahap daur hidup hewan', make: (p, r) => {
        const C0 = CYC[p.a];
        const wr = ['tidak makan dan berada di dalam tanah', 'sudah dapat terbang dan bertelur', 'bernapas dengan paru-paru dan hidup di darat', 'tidak bergerak dan diselubungi kokon'].filter((x) => x !== C0.fact[1]);
        return pg(r, { text: 'Ciri hewan pada tahap X adalah … .', correct: C0.fact[1], wrong: r.sample(wr, 3), explain: `Tahap X adalah ${C0.fact[0]}. Pada tahap ini, hewan **${C0.fact[1]}**.` });
      } },
      { id: 'bs', code: 'IPA-03', level: 'Penalaran', type: 'bs', ind: 'Menganalisis daur hidup dan metamorfosis hewan', make: (p, r) => {
        const C0 = CYC[p.a], n = C0.st.length;
        const items = [{ text: `Daur hidup ${p.a} pada gambar terdiri atas ${n} tahap.`, ans: 0 }];
        if (C0.type === 'sempurna') items.push({ text: `${cap(p.a)} mengalami metamorfosis sempurna.`, ans: 0 }, { text: `Pada daur hidup ${p.a} tidak terdapat tahap ${C0.rest}.`, ans: 1, why: `${C0.rest} termasuk tahap daur hidupnya` });
        else if (C0.type === 'tidak sempurna') items.push({ text: `${cap(p.a)} mengalami metamorfosis sempurna.`, ans: 1, why: 'belalang mengalami metamorfosis tidak sempurna (telur–nimfa–dewasa)' }, { text: 'Pada daur hidup belalang tidak terdapat tahap pupa.', ans: 0 });
        else items.push({ text: 'Berudu bernapas dengan insang.', ans: 0 }, { text: 'Katak dewasa hanya dapat hidup di dalam air.', ans: 1, why: 'katak dewasa dapat hidup di darat dan di air' });
        items.push({ text: `Tahap X adalah ${C0.st[p.x].cap}.`, ans: 0 });
        return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
      } },
    ],
  });
  const ANI = [
    { n: 'kupu-kupu', icon: '🦋', m: 'sempurna' }, { n: 'nyamuk', icon: '🦟', m: 'sempurna' }, { n: 'lebah', icon: '🐝', m: 'sempurna' }, { n: 'semut', icon: '🐜', m: 'sempurna' }, { n: 'kepik', icon: '🐞', m: 'sempurna' },
    { n: 'belalang', icon: '🦗', m: 'tidak sempurna' }, { n: 'kecoak', draw: 'kecoak', m: 'tidak sempurna' }, { n: 'capung', draw: 'capung', m: 'tidak sempurna' },
    { n: 'ayam', icon: '🐔', m: 'tanpa' }, { n: 'kucing', icon: '🐈', m: 'tanpa' }, { n: 'ikan', icon: '🐟', m: 'tanpa' }, { n: 'kura-kura', icon: '🐢', m: 'tanpa' },

  const MSTEP = { sempurna: 'telur → larva → pupa → dewasa', 'tidak sempurna': 'telur → nimfa → dewasa', tanpa: 'anak hewan mirip induknya, tanpa perubahan bentuk' };
  reg({

      const a = r.sample(ANI.filter((x) => x.m === types[0]), 2), b = r.sample(ANI.filter((x) => x.m === types[1]), 2), c = r.sample(ANI.filter((x) => x.m === types[2]), 1);
      return { items: r.shuffle(a.concat(b, c)), main: types[0] };
    },
    stimulus: (p) => ({ title: '', kind: 'Gambar', text: 'Perhatikan gambar beberapa hewan berikut!', visuals: svgV(IPF.panel(p.items.map((x, i) => ({ icon: x.icon, draw: x.draw, cap: x.n, tag: nb(i) })))) }),
    qs: [
      { id: 'sama', code: 'IPA-03', level: 'Penerapan', type: 'pg', ind: 'Menentukan hewan yang memiliki kesamaan tahapan daur hidup', make: (p, r) => {

          explain: `${cap(join(idx.map((i) => `${p.items[i].n} ${nb(i)}`)))} sama-sama ${MVERB[p.main]} (${MSTEP[p.main]}). Jadi, jawabannya **${combo(idx)}**.` });
      } },
      { id: 'pgk', code: 'IPA-03', level: 'Penerapan', type: 'pgk', ind: 'Mengelompokkan hewan berdasarkan jenis metamorfosisnya', make: (p, r) => {
        const target = r.pick(['sempurna', 'tidak sempurna']);
        const c = p.items.filter((x) => x.m === target).map((x) => x.n), w = p.items.filter((x) => x.m !== target).map((x) => x.n);
        if (c.length < 2) throw new GE('kurang');
        return pgk(r, { text: `Hewan pada gambar yang ${MVERB[target]} adalah … .`, correct: c, wrong: w, explain: `Hewan yang ${MVERB[target]} (${MSTEP[target]}) adalah **${join(c)}**.` });
      } },
      { id: 'bs', code: 'IPA-03', level: 'Penalaran', type: 'bs', ind: 'Menganalisis kesamaan metamorfosis beberapa hewan', make: (p, r) => {
        const pairs = []; for (let i = 0; i < p.items.length; i++) for (let j = i + 1; j < p.items.length; j++) pairs.push([i, j]);
        const items = r.sample(pairs, 4).map(([i, j]) => {
          const A = p.items[i], B = p.items[j];
          const claim = r.pick(['sempurna', 'tidak sempurna', 'tanpa']);

        });
        if (items.every((x) => x.ans === 1)) { const idx = p.items.map((x, i) => (x.m === p.main ? i : -1)).filter((i) => i >= 0); items[0] = { text: `Hewan nomor ${nb(idx[0])} dan ${nb(idx[1])} sama-sama ${MVERB[p.main]}.`, ans: 0, why: '' }; }
        return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut terkait daur hidup hewan pada gambar!', items, shuffle: false });

  /* ======================================================================

  const SDA = [

    stimulus: (p) => ({ title: '', kind: 'Gambar', text: 'Perhatikan gambar beberapa hewan berikut!', visuals: svgV(IPF.panel(p.items.map((x, i) => ({ icon: x.icon, cap: x.n, tag: nb(i) })))) }),
    qs: [
      { id: 'sama', code: 'IPA-12', level: 'Penerapan', type: 'pg', ind: 'Menentukan hewan yang memiliki kesamaan tujuan adaptasi', make: (p, r) => { const idx = p.items.map((x, i) => (x.c === p.c0 ? i : -1)).filter((i) => i >= 0);
        return pg(r, { text: `Hewan yang beradaptasi untuk ${p.c0} ditunjukkan nomor … .`, correct: combo(idx), wrong: comboWrongs(r, idx, 4, 2), order: 'text', explain: `${idx.map((i) => `${cap(p.items[i].n)} ${p.items[i].d}`).join('. ')}. Jawabannya **${combo(idx)}**.` }); } },
      { id: 'cara', code: 'IPA-12', level: 'Pemahaman', type: 'pg', ind: 'Menentukan cara adaptasi hewan tertentu', make: (p, r) => { const i = r.int(0, 3); const x = p.items[i];
        return pg(r, { text: `Cara adaptasi hewan nomor ${nb(i)} adalah … .`, correct: x.d, wrong: r.sample(ADA.filter((y) => y.n !== x.n && y.d !== x.d), 3).map((y) => y.d), explain: `Hewan nomor ${nb(i)} adalah ${x.n}, yang ${x.d}.` }); } },
      { id: 'bs', code: 'IPA-12', level: 'Penalaran', type: 'bs', ind: 'Menganalisis cara adaptasi hewan', make: (p, r) => tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items: p.items.map((x, i) => {
        const ok = r.chance(0.5); const o = r.pick(ADA.filter((y) => y.n !== x.n && y.c !== x.c));
        return ok ? { text: `Hewan nomor ${nb(i)} beradaptasi dengan cara ${x.d}.`, ans: 0 } : { text: `Hewan nomor ${nb(i)} beradaptasi dengan cara ${o.d}.`, ans: 1, why: `${x.n} ${x.d}` };
      }), shuffle: false }) },
    ],
  });
  const PLA = [
    { n: 'kaktus', icon: '🌵', d: 'daunnya berbentuk duri dan batangnya tebal untuk menyimpan air', env: 'kering' },
    { n: 'teratai', draw: 'teratai', d: 'daunnya lebar dan tipis untuk mempercepat penguapan', env: 'air' },

  reg({

    qs: [
      { id: 'pgk', code: 'IPA-12', level: 'Penerapan', type: 'pgk', ind: 'Memasangkan tumbuhan dengan cara adaptasinya', make: (p, r) => { const ok = r.sample(p.items.map((_, i) => i), r.int(2, 3));
        const c = ok.map((i) => `${nb(i)} ${p.items[i].d}`);
        const w = p.items.map((_, i) => i).filter((i) => !ok.includes(i)).map((i) => { const o = r.pick(PLA.filter((y) => y.n !== p.items[i].n)); return `${nb(i)} ${o.d}`; });
        return pgk(r, { text: 'Pasangan tumbuhan dan cara adaptasinya yang tepat adalah … .', correct: c, wrong: w, explain: p.items.map((x, i) => `${nb(i)} ${x.n}: ${x.d}`).join('; ') + '.' }); } },
      { id: 'pg', code: 'IPA-12', level: 'Pemahaman', type: 'pg', ind: 'Menentukan cara adaptasi tumbuhan tertentu', make: (p, r) => { const i = r.int(0, 3), x = p.items[i];
        return pg(r, { text: `Cara adaptasi tumbuhan nomor ${nb(i)} adalah … .`, correct: x.d, wrong: r.sample(PLA.filter((y) => y.n !== x.n), 3).map((y) => y.d), explain: `Tumbuhan nomor ${nb(i)} adalah ${x.n}, yang **${x.d}**.` }); } },

  /* ======================================================================
     9. PENDALAMAN SISTEM ORGAN (pencernaan, pernapasan, peredaran darah)

  const ENZ = [

    { n: 'renin', o: 'lambung', f: 'menggumpalkan protein susu (kasein)' },
    { n: 'asam klorida (HCl)', o: 'lambung', f: 'membunuh kuman yang masuk bersama makanan' },
    { n: 'lipase', o: 'pankreas', f: 'mengubah lemak menjadi asam lemak dan gliserol' },
    { n: 'tripsin', o: 'pankreas', f: 'mengubah protein menjadi asam amino' },
    { n: 'cairan empedu', o: 'hati', f: 'mengemulsikan (memecah) lemak menjadi butiran kecil' },
  ];
  const KASUS = [
    { o: 'pankreas', d: 'pencernaan zat tepung, lemak, dan protein di usus halus terhambat' },
    { o: 'hati', d: 'pencernaan lemak terhambat karena cairan empedu berkurang' },

  reg({
    id: 'ipa-cerna-enzim', codes: ['IPA-07'], ind: 'Menjelaskan fungsi enzim dan zat pencernaan',
    params: (r) => ({ items: r.sample(ENZ, 4) }),
    stimulus: (p) => ({ title: '', kind: 'Tabel', text: 'Perhatikan tabel enzim dan zat pencernaan berikut!', visuals: [{ type: 'table', caption: 'Enzim dan zat pencernaan', headers: ['Nomor', 'Enzim/zat', 'Dihasilkan oleh'], rows: p.items.map((x, i) => [nb(i), x.n, x.o]) }] }),
    qs: [
      { id: 'fungsi', code: 'IPA-07', level: 'Pemahaman', type: 'pg', ind: 'Menentukan fungsi enzim pencernaan', make: (p, r) => { const i = r.int(0, 3), x = p.items[i];
        return pg(r, { text: `Fungsi zat nomor ${nb(i)} adalah … .`, correct: x.f, wrong: r.sample(ENZ.filter((y) => y.f !== x.f), 3).map((y) => y.f), explain: `Zat nomor ${nb(i)} adalah ${x.n} dari ${x.o} yang berfungsi **${x.f}**.` }); } },
      { id: 'bs', code: 'IPA-07', level: 'Penerapan', type: 'bs', ind: 'Menilai fungsi enzim pencernaan pada tabel', make: (p, r) => tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut berdasarkan tabel!', items: p.items.map((x, i) => {
        if (r.chance(0.5)) return { text: `Zat nomor ${nb(i)} berfungsi ${x.f}.`, ans: 0 };
        const o = r.pick(ENZ.filter((y) => y.f !== x.f));
        return { text: `Zat nomor ${nb(i)} berfungsi ${o.f}.`, ans: 1, why: `${x.n} berfungsi ${x.f}` };
      }), shuffle: false }) },
      { id: 'kasus', code: 'IPA-07', level: 'Penalaran', type: 'pg', ind: 'Memprediksi akibat gangguan pada organ pencernaan', make: (p, r) => { const k = r.pick(KASUS);
        return pg(r, { text: `Jika ${k.o} seseorang tidak dapat bekerja dengan baik, akibat yang paling mungkin terjadi adalah … .`, correct: k.d, wrong: r.sample(KASUS.filter((y) => y !== k), 3).map((y) => y.d), explain: `Gangguan pada ${k.o} menyebabkan **${k.d}**.` }); } },
    ],
  });
  const PROSES = [
    { t: 'gigi mengunyah dan menghaluskan makanan', m: true }, { t: 'dinding lambung meremas-remas makanan', m: true }, { t: 'lidah mengaduk dan membantu menelan makanan', m: true },
    { t: 'ptialin mengubah zat tepung menjadi gula', m: false }, { t: 'pepsin mengubah protein menjadi pepton', m: false }, { t: 'lipase mengubah lemak menjadi asam lemak dan gliserol', m: false },
  ];
  reg({
    id: 'ipa-cerna-proses', codes: ['IPA-07'], ind: 'Membedakan pencernaan mekanis dan kimiawi',
    params: (r) => ({ items: r.shuffle(r.sample(PROSES.filter((x) => x.m), 2).concat(r.sample(PROSES.filter((x) => !x.m), 3))) }),
    stimulus: (p) => ({ title: '', kind: 'Teks', text: 'Perhatikan proses-proses pencernaan berikut!\n\n' + p.items.map((x, i) => `${nb(i)} ${cap(x.t)}.`).join('\n'), visuals: [] }),
    qs: [
      { id: 'mekanis', code: 'IPA-07', level: 'Penerapan', type: 'pg', ind: 'Menentukan proses pencernaan mekanis', make: (p, r) => { const idx = p.items.map((x, i) => (x.m ? i : -1)).filter((i) => i >= 0);
        return pg(r, { text: 'Proses pencernaan mekanis ditunjukkan nomor … .', correct: combo(idx), wrong: comboWrongs(r, idx, 5, 2), order: 'text', explain: `Pencernaan mekanis mengubah ukuran makanan tanpa zat kimia, yaitu nomor ${combo(idx)}. Proses lainnya memakai enzim (pencernaan kimiawi). Jawabannya **${combo(idx)}**.` }); } },
      { id: 'kimia', code: 'IPA-07', level: 'Penerapan', type: 'pgk', ind: 'Mengelompokkan proses pencernaan kimiawi', make: (p, r) => {
        const c = p.items.filter((x) => !x.m).map((x) => x.t), w = p.items.filter((x) => x.m).map((x) => x.t);
        return pgk(r, { text: 'Proses yang termasuk pencernaan kimiawi adalah … .', correct: c, wrong: w, explain: `Pencernaan kimiawi memakai enzim: **${join(c)}**. Adapun ${join(w)} termasuk pencernaan mekanis.` }); } },
      { id: 'manis', code: 'IPA-07', level: 'Penalaran', type: 'pg', ind: 'Menjelaskan proses pencernaan kimiawi di mulut', make: (p, r) => pg(r, { text: 'Nasi yang dikunyah lama di dalam mulut akan terasa manis karena … .', correct: 'enzim ptialin mengubah zat tepung dalam nasi menjadi gula',
        wrong: ['gigi geraham menghasilkan gula ketika menghaluskan nasi', 'lidah mengubah nasi menjadi protein', 'enzim pepsin mengubah nasi menjadi pepton'], explain: 'Air ludah mengandung **enzim ptialin yang mengubah zat tepung dalam nasi menjadi gula**, sehingga nasi terasa manis bila dikunyah lama.' }) },
    ],
  });
  reg({
    id: 'ipa-napas-gas', codes: ['IPA-06'], ind: 'Menganalisis perbedaan udara yang dihirup dan dihembuskan',

    stimulus: (p) => ({ title: '', kind: 'Tabel', text: `${p.who} membaca data kandungan gas pada udara yang dihirup dan udara yang dihembuskan manusia berikut.`, visuals: [{ type: 'table', caption: 'Kandungan gas dalam udara pernapasan', headers: ['Jenis gas', 'Udara yang dihirup', 'Udara yang dihembuskan'], rows: [['Oksigen', '21%', '16%'], ['Karbon dioksida', '0,04%', '4%'], ['Nitrogen', '78%', '78%']] }] }),
    qs: [
      { id: 'simpul', code: 'IPA-06', level: 'Penalaran', type: 'pg', ind: 'Menyimpulkan proses pertukaran gas berdasarkan data', make: (p, r) => pg(r, { text: 'Kesimpulan yang tepat berdasarkan data tersebut adalah … .', correct: 'sebagian oksigen digunakan oleh tubuh, sedangkan karbon dioksida dikeluarkan dari tubuh',
        wrong: ['tubuh menghasilkan oksigen dan menyerap karbon dioksida', 'tubuh menyerap nitrogen dalam jumlah yang besar', 'udara yang dihembuskan sama dengan udara yang dihirup'],
        explain: 'Kadar oksigen turun dari 21% menjadi 16%, sedangkan kadar karbon dioksida naik dari 0,04% menjadi 4%. Artinya, **sebagian oksigen digunakan oleh tubuh, sedangkan karbon dioksida dikeluarkan dari tubuh**. Kadar nitrogen tetap.' }) },
      { id: 'bs', code: 'IPA-06', level: 'Penerapan', type: 'bs', ind: 'Membaca data kandungan gas pernapasan', make: (p, r) => tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut berdasarkan data!', items: [
        { text: 'Kadar oksigen pada udara yang dihembuskan lebih rendah daripada udara yang dihirup.', ans: 0 },
        { text: 'Selisih kadar oksigen pada udara yang dihirup dan dihembuskan adalah 5%.', ans: 0, why: '21% − 16% = 5%' },
        { text: 'Kadar nitrogen berubah setelah udara dihirup tubuh.', ans: 1, why: 'kadar nitrogen tetap 78%' },
        { text: 'Kadar karbon dioksida pada udara yang dihembuskan lebih rendah daripada udara yang dihirup.', ans: 1, why: 'kadar karbon dioksida naik dari 0,04% menjadi 4%' },
      ] }) },
    ],
  });
  const MEK = {
    perut: { gej: 'perutnya tampak mengembang', ok: 'otot diafragma berkontraksi sehingga rongga dada membesar dan udara masuk ke paru-paru', no: ['otot diafragma berelaksasi sehingga rongga dada mengecil dan udara masuk ke paru-paru', 'lambung mengembang karena terisi udara dari hidung', 'otot antartulang rusuk berelaksasi sehingga udara keluar dari paru-paru'] },
    dada: { gej: 'dadanya tampak terangkat', ok: 'otot antartulang rusuk berkontraksi sehingga tulang rusuk terangkat dan rongga dada membesar', no: ['otot antartulang rusuk berelaksasi sehingga tulang rusuk turun dan rongga dada membesar', 'diafragma melengkung ke atas sehingga udara masuk ke paru-paru', 'jantung memompa udara masuk ke paru-paru'] },
  };
  reg({
    id: 'ipa-napas-mekanisme', codes: ['IPA-06'], ind: 'Menjelaskan mekanisme pernapasan dada dan perut',
    params: (r) => ({ k: r.pick(['perut', 'dada']), who: r.pick(NAMES) }),
    stimulus: (p) => ({ title: '', kind: 'Teks', text: `Saat menarik napas dalam-dalam di depan cermin, ${p.who} melihat ${MEK[p.k].gej}.`, visuals: [] }),
    qs: [
      { id: 'proses', code: 'IPA-06', level: 'Penalaran', type: 'pg', ind: 'Menjelaskan proses yang terjadi saat menghirup napas', make: (p, r) => pg(r, { text: `Proses yang terjadi pada tubuh ${p.who} saat itu adalah … .`, correct: MEK[p.k].ok, wrong: MEK[p.k].no,
        explain: `${cap(MEK[p.k].gej)} menunjukkan pernapasan ${p.k}. Saat menghirup napas, **${MEK[p.k].ok}**.` }) },
      { id: 'bs', code: 'IPA-06', level: 'Penerapan', type: 'bs', ind: 'Menilai pernyataan tentang mekanisme pernapasan', make: (p, r) => tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items: [
        { text: `Peristiwa yang dialami ${p.who} menunjukkan pernapasan ${p.k}.`, ans: 0 },
        { text: 'Saat menghirup napas, rongga dada membesar sehingga udara masuk ke paru-paru.', ans: 0 },
        { text: 'Saat menghembuskan napas, rongga dada membesar sehingga udara keluar.', ans: 1, why: 'saat menghembuskan napas, rongga dada mengecil' },
        { text: `Pernapasan ${p.k} melibatkan otot ${p.k === 'perut' ? 'antartulang rusuk' : 'diafragma'} sebagai otot utamanya.`, ans: 1, why: `pernapasan ${p.k} melibatkan otot ${p.k === 'perut' ? 'diafragma' : 'antartulang rusuk'}` },
      ] }) },
    ],
  });
  const ROKOK = [
    { z: 'nikotin', d: 'menyebabkan kecanduan dan menyempitkan pembuluh darah' },
    { z: 'tar', d: 'menempel pada paru-paru dan dapat memicu kanker paru-paru' },
    { z: 'karbon monoksida (CO)', d: 'mengikat sel darah merah sehingga tubuh kekurangan oksigen' },
  ];
  reg({
    id: 'ipa-napas-rokok', codes: ['IPA-06'], ind: 'Menganalisis bahaya zat dalam asap rokok bagi pernapasan',
    params: (r) => ({ who: r.pick(NAMES) }),
    stimulus: (p) => ({ title: '', kind: 'Teks', text: `Paman ${p.who} sudah merokok selama bertahun-tahun. Akhir-akhir ini ia sering batuk dan napasnya cepat tersengal-sengal ketika menaiki tangga.`, visuals: [] }),
    qs: [
      { id: 'pgk', code: 'IPA-06', level: 'Penerapan', type: 'pgk', ind: 'Memasangkan zat dalam asap rokok dengan dampaknya', make: (p, r) => {
        const ok = r.sample(ROKOK, 2), bad = ROKOK.filter((x) => !ok.includes(x));
        const c = ok.map((x) => `${x.z}: ${x.d}`);
        const w = bad.map((x) => `${x.z}: ${r.pick(ROKOK.filter((y) => y !== x)).d}`).concat([`${r.pick(ok).z}: melebarkan saluran pernapasan sehingga napas lebih lega`]);
        return pgk(r, { text: 'Pasangan zat dalam asap rokok dan dampaknya yang tepat adalah … .', correct: c, wrong: w, explain: `${ROKOK.map((x) => `${cap(x.z)} ${x.d}`).join('. ')}. Pasangan yang tepat: **${c.join('; ')}**.` });
      } },
      { id: 'sebab', code: 'IPA-06', level: 'Penalaran', type: 'pg', ind: 'Menjelaskan penyebab gangguan pernapasan akibat merokok', make: (p, r) => pg(r, { text: `Napas Paman ${p.who} cepat tersengal-sengal karena … .`, correct: 'karbon monoksida dari asap rokok mengikat sel darah merah sehingga tubuh kekurangan oksigen',
        wrong: ['nikotin membuat paru-paru menghasilkan lebih banyak oksigen', 'tar melebarkan saluran pernapasan', 'asap rokok menambah kadar oksigen di dalam darah'], explain: 'Asap rokok mengandung **karbon monoksida yang mengikat sel darah merah sehingga tubuh kekurangan oksigen**. Akibatnya, napas menjadi cepat tersengal-sengal.' }) },
    ],
  });
  const ALUR = {
    besar: ['bilik kiri', 'aorta', 'seluruh tubuh', 'pembuluh balik besar (vena cava)', 'serambi kanan'],
    kecil: ['bilik kanan', 'pembuluh nadi paru-paru', 'paru-paru', 'pembuluh balik paru-paru', 'serambi kiri'],
  };
  const DARAHF = [
    { t: 'Peredaran darah kecil berawal dari bilik kanan.', f: 'Peredaran darah kecil berawal dari bilik kiri.' },
    { t: 'Pada peredaran darah besar, darah kaya oksigen dipompa dari bilik kiri ke seluruh tubuh.', f: 'Pada peredaran darah besar, darah kaya karbon dioksida dipompa dari bilik kiri ke seluruh tubuh.' },
    { t: 'Darah dari paru-paru masuk ke jantung melalui serambi kiri.', f: 'Darah dari paru-paru masuk ke jantung melalui serambi kanan.' },
    { t: 'Peredaran darah besar berakhir di serambi kanan.', f: 'Peredaran darah besar berakhir di serambi kiri.' },
    { t: 'Pembuluh balik paru-paru membawa darah yang kaya oksigen.', f: 'Pembuluh balik paru-paru membawa darah yang kaya karbon dioksida.' },
  ];
  reg({
    id: 'ipa-darah-peredaran', codes: ['IPA-08'], ind: 'Menjelaskan urutan peredaran darah besar dan kecil',
    params: (r) => ({ k: r.pick(['besar', 'kecil']) }),
    stimulus: () => ({ title: '', kind: 'Teks', text: 'Darah di dalam tubuh manusia mengalir melalui dua jalur, yaitu peredaran darah besar dan peredaran darah kecil. Kedua jalur itu berawal dan berakhir di jantung.', visuals: [] }),
    qs: [
      { id: 'urut', code: 'IPA-08', level: 'Penalaran', type: 'pg', ind: 'Menentukan urutan peredaran darah', make: (p, r) => {
        const A = ALUR[p.k], B = ALUR[p.k === 'besar' ? 'kecil' : 'besar'];
        const right = A.join(' → ');
        const w = [A.slice().reverse().join(' → '), [A[0], A[3], A[2], A[1], A[4]].join(' → '), [A[0], A[1], A[2], A[3], B[4]].join(' → ')];
        return pg(r, { text: `Urutan peredaran darah ${p.k} yang tepat adalah … .`, correct: right, wrong: w, explain: `Peredaran darah ${p.k}: **${right}**.` });
      } },
      { id: 'bs', code: 'IPA-08', level: 'Penerapan', type: 'bs', ind: 'Menilai pernyataan tentang peredaran darah besar dan kecil', make: (p, r) => tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items: tfItems(r, DARAHF, 4).map((x) => Object.assign(x, { why: x.ans === 1 ? 'pernyataan ini tidak sesuai dengan alur peredaran darah' : '' })), shuffle: false }) },
      { id: 'fungsi', code: 'IPA-08', level: 'Pemahaman', type: 'pg', ind: 'Menjelaskan fungsi peredaran darah kecil', make: (p, r) => pg(r, { text: 'Peredaran darah kecil berfungsi untuk … .', correct: 'menukar karbon dioksida dengan oksigen di paru-paru',
        wrong: ['mengedarkan sari makanan ke seluruh tubuh', 'menyerap sari makanan dari usus halus', 'menyaring zat sisa di ginjal'], explain: 'Pada peredaran darah kecil, darah dibawa ke paru-paru untuk **menukar karbon dioksida dengan oksigen di paru-paru**, lalu kembali ke jantung.' }) },

  reg({

    },
    stimulus: (p) => ({ title: '', kind: 'Teks', text: 'Perhatikan beberapa peristiwa berikut!\n\n' + p.ev.map((x, i) => `${nb(i)} ${cap(x.e)}.`).join('\n'), visuals: [] }),

      } },
      { id: 'sifat', code: 'IPA-17', level: 'Pemahaman', type: 'pg', ind: 'Menentukan sifat cahaya pada suatu peristiwa', make: (p, r) => { const i = r.int(0, 4), x = p.ev[i];

      { id: 'bs', code: 'IPA-17', level: 'Penalaran', type: 'bs', ind: 'Menilai sifat cahaya pada beberapa peristiwa', make: (p, r) => tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items: r.sample(p.ev.map((x, i) => {
        const claim = r.chance(0.5) ? x.n : r.pick(SCN.filter((s) => s !== x.n));
        return { text: `Peristiwa nomor ${nb(i)} menunjukkan bahwa cahaya ${claim}.`, ans: claim === x.n ? 0 : 1, why: `peristiwa ${nb(i)} menunjukkan cahaya ${x.n}` };
      }), 4), shuffle: false }) },
    ],
  });
  const BIAS = [{ end: [250, 210], k: 'benar' }, { end: [282, 206], k: 'lurus' }, { end: [322, 180], k: 'menjauh' }, { end: [290, 40], k: 'pantul' }];

  const ALATC = [

  reg({

  reg({

  /* ======================================================================
     IPA-19 ROTASI & REVOLUSI
     ====================================================================== */
  const ROT = ['terjadinya siang dan malam', 'perbedaan waktu di berbagai wilayah di bumi', 'gerak semu harian matahari (terbit di timur dan terbenam di barat)'];

  const ZONA = { WIB: ['Jakarta', 'Yogyakarta', 'Medan', 'Pontianak', 'Palembang', 'Semarang', 'Surabaya', 'Padang'], WITA: ['Makassar', 'Denpasar', 'Balikpapan', 'Mataram', 'Banjarmasin', 'Kupang', 'Manado', 'Palu'], WIT: ['Jayapura', 'Ambon', 'Ternate', 'Sorong', 'Merauke', 'Manokwari'] };
  const ZO = { WIB: 0, WITA: 1, WIT: 2 };

    ],
  });
  const MOON = [

    ],
  });

  /* ======================================================================
     IPA-20 GERHANA
     ====================================================================== */
  const ECL = [
    { t: 'Gerhana bulan terjadi ketika bulan berada pada fase purnama.', f: 'Gerhana bulan terjadi ketika bulan berada pada fase bulan baru.' },
    { t: 'Gerhana matahari terjadi pada siang hari.', f: 'Gerhana matahari terjadi pada malam hari.' },

const ENGINE = (() => {
  const GE = U.GenError;

  function inferTypes() {

  const KISI_MTK = `Matriks Asesmen TKA Matematika SD/MI

  // Contoh kisi IPAS disusun dari cakupan CP Fase B–C (BSKAP No. 46 Tahun 2025) seperti TKAD DIY.

  const KISI_BI = `Kisi-kisi TKA Bahasa Indonesia Kelas 6 SD/MI (membaca)
- Menentukan informasi tersurat dan tersirat dalam teks.
- Menentukan gagasan utama paragraf.
