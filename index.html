      tip: 'Pecah bangun gabungan menjadi persegi panjang dan segitiga. Keliling = jumlah panjang semua sisi terluar.' },
    { code: 'UKR-7', grp: 'UKR', el: 'Geometri dan Pengukuran', label: 'Volume bangun ruang (kubus, balok, gabungan)', w: 1.4,
      test: (l) => /volume.{0,40}(bangun\s+ruang|kubus|balok|gabungan)|(kubus|balok).{0,30}volume/.test(l),
      tip: 'Volume balok = p × l × t dan volume kubus = s × s × s. Untuk bangun gabungan, jumlahkan volume tiap bagian.' },
    { code: 'UKR-8', grp: 'UKR', el: 'Geometri dan Pengukuran', label: 'Besar sudut', w: 1,
      test: (l) => /sudut/.test(l),
      tip: 'Satu putaran penuh 360°, sudut lurus 180°, sudut siku-siku 90°. Jumlah sudut segitiga 180°.' },
    { code: 'UKR-9', grp: 'UKR', el: 'Geometri dan Pengukuran', label: 'Penaksiran ukuran', w: 0.9,
      test: (l) => /penaksiran|menaksir|taksiran|perkiraan|memperkirakan|estimasi|pembulatan/.test(l),
      tip: 'Bandingkan dengan ukuran benda yang sudah dikenal (tinggi badan, panjang pensil, isi gelas) dan bulatkan angka sebelum menghitung.' },
    { code: 'DAT-1', grp: 'DAT', el: 'Data', label: 'Penyajian data (gambar, piktogram, diagram batang, tabel frekuensi)', w: 1.5,
      test: (l) => /penyajian\s+data|menyajikan|piktogram|diagram\s+(batang|gambar)|tabel\s+frekuensi/.test(l),
      tip: 'Perhatikan skala dan keterangan simbol. Cocokkan setiap nilai pada tabel dengan tinggi batang atau banyak gambar.' },
    { code: 'DAT-2', grp: 'DAT', el: 'Data', label: 'Pengambilan informasi dan penggunaan data', w: 1.7,
      test: (l) => /pengambilan\s+informasi|penggunaan\s+data|pengolahan\s+data|membaca\s+data|interpretasi.{0,15}(data|tabel|grafik|diagram)|menafsirkan|kesimpulan.{0,25}data|menganalisis\s+data/.test(l),
      tip: 'Baca judul, label, dan satuan data terlebih dahulu. Hitung selisih, jumlah, dan bandingkan nilai secara teliti sebelum menyimpulkan.' },
    { code: 'EXT-PRB', grp: 'EXT', el: 'Bilangan', label: 'Perbandingan, skala, dan proporsi', w: 1.2, extra: true,
      test: (l) => !/pecahan/.test(l) && /proporsi|\bskala\b|\brasio\b|perbandingan\s+(senilai|berbalik|dua|antar|dan\s+proporsi)|^perbandingan\b/.test(l),
      tip: 'Tuliskan perbandingan dalam bentuk paling sederhana, lalu kalikan kedua suku dengan bilangan yang sama.' },
    { code: 'EXT-POL', grp: 'EXT', el: 'Bilangan', label: 'Pola bilangan', w: 1, extra: true,
      test: (l) => /pola\s+(bilangan|gambar|susunan)|barisan\s+bilangan/.test(l),
      tip: 'Cari selisih atau aturan antarsuku, lalu lanjutkan pola langkah demi langkah.' },
    { code: 'EXT-DLG', grp: 'EXT', el: 'Data', label: 'Diagram garis dan diagram lingkaran', w: 1, extra: true,
      test: (l) => /diagram\s+(garis|lingkaran)|grafik\s+garis/.test(l),
      tip: 'Pada diagram garis, perhatikan naik-turunnya garis; pada diagram lingkaran, ingat seluruh lingkaran = 100%.' },
  ];

  const BI = [
    { code: 'BI-01', label: 'Informasi tersurat', w: 1.4, test: has(/tersurat|eksplisit|informasi\s+(penting|rinci|dalam\s+teks)|menemukan\s+informasi|mencari\s+informasi|5w\s*1h|unsur\s+berita/),
      tip: 'Baca ulang bagian teks yang memuat kata kunci pertanyaan; jawaban tersurat tertulis langsung dalam teks.' },
    { code: 'BI-02', label: 'Informasi tersirat', w: 1.4, test: has(/tersirat|implisit|menyimpulkan|simpulan|kesimpulan|inferensi/),
      tip: 'Hubungkan beberapa petunjuk dalam teks untuk menemukan maksud yang tidak ditulis langsung.' },
    { code: 'BI-03', label: 'Gagasan utama', w: 1.2, test: has(/gagasan\s+(utama|pokok)|ide\s+(pokok|utama)|pikiran\s+(utama|pokok)|kalimat\s+utama|topik\s+paragraf/),
      tip: 'Gagasan utama adalah hal yang paling sering dibahas dalam paragraf, biasanya ada di kalimat awal atau akhir.' },
    { code: 'BI-04', label: 'Makna kata dan ungkapan', w: 1.2, test: has(/makna\s+(kata|istilah|ungkapan)|kosakata|arti\s+kata|ungkapan|sinonim|antonim|(kata|makna).{0,30}konteks/),
      tip: 'Tentukan makna kata dari kalimat di sekitarnya, lalu uji dengan mengganti kata itu dengan pilihan jawaban.' },
    { code: 'BI-05', label: 'Hubungan sebab-akibat', w: 1.1, test: has(/sebab|akibat|kausal/),
      tip: 'Cari kata penghubung seperti “karena”, “sehingga”, “akibatnya” untuk menemukan hubungan sebab-akibat.' },
    { code: 'BI-06', label: 'Tokoh dan peristiwa', w: 1.1, test: has(/tokoh|watak|karakter|penokohan|peristiwa|\balur\b|latar|urutan\s+(kejadian|peristiwa)/),
      tip: 'Perhatikan tindakan, ucapan, dan pikiran tokoh untuk menentukan wataknya; catat urutan peristiwa.' },
    { code: 'BI-07', label: 'Pesan dan amanat', w: 1.1, test: has(/amanat|pesan\s+(moral|cerita|penulis)|nilai\s+(moral|kehidupan)|pelajaran\s+(yang|dari)/),
      tip: 'Amanat adalah pelajaran dari sikap tokoh dan akibatnya; rumuskan sebagai ajakan berbuat baik.' },
    { code: 'BI-08', label: 'Interpretasi puisi', w: 1, test: has(/puisi|larik|\bbait\b|pantun|syair/),
      tip: 'Baca puisi per bait, temukan perbandingan atau kiasan, lalu tafsirkan perasaan dan pesan penyair.' },
    { code: 'BI-09', label: 'Evaluasi pendapat dan alasan', w: 1.1, test: has(/pendapat|opini|argumen|alasan|\bfakta\b|mengevaluasi|mendukung/),
      tip: 'Uji setiap alasan: apakah membuat pendapat lebih kuat (mendukung) atau justru melemahkannya?' },
    { code: 'BI-10', label: 'Fungsi gambar, tabel, dan infografis', w: 1, test: has(/fungsi\s+(gambar|tabel|ilustrasi|infografis|simbol|warna)|ilustrasi/),
      tip: 'Tanyakan: informasi apa yang dibantu dijelaskan oleh gambar, tabel, warna, atau simbol itu?' },
    { code: 'BI-11', label: 'Tujuan komunikasi teks', w: 1, test: has(/tujuan\s+(teks|penulis|komunikasi|surat|pengumuman|iklan)|maksud\s+(teks|penulis)|\bsurat\b|pengumuman|iklan|undangan/),
      tip: 'Tentukan untuk siapa teks ditulis dan apa yang diharapkan penulis dari pembaca.' },
    { code: 'BI-12', label: 'Interpretasi informasi visual', w: 1.2, test: has(/infografis|diagram|grafik|bagan|tabel|visual|denah/),
      tip: 'Baca judul, keterangan, dan angka pada infografis atau diagram, lalu cocokkan dengan pernyataan.' },
  ];
  const BI_EL = 'Membaca';
  BI.forEach((c) => { c.grp = 'BI'; c.el = BI_EL; });

  const byCode = {};
  MATH.forEach((c) => { byCode[c.code] = Object.assign(c, { subject: 'mtk' }); });
  BI.forEach((c) => { byCode[c.code] = Object.assign(c, { subject: 'bi' }); });

  const MATH_KW = [/bilangan/, /pecahan/, /desimal/, /persen/, /\bkpk\b/, /\bfpb\b/, /kelipatan/, /\bfaktor/, /cacah/, /operasi\s+hitung/, /penjumlahan|pengurangan|perkalian|pembagian/, /geometri/, /bangun/, /segitiga|segiempat|segi\s*banyak/, /kubus|balok/, /keliling/, /\bluas\b/, /volume/, /satuan/, /berat/, /kecepatan/, /sudut/, /penaksiran|taksiran/, /piktogram/, /diagram\s+batang/, /tabel\s+frekuensi/, /\bdata\b/, /numerasi/, /matematika/, /pengukuran/, /proporsi|skala/, /pola\s+bilangan/, /statistik/, /\b(mm|cm|km|kg|ml)\b/, /pengolahan\s+data/];
  const BI_KW = [/\bteks\b/, /bacaan/, /paragraf/, /gagasan/, /ide\s+pokok/, /tersurat/, /tersirat/, /makna/, /\bkata\b/, /ungkapan/, /amanat/, /tokoh/, /watak/, /fabel/, /cerita/, /puisi/, /larik/, /\bbait\b/, /\bsurat\b/, /pengumuman/, /infografis/, /literasi/, /bahasa\s+indonesia/, /kalimat/, /opini/, /\bfakta\b/, /pendapat/, /tujuan\s+(teks|penulis|komunikasi)/, /membaca/, /menyimpulkan|simpulan/, /sebab|akibat/, /penulis/, /narasi/, /eksplanasi/, /prosedur/, /berita/, /iklan/, /sastra/, /dongeng/];

  const GENERIC = [
    { subj: 'mtk', grp: 'BIL', re: /^bilangan( rasional)?$|\bbilangan\b/, codes: ['BIL-1', 'BIL-3', 'BIL-4', 'BIL-6'] },
    { subj: 'mtk', grp: 'BIL', re: /pecahan/, codes: ['BIL-1', 'BIL-2', 'BIL-3', 'BIL-5'] },
    { subj: 'mtk', grp: 'GEO', re: /geometri|objek\s+geometri/, codes: ['GEO-1', 'GEO-2'] },
    { subj: 'mtk', grp: 'GEO', re: /bangun\s+datar/, codes: ['GEO-1'] },
    { subj: 'mtk', grp: 'GEO', re: /bangun\s+ruang/, codes: ['GEO-2'] },
    { subj: 'mtk', grp: 'UKR', re: /pengukuran|satuan\s+baku/, codes: ['UKR-1', 'UKR-3', 'UKR-4', 'UKR-5', 'UKR-6', 'UKR-7'] },
    { subj: 'mtk', grp: 'DAT', re: /\bdata\b|statistik/, codes: ['DAT-1', 'DAT-2'] },
    { subj: 'bi', grp: 'BI', re: /teks\s+sastra|cerita|fabel|dongeng/, codes: ['BI-06', 'BI-07', 'BI-04', 'BI-02'] },
    { subj: 'bi', grp: 'BI', re: /teks\s+informasi|teks\s+nonsastra|informatif/, codes: ['BI-01', 'BI-03', 'BI-02', 'BI-12'] },
    { subj: 'bi', grp: 'BI', re: /membaca|literasi|pemahaman\s+bacaan/, codes: ['BI-01', 'BI-02', 'BI-03', 'BI-04', 'BI-07', 'BI-12'] },
  ];

  const SUBJ_NAME = { mtk: 'Matematika', bi: 'Bahasa Indonesia' };
  const ROMAN = { i: 1, ii: 2, iii: 3, iv: 4, v: 5, vi: 6, vii: 7, viii: 8, ix: 9, x: 10, xi: 11, xii: 12 };

  function detectJenjang(text) {
    const t = ' ' + text.toLowerCase() + ' ';
    let kelas = null;
    const m = /kelas\s*([0-9]{1,2}|xii|xi|ix|x|viii|vii|vi|iv|v|iii|ii|i)\b/.exec(t);
    if (m) kelas = /\d/.test(m[1]) ? parseInt(m[1], 10) : ROMAN[m[1]];
    let level = null;
    if (/\b(sd|mi)\b|sekolah\s+dasar|madrasah\s+ibtidaiyah/.test(t)) level = 'SD/MI';
    else if (/\b(smp|mts)\b/.test(t)) level = 'SMP/MTs';
    else if (/\b(sma|ma|smk)\b/.test(t)) level = 'SMA/MA';
    if (!level && kelas) level = kelas <= 6 ? 'SD/MI' : kelas <= 9 ? 'SMP/MTs' : 'SMA/MA';
    const isDefault = !kelas && !level;
    if (!kelas && level === 'SD/MI') kelas = 6;
    if (!level) level = 'SD/MI';
    if (!kelas) kelas = level === 'SD/MI' ? 6 : level === 'SMP/MTs' ? 9 : 12;
    return { kelas, level, label: `Kelas ${kelas} ${level}`, isDefault };
  }

  function prepLines(text) {
    const raw = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    raw.forEach((r0) => {
      let r = r0.replace(/ /g, ' ').replace(/^[\s●•▪◦·*\-–—]+/, '').replace(/^\(?\d{1,2}[.)]\s*/, '').trim();
      if (!r) return;
      if (/^(no\.?|elemen\/? ?materi|sub-?elemen\/? ?submateri|kompetensi|batasan\/? ?catatan|matriks asesmen)$/i.test(r)) return;
      const prev = out[out.length - 1];
      if (prev && /^[a-z(]/.test(r) && !/[.;:!?]$/.test(prev)) out[out.length - 1] = prev + ' ' + r;
      else out.push(r);
    });
    return out;
  }
  const score = (l, kws) => kws.reduce((s, re) => s + (re.test(l) ? 1 : 0), 0);

  // Analisis utama: mengembalikan daftar analisis per mata pelajaran
  function analyze(text) {
    const lines = prepLines(text);
    const jen = detectJenjang(text);
    const res = { mtk: { codes: {}, lines: [], generic: new Set(), genericCodes: {} }, bi: { codes: {}, lines: [], generic: new Set(), genericCodes: {} } };
    const unknown = [];
    let ctx = null;
    let docM = 0, docB = 0;
    lines.forEach((l0) => { const l = l0.toLowerCase(); docM += score(l, MATH_KW); docB += score(l, BI_KW); });
    const docBias = docM >= docB ? 'mtk' : 'bi';
    let levelNote = false;
    lines.forEach((l0) => {
      const l = l0.toLowerCase();
      if (/(^|\b)(matematika|numerasi)\b/.test(l) && l.length < 60 && !/bahasa/.test(l)) ctx = 'mtk';
      if (/bahasa\s+indonesia|literasi\s+membaca|\bliterasi\b/.test(l) && l.length < 60) ctx = 'bi';
      if (/memahami|mengaplikasikan|menerapkan|bernalar|penalaran/.test(l)) levelNote = true;
      const mCodes = MATH.filter((c) => c.test(l)).map((c) => c.code);
      const bCodes = BI.filter((c) => c.test(l)).map((c) => c.code);
      const sm = score(l, MATH_KW), sb = score(l, BI_KW);
      let subj = null;
      if (mCodes.length && !bCodes.length) subj = 'mtk';
      else if (bCodes.length && !mCodes.length) subj = 'bi';
      else if (mCodes.length && bCodes.length) subj = sm > sb ? 'mtk' : sb > sm ? 'bi' : (ctx || docBias);
      if (subj === 'mtk' && /pecahan/.test(l) && !mCodes.some((c) => c === 'BIL-1' || c === 'BIL-2' || c === 'BIL-5')) {
        ['BIL-1', 'BIL-5'].forEach((c) => { res.mtk.codes[c] = (res.mtk.codes[c] || 0) + 0.5; });
      }
      if (subj) {
        const codes = subj === 'mtk' ? mCodes : bCodes;
        codes.forEach((c) => { res[subj].codes[c] = (res[subj].codes[c] || 0) + 1; });
        res[subj].lines.push({ line: l0, codes });
        return;
      }
      // tidak ada kode spesifik → coba generik
      const g = GENERIC.filter((gr) => gr.re.test(l));
      if (g.length) {
        let gs = g.filter((gr) => gr.subj === (sm >= sb ? (sm === sb ? (ctx || docBias) : 'mtk') : 'bi'));
        if (!gs.length) gs = g;
        gs.forEach((gr) => {
          res[gr.subj].generic.add(gr.grp);
          res[gr.subj].genericCodes[gr.grp] = Array.from(new Set([...(res[gr.subj].genericCodes[gr.grp] || []), ...gr.codes]));
          res[gr.subj].lines.push({ line: l0, codes: [], generic: gr.grp });
        });
        return;
      }
      if (sm || sb) {
        const s2 = sm > sb ? 'mtk' : sb > sm ? 'bi' : (ctx || docBias);
        res[s2].lines.push({ line: l0, codes: [], context: true });
        if (/pemecahan\s+masalah|kontekstual|penalaran/.test(l)) res[s2].hots = true;
        return;
      }
      if (/pemecahan\s+masalah|kontekstual|soal\s+cerita|penalaran/.test(l)) {
        const s3 = ctx || docBias; res[s3].hots = true; res[s3].lines.push({ line: l0, codes: [], context: true });
        return;
      }
      if (l.length > 3 && !/^(memahami|mengaplikasikan)/.test(l)) unknown.push(l0);
    });
    const out = [];
    ['mtk', 'bi'].forEach((subj) => {
      const r = res[subj];
      // perluas grup generik jika grup tersebut tidak punya kode spesifik
      r.generic.forEach((grp) => {
        const spec = Object.keys(r.codes).some((c) => byCode[c].grp === grp);
        if (!spec) (r.genericCodes[grp] || []).forEach((c) => { r.codes[c] = (r.codes[c] || 0) + 0.5; });
      });
      const codes = Object.keys(r.codes);
      if (!codes.length) return;
      const list = (subj === 'mtk' ? MATH : BI).filter((c) => r.codes[c.code]).map((c) => ({
        code: c.code, label: c.label, el: c.el, grp: c.grp, extra: !!c.extra,
        hits: r.codes[c.code], weight: c.w * (1 + 0.15 * (Math.max(1, r.codes[c.code]) - 1)),
      }));
      out.push({ subject: subj, subjectName: SUBJ_NAME[subj], jenjang: jen, codes: list, lines: r.lines, hots: !!r.hots, levelNote, unknown: subj === docBias ? unknown : [] });
    });
    return { analyses: out, lines, unknown, jenjang: jen };
  }

  // Alokasi jumlah soal per kompetensi (sisa terbesar)
  function allocate(codes, total) {
    const K = codes.length;
    const alloc = {};
    if (!K) return alloc;
    if (K >= total) {
      codes.slice().sort((a, b) => b.weight - a.weight).slice(0, total).forEach((c) => { alloc[c.code] = 1; });
      return alloc;
    }
    codes.forEach((c) => { alloc[c.code] = 1; });
    const rest = total - K;
    const sw = codes.reduce((s, c) => s + c.weight, 0);
    const raw = codes.map((c) => ({ c, q: (rest * c.weight) / sw }));
    let used = 0;
    raw.forEach((x) => { const f = Math.floor(x.q); alloc[x.c.code] += f; used += f; x.r = x.q - f; });
    raw.sort((a, b) => b.r - a.r).slice(0, rest - used).forEach((x) => { alloc[x.c.code] += 1; });
    return alloc;
  }

  const LEVELS = ['Pemahaman', 'Penerapan', 'Penalaran'];
  const TYPE_NAME = { pg: 'Pilihan Ganda', pgk: 'Pilihan Ganda Kompleks', bs: 'Benar/Salah', ss: 'Sesuai/Tidak Sesuai', mtm: 'Mendukung/Tidak Mendukung', kat: 'Klasifikasi Pernyataan' };
  const TYPE_HINT = {
    pg: 'Pilih satu jawaban yang paling tepat.',
    pgk: 'Jawaban benar lebih dari satu. Pilih semua jawaban yang benar.',
    bs: 'Tentukan Benar atau Salah untuk setiap pernyataan.',
    ss: 'Tentukan Sesuai atau Tidak Sesuai untuk setiap pernyataan berdasarkan bacaan.',
    mtm: 'Tentukan apakah setiap alasan Mendukung atau Tidak Mendukung pendapat.',
    kat: 'Kelompokkan setiap pernyataan ke kolom yang tepat.',
  };
  const DEFAULT_LABELS = { bs: ['Benar', 'Salah'], ss: ['Sesuai', 'Tidak Sesuai'], mtm: ['Mendukung', 'Tidak Mendukung'], kat: ['Ya', 'Tidak'] };
  const isTable = (type) => type === 'bs' || type === 'ss' || type === 'mtm' || type === 'kat';

  return { MATH, BI, byCode, analyze, allocate, detectJenjang, prepLines, SUBJ_NAME, LEVELS, TYPE_NAME, TYPE_HINT, DEFAULT_LABELS, isTable };
})();

/* ===== 30_math_core.js ===== */
/* ==========================================================================
   30_math_core.js — pembantu penyusun soal Matematika + template elemen
   BILANGAN (pecahan, desimal, persen, operasi cacah, KPK/FPB).
   Setiap template: params(r) → p, stimulus(p), qs: [pembuat soal].
   ========================================================================== */
const MATH = (() => {
  const GE = U.GenError;
  const LET = ['A', 'B', 'C', 'D', 'E', 'F'];
  const optText = (v) => (v && typeof v === 'object')
    ? (v.text != null ? v.text : v.svg ? 'svg:' + U.hash(v.svg) : JSON.stringify(v.table || v))
    : String(v);
  function uniq(list, textOnly) {
    const ks = list.map((x) => (textOnly ? 't:' + U.norm(optText(x)) : U.optKey(optText(x))));
    if (new Set(ks).size !== ks.length) throw new GE('opsi kembar: ' + list.map(optText).join(' | '));
  }
  const toOpt = (v, id) => Object.assign({ id }, (v && typeof v === 'object') ? v : { text: String(v) });

  // Pilihan ganda: correct, wrong[] → opsi teracak/terurut
  function pg(r, o) {
    const n = o.n || 4;
    const wrong = (o.wrong || []).filter((w) => w != null);
    if (wrong.length < n - 1) throw new GE('pengecoh kurang');
    const items = [{ v: o.correct, ok: true }, ...wrong.slice(0, n - 1).map((v) => ({ v, ok: false }))];
    uniq(items.map((i) => i.v), o.textUniq);
    let arr;
    const nums = items.map((i) => (typeof i.v === 'object' ? null : U.numVal(String(i.v))));
    if (o.sortBy) arr = items.slice().sort((a, b) => o.sortBy(a.v) - o.sortBy(b.v));
    else if (o.order === 'text') arr = items.slice().sort((a, b) => optText(a.v).localeCompare(optText(b.v), 'id'));
    else if (o.order !== 'shuffle' && nums.every((x) => x !== null)) arr = items.slice().sort((a, b) => U.numVal(String(a.v)) - U.numVal(String(b.v)));
    else arr = r.shuffle(items);
    const options = arr.map((it, i) => toOpt(it.v, LET[i]));
    const q = { type: 'pg', text: o.text, options, key: LET[arr.findIndex((x) => x.ok)], explain: o.explain || '' };
    if (o.layout) q.layout = o.layout;
    return q;
  }
  // Pilihan ganda kompleks
  function pgk(r, o) {
    if (!o.correct || o.correct.length < 2) throw new GE('pgk butuh ≥2 benar');
    if (!o.wrong || !o.wrong.length) throw new GE('pgk butuh pengecoh');
    const items = [...o.correct.map((v) => ({ v, ok: true })), ...o.wrong.map((v) => ({ v, ok: false }))];
    uniq(items.map((i) => i.v), o.textUniq);
    const arr = o.order === 'text' ? items.slice().sort((a, b) => optText(a.v).localeCompare(optText(b.v), 'id')) : r.shuffle(items);
    const options = arr.map((it, i) => toOpt(it.v, LET[i]));
    const key = arr.map((x, i) => (x.ok ? LET[i] : null)).filter(Boolean);
    const q = { type: 'pgk', text: o.text, options, key, explain: o.explain || '' };
    if (o.layout) q.layout = o.layout;
    return q;
  }
  // Tabel pernyataan (Benar/Salah, Sesuai/Tidak, Mendukung/Tidak, Klasifikasi)
  function tab(r, o) {
    const type = o.type || 'bs';
    const labels = o.labels || TAX.DEFAULT_LABELS[type];
    let items = o.items.filter(Boolean);
    if (o.take) items = r.sample(items, Math.min(o.take, items.length));
    else if (o.shuffle !== false) items = r.shuffle(items);
    uniq(items.map((i) => i.text), true);
    if (!o.allowSame && new Set(items.map((i) => i.ans)).size < 2) throw new GE('jawaban tabel seragam');
    if (items.length < 3) throw new GE('pernyataan kurang');
    const explain = (o.intro ? o.intro + '\n\n' : '') + items.map((it, i) => `${i + 1}. ${it.text} → **${labels[it.ans]}**${it.why ? '. ' + it.why : ''}`).join('\n');
    return { type, text: o.text, labels, statements: items.map((it, i) => ({ id: 's' + (i + 1), text: it.text, key: it.ans })), explain: o.explain || explain };
  }
  // Pengecoh angka berdasarkan miskonsepsi (urutan prioritas) + pengisi
  function wrongs(r, correct, cands, o = {}) {
    const need = o.need || 3, f = o.fmt || ((x) => String(x));
    const out = [], seen = new Set([U.optKey(f(correct))]);
    const add = (v) => {
      if (v == null) return;
      if (typeof v === 'number') {
        if (!isFinite(v)) return;
        if (o.min != null && v < o.min) return;
        if (o.max != null && v > o.max) return;
        if (o.int && Math.abs(Math.round(v) - v) > 1e-9) return;
      }
      const k = U.optKey(f(v));
      if (seen.has(k)) return;
      seen.add(k); out.push(v);
    };
    cands.forEach(add);
    if (typeof correct === 'number') {
      const steps = o.steps || [1, 2, 3, 5, 10];
      let g = 0;
      while (out.length < need && g++ < 80) add(correct + r.pick(steps) * (o.unit || 1) * (r.chance(0.5) ? 1 : -1));
    }
    if (out.length < need) throw new GE('pengecoh kurang');
    return out.slice(0, need).map(f);
  }
  const MALE = ['Andi', 'Bima', 'Raka', 'Dimas', 'Fajar', 'Galih', 'Hafiz', 'Iqbal', 'Rafi', 'Yusuf', 'Arif', 'Bayu', 'Rizky', 'Ahmad', 'Dani', 'Satria'];
  const FEMALE = ['Ani', 'Bunga', 'Citra', 'Dewi', 'Fitri', 'Gita', 'Hana', 'Intan', 'Laila', 'Nisa', 'Putri', 'Rina', 'Sari', 'Tasya', 'Zahra', 'Aisyah', 'Nadia', 'Salma'];
  const people = (r, k) => r.sample(MALE.concat(FEMALE), k);
  const SCHOOLS = ['SD Harapan Bangsa', 'MI Nurul Huda', 'SD Tunas Mulia', 'MI Al-Hikmah', 'SD Pelita Ilmu', 'MI Miftahul Ulum', 'SD Cahaya Nusantara'];
  const svgV = (svg) => ({ type: 'svg', svg });
  const T = [];
  return { T, pg, pgk, tab, wrongs, people, SCHOOLS, LET, optText, svgV, GE };
})();

/* ---------------------------------------------------------------------------
   BILANGAN 1 — Pecahan bergambar (senilai, perbandingan, persen, operasi)
--------------------------------------------------------------------------- */
(() => {
  const { pg, pgk, tab, wrongs, people, svgV, GE } = MATH;
  const { Fr } = U;
  const R = Fr.raw;
  const CTX = [
    { item: 'kue bolu', cut: 'dipotong', kind: 'rect', title: 'Kue Bolu untuk Tiga Sahabat' },
    { item: 'martabak manis', cut: 'dipotong', kind: 'circle', title: 'Martabak Manis' },
    { item: 'cokelat batang', cut: 'dibagi', kind: 'rect', title: 'Cokelat Batang' },
    { item: 'pizza', cut: 'dipotong', kind: 'circle', title: 'Pizza di Hari Ulang Tahun' },
  ];
  const BASES = [[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [2, 5], [3, 5]];
  const SITA = [[1, 4], [3, 4], [1, 5], [2, 5], [3, 5], [4, 5], [3, 10], [7, 10], [9, 10]];
  const fv = (n, d) => n / d;
  MATH.T.push({
    id: 'frac_share', name: 'Pecahan bergambar', codes: ['BIL-1', 'BIL-2', 'BIL-3', 'BIL-5'],
    params(r) {
      const c = r.pick(CTX);
      let a, b, m;
      do { [a, b] = r.pick(BASES); m = r.pick([2, 3]); } while (b * m > 12);
      let sc, sd;
      do { [sc, sd] = r.pick(SITA); } while (Math.abs(fv(sc, sd) - fv(a, b)) < 0.06);
      return { c, a, b, m, sc, sd, names: people(r, 3) };
    },
    stimulus(p) {
      const [n0, n1, n2] = p.names;
      return {
        title: p.c.title, kind: 'Ilustrasi pecahan',
        text: `Ibu membeli tiga ${p.c.item} yang sama besar untuk ${n0}, ${n1}, dan ${n2}. Setiap ${p.c.item} ${p.c.cut} menjadi beberapa bagian yang sama besar. Bagian yang diarsir pada gambar menunjukkan bagian ${p.c.item} yang sudah dimakan.`,
        visuals: [svgV(SVG.fracSet([
          { kind: p.c.kind, parts: p.b, shaded: p.a, label: `Milik ${n0}` },
          { kind: p.c.kind, parts: p.b * p.m, shaded: p.a * p.m, label: `Milik ${n1}` },
          { kind: p.c.kind, parts: p.sd, shaded: p.sc, label: `Milik ${n2}` },
        ], { label: 'Gambar bagian kue yang dimakan' }))],
      };
    },
    qs: [
      { id: 'senilai', code: 'BIL-1', level: 'Pemahaman', ind: 'Menentukan pecahan senilai dari gambar arsiran',
        make(p, r) {
          const [n0] = p.names;
          const ks = [2, 3, 4].filter((k) => k !== p.m && p.b * k <= 20);
          const k = r.pick(ks.length ? ks : [p.m]);
          const corr = R(p.a * k, p.b * k);
          const base = p.a / p.b;
          const cands = [[p.a + k, p.b + k], [p.b - p.a, p.b], [(p.b - p.a) * k, p.b * k], [p.a * k, p.b + k], [p.a + 1, p.b * k]]
            .filter(([x, y]) => x > 0 && y > 0 && Math.abs(x / y - base) > 1e-9);
          const vals = []; const seenV = new Set();
          cands.forEach(([x, y]) => { const v = Math.round((x / y) * 1e6); if (!seenV.has(v)) { seenV.add(v); vals.push(R(x, y)); } });
          if (vals.length < 3) throw new GE('pengecoh');
          return pg(r, {
            text: `Bagian ${p.c.item} milik ${n0} yang sudah dimakan senilai dengan pecahan ....`,
            correct: corr, wrong: vals.slice(0, 3), order: 'shuffle',
            explain: `Bagian ${p.c.item} milik ${n0} yang diarsir adalah ${p.a} dari ${p.b} bagian, yaitu ${R(p.a, p.b)}.\nPecahan senilai diperoleh dengan mengalikan pembilang dan penyebut dengan bilangan yang sama:\n${R(p.a, p.b)} = {{${p.a} × ${k}/${p.b} × ${k}}} = ${corr}.\nJadi, jawabannya **${corr}**.`,
          });
        } },
      { id: 'senilai_banyak', code: 'BIL-1', level: 'Penerapan', ind: 'Menentukan beberapa pecahan yang senilai dengan gambar arsiran',
        make(p, r) {
          const [, n1] = p.names;
          const ks = r.shuffle([1, 2, 3, 4, 5].filter((k) => k !== p.m && p.b * k <= 24)).slice(0, 2);
          if (ks.length < 2) throw new GE('kurang');
          const correct = ks.map((k) => R(p.a * k, p.b * k));
          const base = p.a / p.b;
          const wc = [[p.b - p.a, p.b], [p.a + 1, p.b + 1], [p.a * 2, p.b * 2 + 1], [p.a, p.b * p.m], [p.a + 2, p.b * 2]]
            .filter(([x, y]) => x > 0 && x < y && Math.abs(x / y - base) > 1e-9);
          const wrong = []; const seen = new Set();
          wc.forEach(([x, y]) => { const v = Math.round((x / y) * 1e6); if (!seen.has(v) && wrong.length < 2) { seen.add(v); wrong.push(R(x, y)); } });
          if (wrong.length < 2) throw new GE('kurang');
          return pgk(r, {
            text: `Pecahan yang senilai dengan bagian ${p.c.item} milik ${n1} yang sudah dimakan adalah ....`,
            correct, wrong, textUniq: true,
            explain: `Bagian yang diarsir pada ${p.c.item} milik ${n1} adalah ${R(p.a * p.m, p.b * p.m)}. Bentuk paling sederhananya ${R(p.a * p.m, p.b * p.m)} = {{${p.a * p.m} : ${p.m}/${p.b * p.m} : ${p.m}}} = ${R(p.a, p.b)}.\nPecahan yang senilai dengan ${R(p.a, p.b)} adalah ${correct.join(' dan ')} (pembilang dan penyebut dikalikan bilangan yang sama).\nPecahan ${wrong.join(' dan ')} tidak senilai karena tidak dapat diperoleh dengan cara tersebut.`,
          });
        } },
      { id: 'banding', code: 'BIL-2', level: 'Penalaran', ind: 'Membandingkan beberapa pecahan berdasarkan gambar', type: 'bs',
        make(p, r) {
          const [n0, n1, n2] = p.names;
          const A = Fr.make(p.a, p.b), S = Fr.make(p.sc, p.sd);
          const sitaMore = Fr.cmp(S, A) > 0;
          const leftS = Fr.make(p.sd - p.sc, p.sd);
          const sumAS = Fr.add(A, S);
          const items = [];
          if (r.chance(0.7)) items.push({ text: `Bagian ${p.c.item} yang dimakan ${n0} sama banyak dengan bagian yang dimakan ${n1}.`, ans: 0, why: `${R(p.a, p.b)} = ${R(p.a * p.m, p.b * p.m)}` });
          else items.push({ text: `Bagian ${p.c.item} yang dimakan ${n1} lebih banyak daripada bagian yang dimakan ${n0}.`, ans: 1, why: `${R(p.a * p.m, p.b * p.m)} = ${R(p.a, p.b)}, jadi sama banyak` });
          items.push({ text: `Bagian yang dimakan ${n2} lebih banyak daripada bagian yang dimakan ${n0}.`, ans: sitaMore ? 0 : 1, why: `${R(p.sc, p.sd)} ${sitaMore ? '>' : '<'} ${R(p.a, p.b)}` });
          if (r.chance(0.5)) items.push({ text: `Sisa ${p.c.item} milik ${n2} adalah ${Fr.md(leftS)} bagian.`, ans: 0, why: `1 − ${R(p.sc, p.sd)} = ${Fr.md(leftS)}` });
          else items.push({ text: `Sisa ${p.c.item} milik ${n2} adalah ${R(p.sc, p.sd)} bagian.`, ans: 1, why: `sisanya 1 − ${R(p.sc, p.sd)} = ${Fr.md(leftS)}` });
          items.push({ text: `Jika bagian yang dimakan ${n0} dan ${n2} digabungkan, hasilnya lebih dari satu ${p.c.item} utuh.`, ans: Fr.cmp(sumAS, Fr.make(1, 1)) > 0 ? 0 : 1, why: `${R(p.a, p.b)} + ${R(p.sc, p.sd)} = ${Fr.md(sumAS)}` });
          return tab(r, { type: 'bs', text: `Tentukan benar atau salah setiap pernyataan berikut berdasarkan gambar!`, items });
        } },
      { id: 'persen', code: 'BIL-3', level: 'Penerapan', ind: 'Mengubah pecahan menjadi bentuk persen',
        make(p, r) {
          const [, , n2] = p.names;
          const P = (p.sc * 100) / p.sd, k = 100 / p.sd;
          const f = (v) => U.fmt(v) + '%';
          const cands = [((p.sd - p.sc) * 100) / p.sd, parseInt(`${p.sc}${p.sd}`, 10), P / 10, p.sc * 10, P + 5];
          return pg(r, {
            text: `Bagian ${p.c.item} milik ${n2} yang sudah dimakan jika dinyatakan dalam persen adalah ....`,
            correct: f(P), wrong: wrongs(r, P, cands, { fmt: f, min: 1, max: 99 }),
            explain: `Bagian yang dimakan ${n2} adalah ${R(p.sc, p.sd)}. Ubah penyebutnya menjadi 100:\n${R(p.sc, p.sd)} = {{${p.sc} × ${k}/${p.sd} × ${k}}} = {{${P}/100}} = ${U.fmt(P)}%.\nJadi, jawabannya **${U.fmt(P)}%**.`,
          });
        } },
      { id: 'jumlah', code: 'BIL-5', level: 'Penalaran', ind: 'Menjumlahkan pecahan berpenyebut berbeda dalam masalah sehari-hari',
        make(p, r) {
          const [n0, , n2] = p.names;
          const L0 = Fr.make(p.b - p.a, p.b), L2 = Fr.make(p.sd - p.sc, p.sd);
          const sum = Fr.add(L0, L2);
          const lcd = U.lcm(L0.d, L2.d);
          const x = L0.n * (lcd / L0.d), y = L2.n * (lcd / L2.d);
          const bad1 = Fr.make(L0.n + L2.n, L0.d + L2.d);
          const eaten = Fr.add(Fr.make(p.a, p.b), Fr.make(p.sc, p.sd));
          const diff = Fr.sub(L0, L2);
          const cands = [bad1, eaten, Fr.make(Math.abs(diff.n), diff.d), Fr.add(sum, Fr.make(1, lcd))].filter((v) => v.n > 0 && !Fr.eq(v, sum));
          const opts = []; const seen = new Set();
          cands.forEach((v) => { const k2 = v.n + '/' + v.d; if (!seen.has(k2)) { seen.add(k2); opts.push(Fr.md(v)); } });
          if (opts.length < 3) throw new GE('pengecoh');
          return pg(r, {
            text: `Sisa ${p.c.item} milik ${n0} dan sisa ${p.c.item} milik ${n2} dikumpulkan menjadi satu. Jumlah kedua sisa ${p.c.item} tersebut adalah .... bagian ${p.c.item} utuh.`,
            correct: Fr.md(sum), wrong: opts.slice(0, 3),
            explain: `Sisa milik ${n0} = 1 − ${R(p.a, p.b)} = ${Fr.md(L0)}.\nSisa milik ${n2} = 1 − ${R(p.sc, p.sd)} = ${Fr.md(L2)}.\nJumlahnya: ${Fr.md(L0)} + ${Fr.md(L2)} = ${R(x, lcd)} + ${R(y, lcd)} = ${R(x + y, lcd)} = ${Fr.md(sum)}.\nJadi, jawabannya **${Fr.md(sum)}**.`,
          });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   BILANGAN 2 — Survei: relasi pecahan, desimal, persen
--------------------------------------------------------------------------- */
(() => {

  const { Fr } = U;
  const CTX = [
    { title: 'Pilihan Ekstrakurikuler', topic: 'ekstrakurikuler yang ingin diikuti', head: 'Ekstrakurikuler', cats: ['Pramuka', 'Futsal', 'Menari', 'Melukis', 'Robotik', 'Tahfiz', 'Paduan suara'] },
    { title: 'Cara Siswa Berangkat ke Sekolah', topic: 'cara berangkat ke sekolah', head: 'Cara berangkat', cats: ['Berjalan kaki', 'Bersepeda', 'Diantar motor', 'Naik angkot', 'Naik bus sekolah'] },
    { title: 'Buah Kesukaan Siswa', topic: 'buah kesukaan', head: 'Buah', cats: ['Mangga', 'Pisang', 'Jeruk', 'Semangka', 'Rambutan', 'Pepaya'] },
  ];
  const decStr = (pct) => '0,' + String(pct).padStart(2, '0').replace(/0$/, '');
  MATH.T.push({
    id: 'survey_pct', name: 'Survei pecahan-desimal-persen', codes: ['BIL-3', 'BIL-2', 'BIL-5', 'DAT-2'],
    params(r) {
      const c = r.pick(CTX);
      const N = 20 * r.pick([2, 3, 4]);
      let p1, p2, p3, p4, g = 0;
      do {
        p1 = r.pick([20, 25, 30, 35, 40]); p2 = r.pick([15, 20, 25, 30, 35, 40, 45]); p3 = r.pick([10, 15, 20, 25, 30]);
        p4 = 100 - p1 - p2 - p3;
      } while ((p4 < 10 || new Set([p1, p2, p3, p4]).size < 4) && g++ < 200);
      if (p4 < 10 || new Set([p1, p2, p3, p4]).size < 4) throw new GE('param');
      const cats = r.sample(c.cats, 4);
      return { c, N, pc: [p1, p2, p3, p4], cats, school: r.pick(SCHOOLS) };
    },
    stimulus(p) {
      const [p1, p2, p3] = p.pc;
      return {
        title: p.c.title, kind: 'Tabel data',
        text: `Sebanyak ${p.N} siswa kelas 6 ${p.school} ditanya tentang ${p.c.topic}. Setiap siswa hanya memilih satu. Hasilnya dicatat dalam tabel berikut.`,
        visuals: [{ type: 'table', caption: `Hasil pilihan ${p.N} siswa`, headers: [p.c.head, 'Bagian dari seluruh siswa'],
          rows: [[p.cats[0], Fr.md(Fr.make(p1, 100))], [p.cats[1], decStr(p2)], [p.cats[2], p3 + '%'], [p.cats[3], 'sisanya']] }],
      };
    },
    qs: [
      { id: 'setara', code: 'BIL-3', level: 'Pemahaman', ind: 'Menentukan kesetaraan pecahan, desimal, dan persen', type: 'bs',
        make(p, r) {
          const [p1, p2, p3] = p.pc;
          const f1 = Fr.md(Fr.make(p1, 100));
          const items = [];
          if (r.chance(0.5)) items.push({ text: `${f1} sama dengan ${p1}%.`, ans: 0, why: `${f1} = {{${p1}/100}} = ${p1}%` });
          else items.push({ text: `${f1} sama dengan ${p1 + 5}%.`, ans: 1, why: `${f1} = {{${p1}/100}} = ${p1}%` });
          if (r.chance(0.5)) items.push({ text: `${decStr(p2)} sama dengan {{${p2}/10}}.`, ans: 1, why: `${decStr(p2)} = {{${p2}/100}}` });
          else items.push({ text: `${decStr(p2)} sama dengan ${Fr.md(Fr.make(p2, 100))}.`, ans: 0, why: `${decStr(p2)} = {{${p2}/100}} = ${Fr.md(Fr.make(p2, 100))}` });
          if (r.chance(0.5)) items.push({ text: `${p3}% sama dengan ${Fr.md(Fr.make(p3, 100))}.`, ans: 0, why: `${p3}% = {{${p3}/100}} = ${Fr.md(Fr.make(p3, 100))}` });
          else items.push({ text: `${p3}% sama dengan {{1/${p3}}}.`, ans: 1, why: `${p3}% = {{${p3}/100}} = ${Fr.md(Fr.make(p3, 100))}` });
          items.push({ text: `Siswa yang memilih ${p.cats[1]} lebih sedikit daripada siswa yang memilih ${p.cats[0]}.`, ans: p2 < p1 ? 0 : 1, why: `${decStr(p2)} = ${p2}% dan ${f1} = ${p1}%` });
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
      { id: 'urut', code: 'BIL-2', level: 'Penerapan', ind: 'Mengurutkan data berbentuk pecahan, desimal, dan persen',
        make(p, r) {
          const idx = [0, 1, 2, 3];
          const desc = idx.slice().sort((a, b) => p.pc[b] - p.pc[a]);
          const name = (ord) => ord.map((i) => p.cats[i]).join(', ');
          const asc = desc.slice().reverse();
          const sw1 = desc.slice(); [sw1[0], sw1[1]] = [sw1[1], sw1[0]];
          const sw2 = desc.slice(); [sw2[2], sw2[3]] = [sw2[3], sw2[2]];
          const written = idx.slice().sort((a, b) => [p.pc[0] / 100 * 10, p.pc[1], p.pc[2], 0][b] - [p.pc[0] / 100 * 10, p.pc[1], p.pc[2], 0][a]);
          const cands = [asc, sw1, sw2, written, idx].map(name).filter((s) => s !== name(desc));
          const wr = Array.from(new Set(cands)).slice(0, 3);
          if (wr.length < 3) throw new GE('pengecoh');
          return pg(r, {
            text: `Urutan pilihan dari yang paling banyak dipilih sampai yang paling sedikit adalah ....`,
            correct: name(desc), wrong: wr, order: 'shuffle',
            explain: `Ubah semua ke persen: ${p.cats[0]} = ${Fr.md(Fr.make(p.pc[0], 100))} = ${p.pc[0]}%, ${p.cats[1]} = ${decStr(p.pc[1])} = ${p.pc[1]}%, ${p.cats[2]} = ${p.pc[2]}%, ${p.cats[3]} = 100% − ${p.pc[0]}% − ${p.pc[1]}% − ${p.pc[2]}% = ${p.pc[3]}%.\nUrutan dari yang terbesar: **${name(desc)}**.`,
          });
        } },
      { id: 'banyak', code: 'DAT-2', level: 'Penerapan', ind: 'Menghitung banyak anggota dari data persen', form: 'Interpretasi data',
        make(p, r) {
          const p4 = p.pc[3], v = (p4 * p.N) / 100;
          const others = [0, 1, 2].map((i) => (p.pc[i] * p.N) / 100);
          return pg(r, {
            text: `Banyak siswa yang memilih ${p.cats[3]} adalah .... orang.`,
            correct: String(v), wrong: wrongs(r, v, [p4, p.N - v, ...others], { min: 1, int: true }),
            explain: `Bagian ${p.cats[3]} = 100% − ${p.pc[0]}% − ${p.pc[1]}% − ${p.pc[2]}% = ${p4}%.\nBanyak siswa = ${p4}% × ${p.N} = {{${p4}/100}} × ${p.N} = ${v} orang.\nJadi, jawabannya **${v} orang**.`,
          });
        } },
      { id: 'jumlahfr', code: 'BIL-5', level: 'Penalaran', ind: 'Menjumlahkan pecahan dan persen lalu menyederhanakan', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const [p1, p2, p3] = p.pc;
          const corr = Fr.make(p1 + p3, 100);
          const f1 = Fr.make(p1, 100);
          const bad = Fr.make(f1.n + p3, f1.d + 100);
          const cands = [bad, Fr.make(p1 + p2, 100), Fr.make(100 - p1 - p3, 100), Fr.make(p2 + p3, 100), Fr.make(p1 + p3 + 5, 100)]
            .filter((x) => !Fr.eq(x, corr));
          const seen = new Set(); const wr = [];
          cands.forEach((x) => { const k = x.n + '/' + x.d; if (!seen.has(k) && wr.length < 3) { seen.add(k); wr.push(Fr.md(x)); } });
          if (wr.length < 3) throw new GE('pengecoh');
          return pg(r, {
            text: `Bagian siswa yang memilih ${p.cats[0]} atau ${p.cats[2]} jika dinyatakan dalam pecahan paling sederhana adalah ....`,
            correct: Fr.md(corr), wrong: wr, order: 'shuffle',
            explain: `${p.cats[0]} = ${Fr.md(f1)} = {{${p1}/100}} dan ${p.cats[2]} = ${p3}% = {{${p3}/100}}.\nJumlahnya {{${p1}/100}} + {{${p3}/100}} = {{${p1 + p3}/100}} = ${Fr.md(corr)}.\nJadi, jawabannya **${Fr.md(corr)}**.`,
          });
        } },
      { id: 'simpul', code: 'DAT-2', level: 'Penalaran', ind: 'Menarik kesimpulan dari data pecahan, desimal, dan persen', form: 'Interpretasi data',
        make(p, r) {
          const cnt = p.pc.map((x) => (x * p.N) / 100);
          const i = r.int(0, 3); let j = r.int(0, 3); if (j === i) j = (i + 1) % 4;
          const max = Math.max(...p.pc), imax = p.pc.indexOf(max);
          const pool = [
            { t: `${p.cats[i]} dipilih oleh ${cnt[i]} siswa.`, ok: true },
            { t: `Selisih banyak siswa yang memilih ${p.cats[i]} dan ${p.cats[j]} adalah ${Math.abs(cnt[i] - cnt[j])} orang.`, ok: true },
            { t: `${p.cats[2]} dipilih oleh ${p.pc[2]} siswa.`, ok: cnt[2] === p.pc[2] },
            { t: `Lebih dari setengah jumlah siswa memilih ${p.cats[imax]}.`, ok: max > 50 },
            { t: `Banyak siswa yang memilih ${p.cats[0]} sama dengan ${Fr.md(Fr.make(p.pc[0], 100))} × ${p.N} = ${cnt[0]} orang.`, ok: true },
            { t: `Siswa yang memilih ${p.cats[3]} lebih banyak daripada yang memilih ${p.cats[1]}.`, ok: p.pc[3] > p.pc[1] },
            { t: `Jumlah siswa yang memilih ${p.cats[1]} dan ${p.cats[2]} adalah ${cnt[1] + cnt[2] + (r.chance(0.5) ? 2 : -2)} orang.`, ok: false },
          ];
          const T = r.shuffle(pool.filter((x) => x.ok)).slice(0, r.pick([2, 3]));
          const F = r.shuffle(pool.filter((x) => !x.ok)).slice(0, 2);
          if (T.length < 2 || F.length < 1) throw new GE('kurang');
          return pgk(r, {
            text: `Berdasarkan tabel, pernyataan yang benar adalah ....`,
            correct: T.map((x) => x.t), wrong: F.map((x) => x.t),
            explain: `Banyak siswa tiap pilihan: ${p.cats.map((c, k) => `${c} = ${p.pc[k]}% × ${p.N} = ${cnt[k]} orang`).join('; ')}.\nPernyataan yang sesuai dengan perhitungan tersebut adalah yang benar: ${T.map((x) => '“' + x.t + '”').join(', ')}.`,
          });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   BILANGAN 3 — Stok barang: operasi hitung bilangan cacah
--------------------------------------------------------------------------- */
(() => {
  const { pg, pgk, tab, wrongs, GE } = MATH;
  const { fmt, rp } = U;
  const CTX = [
    { place: 'Toko Pak Amir', stock: (K) => `${K} kardus air mineral`, cont: 'kardus', unit: 'botol', item: 'botol air mineral', per: [24, 36, 48], pack: 'plastik', packs: [5, 6, 10, 12], price: [12000, 15000, 18000], verb: 'menerima' },
    { place: 'Peternakan Bu Siti', stock: (K) => `${K} rak telur`, cont: 'rak', unit: 'butir', item: 'telur', per: [30], pack: 'kotak', packs: [6, 10, 12], price: [15000, 20000, 24000], verb: 'mengumpulkan' },
    { place: 'Koperasi sekolah', stock: (K) => `${K} pak buku tulis`, cont: 'pak', unit: 'buku', item: 'buku tulis', per: [20, 40], pack: 'paket', packs: [3, 4, 6], price: [12000, 15000, 21000], verb: 'menerima' },
  ];
  MATH.T.push({
    id: 'stock_ops', name: 'Stok barang (operasi bilangan cacah)', codes: ['BIL-4'],
    params(r) {
      const c = r.pick(CTX);
      const per = r.pick(c.per);
      let K, T, g = 0;
      do { K = r.int(12, 45); T = K * per; } while ((T < 360 || T > 2400 || K === per) && g++ < 100);
      let S = Math.round((T * (0.35 + r() * 0.3)) / 5) * 5;
      if (S % 10 === 0 && r.chance(0.6)) S += 5;
      const sisa = T - S;
      const qs = c.packs.filter((q) => sisa % q !== 0);
      const q = qs.length ? r.pick(qs) : r.pick(c.packs);
      return { c, per, K, T, S, sisa, q, n: Math.floor(sisa / q), rem: sisa % q, price: r.pick(c.price) };
    },
    stimulus(p) {
      return {
        title: `Persediaan di ${p.c.place}`, kind: 'Masalah kontekstual',
        text: `${p.c.place} ${p.c.verb} ${p.c.stock(p.K)}. Setiap ${p.c.cont} berisi ${p.per} ${p.c.unit}. Pada minggu pertama, terjual ${fmt(p.S)} ${p.c.unit}.\n\nSisa ${p.c.item} kemudian dikemas ulang ke dalam ${p.c.pack} yang masing-masing berisi ${p.q} ${p.c.unit}. Setiap ${p.c.pack} dijual dengan harga ${rp(p.price)}.`,
        visuals: [],
      };
    },
    qs: [
      { id: 'kali', code: 'BIL-4', level: 'Pemahaman', ind: 'Menghitung hasil perkalian bilangan cacah dalam konteks',
        make(p, r) {
          const u = p.c.unit, f = (v) => fmt(v) + ' ' + u;
          const tens = Math.floor(p.per / 10) * 10, ones = p.per % 10;
          const pv = ones ? p.K * (tens / 10) + p.K * ones : null;
          return pg(r, {
            text: `Banyak ${p.c.item} seluruhnya sebelum ada yang terjual adalah ....`,
            correct: f(p.T), wrong: wrongs(r, p.T, [pv, (p.K - 1) * p.per, (p.K + 1) * p.per, p.K + p.per], { fmt: f, min: 1, int: true, unit: p.per }),
            explain: ones
              ? `Banyak ${p.c.unit} = ${p.K} × ${p.per} = ${p.K} × ${tens} + ${p.K} × ${ones} = ${fmt(p.K * tens)} + ${fmt(p.K * ones)} = ${fmt(p.T)}.\nJadi, jawabannya **${fmt(p.T)} ${u}**.`
              : `Banyak ${p.c.unit} = ${p.K} × ${p.per} = ${fmt(p.T)}.\nJadi, jawabannya **${fmt(p.T)} ${u}**.`,
          });
        } },
      { id: 'bagi', code: 'BIL-4', level: 'Penerapan', ind: 'Menentukan hasil bagi dan sisa pembagian dalam konteks',
        make(p, r) {
          const f = (v) => fmt(v) + ' ' + p.c.pack;
          return pg(r, {
            text: `Banyak ${p.c.pack} yang terisi penuh adalah ....`,
            correct: f(p.n), wrong: wrongs(r, p.n, [p.rem ? p.n + 1 : null, Math.floor(p.T / p.q), Math.floor(p.S / p.q), p.n - 1], { fmt: f, min: 1, int: true }),
            explain: `Sisa ${p.c.unit} = ${fmt(p.T)} − ${fmt(p.S)} = ${fmt(p.sisa)}.\n${fmt(p.sisa)} : ${p.q} = ${p.n}${p.rem ? ` sisa ${p.rem}` : ''}.\nJadi, ada **${p.n} ${p.c.pack}** yang terisi penuh${p.rem ? ` dan ${p.rem} ${p.c.unit} tidak masuk ${p.c.pack}` : ''}.`,
          });
        } },
      { id: 'uang', code: 'BIL-4', level: 'Penalaran', ind: 'Menyelesaikan masalah operasi hitung campuran bilangan cacah', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const v = p.n * p.price;
          return pg(r, {
            text: `Jika semua ${p.c.pack} yang terisi penuh terjual, uang yang diterima adalah ....`,
            correct: U.rp(v), wrong: wrongs(r, v, [(p.n + 1) * p.price, (p.n - 1) * p.price, Math.floor(p.T / p.q) * p.price, p.sisa * p.price / 10], { fmt: U.rp, min: 1000, int: true, unit: p.price }),
            explain: `Banyak ${p.c.pack} penuh = ${fmt(p.sisa)} : ${p.q} = ${p.n}${p.rem ? ` (sisa ${p.rem})` : ''}.\nUang yang diterima = ${p.n} × ${U.rp(p.price)} = ${U.rp(v)}.\nJadi, jawabannya **${U.rp(v)}**.`,
          });
        } },
      { id: 'cek', code: 'BIL-4', level: 'Penerapan', ind: 'Memeriksa kebenaran hasil operasi hitung bilangan cacah', type: 'bs',
        make(p, r) {
          const u = p.c.unit;
          const items = [
            r.chance(0.5) ? { text: `Banyak ${u} sebelum ada yang terjual adalah ${fmt(p.T)}.`, ans: 0, why: `${p.K} × ${p.per} = ${fmt(p.T)}` }
              : { text: `Banyak ${u} sebelum ada yang terjual adalah ${fmt(p.T + p.per)}.`, ans: 1, why: `${p.K} × ${p.per} = ${fmt(p.T)}` },
            r.chance(0.5) ? { text: `Sisa ${u} sebelum dikemas ulang adalah ${fmt(p.sisa)}.`, ans: 0, why: `${fmt(p.T)} − ${fmt(p.S)} = ${fmt(p.sisa)}` }
              : { text: `Sisa ${u} sebelum dikemas ulang adalah ${fmt(p.sisa + 10)}.`, ans: 1, why: `${fmt(p.T)} − ${fmt(p.S)} = ${fmt(p.sisa)}` },
            p.rem ? { text: `Ada ${p.rem} ${u} yang tidak masuk ke dalam ${p.c.pack}.`, ans: 0, why: `${fmt(p.sisa)} : ${p.q} = ${p.n} sisa ${p.rem}` }
              : { text: `Ada ${p.q - 1} ${u} yang tidak masuk ke dalam ${p.c.pack}.`, ans: 1, why: `${fmt(p.sisa)} : ${p.q} = ${p.n} tanpa sisa` },
            r.chance(0.5) ? { text: `Jika 2 ${p.c.cont} rusak sebelum dijual, banyak ${u} berkurang ${2 * p.per}.`, ans: 0, why: `2 × ${p.per} = ${2 * p.per}` }
              : { text: `Jika 2 ${p.c.cont} rusak sebelum dijual, banyak ${u} berkurang ${p.per + 2}.`, ans: 1, why: `2 × ${p.per} = ${2 * p.per}` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
      { id: 'kalimat', code: 'BIL-4', level: 'Penalaran', ind: 'Memilih kalimat matematika yang tepat untuk menyelesaikan masalah',
        make(p, r) {
          const K = p.K, per = p.per, S = fmt(p.S);
          const correct = r.sample([`${K} × ${per} − ${S}`, `(${K} × ${per}) − ${S}`, `${per} × ${K} − ${S}`], 2);
          const wrong = r.sample([`${K} × (${per} − ${S})`, `${S} − ${K} × ${per}`, `${K} + ${per} − ${S}`, `(${K} − ${S}) × ${per}`], 2);
          return pgk(r, {
            text: `Kalimat matematika yang tepat untuk menghitung sisa ${p.c.unit} sebelum dikemas ulang adalah ....`,
            correct, wrong, textUniq: true,
            explain: `Sisa = (banyak ${p.c.unit} seluruhnya) − (yang terjual) = ${K} × ${per} − ${S}. Perkalian dikerjakan lebih dahulu, sehingga ${correct.join(' dan ')} memberikan hasil yang sama, yaitu ${fmt(p.sisa)}.\nKalimat ${wrong.join(' dan ')} tidak tepat karena urutan atau operasinya salah.`,
          });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   BILANGAN 4 — Belanja di koperasi: operasi campuran & persen
--------------------------------------------------------------------------- */
(() => {
  const { pg, pgk, tab, wrongs, people, GE } = MATH;
  const { fmt, rp } = U;
  const ITEMS = [
    ['buku tulis', 3500, 6000], ['pensil', 2000, 3500], ['penghapus', 1500, 2500], ['penggaris', 3000, 5000],
    ['pulpen', 2500, 4000], ['spidol', 6000, 9000], ['buku gambar', 7000, 10000], ['rautan', 2000, 3500], ['map plastik', 2500, 4500],
  ];
  MATH.T.push({
    id: 'shopping', name: 'Belanja dan potongan harga', codes: ['BIL-4', 'BIL-3'],
    params(r) {
      for (let g = 0; g < 200; g++) {
        const list = r.sample(ITEMS, 5).map(([n, lo, hi]) => ({ n, price: 500 * r.int(lo / 500, hi / 500) }));
        if (new Set(list.map((x) => x.price)).size < 5) continue;
        const buy = list.slice(0, 3).map((x) => ({ ...x, q: r.int(2, 5) }));
        const T = buy.reduce((s, x) => s + x.q * x.price, 0);
        const disc = r.pick([10, 5]);
        const thr = r.pick([25000, 30000]);
        if (T < thr + 2000 || T > 48000) continue;
        const after = T - (T * disc) / 100;
        const pay = 50000;
        const change = pay - after;
        const afford = list.filter((x) => x.price <= change).length;
        if (afford < 2 || afford > 3) continue;
        return { list, buy, T, disc, thr, after, pay, change, name: people(r, 1)[0] };
      }
      throw new GE('param belanja');
    },
    stimulus(p) {
      return {
        title: 'Belanja di Koperasi Sekolah', kind: 'Daftar harga',
        text: `${p.name} berbelanja di koperasi sekolah. Ia membeli ${U.listJoin(p.buy.map((x) => `${x.q} ${x.n}`))}. Ia membayar dengan selembar uang ${rp(p.pay)}.\n\nKoperasi memberikan potongan harga ${p.disc}% untuk total belanja minimal ${rp(p.thr)}.`,
        visuals: [{ type: 'table', caption: 'Daftar harga koperasi', headers: ['Barang', 'Harga satuan'], rows: p.list.map((x) => [x.n, rp(x.price)]) }],
      };
    },
    qs: [
      { id: 'total', code: 'BIL-4', level: 'Penerapan', ind: 'Menghitung total harga dengan operasi hitung campuran',
        make(p, r) {
          const sumUnit = p.buy.reduce((s, x) => s + x.price, 0);
          const w1 = p.T - p.buy[0].price, w2 = p.T + p.buy[1].price;
          return pg(r, {
            text: `Total harga belanjaan ${p.name} sebelum mendapat potongan adalah ....`,
            correct: rp(p.T), wrong: wrongs(r, p.T, [w1, w2, sumUnit * 3, p.T + 1000], { fmt: rp, min: 1000, int: true, unit: 500 }),
            explain: p.buy.map((x) => `${x.q} × ${rp(x.price)} = ${rp(x.q * x.price)}`).join('\n') + `\nTotal = ${p.buy.map((x) => rp(x.q * x.price)).join(' + ')} = ${rp(p.T)}.\nJadi, jawabannya **${rp(p.T)}**.`,
          });
        } },
      { id: 'potongan', code: 'BIL-3', level: 'Penerapan', ind: 'Menghitung besar potongan harga dalam persen',
        make(p, r) {
          const d = (p.T * p.disc) / 100;
          return pg(r, {
            text: `Besar potongan harga yang diterima ${p.name} adalah ....`,
            correct: rp(d), wrong: wrongs(r, d, [p.disc * 1000, (p.T * p.disc) / 10, p.after, d + 500], { fmt: rp, min: 100, unit: 50 }),
            explain: `Total belanja ${rp(p.T)} sudah mencapai minimal ${rp(p.thr)}, jadi mendapat potongan ${p.disc}%.\nPotongan = ${p.disc}% × ${rp(p.T)} = {{${p.disc}/100}} × ${fmt(p.T)} = ${rp(d)}.\nJadi, jawabannya **${rp(d)}**.`,
          });
        } },
      { id: 'kembali', code: 'BIL-4', level: 'Penalaran', ind: 'Menyelesaikan masalah uang kembalian setelah potongan harga', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const d = (p.T * p.disc) / 100;
          return pg(r, {
            text: `Uang kembalian yang diterima ${p.name} adalah ....`,
            correct: rp(p.change), wrong: wrongs(r, p.change, [p.pay - p.T, p.pay - d, p.change + 1000, p.change - 500], { fmt: rp, min: 100, unit: 50 }),
            explain: `Potongan = ${p.disc}% × ${rp(p.T)} = ${rp(d)}.\nHarga yang dibayar = ${rp(p.T)} − ${rp(d)} = ${rp(p.after)}.\nKembalian = ${rp(p.pay)} − ${rp(p.after)} = ${rp(p.change)}.\nJadi, jawabannya **${rp(p.change)}**.`,
          });
        } },
      { id: 'pilih', code: 'BIL-4', level: 'Penalaran', ind: 'Menentukan barang yang dapat dibeli dengan sisa uang', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const ok = p.list.filter((x) => x.price <= p.change), no = p.list.filter((x) => x.price > p.change);
          if (ok.length < 2 || !no.length) throw new GE('kurang');
          return pgk(r, {
            text: `Dengan uang kembaliannya, ${p.name} ingin membeli satu barang lagi dari daftar harga. Barang yang dapat dibeli adalah ....`,
            correct: ok.map((x) => x.n), wrong: no.map((x) => x.n), order: 'shuffle',
            explain: `Uang kembalian ${p.name} adalah ${rp(p.change)}. Barang yang harganya tidak lebih dari ${rp(p.change)}: ${ok.map((x) => `${x.n} (${rp(x.price)})`).join(', ')}.\nBarang yang tidak terbeli: ${no.map((x) => `${x.n} (${rp(x.price)})`).join(', ')}.`,
          });
        } },
      { id: 'banding', code: 'BIL-4', level: 'Penerapan', ind: 'Membandingkan harga barang menggunakan operasi hitung', type: 'bs',
        make(p, r) {
          const [a, b, c] = r.sample(p.list, 3);
          const k = r.int(2, 4);
          const items = [
            { text: `Harga ${k} ${a.n} lebih mahal daripada harga 1 ${c.n}.`, ans: k * a.price > c.price ? 0 : 1, why: `${k} × ${rp(a.price)} = ${rp(k * a.price)}, sedangkan 1 ${c.n} = ${rp(c.price)}` },
            r.chance(0.5) ? { text: `Selisih harga ${a.n} dan ${b.n} adalah ${rp(Math.abs(a.price - b.price))}.`, ans: 0, why: `${rp(Math.max(a.price, b.price))} − ${rp(Math.min(a.price, b.price))} = ${rp(Math.abs(a.price - b.price))}` }
              : { text: `Selisih harga ${a.n} dan ${b.n} adalah ${rp(Math.abs(a.price - b.price) + 500)}.`, ans: 1, why: `${rp(Math.max(a.price, b.price))} − ${rp(Math.min(a.price, b.price))} = ${rp(Math.abs(a.price - b.price))}` },
            r.chance(0.5) ? { text: `Jika tidak mendapat potongan harga, uang kembalian ${p.name} adalah ${rp(p.pay - p.T)}.`, ans: 0, why: `${rp(p.pay)} − ${rp(p.T)} = ${rp(p.pay - p.T)}` }
              : { text: `Jika tidak mendapat potongan harga, uang kembalian ${p.name} adalah ${rp(p.pay - p.T + 1000)}.`, ans: 1, why: `${rp(p.pay)} − ${rp(p.T)} = ${rp(p.pay - p.T)}` },
            { text: `Total belanja ${p.name} memenuhi syarat untuk mendapat potongan harga.`, ans: p.T >= p.thr ? 0 : 1, why: `${rp(p.T)} ≥ ${rp(p.thr)}` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   BILANGAN 5 — KPK: jadwal kegiatan (tanggal) dan keberangkatan bus (waktu)
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, wrongs, people, GE } = MATH;
  const MONTHS = [['Januari', 31, 'Februari'], ['Maret', 31, 'April'], ['April', 30, 'Mei'], ['Juli', 31, 'Agustus'], ['Agustus', 31, 'September'], ['September', 30, 'Oktober'], ['Oktober', 31, 'November']];
  const ACTS = [
    { act: 'berenang', where: 'di kolam renang' }, { act: 'berlatih bulu tangkis', where: 'di gedung olahraga' },
    { act: 'meminjam buku', where: 'di perpustakaan daerah' }, { act: 'berlatih menari', where: 'di sanggar' },
  ];
  const PAIRS = [[4, 6], [6, 9], [4, 10], [6, 8], [3, 4], [4, 5], [2, 5], [3, 6], [6, 10]];
  const dstr = (p, d) => (d <= p.D ? `${d} ${p.mon}` : `${d - p.D} ${p.next}`);
  MATH.T.push({
    id: 'kpk_date', name: 'KPK pada jadwal kegiatan', codes: ['BIL-6'],
    params(r) {
      for (let g = 0; g < 100; g++) {
        const [a, b] = r.shuffle(r.pick(PAIRS));
        const L = U.lcm(a, b);
        const [mon, D, next] = r.pick(MONTHS);
        if (L > 15) continue;
        const t = r.int(1, Math.min(9, D - 2 * L));
        if (t < 1) continue;
        return { a, b, L, mon, D, next, t, act: r.pick(ACTS), names: people(r, 2) };
      }
      throw new GE('param kpk');
    },
    stimulus(p) {
      const [A, B] = p.names;
      return {
        title: 'Jadwal Kegiatan Bersama', kind: 'Masalah kontekstual',
        text: `${A} ${p.act.act} ${p.act.where} setiap ${p.a} hari sekali, sedangkan ${B} ${p.act.act} di tempat yang sama setiap ${p.b} hari sekali. Pada tanggal ${p.t} ${p.mon}, mereka ${p.act.act} bersama-sama untuk pertama kalinya.`,
        visuals: [],
      };
    },
    qs: [
      { id: 'kpk', code: 'BIL-6', level: 'Pemahaman', ind: 'Menentukan KPK dua bilangan dalam konteks',
        make(p, r) {
          const f = (v) => `${v} hari`;
          return pg(r, {
            text: `${p.names[0]} dan ${p.names[1]} akan ${p.act.act} bersama-sama setiap .... sekali.`,
            correct: f(p.L), wrong: wrongs(r, p.L, [p.a * p.b, U.gcd(p.a, p.b), p.a + p.b, Math.max(p.a, p.b)], { fmt: f, min: 1, int: true }),
            explain: `Kelipatan ${p.a}: ${Array.from({ length: Math.ceil(p.L / p.a) + 1 }, (_, i) => p.a * (i + 1)).join(', ')}, ...\nKelipatan ${p.b}: ${Array.from({ length: Math.ceil(p.L / p.b) + 1 }, (_, i) => p.b * (i + 1)).join(', ')}, ...\nKelipatan persekutuan terkecil (KPK) = ${p.L}.\nJadi, mereka ${p.act.act} bersama setiap **${p.L} hari** sekali.`,
          });
        } },
      { id: 'tanggal', code: 'BIL-6', level: 'Penerapan', ind: 'Menyelesaikan masalah KPK untuk menentukan tanggal', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const cands = [p.t + p.a * p.b, p.t + p.a + p.b, p.t + 2 * Math.max(p.a, p.b), p.t + p.L - 1, p.t + p.L + Math.min(p.a, p.b)]
            .filter((d) => d !== p.t + p.L && d - p.D <= 28);
          const seen = new Set(); const wr = [];
          cands.forEach((d) => { const s = dstr(p, d); if (!seen.has(s) && s !== dstr(p, p.t + p.L) && wr.length < 3) { seen.add(s); wr.push(s); } });
          if (wr.length < 3) throw new GE('pengecoh');
          return pg(r, {
            text: `Mereka akan ${p.act.act} bersama-sama lagi pada tanggal ....`,
            correct: dstr(p, p.t + p.L), wrong: wr, sortBy: (s) => (s.indexOf(p.mon) >= 0 ? 0 : 100) + parseInt(s, 10),
            explain: `KPK dari ${p.a} dan ${p.b} adalah ${p.L}. Artinya mereka bersama setiap ${p.L} hari.\nTanggal berikutnya = ${p.t} + ${p.L} = ${p.t + p.L} ${p.mon}.\nJadi, jawabannya **${dstr(p, p.t + p.L)}**.`,
          });
        } },
      { id: 'banyak', code: 'BIL-6', level: 'Penalaran', ind: 'Menentukan banyak kejadian bersamaan dalam rentang waktu', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const cnt = Math.floor((p.D - p.t) / p.L) + 1;
          const dates = Array.from({ length: cnt }, (_, i) => p.t + i * p.L);
          const f = (v) => `${v} kali`;
          return pg(r, {
            text: `Selama bulan ${p.mon}, termasuk tanggal ${p.t}, mereka ${p.act.act} bersama-sama sebanyak ....`,
            correct: f(cnt), wrong: wrongs(r, cnt, [cnt - 1, cnt + 1, Math.floor(p.D / p.L), cnt + 2], { fmt: f, min: 1, int: true }),
            explain: `Mereka bersama setiap ${p.L} hari mulai tanggal ${p.t}: tanggal ${dates.join(', ')}. Tanggal berikutnya (${p.t + cnt * p.L}) sudah melewati ${p.D} ${p.mon}.\nJadi, mereka bersama sebanyak **${cnt} kali**.`,
          });
        } },
      { id: 'cek', code: 'BIL-6', level: 'Penerapan', ind: 'Menggunakan kelipatan untuk memeriksa jadwal', type: 'bs',
        make(p, r) {
          const [A, B] = p.names;
          const items = [];
          const dA = p.t + 2 * p.a;
          items.push({ text: `${A} ${p.act.act} pada tanggal ${dA} ${p.mon}.`, ans: 0, why: `${dA} = ${p.t} + 2 × ${p.a}` });
          const dB = p.t + p.a;
          items.push({ text: `${B} ${p.act.act} pada tanggal ${dB} ${p.mon}.`, ans: p.a % p.b === 0 ? 0 : 1, why: `${p.a} ${p.a % p.b === 0 ? '' : 'bukan '}kelipatan ${p.b}` });
          const dC = p.t + p.a * p.b;
          if (dC <= p.D) items.push({ text: `Pada tanggal ${dC} ${p.mon}, mereka ${p.act.act} bersama-sama.`, ans: 0, why: `${p.a * p.b} adalah kelipatan ${p.a} dan juga kelipatan ${p.b}` });
          const half = p.t + Math.max(p.a, p.b);
          items.push({ text: `Pada tanggal ${half} ${p.mon}, mereka ${p.act.act} bersama-sama.`, ans: Math.max(p.a, p.b) % p.L === 0 ? 0 : 1, why: `${Math.max(p.a, p.b)} bukan kelipatan ${Math.min(p.a, p.b)}` });
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
    ],
  });

  // --- Varian waktu: bus dari terminal ---
  const BUS = [[10, 15], [12, 18], [15, 20], [20, 30], [12, 20], [10, 25], [6, 8], [8, 12]];
  MATH.T.push({
    id: 'kpk_bus', name: 'KPK pada jadwal keberangkatan', codes: ['BIL-6', 'UKR-4'],
    params(r) {
      const [a, b] = r.shuffle(r.pick(BUS));
      const L = U.lcm(a, b);
      const start = 6 * 60 + 15 * r.int(0, 6);
      const dest = r.sample(['Kota Melati', 'Kota Kenanga', 'Desa Sukamaju', 'Pantai Indah', 'Kota Cempaka'], 2);
      return { a, b, L, start, dest };
    },
    stimulus(p) {
      return {
        title: 'Keberangkatan Bus dari Terminal', kind: 'Masalah kontekstual',
        text: `Di sebuah terminal, bus jurusan ${p.dest[0]} berangkat setiap ${p.a} menit sekali, sedangkan bus jurusan ${p.dest[1]} berangkat setiap ${p.b} menit sekali. Pada pukul ${U.clock(p.start)}, kedua bus berangkat bersama-sama untuk pertama kalinya hari itu.`,
        visuals: [],
      };
    },
    qs: [
      { id: 'berikut', code: 'BIL-6', level: 'Penerapan', ind: 'Menyelesaikan masalah KPK dalam konteks waktu', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const C = U.clock;
          const cands = [p.start + p.a * p.b, p.start + p.a + p.b, p.start + 2 * p.L, p.start + p.L - 10, p.start + p.L + 10];
          return pg(r, {
            text: `Kedua bus akan berangkat bersama-sama lagi pada pukul ....`,
            correct: C(p.start + p.L), wrong: wrongs(r, p.start + p.L, cands, { fmt: C }), order: 'text',
            explain: `KPK dari ${p.a} dan ${p.b} adalah ${p.L}. Jadi, kedua bus berangkat bersama setiap ${p.L} menit${p.L >= 60 ? ` (${U.dur(p.L)})` : ''}.\nPukul ${C(p.start)} + ${p.L} menit = pukul ${C(p.start + p.L)}.\nJadi, jawabannya **pukul ${C(p.start + p.L)}**.`,
          });
        } },
      { id: 'ketiga', code: 'UKR-4', level: 'Penalaran', ind: 'Menentukan waktu kejadian bersamaan berikutnya', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const C = U.clock;
          const v = p.start + 2 * p.L;
          return pg(r, {
            text: `Pukul berapakah kedua bus berangkat bersama-sama untuk ketiga kalinya pada hari itu?`,
            correct: C(v), wrong: wrongs(r, v, [p.start + 3 * p.L, p.start + p.L, p.start + 2 * p.a * p.b, v + 10], { fmt: C }), order: 'text',
            explain: `Berangkat bersama pertama pukul ${C(p.start)}, kedua pukul ${C(p.start + p.L)}, ketiga pukul ${C(v)} (setiap ${p.L} menit).\nJadi, jawabannya **pukul ${C(v)}**.`,
          });
        } },
      { id: 'cek', code: 'BIL-6', level: 'Penerapan', ind: 'Menggunakan kelipatan untuk memeriksa jadwal keberangkatan', type: 'bs',
        make(p, r) {
          const C = U.clock;
          const items = [
            { text: `Bus jurusan ${p.dest[0]} berangkat pada pukul ${C(p.start + 3 * p.a)}.`, ans: 0, why: `${C(p.start)} + 3 × ${p.a} menit` },
            { text: `Bus jurusan ${p.dest[1]} berangkat pada pukul ${C(p.start + p.a)}.`, ans: p.a % p.b === 0 ? 0 : 1, why: `${p.a} menit bukan kelipatan ${p.b}` },
            { text: `Dalam 1 jam setelah pukul ${C(p.start)}, bus jurusan ${p.dest[0]} berangkat ${Math.floor(60 / p.a)} kali.`, ans: 0, why: `60 : ${p.a} = ${Math.floor(60 / p.a)}${60 % p.a ? ' sisa ' + (60 % p.a) : ''}` },
            { text: `Kedua bus berangkat bersama-sama setiap ${p.a * p.b} menit.`, ans: p.a * p.b === p.L ? 0 : 1, why: `KPK dari ${p.a} dan ${p.b} adalah ${p.L}` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   BILANGAN 6 — FPB: bingkisan sama banyak
--------------------------------------------------------------------------- */
(() => {
  const { pg, pgk, tab, wrongs, GE } = MATH;
  const GOODS = [['buku tulis', 'buku'], ['pensil', 'pensil'], ['penghapus', 'penghapus'], ['kotak susu', 'kotak'], ['roti', 'bungkus'], ['permen', 'bungkus'], ['pulpen', 'pulpen']];
  const EVENTS = ['lomba Hari Kemerdekaan', 'santunan anak yatim', 'pesantren kilat', 'pekan literasi', 'perayaan Hari Anak'];
  MATH.T.push({
    id: 'fpb_parcel', name: 'FPB pada pembagian bingkisan', codes: ['BIL-6'],
    params(r) {
      for (let g = 0; g < 300; g++) {
        const G = r.pick([4, 6, 8, 9, 10, 12, 15]);
        const m = r.sample([2, 3, 4, 5, 6, 7, 8, 9], 3);
        if (U.gcdArr(m) !== 1) continue;
        const nums = m.map((x) => x * G);
        if (Math.max(...nums) > 120) continue;
        if (U.gcd(nums[0], nums[1]) === G && U.gcd(nums[1], nums[2]) === G) continue; // agar pengecoh bermakna
        const goods = r.sample(GOODS, 3);
        return { G, m, nums, goods, ev: r.pick(EVENTS) };
      }
      throw new GE('param fpb');
    },
    stimulus(p) {
      const [x, y, z] = p.nums, [g1, g2, g3] = p.goods;
      return {
        title: 'Menyiapkan Bingkisan', kind: 'Masalah kontekstual',
        text: `Panitia ${p.ev} menyiapkan ${x} ${g1[0]}, ${y} ${g2[0]}, dan ${z} ${g3[0]}. Semua barang akan dimasukkan ke dalam beberapa bingkisan. Setiap bingkisan harus berisi barang dengan jenis dan jumlah yang sama, dan tidak boleh ada barang yang tersisa.`,
        visuals: [],
      };
    },
    qs: [
      { id: 'fpb', code: 'BIL-6', level: 'Penerapan', ind: 'Menyelesaikan masalah FPB dalam konteks pembagian', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const [x, y, z] = p.nums;
          const f = (v) => `${v} bingkisan`;
          const prop = U.divisors(p.G).filter((d) => d > 1 && d < p.G).pop();
          return pg(r, {
            text: `Paling banyak bingkisan yang dapat dibuat adalah ....`,
            correct: f(p.G), wrong: wrongs(r, p.G, [U.gcd(x, y), U.gcd(y, z), U.gcd(x, z), prop, 2 * p.G], { fmt: f, min: 2, int: true }),
            explain: `Banyak bingkisan harus membagi habis ${x}, ${y}, dan ${z}. Banyak bingkisan terbanyak adalah FPB-nya.\nFaktor ${x}: ${U.divisors(x).join(', ')}\nFaktor ${y}: ${U.divisors(y).join(', ')}\nFaktor ${z}: ${U.divisors(z).join(', ')}\nFaktor persekutuan terbesar = ${p.G}.\nJadi, jawabannya **${p.G} bingkisan**.`,
          });
        } },
      { id: 'isi', code: 'BIL-6', level: 'Penerapan', ind: 'Menentukan isi setiap bagian setelah dibagi sama banyak',
        make(p, r) {
          const [g1, g2, g3] = p.goods;
          const s = (d) => `${p.nums[0] / d} ${g1[1]}, ${p.nums[1] / d} ${g2[1]}, dan ${p.nums[2] / d} ${g3[1]}`;
          const ds = U.divisors(p.G).filter((d) => d > 1 && d < p.G);
          const wr = [];
          ds.slice().reverse().forEach((d) => { if (wr.length < 2) wr.push(s(d)); });
          wr.push(`${p.m[1]} ${g1[1]}, ${p.m[0]} ${g2[1]}, dan ${p.m[2]} ${g3[1]}`);
          wr.push(`${p.m[0] + 1} ${g1[1]}, ${p.m[1] + 1} ${g2[1]}, dan ${p.m[2] + 1} ${g3[1]}`);
          const uniqW = Array.from(new Set(wr)).filter((w) => w !== s(p.G));
          if (uniqW.length < 3) throw new GE('pengecoh');
          return pg(r, {
            text: `Jika dibuat bingkisan sebanyak-banyaknya, isi setiap bingkisan adalah ....`,
            correct: s(p.G), wrong: uniqW.slice(0, 3), order: 'shuffle', textUniq: true,
            explain: `Banyak bingkisan terbanyak = FPB = ${p.G}.\nIsi tiap bingkisan: ${p.nums[0]} : ${p.G} = ${p.m[0]} ${g1[1]}, ${p.nums[1]} : ${p.G} = ${p.m[1]} ${g2[1]}, dan ${p.nums[2]} : ${p.G} = ${p.m[2]} ${g3[1]}.\nJadi, jawabannya **${s(p.G)}**.`,
          });
        } },
      { id: 'mungkin', code: 'BIL-6', level: 'Penalaran', ind: 'Menentukan faktor persekutuan dari beberapa bilangan',
        make(p, r) {
          const [x, y, z] = p.nums;
          const common = U.divisors(p.G).filter((d) => d > 1);
          const correct = r.sample(common, Math.min(common.length, r.pick([2, 3])));
          const notCommon = [];
          for (let d = 2; d <= Math.max(x, y, z); d++) {
            const c = [x, y, z].filter((v) => v % d === 0).length;
            if (c >= 1 && c < 3) notCommon.push(d);
          }
          const wrong = r.sample(notCommon.filter((d) => d <= 2 * p.G + 6), 2);
          if (correct.length < 2 || wrong.length < 2) throw new GE('kurang');
          const f = (v) => `${v} bingkisan`;
          return pgk(r, {
            text: `Banyak bingkisan yang mungkin dibuat agar semua barang terbagi habis dan isi setiap bingkisan sama adalah ....`,
            correct: correct.map(f), wrong: wrong.map(f),
            explain: `Banyak bingkisan harus merupakan faktor persekutuan dari ${x}, ${y}, dan ${z}, yaitu faktor dari FPB-nya (${p.G}): ${common.join(', ')}.\n${wrong.map((d) => `${d} tidak membagi habis ${[x, y, z].filter((v) => v % d !== 0).join(' dan ')}`).join('; ')}.`,
          });
        } },
      { id: 'faktor', code: 'BIL-6', level: 'Pemahaman', ind: 'Menentukan faktor dan kelipatan suatu bilangan', type: 'bs',
        make(p, r) {
          const [x, y, z] = p.nums;
          const nd = U.divisors(p.G).length;
          const f5 = r.pick([5, 7, 9, 4, 6].filter((d) => d !== p.G));
          const items = [
            { text: `${x} merupakan kelipatan ${p.G}.`, ans: 0, why: `${x} = ${p.m[0]} × ${p.G}` },
            { text: `${f5} merupakan faktor dari ${y}.`, ans: y % f5 === 0 ? 0 : 1, why: `${y} : ${f5} = ${y % f5 === 0 ? y / f5 : 'tidak habis'}` },
            r.chance(0.5) ? { text: `FPB dari ${x} dan ${y} adalah ${U.gcd(x, y)}.`, ans: 0, why: `faktor persekutuan terbesar ${x} dan ${y} adalah ${U.gcd(x, y)}` }
              : { text: `FPB dari ${x} dan ${y} adalah ${U.gcd(x, y) * 2}.`, ans: (x % (U.gcd(x, y) * 2) === 0 && y % (U.gcd(x, y) * 2) === 0) ? 0 : 1, why: `FPB dari ${x} dan ${y} adalah ${U.gcd(x, y)}` },
            { text: `Banyak faktor dari ${p.G} ada ${nd} buah.`, ans: 0, why: `faktor ${p.G}: ${U.divisors(p.G).join(', ')}` },
            { text: `${p.G} merupakan faktor dari ${z}.`, ans: z % p.G === 0 ? 0 : 1, why: `${z} : ${p.G} = ${z / p.G}` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items, take: 4 });
        } },
      { id: 'klasifikasi', code: 'BIL-6', level: 'Penerapan', ind: 'Mengelompokkan bilangan sebagai faktor persekutuan atau bukan', type: 'kat',
        make(p, r) {
          const [x, y, z] = p.nums;
          const common = U.divisors(p.G).filter((d) => d > 1);
          const non = [];
          for (let d = 2; d <= 20; d++) if (!common.includes(d) && [x, y, z].some((v) => v % d === 0)) non.push(d);
          const pick = r.sample(common, Math.min(2, common.length)).concat(r.sample(non, 2));
          const items = pick.map((d) => ({ text: `Bilangan ${d}`, ans: common.includes(d) ? 0 : 1, why: common.includes(d) ? `${d} membagi habis ${x}, ${y}, dan ${z}` : `${d} tidak membagi habis ${[x, y, z].filter((v) => v % d !== 0).join(' dan ')}` }));
          return tab(r, { type: 'kat', labels: ['Faktor persekutuan', 'Bukan faktor persekutuan'], text: `Kelompokkan bilangan berikut sebagai faktor persekutuan dari ${x}, ${y}, dan ${z} atau bukan!`, items });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   BILANGAN 7 — Operasi pecahan: pita, tepung, jus
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, people, GE } = MATH;
  const { Fr } = U;
  const R = Fr.raw;
  const CTX = [
    { id: 'pita', thing: 'pita', unit: 'm', use1: 'membuat pita rambut', craft: 'bunga hiasan', plan: 'membuat bunga hiasan', doN: (n) => `membuat ${n} bunga hiasan`, share: 'adik' },
    { id: 'tepung', thing: 'tepung terigu', unit: 'kg', use1: 'membuat roti', craft: 'loyang kue', plan: 'membuat kue', doN: (n) => `membuat ${n} loyang kue`, share: 'tetangga' },
    { id: 'jus', thing: 'jus jeruk', unit: 'liter', use1: 'mengisi teko untuk tamu', craft: 'botol kecil', plan: 'mengisi botol-botol kecil', doN: (n) => `mengisi ${n} botol kecil`, share: 'kelompok' },
  ];
  const fmd = (f) => Fr.md(f);
  MATH.T.push({
    id: 'frac_ops', name: 'Operasi hitung pecahan', codes: ['BIL-5', 'BIL-2'],
    params(r) {
      for (let g = 0; g < 400; g++) {
        const c = r.pick(CTX);
        const w = r.int(2, 4), b = r.pick([2, 3, 4]), a = r.int(1, b - 1);
        const A = Fr.make(w * b + a, b);
        const d1 = r.pick([2, 3, 4, 5, 6, 8].filter((d) => d !== b)), n1 = r.int(1, d1 - 1);
        const U1 = Fr.make(n1, d1);
        const left = Fr.sub(A, U1);
        const f = r.pick([3, 4, 5, 8, 10]), e = r.int(1, f - 1);
        const E = Fr.make(e, f);
        const n = r.int(2, 4);
        const need = Fr.mul(E, Fr.make(n, 1));
        const after = Fr.sub(left, need);
        if (Fr.val(after) <= 0.1) continue;
        if (Fr.eq(U1, E)) continue;
        const k = r.pick([2, 3, 4, 5]);
        return { c, A, U1, E, n, k, left, need, after, name: r.pick(['Kak Laras', 'Ibu', 'Bu Rahma', 'Pak Hadi', 'Kak Dimas']) };
      }
      throw new GE('param frac_ops');
    },
    stimulus(p) {
      const u = p.c.unit;
      return {
        title: `Menggunakan ${U.cap(p.c.thing)}`, kind: 'Masalah kontekstual',
        text: `${p.name} memiliki ${fmd(p.A)} ${u} ${p.c.thing}. Sebanyak ${fmd(p.U1)} ${u} ${p.c.thing} digunakan untuk ${p.c.use1}.\n\nSisa ${p.c.thing} akan digunakan untuk ${p.c.plan}. Setiap ${p.c.craft} memerlukan ${fmd(p.E)} ${u} ${p.c.thing}.`,
        visuals: [],
      };
    },
    qs: [
      { id: 'kurang', code: 'BIL-5', level: 'Penerapan', ind: 'Mengurangkan pecahan campuran dengan pecahan biasa',
        make(p, r) {
          const u = p.c.unit;
          const lcd = U.lcm(p.A.d, p.U1.d);
          const w = Math.floor(Fr.val(p.A)), fa = Fr.sub(p.A, Fr.make(w, 1));
          const borrow = Fr.cmp(fa, p.U1) < 0 ? Fr.add(Fr.make(w, 1), Fr.sub(p.U1, fa)) : null;
          const cands = [borrow, Fr.add(p.A, p.U1), Fr.sub(p.left, Fr.make(1, lcd)), Fr.add(p.left, Fr.make(1, 2)), Fr.sub(p.left, Fr.make(1, 1))].filter(Boolean)
            .filter((x) => x.n > 0 && !Fr.eq(x, p.left));
          const seen = new Set(); const wr = [];
          cands.forEach((x) => { const k = x.n + '/' + x.d; if (!seen.has(k) && wr.length < 3) { seen.add(k); wr.push(fmd(x) + ' ' + u); } });
          if (wr.length < 3) throw new GE('pengecoh');
          const a1 = p.A.n * (lcd / p.A.d), b1 = p.U1.n * (lcd / p.U1.d);
          return pg(r, {
            text: `Sisa ${p.c.thing} setelah digunakan untuk ${p.c.use1} adalah ....`,
            correct: fmd(p.left) + ' ' + u, wrong: wr,
            explain: `${fmd(p.A)} − ${fmd(p.U1)} = ${R(p.A.n, p.A.d)} − ${R(p.U1.n, p.U1.d)} = ${R(a1, lcd)} − ${R(b1, lcd)} = ${R(a1 - b1, lcd)} = ${fmd(p.left)}.\nJadi, sisanya **${fmd(p.left)} ${u}**.`,
          });
        } },
      { id: 'kali', code: 'BIL-5', level: 'Penerapan', ind: 'Mengalikan pecahan dengan bilangan asli dalam konteks',
        make(p, r) {
          const u = p.c.unit;
          const cands = [Fr.make(p.E.n, p.E.d * p.n), Fr.make(p.E.n + p.n, p.E.d), Fr.add(p.need, Fr.make(1, p.E.d)), Fr.make(p.E.n * p.n, p.E.d * p.n + 1)]
            .filter((x) => x.n > 0 && !Fr.eq(x, p.need));
          const seen = new Set(); const wr = [];
          cands.forEach((x) => { const k = x.n + '/' + x.d; if (!seen.has(k) && wr.length < 3) { seen.add(k); wr.push(fmd(x) + ' ' + u); } });
          if (wr.length < 3) throw new GE('pengecoh');
          return pg(r, {
            text: `Untuk ${p.c.doN(p.n)}, banyak ${p.c.thing} yang diperlukan adalah ....`,
            correct: fmd(p.need) + ' ' + u, wrong: wr,
            explain: `${p.n} × ${fmd(p.E)} = {{${p.n} × ${p.E.n}/${p.E.d}}} = ${R(p.n * p.E.n, p.E.d)} = ${fmd(p.need)}.\nJadi, diperlukan **${fmd(p.need)} ${u}**.`,
          });
        } },
      { id: 'bagi', code: 'BIL-5', level: 'Penerapan', ind: 'Membagi pecahan dengan bilangan asli dalam konteks',
        make(p, r) {
          const u = p.c.unit;
          const v = Fr.div(p.left, Fr.make(p.k, 1));
          const cands = [Fr.mul(p.left, Fr.make(p.k, 1)), Fr.make(p.left.n, p.left.d + p.k), Fr.div(p.A, Fr.make(p.k, 1)), Fr.add(v, Fr.make(1, v.d * 2))]
            .filter((x) => x.n > 0 && !Fr.eq(x, v));
          const seen = new Set(); const wr = [];
          cands.forEach((x) => { const k = x.n + '/' + x.d; if (!seen.has(k) && wr.length < 3) { seen.add(k); wr.push(fmd(x) + ' ' + u); } });
          if (wr.length < 3) throw new GE('pengecoh');
          return pg(r, {
            text: `Seandainya sisa ${p.c.thing} setelah digunakan untuk ${p.c.use1} dibagi sama banyak kepada ${p.k} ${p.c.share}, setiap ${p.c.share} mendapat ....`,
            correct: fmd(v) + ' ' + u, wrong: wr,
            explain: `Sisa ${p.c.thing} = ${fmd(p.A)} − ${fmd(p.U1)} = ${fmd(p.left)}.\n${fmd(p.left)} : ${p.k} = ${R(p.left.n, p.left.d)} × {{1/${p.k}}} = ${R(p.left.n, p.left.d * p.k)} = ${fmd(v)}.\nJadi, setiap ${p.c.share} mendapat **${fmd(v)} ${u}**.`,
          });
        } },
      { id: 'banding', code: 'BIL-2', level: 'Penalaran', ind: 'Membandingkan hasil operasi pecahan', type: 'bs',
        make(p, r) {
          const u = p.c.unit;
          const items = [
            { text: `${U.cap(p.c.thing)} yang digunakan untuk ${p.c.use1} lebih banyak daripada yang diperlukan untuk satu ${p.c.craft}.`, ans: Fr.cmp(p.U1, p.E) > 0 ? 0 : 1, why: `${fmd(p.U1)} ${Fr.cmp(p.U1, p.E) > 0 ? '>' : '<'} ${fmd(p.E)}` },
            { text: `Sisa ${p.c.thing} setelah digunakan untuk ${p.c.use1} lebih dari 2 ${u}.`, ans: Fr.val(p.left) > 2 ? 0 : 1, why: `sisanya ${fmd(p.left)} ${u}` },
            { text: `Untuk ${p.c.doN(p.n)} diperlukan ${p.c.thing} kurang dari 1 ${u}.`, ans: Fr.val(p.need) < 1 ? 0 : 1, why: `${p.n} × ${fmd(p.E)} = ${fmd(p.need)}` },
            (() => { const n2 = p.n + r.int(1, 3); const nd = Fr.mul(p.E, Fr.make(n2, 1)); const ok = Fr.cmp(p.left, nd) >= 0; return { text: `Sisa ${p.c.thing} cukup untuk ${p.c.doN(n2)}.`, ans: ok ? 0 : 1, why: `diperlukan ${n2} × ${fmd(p.E)} = ${fmd(nd)}, sedangkan sisanya ${fmd(p.left)}` }; })(),
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
      { id: 'akhir', code: 'BIL-5', level: 'Penalaran', ind: 'Menyelesaikan masalah operasi campuran pecahan', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const u = p.c.unit;
          const cands = [Fr.sub(p.A, p.need), p.left, Fr.add(p.after, Fr.make(1, p.E.d)), Fr.sub(p.left, p.E)]
            .filter((x) => x.n > 0 && !Fr.eq(x, p.after));
          const seen = new Set(); const wr = [];
          cands.forEach((x) => { const k = x.n + '/' + x.d; if (!seen.has(k) && wr.length < 3) { seen.add(k); wr.push(fmd(x) + ' ' + u); } });
          if (wr.length < 3) throw new GE('pengecoh');
          return pg(r, {
            text: `${p.name} kemudian ${p.c.doN(p.n)} dari sisa ${p.c.thing} tersebut. Banyak ${p.c.thing} yang masih tersisa sekarang adalah ....`,
            correct: fmd(p.after) + ' ' + u, wrong: wr,
            explain: `Sisa pertama = ${fmd(p.A)} − ${fmd(p.U1)} = ${fmd(p.left)}.\nUntuk ${p.c.doN(p.n)} = ${p.n} × ${fmd(p.E)} = ${fmd(p.need)}.\nSisa akhir = ${fmd(p.left)} − ${fmd(p.need)} = ${fmd(p.after)}.\nJadi, jawabannya **${fmd(p.after)} ${u}**.`,
          });
        } },
    ],
  });
})();
