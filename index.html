      { id: 'piktogram', code: 'DAT-1', level: 'Penerapan', ind: 'Menentukan banyak gambar pada piktogram dari data tabel',
        make(p, r) {
          const idx = p.vals.map((v, i) => i).filter((i) => p.vals[i] % 4 === 2);
          const i = r.pick(idx), v = p.vals[i], full = Math.floor(v / 4);
          const s = (n, h) => (n ? `${n} gambar utuh` : '') + (n && h ? ' dan ' : '') + (h ? 'setengah gambar' : '');
          const wr = [s(full + 1, true), full >= 1 ? s(full - 1, true) : s(full + 2, true), s(full + 1, false), s(full, false)].filter((x) => x && x !== s(full, true));
          return pg(r, {
            text: `Data tersebut akan disajikan dalam piktogram dengan satu gambar mewakili 4 siswa. Banyak gambar untuk ${p.cats[i]} adalah ....`,
            correct: s(full, true), wrong: Array.from(new Set(wr)).slice(0, 3), order: 'shuffle',
            explain: `${p.cats[i]} = ${v} siswa. ${v} : 4 = ${U.fmt(v / 4)}.\nArtinya ${full} gambar utuh (${full * 4} siswa) dan setengah gambar (2 siswa).\nJadi, jawabannya **${s(full, true)}**.`,
          });
        } },
      { id: 'banding', code: 'DAT-2', level: 'Penerapan', ind: 'Membandingkan data pada tabel', form: 'Interpretasi data',
        make(p, r) {
          const [i, j] = r.sample(p.vals.map((_, k) => k), 2);
          const d = Math.abs(p.vals[i] - p.vals[j]);
          const f = (x) => `${x} siswa`;
          return pg(r, {
            text: `Selisih banyak siswa yang memilih ${p.cats[i]} dan ${p.cats[j]} adalah ....`,
            correct: f(d), wrong: wrongs(r, d, [p.vals[i] + p.vals[j], d + 2, Math.max(p.vals[i], p.vals[j]), d - 2], { fmt: f, min: 1, int: true }),
            explain: `${p.cats[i]} = ${p.vals[i]} siswa dan ${p.cats[j]} = ${p.vals[j]} siswa.\nSelisih = ${Math.max(p.vals[i], p.vals[j])} − ${Math.min(p.vals[i], p.vals[j])} = ${d}.\nJadi, jawabannya **${f(d)}**.`,
          });
        } },
      { id: 'simpul', code: 'DAT-2', level: 'Penalaran', ind: 'Menarik kesimpulan dari data pada tabel', form: 'Interpretasi data', type: 'bs',
        make(p, r) {
          const tot = p.vals.reduce((a, b) => a + b, 0);
          const mx = p.vals.indexOf(Math.max(...p.vals));
          const [i, j] = r.sample(p.vals.map((_, k) => k), 2);
          const items = [
            r.chance(0.5) ? { text: `Banyak siswa yang didata ada ${tot} orang.`, ans: 0, why: `${p.vals.join(' + ')} = ${tot}` } : { text: `Banyak siswa yang didata ada ${tot + 2} orang.`, ans: 1, why: `${p.vals.join(' + ')} = ${tot}` },
            { text: `${p.cats[mx]} paling banyak dipilih.`, ans: 0, why: `${p.vals[mx]} siswa` },
            { text: `Banyak siswa yang memilih ${p.cats[i]} dua kali banyak siswa yang memilih ${p.cats[j]}.`, ans: p.vals[i] === 2 * p.vals[j] ? 0 : 1, why: `${p.vals[i]} dan ${p.vals[j]}` },
            { text: `Lebih dari setengah siswa memilih ${p.cats[mx]}.`, ans: p.vals[mx] * 2 > tot ? 0 : 1, why: `${p.vals[mx]} dari ${tot}` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   TAMBAHAN 2 — Pola bilangan dari susunan batang
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, wrongs, svgV, GE } = MATH;
  function sticks(n, kind) {
    // kind 'persegi' (3n+1) atau 'segitiga' (2n+1)
    const s = 26, pad = 10;
    const W = pad * 2 + n * s, H = pad * 2 + s + (kind === 'segitiga' ? 0 : 0);
    let b = '';
    const L = (x1, y1, x2, y2) => SVG.line(x1, y1, x2, y2, { stroke: '#8A5A2B', sw: 3.2, cap: 'round' });
    if (kind === 'persegi') {
      for (let i = 0; i <= n; i++) b += L(pad + i * s, pad, pad + i * s, pad + s);
      for (let i = 0; i < n; i++) { b += L(pad + i * s, pad, pad + (i + 1) * s, pad); b += L(pad + i * s, pad + s, pad + (i + 1) * s, pad + s); }
    } else {
      for (let i = 0; i < n; i++) {
        const x = pad + i * (s / 2);
        if (i % 2 === 0) { b += L(x, pad + s, x + s / 2, pad); b += L(x + s / 2, pad, x + s, pad + s); b += L(x, pad + s, x + s, pad + s); }
        else { b += L(x, pad, x + s, pad); }
      }
      return SVG.wrap(pad * 2 + (n + 1) * (s / 2), H, b, 'Susunan batang');
    }
    return SVG.wrap(W, H, b, 'Susunan batang');
  }
  MATH.T.push({
    id: 'pattern', name: 'Pola bilangan', codes: ['EXT-POL'], extra: true,
    params(r) {
      const kind = r.pick(['persegi', 'segitiga']);
      const a = kind === 'persegi' ? 3 : 2, c = 1;
      const n = r.pick([10, 12, 15, 20]);
      const k = r.int(8, 25);
      return { kind, a, c, n, k, val: (m) => a * m + c };
    },
    stimulus(p) {
      const parts = [1, 2, 3].map((m) => sticks(m, p.kind));
      return {
        title: 'Susunan Batang Korek Api', kind: 'Pola gambar',
        text: `Dimas menyusun batang korek api membentuk pola ${p.kind === 'persegi' ? 'persegi yang berjajar' : 'segitiga yang berjajar'} seperti gambar. Pola ke-1, ke-2, dan ke-3 berturut-turut memerlukan ${p.val(1)}, ${p.val(2)}, dan ${p.val(3)} batang.`,
        visuals: [{ type: 'svg', caption: 'Pola ke-1, ke-2, dan ke-3', svg: SVG.row(parts, { gap: 34 }) }],
      };
    },
    qs: [
      { id: 'berikut', code: 'EXT-POL', level: 'Pemahaman', ind: 'Menentukan suku berikutnya pada pola bilangan',
        make(p, r) {
          const v = p.val(4); const f = (x) => `${x} batang`;
          return pg(r, {
            text: 'Banyak batang korek api pada pola ke-4 adalah ....',
            correct: f(v), wrong: wrongs(r, v, [v + 1, v - 1, p.val(3) * 2, 4 * p.a], { fmt: f, min: 1, int: true }),
            explain: `Setiap pola bertambah ${p.a} batang: ${p.val(1)}, ${p.val(2)}, ${p.val(3)}, ... Pola ke-4 = ${p.val(3)} + ${p.a} = ${v}.\nJadi, jawabannya **${f(v)}**.`,
          });
        } },
      { id: 'kesuku', code: 'EXT-POL', level: 'Penerapan', ind: 'Menentukan suku ke-n pada pola bilangan',
        make(p, r) {
          const v = p.val(p.n); const f = (x) => `${x} batang`;
          return pg(r, {
            text: `Banyak batang korek api pada pola ke-${p.n} adalah ....`,
            correct: f(v), wrong: wrongs(r, v, [p.a * p.n, p.val(1) * p.n, v + p.a, (p.a + 1) * p.n], { fmt: f, min: 1, int: true }),
            explain: `Banyak batang pada pola ke-n = ${p.a} × n + ${p.c}.\nPola ke-${p.n} = ${p.a} × ${p.n} + ${p.c} = ${v}.\nJadi, jawabannya **${f(v)}**.`,
          });
        } },
      { id: 'balik', code: 'EXT-POL', level: 'Penalaran', ind: 'Menentukan urutan pola dari banyak anggota',
        make(p, r) {
          const v = p.val(p.k);
          return pg(r, {
            text: `Dimas memiliki ${v} batang korek api dan menggunakan semuanya untuk satu pola. Pola tersebut adalah pola ke- ....`,
            correct: String(p.k), wrong: wrongs(r, p.k, [Math.round(v / p.a), p.k + 1, p.k - 1, Math.round(v / (p.a + 1))], { min: 1, int: true }),
            explain: `${p.a} × n + ${p.c} = ${v}, sehingga ${p.a} × n = ${v - p.c} dan n = ${(v - p.c) / p.a}.\nJadi, jawabannya pola ke-**${p.k}**.`,
          });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   TAMBAHAN 3 — Diagram garis
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, wrongs, svgV, GE } = MATH;
  MATH.T.push({
    id: 'linechart', name: 'Diagram garis', codes: ['EXT-DLG', 'DAT-2'], extra: true,
    params(r) {
      for (let g = 0; g < 300; g++) {
        const vals = [];
        let v = r.int(4, 8);
        for (let i = 0; i < 6; i++) { vals.push(v); v += r.pick([1, 2, 3, 4]); }
        if (vals[5] > 26) continue;
        const inc = vals.slice(1).map((x, i) => x - vals[i]);
        const mx = Math.max(...inc);
        if (inc.filter((x) => x === mx).length > 1) continue;
        return { vals, inc };
      }
      throw new GE('param line');
    },
    stimulus(p) {
      return {
        title: 'Pertumbuhan Tanaman Cabai', kind: 'Diagram garis',
        text: 'Siswa kelas 6 mengamati tinggi tanaman cabai setiap minggu. Hasil pengamatan disajikan dalam diagram garis berikut.',
        visuals: [svgV(SVG.lineChart({ labels: ['M1', 'M2', 'M3', 'M4', 'M5', 'M6'], values: p.vals, step: 2, title: 'Tinggi Tanaman Cabai (cm)', yLabel: 'Tinggi (cm)', xLabel: 'Minggu ke-' }))],
      };
    },
    qs: [
      { id: 'baca', code: 'EXT-DLG', level: 'Pemahaman', ind: 'Membaca data pada diagram garis', form: 'Interpretasi data',
        make(p, r) {
          const i = r.int(1, 5), v = p.vals[i]; const f = (x) => `${x} cm`;
          return pg(r, { text: `Tinggi tanaman cabai pada minggu ke-${i + 1} adalah ....`, correct: f(v), wrong: wrongs(r, v, [p.vals[i - 1], v + 1, v + 2, p.vals[(i + 1) % 6]], { fmt: f, min: 1, int: true }), explain: `Titik pada minggu ke-${i + 1} sejajar dengan angka ${v} pada sumbu tegak.\nJadi, jawabannya **${v} cm**.` });
        } },
      { id: 'naik', code: 'EXT-DLG', level: 'Penerapan', ind: 'Menentukan kenaikan terbesar pada diagram garis', form: 'Interpretasi data',
        make(p, r) {
          const mx = Math.max(...p.inc), i = p.inc.indexOf(mx);
          const s = (k) => `Minggu ke-${k + 1} ke minggu ke-${k + 2}`;
          const wr = [0, 1, 2, 3, 4].filter((k) => k !== i).map(s);
          return pg(r, { text: 'Kenaikan tinggi tanaman paling besar terjadi pada ....', correct: s(i), wrong: r.sample(wr, 3), order: 'text', explain: `Kenaikan tiap minggu: ${p.inc.map((x, k) => `${s(k).toLowerCase()} = ${x} cm`).join('; ')}.\nKenaikan terbesar ${mx} cm, yaitu **${s(i).toLowerCase()}**.` });
        } },
      { id: 'cek', code: 'DAT-2', level: 'Penalaran', ind: 'Menarik kesimpulan dari diagram garis', form: 'Interpretasi data', type: 'bs',
        make(p, r) {
          const tot = p.vals[5] - p.vals[0];
          const items = [
            { text: 'Tinggi tanaman selalu bertambah setiap minggu.', ans: 0, why: 'garis selalu naik' },
            r.chance(0.5) ? { text: `Selama enam minggu, tinggi tanaman bertambah ${tot} cm.`, ans: 0, why: `${p.vals[5]} − ${p.vals[0]}` } : { text: `Selama enam minggu, tinggi tanaman bertambah ${tot + 2} cm.`, ans: 1, why: `${p.vals[5]} − ${p.vals[0]} = ${tot}` },
            { text: `Tinggi tanaman pada minggu ke-4 dua kali tinggi pada minggu ke-1.`, ans: p.vals[3] === 2 * p.vals[0] ? 0 : 1, why: `${p.vals[3]} dan ${p.vals[0]}` },
            { text: `Tinggi tanaman pada minggu ke-6 lebih dari 20 cm.`, ans: p.vals[5] > 20 ? 0 : 1, why: `${p.vals[5]} cm` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },

  });
})();

(() => {

      }

    },
    stimulus(p) {
      return {
        title: 'Pilihan Ekstrakurikuler', kind: 'Diagram lingkaran',

        visuals: [svgV(SVG.pie({ labels: p.cats, values: p.pc, title: 'Pilihan Ekstrakurikuler' }))],
      };
    },

      { id: 'banyak', code: 'EXT-DLG', level: 'Penerapan', ind: 'Menghitung banyak data dari diagram lingkaran', form: 'Interpretasi data',
        make(p, r) {
          const i = r.int(0, 3), v = (p.pc[i] * p.N) / 100; const f = (x) => `${x} siswa`;
          return pg(r, { text: `Banyak siswa yang memilih ${p.cats[i]} adalah ....`, correct: f(v), wrong: wrongs(r, v, [p.pc[i], v + 2, (p.pc[(i + 1) % 4] * p.N) / 100, p.N - v], { fmt: f, min: 1, int: true }), explain: `${p.cats[i]} = ${p.pc[i]}%.\nBanyak siswa = ${p.pc[i]}% × ${p.N} = {{${p.pc[i]}/100}} × ${p.N} = ${v}.\nJadi, jawabannya **${f(v)}**.` });
        } },
      { id: 'pecahan', code: 'BIL-3', level: 'Penerapan', ind: 'Mengubah persen pada diagram lingkaran menjadi pecahan',
        make(p, r) {
          const i = r.int(0, 3), fr = U.Fr.make(p.pc[i], 100);
          const cands = [U.Fr.make(p.pc[i], 10), U.Fr.make(100 - p.pc[i], 100), U.Fr.make(1, Math.round(100 / p.pc[i]) + 1), U.Fr.make(p.pc[i] + 5, 100)].filter((x) => !U.Fr.eq(x, fr) && x.n < x.d);

        } },
      { id: 'cek', code: 'EXT-DLG', level: 'Penalaran', ind: 'Menarik kesimpulan dari diagram lingkaran', form: 'Interpretasi data', type: 'bs',
        make(p, r) {
          const mx = p.pc.indexOf(Math.max(...p.pc));
          const items = [
            { text: `${p.cats[mx]} paling banyak dipilih.`, ans: 0, why: `${p.pc[mx]}%` },

            { text: `Siswa yang memilih ${p.cats[0]} dan ${p.cats[1]} lebih dari setengah jumlah siswa.`, ans: p.pc[0] + p.pc[1] > 50 ? 0 : 1, why: `${p.pc[0]}% + ${p.pc[1]}% = ${p.pc[0] + p.pc[1]}%` },
            { text: `${p.cats[2]} dipilih oleh ${p.pc[2]} siswa.`, ans: (p.pc[2] * p.N) / 100 === p.pc[2] ? 0 : 1, why: `${p.pc[2]}% × ${p.N} = ${(p.pc[2] * p.N) / 100} siswa` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
    ],
  });
})();

   generator dapat memilih 3 soal per stimulus sesuai kisi-kisi.

const BIB = (() => {
  const S = [];
  const add = (s) => S.push(s);
  const flowOpt = (steps) => ({ svg: SVG.flow(steps, { dir: 'v', boxW: 196, boxH: 40, fontSize: 12 }), alt: steps.join(' → ') });

  /* ---------------- 1. Fabel ---------------- */

  function infografis() {
    const W = 620, H = 430, C = SVG.C;
    const t = SVG.t;
    const drop = (x, y, s, col) => `<path d="M${x},${y} C${x - s * 0.9},${y + s * 1.2} ${x - s},${y + s * 1.9} ${x},${y + s * 2.1} C${x + s},${y + s * 1.9} ${x + s * 0.9},${y + s * 1.2} ${x},${y}Z" fill="${col}"/>`;
    let b = SVG.rect(0, 0, W, H, { fill: '#F3F8FF', stroke: '#BFD3F2', sw: 1.5, rx: 14 });
    b += drop(40, 22, 14, '#2F80ED');
    b += t(70, 44, 'Ayo Hemat Air di Rumah!', { size: 24, weight: 'bold', anchor: 'start', fill: '#13306E' });
    b += t(70, 66, 'Kelompok Peduli Lingkungan Kelas 6', { size: 13, anchor: 'start', fill: C.muted });
    // kolom hemat
    b += SVG.rect(20, 86, 280, 262, { fill: '#FFFFFF', stroke: '#2F80ED', sw: 2, rx: 12 });
    b += SVG.circ(46, 112, 14, { fill: '#2F80ED', stroke: '#2F80ED' }) + `<path d="M39,112 L44,118 L54,105" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
    b += t(68, 118, 'Kebiasaan hemat', { size: 16, weight: 'bold', anchor: 'start', fill: '#1B4FB8' });
    const good = [['Matikan keran saat', 'menggosok gigi.'], ['Mandi memakai gayung', 'atau pancuran secukupnya.'], ['Siram tanaman dengan', 'air bekas cucian sayur.']];
    good.forEach((g, i) => { const y = 150 + i * 64; b += drop(42, y - 8, 9, '#2F80ED'); b += t(60, y + 4, g[0], { size: 14, anchor: 'start' }) + t(60, y + 22, g[1], { size: 14, anchor: 'start' }); });
    // kolom boros
    b += SVG.rect(320, 86, 280, 262, { fill: '#FFFFFF', stroke: '#D93B30', sw: 2, rx: 12 });
    b += SVG.circ(346, 112, 14, { fill: '#D93B30', stroke: '#D93B30' }) + `<path d="M340,106 L352,118 M352,106 L340,118" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
    b += t(368, 118, 'Kebiasaan boros', { size: 16, weight: 'bold', anchor: 'start', fill: '#B22A21' });
    b += t(340, 160, 'Keran dibiarkan menyala', { size: 14, anchor: 'start' });
    b += t(340, 196, '± 6 liter', { size: 28, weight: 'bold', anchor: 'start', fill: '#D93B30' });
    b += t(340, 216, 'air terbuang setiap menit', { size: 13, anchor: 'start', fill: C.muted });
    b += SVG.line(336, 236, 584, 236, { stroke: '#F1C9C5', sw: 1.5, dash: '4 4' });
    b += t(340, 262, 'Keran bocor menetes', { size: 14, anchor: 'start' });
    b += t(340, 298, '± 20 liter', { size: 28, weight: 'bold', anchor: 'start', fill: '#D93B30' });
    b += t(340, 318, 'air terbuang setiap hari', { size: 13, anchor: 'start', fill: C.muted });
    b += SVG.rect(20, 362, 580, 50, { fill: '#13306E', stroke: '#13306E', rx: 10 });
    b += t(310, 393, 'Air bersih terbatas. Hemat hari ini, cukup untuk esok.', { size: 15, weight: 'bold', fill: '#FFFFFF' });
    return SVG.wrap(W, H, b, 'Infografis Ayo Hemat Air di Rumah');
  }

const ENGINE = (() => {

  const typeCls = (t) => (t === 'pg' ? 'pg' : t === 'pgk' ? 'pgk' : 'tab');

  function inferTypes() {

  }

  const KISI_MTK = `Matriks Asesmen TKA Matematika SD/MI
1. Bilangan — Bilangan Rasional
Memahami, mengaplikasikan, dan bernalar yang lebih tinggi untuk menyelesaikan permasalahan terkait cakupan sub-elemen berikut:

- Operasi penjumlahan dan pengurangan bilangan pecahan, serta operasi perkalian dan pembagian bilangan pecahan dengan bilangan asli;

2. Geometri dan Pengukuran — Objek Geometri
- Bentuk bangun datar (segitiga, segiempat, dan segi banyak);

Pengukuran

- Volume benda menggunakan satuan baku; hubungan antarsatuan baku volume (ml, dl, cl, l, dal, hl, kl);
- Berat benda menggunakan satuan baku; hubungan antarsatuan baku berat (mg, dg, cg, g, dag, hg, kg);
- Waktu; hubungan antarsatuan waktu (detik, menit, jam, hari, pekan, bulan, tahun);

  const KISI_BI = `Kisi-kisi TKA Bahasa Indonesia Kelas 6 SD/MI (membaca)
- Menentukan informasi tersurat dan tersirat dalam teks.

  // ---------------- Analisis ----------------
  function analyze(text) {

  }
  function autoCount(a) {

  // ---------------- Rancangan (blueprint) ----------------

  function planMath(a, G, r0, avoid = {}) {
    inferTypes();
    const inScope = new Set(a.codes.map((c) => c.code));
    const alloc = TAX.allocate(a.codes, G * 3);
    const tpls = MATH.T.filter((t) => t.qs.some((m) => inScope.has(m.code)) && (!t.extra || t.codes.some((c) => inScope.has(c))));
    if (!tpls.length) throw new GE('Tidak ada template yang cocok dengan kisi-kisi ini.');
    let bestPlan = null;
    const trials = 90;
    for (let trial = 0; trial < trials; trial++) {
      const r = U.rng(r0.seed());
      const res = greedyMath(tpls, inScope, alloc, G, r, avoid, trial === 0 ? 0.6 : 1.2 + (trial % 5));
      if (!bestPlan || res.score > bestPlan.score) bestPlan = res;
    }
    const plan = bestPlan.plan;
    const ord = (p) => { const m = TPL[p.tpl].qs.find((q) => q.id === p.makers[0]); const c = TAX.byCode[m.code]; return GRP_ORDER[c.grp] * 100 + MATH.T.indexOf(TPL[p.tpl]); };
    plan.sort((x, y) => ord(x) - ord(y));
    return { plan, alloc };
  }
  function greedyMath(tpls, inScope, alloc, G, r, avoid, jit) {
    const need = Object.assign({}, alloc);
    const used = {}; const usedMakers = {};

    const covered = {};
    const plan = [];
    for (let g = 0; g < G; g++) {
      let best = null;
      tpls.forEach((t) => {
        const reuse = used[t.id] || 0;
        if (reuse >= 3) return;
        const avoidPen = (avoid.tpls && avoid.tpls.includes(t.id)) ? 10 : 0;
        const tmp = Object.assign({}, need);
        const chosen = [];
        let score = 0;
        for (let k = 0; k < 3; k++) {
          let bm = null, bs = -1e9;
          t.qs.forEach((m) => {
            if (chosen.includes(m)) return;

            if (!inScope.has(m.code)) s = -25;
            else s = (tmp[m.code] || 0) > 0 ? 12 + tmp[m.code] * 2 : 2;
            if (inScope.has(m.code) && !covered[m.code] && !chosen.some((c) => c.code === m.code)) s += 14;
            if ((usedMakers[t.id] || []).includes(m.id)) s -= 9;
            if (avoid.makers && avoid.makers.includes(t.id + ':' + m.id)) s -= 3;

            const placed = tcount.pg + tcount.pgk + tcount.tab + chosen.length;
            const pgShare = (tcount.pg + chosen.filter((c) => (c.type || 'pg') === 'pg').length) / Math.max(1, placed);

            if (tc === 'pg' && pgShare < 0.4) s += 2;

            if (chosen.some((c) => typeCls(c.type || 'pg') === tc && tc !== 'pg')) s -= 3;
            s += r() * jit;
            if (s > bs) { bs = s; bm = m; }
          });
          if (!bm) break;
          chosen.push(bm); score += bs;
          if ((tmp[bm.code] || 0) > 0) tmp[bm.code]--;
        }
        if (chosen.length < 3) return;
        score -= reuse * 14 + avoidPen;
        score += r() * jit * 2;
        if (!best || score > best.score) best = { t, makers: chosen, score };
      });
      if (!best) break;
      plan.push({ tpl: best.t.id, makers: best.makers.map((m) => m.id) });
      used[best.t.id] = (used[best.t.id] || 0) + 1;
      usedMakers[best.t.id] = (usedMakers[best.t.id] || []).concat(best.makers.map((m) => m.id));
      best.makers.forEach((m) => { if ((need[m.code] || 0) > 0) need[m.code]--; covered[m.code] = (covered[m.code] || 0) + 1; tcount[typeCls(m.type || 'pg')]++; });
    }
    const cov = [...inScope].filter((c) => covered[c]).length;
    const left = Object.values(need).reduce((s2, x) => s2 + Math.max(0, x), 0);
    const reuses = Object.values(used).reduce((s2, x) => s2 + Math.max(0, x - 1), 0);
    const tot = tcount.pg + tcount.pgk + tcount.tab || 1;
    const bal = -Math.abs(tcount.pg / tot - 0.55) * 20 - (tcount.pgk ? 0 : 6) - (tcount.tab ? 0 : 6);
    const outScope = plan.reduce((s2, p) => s2 + p.makers.filter((id) => !inScope.has(TPL[p.tpl].qs.find((m) => m.id === id).code)).length, 0);

  }
  function planBI(a, G, r, avoid = {}) {
    const inScope = new Set(a.codes.map((c) => c.code));
    const alloc = TAX.allocate(a.codes, G * 3);
    const need = Object.assign({}, alloc);
    const pool = BIB.S.filter((s) => s.qs.some((q) => inScope.has(q.code)));
    const plan = [];
    const tcount = { pg: 0, pgk: 0, tab: 0 };
    const usedSt = new Set();
    const usedQ = new Set(avoid.qs || []);
    const covered = {};
    for (let g = 0; g < G; g++) {
      let best = null;
      pool.forEach((st) => {
        if (usedSt.has(st.id)) return;

        const chosen = [];

          let bq = null, bs = -1e9;
          st.qs.forEach((q) => {
            if (chosen.includes(q)) return;
            let s = !inScope.has(q.code) ? -20 : (tmp[q.code] || 0) > 0 ? 12 + tmp[q.code] * 2 : 2;
            if (inScope.has(q.code) && !covered[q.code] && !chosen.some((c) => c.code === q.code)) s += 14;
            if (usedQ.has(st.id + ':' + q.id)) s -= 6;
            const tc = typeCls(q.type);
            const placed = tcount.pg + tcount.pgk + tcount.tab + chosen.length;
            const pgShare = (tcount.pg + chosen.filter((c) => c.type === 'pg').length) / Math.max(1, placed);

  // ---------------- Pembuatan kelompok soal ----------------
  function decorate(q, meta) {
    q.id = U.uid('q');
    q.code = meta.code; q.level = meta.level; q.indikator = meta.ind;
    if (meta.form) q.form = meta.form;
    if (meta.variant) q.variant = meta.variant;
    const c = TAX.byCode[meta.code];
    q.materi = meta.materi || c.el;
    q.submateri = c.label;
    q.gen = meta.gen;
    return q;
  }
  function makeMathQ(tpl, m, p, qseed) {
    let last;
    for (let k = 0; k < 8; k++) {
      try {
        const q = m.make(p, U.rng(qseed + k * 977));
        return decorate(q, { code: m.code, level: m.level, ind: m.ind, form: m.form, variant: m.variant, gen: { tpl: tpl.id, maker: m.id, qseed: qseed + k * 977 } });
      } catch (e) { if (!(e instanceof GE)) throw e; last = e; }
    }
    throw last || new GE('gagal');
  }
  function buildMathGroup(tplId, makerIds, seed) {
    const tpl = TPL[tplId];
    let lastErr;
    for (let att = 0; att < 12; att++) {
      const s = (seed + att * 7919) >>> 0;
      try {
        const p = tpl.params(U.rng(s));
        const st = tpl.stimulus(p);
        const ids = makerIds.slice();
        const qs = [];
        for (let i = 0; i < ids.length; i++) {
          const m = tpl.qs.find((x) => x.id === ids[i]);
          try { qs.push(makeMathQ(tpl, m, p, s * 31 + i * 101)); } catch (e) {
            if (!(e instanceof GE)) throw e;
            // coba pembuat soal lain dari template yang sama
            const alt = tpl.qs.filter((x) => !ids.includes(x.id) && x.code === m.code).concat(tpl.qs.filter((x) => !ids.includes(x.id) && x.code !== m.code));
            let ok = false;
            for (const am of alt) { try { qs.push(makeMathQ(tpl, am, p, s * 31 + i * 101)); ids[i] = am.id; ok = true; break; } catch (e2) { if (!(e2 instanceof GE)) throw e2; } }
            if (!ok) throw e;

        }

  function bankQ(st, q, r) {

      const keyIdx = (Array.isArray(c.key) ? c.key : [c.key]).map((k) => LET.indexOf(k));

      c.options = opts;
      c.key = Array.isArray(c.key) ? newKey : newKey[0];
    }
    delete c.keep;
    const meta = { code: q.code, level: q.level, ind: q.ind, variant: q.variant, materi: st.genre, gen: { bank: st.id, q: q.id } };

  }
  function buildBIGroup(stId, qIds, seed) {
    const st = BIB.byId[stId];
    const r = U.rng(seed);

    const stim = { id: U.uid('s'), title: st.title, kind: st.kind, genre: st.genre, text: st.text, visuals: U.clone(st.visuals || []), poem: !!st.poem };

  }

  // ---------------- Validasi ----------------
  const CHECKS = [
    ['kisi', 'Kesesuaian dengan kisi-kisi'], ['stimulus', 'Kesesuaian dengan stimulus'], ['jelas', 'Kejelasan kalimat'],
    ['tipe', 'Ketepatan tipe soal'], ['kunci', 'Kebenaran kunci jawaban'], ['bahas', 'Konsistensi pembahasan'],
    ['pengecoh', 'Kelayakan pengecoh'], ['ganda', 'Tidak ada jawaban ganda yang tidak disengaja'],
    ['info', 'Tidak ada informasi yang kurang'], ['duplikat', 'Tidak ada soal duplikat'],

  const optTxt = (o) => (o.text != null ? o.text : o.alt != null ? o.alt : o.svg ? 'svg' : o.table ? JSON.stringify(o.table) : '');
  function regenSame(q) {

  function validate(pkg, a) {

    const scope = new Set((a && a.codes ? a.codes.map((c) => c.code) : (pkg.analysis && pkg.analysis.codes || []).map((c) => c.code)));

    const addQ = (q, msg, lvl = 'warn') => { (perQ[q.id] = perQ[q.id] || []).push({ msg, lvl }); };
    let no = 0;

      const nVis = (g.stimulus && g.stimulus.visuals || []).length;
      g.questions.forEach((q) => {
        no++; all.push({ q, no, g });
        const tag = `Soal ${no}`;
        // 1. kisi

          if (k.length < 2 || k.length >= (q.options || []).length || !k.every((x) => q.options.some((o) => o.id === x))) { flag('tipe', 'fail', `${tag}: pilihan ganda kompleks harus memiliki ≥2 jawaban benar dan ≥1 pengecoh.`); addQ(q, 'Struktur pilihan ganda kompleks tidak valid', 'fail'); }
        } else if (isTab(q.type)) {
          const ok = q.labels && q.labels.length >= 2 && q.statements && q.statements.length >= 2 && q.statements.every((s) => Number.isInteger(s.key) && s.key >= 0 && s.key < q.labels.length);
          if (!ok) { flag('tipe', 'fail', `${tag}: tabel pernyataan tidak valid.`); addQ(q, 'Tabel pernyataan tidak valid', 'fail'); }
          else if (q.statements.length < 3) flag('tipe', 'warn', `${tag}: sebaiknya minimal 3 pernyataan.`);
        } else { flag('tipe', 'fail', `${tag}: tipe soal tidak dikenal.`); addQ(q, 'Tipe tidak dikenal', 'fail'); }
        // 5. kunci (hitung ulang untuk soal generator lokal)
        if (q.edited) { flag('kunci', 'warn', `${tag} diedit manual; kunci diperiksa oleh guru.`); }
        else if (q.gen && q.gen.tpl) {
          const rs = regenSame(q);
          if (rs && rs.m) {
            try {
              const grp = g.gen && g.gen.tpl === q.gen.tpl ? g.gen : null;
              if (grp) {
                const p = rs.tpl.params(U.rng(grp.seed));
                const q2 = rs.m.make(p, U.rng(q.gen.qseed));
                const same = JSON.stringify([q2.key, (q2.options || []).map(optTxt), (q2.statements || []).map((s) => [s.text, s.key])]) === JSON.stringify([q.key, (q.options || []).map(optTxt), (q.statements || []).map((s) => [s.text, s.key])]);
                if (!same) { flag('kunci', 'fail', `${tag}: kunci berbeda dari hasil perhitungan ulang.`); addQ(q, 'Kunci tidak cocok dengan perhitungan ulang', 'fail'); }
              }
            } catch (e) { flag('kunci', 'warn', `${tag}: perhitungan ulang tidak dapat dijalankan.`); }
          }
        } else if (q.gen && q.gen.bank) {
          // soal bank: cocokkan jawaban dengan bank asli
          const st = BIB.byId[q.gen.bank], oq = st && st.qs.find((x) => x.id === q.gen.q);
          if (oq) {
            const keyTexts = (o) => (Array.isArray(o.key) ? o.key : [o.key]).map((k) => optTxt(o.options.find((x) => x.id === k) || {})).sort().join('|');
            if (q.options && oq.options && keyTexts(q) !== keyTexts(oq)) { flag('kunci', 'fail', `${tag}: kunci tidak sesuai bukti pada teks.`); addQ(q, 'Kunci tidak sesuai bank', 'fail'); }
            if (q.statements && JSON.stringify(q.statements.map((s) => s.key)) !== JSON.stringify(oq.statements.map((s) => s.key))) { flag('kunci', 'fail', `${tag}: kunci tabel tidak sesuai bukti pada teks.`); addQ(q, 'Kunci tabel tidak sesuai bank', 'fail'); }
          }
        } else if (q.ai && !q.aiChecked) { flag('kunci', 'warn', `${tag}: kunci dari AI belum diverifikasi ulang.`); addQ(q, 'Kunci belum diverifikasi ulang'); }
        // 6. pembahasan
        const ex = U.plain(q.explain || '').toLowerCase();
        if (ex.length < 15) { flag('bahas', 'fail', `${tag}: pembahasan kosong atau terlalu singkat.`); addQ(q, 'Pembahasan kosong', 'fail'); }
        else if (q.type === 'pg' && q.options) {
          const ko = q.options.find((o) => o.id === q.key);
          if (ko && ko.text != null) {
            const kt = U.plain(ko.text).toLowerCase().replace(/[“”"]/g, '').trim();
            const kn = U.numVal(ko.text);
            const exn = ex.replace(/[“”"]/g, '');
            const kw = U.words(kt).filter((w) => w.length > 3);
            const overlap = kw.length ? kw.filter((w) => exn.includes(w)).length / kw.length : 0;
            const hit = exn.includes(kt.slice(0, 28)) || overlap >= 0.5 || (kn !== null && (exn.includes(U.fmt(kn).toLowerCase()) || exn.includes(String(kn))));
            if (!hit) { flag('bahas', 'warn', `${tag}: pembahasan tidak menyebut jawaban kunci secara eksplisit.`); }
          }
        }
        // 7. pengecoh
        if (q.options && q.options.length) {
          const texts = q.options.map(optTxt);
          if (texts.some((t) => !U.plain(t).trim())) { flag('pengecoh', 'fail', `${tag}: ada opsi kosong.`); addQ(q, 'Opsi kosong', 'fail'); }
          const lens = q.options.filter((o) => o.text != null).map((o) => U.plain(o.text).length).sort((x, y) => x - y);
          if (lens.length >= 3) {
            const med = lens[Math.floor(lens.length / 2)];
            const keyLen = (Array.isArray(q.key) ? [] : q.options.filter((o) => o.id === q.key && o.text != null).map((o) => U.plain(o.text).length))[0];
            if (keyLen && med > 6 && keyLen > med * 2.4) flag('pengecoh', 'warn', `${tag}: opsi kunci jauh lebih panjang daripada pengecoh.`);
          }
        }
        // 8. jawaban ganda
        if (q.options) {
          const ks = q.options.map((o) => (q.type === 'pgk' ? 't:' + U.norm(optTxt(o)) : U.optKey(optTxt(o))));
          if (new Set(ks).size !== ks.length) { flag('ganda', 'fail', `${tag}: ada opsi yang bernilai sama.`); addQ(q, 'Opsi bernilai sama', 'fail'); }
        }
        if (q.statements) {
          const ks = q.statements.map((s) => U.norm(s.text));
          if (new Set(ks).size !== ks.length) { flag('ganda', 'fail', `${tag}: ada pernyataan kembar.`); addQ(q, 'Pernyataan kembar', 'fail'); }
        }
        // 9. informasi kurang
        const blob = JSON.stringify([q.text, (q.options || []).map((o) => o.text || ''), (q.statements || []).map((s) => s.text), q.explain]);
        if (/undefined|NaN|\bnull\b|\[object|\{\{\s*\}\}/.test(blob)) { flag('info', 'fail', `${tag}: ada teks yang tidak lengkap.`); addQ(q, 'Teks tidak lengkap', 'fail'); }
        if (/gambar 2/i.test(q.text || '') && nVis < 2) { flag('info', 'warn', `${tag} merujuk “Gambar 2”, tetapi stimulus tidak memiliki dua gambar.`); }
        if (/\b(tabel|diagram|piktogram|gambar|infografis|grafik)\b/i.test(q.text || '') && !nVis && !/\b(tabel|diagram|piktogram|gambar|infografis)\b/i.test(stimTxt)) flag('info', 'warn', `${tag} merujuk ilustrasi yang tidak ada pada stimulus.`);
      });
    });
    // 10. duplikat
    const sig = (q) => U.plain(q.text) + ' ' + (q.options || []).map(optTxt).join(' ') + ' ' + (q.statements || []).map((s) => s.text).join(' ');
    for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
      const A = all[i], B = all[j];
      if (A.q.gen && B.q.gen && A.q.gen.tpl && A.q.gen.tpl === B.q.gen.tpl && A.q.gen.maker === B.q.gen.maker) {
        flag('duplikat', 'warn', `Soal ${A.no} dan ${B.no} memakai model soal yang sama.`); addQ(B.q, 'Model soal sama dengan soal lain');
        continue;
      }
      const jac = U.jaccard(sig(A.q), sig(B.q));
      if (jac > 0.82) { flag('duplikat', 'fail', `Soal ${A.no} dan ${B.no} hampir sama.`); addQ(B.q, 'Hampir sama dengan soal lain', 'fail'); }
    }
    // cakupan kisi-kisi
    if (scope.size) {
      const covered = new Set(all.map((x) => x.q.code));
      const miss = [...scope].filter((c) => !covered.has(c));
      if (miss.length) flag('kisi', 'warn', `Belum terwakili: ${miss.map((c) => TAX.byCode[c] ? TAX.byCode[c].label : c).join('; ')}.`);
    }
    const checks = CHECKS.map(([id]) => res[id]);
    return {
      at: Date.now(), checks, perQ,
      summary: { ok: checks.filter((c) => c.status === 'ok').length, warn: checks.filter((c) => c.status === 'warn').length, fail: checks.filter((c) => c.status === 'fail').length, total: no },
    };
  }

  // ---------------- Buat ulang & variasi ----------------
  function regenQuestion(pkg, gi, qi, seed) {
    const g = pkg.groups[gi], q = g.questions[qi];
    seed = seed || U.newSeed();
    if (g.gen && g.gen.tpl) {
      const tpl = TPL[g.gen.tpl];
      const p = tpl.params(U.rng(g.gen.seed));
      const used = g.questions.map((x) => x.gen && x.gen.maker);
      const cands = tpl.qs.filter((m) => !used.includes(m.id)).sort((a, b) => (a.code === q.code ? 0 : 1) - (b.code === q.code ? 0 : 1));
      for (const m of cands) {
        try { const nq = makeMathQ(tpl, m, p, seed); g.questions[qi] = nq; return { ok: true, how: 'Soal diganti dengan model soal lain dari stimulus yang sama.' }; } catch (e) { if (!(e instanceof GE)) throw e; }
      }
      const m0 = tpl.qs.find((m) => m.id === q.gen.maker);
      for (let k = 0; k < 6; k++) {
        try {
          const nq = makeMathQ(tpl, m0, p, seed + k * 13);
          if (JSON.stringify([nq.options, nq.statements]) !== JSON.stringify([q.options, q.statements])) { g.questions[qi] = nq; return { ok: true, how: 'Opsi dan pernyataan soal disusun ulang.' }; }
        } catch (e) { if (!(e instanceof GE)) throw e; }
      }
      return { ok: false, msg: 'Tidak ada variasi lain untuk soal ini. Gunakan “Buat ulang kelompok” atau edit manual.' };
    }
    if (g.gen && g.gen.bank) {
      const st = BIB.byId[g.gen.bank];
      const used = g.questions.map((x) => x.gen && x.gen.q);
      const cands = st.qs.filter((x) => !used.includes(x.id)).sort((a, b) => (a.code === q.code ? 0 : 1) - (b.code === q.code ? 0 : 1));
      if (!cands.length) return { ok: false, msg: 'Semua soal cadangan untuk bacaan ini sudah dipakai. Gunakan “Buat ulang kelompok” atau hubungkan AI.' };
      g.questions[qi] = bankQ(st, cands[0], U.rng(seed));
      return { ok: true, how: 'Soal diganti dengan soal cadangan untuk bacaan yang sama.' };
    }
    return { ok: false, msg: 'Soal ini dibuat oleh AI atau ditambahkan manual. Buat ulang memerlukan koneksi AI.', needAI: true };
  }
  function regenGroup(pkg, gi, seed) {
    const g = pkg.groups[gi];
    seed = seed || U.newSeed();
    if (g.gen && g.gen.tpl) {
      const makers = g.questions.map((q) => q.gen && q.gen.maker).filter(Boolean);
      const ng = buildMathGroup(g.gen.tpl, makers.length ? makers : TPL[g.gen.tpl].qs.slice(0, 3).map((m) => m.id), seed);
      pkg.groups[gi] = ng;
      return { ok: true, how: 'Stimulus dan soal dibuat ulang dengan konteks dan angka baru.' };
    }
    if (g.gen && g.gen.bank) {
      const usedSt = pkg.groups.map((x) => x.gen && x.gen.bank);
      const codes = g.questions.map((q) => q.code);
      const cands = BIB.S.filter((s) => !usedSt.includes(s.id)).map((s) => ({ s, sc: s.qs.filter((q) => codes.includes(q.code)).length })).sort((a, b) => b.sc - a.sc);
      if (!cands.length) return { ok: false, msg: 'Semua bacaan di bank lokal sudah dipakai dalam naskah ini. Hubungkan AI untuk membuat bacaan baru.' };
      const st = cands[0].s, r = U.rng(seed);
      const picks = [];
      codes.forEach((c) => { const q = st.qs.find((x) => x.code === c && !picks.includes(x)); if (q) picks.push(q); });
      r.shuffle(st.qs).forEach((q) => { if (picks.length < g.questions.length && !picks.includes(q)) picks.push(q); });
      pkg.groups[gi] = buildBIGroup(st.id, picks.slice(0, Math.max(1, g.questions.length)).map((q) => q.id), seed);
      return { ok: true, how: `Bacaan diganti dengan “${st.title}”.` };
    }
    return { ok: false, msg: 'Kelompok ini dibuat oleh AI atau manual. Buat ulang kelompok memerlukan koneksi AI.', needAI: true };
  }

  // ---------------- Pipeline lokal (7 langkah) ----------------
  const STEPS = ['Menganalisis kisi-kisi', 'Menentukan kompetensi', 'Membuat stimulus', 'Menyusun pertanyaan', 'Membuat kunci jawaban', 'Memvalidasi soal', 'Menyelesaikan naskah'];
  async function runLocal(a, opts = {}, onStep = async () => {}) {
    const seed = opts.seed || U.newSeed();
    const r = U.rng(seed);
    const count = opts.count || autoCount(a);
    const G = Math.max(1, Math.round(count / 3));
    const log = (i, state, detail) => onStep(i, state, detail);
    // 1
    await log(0, 'run');
    const sub = a.subjectName;
    await log(0, 'done', `${sub}: ${a.codes.length} kompetensi dikenali dari ${a.lines.length} baris kisi-kisi. Jenjang: ${a.jenjang.label}.`);
    // 2
    await log(1, 'run');
    const isM = a.subject === 'mtk';
    const { plan, alloc } = isM ? planMath(a, G, r, opts.avoid || {}) : planBI(a, Math.min(G, BIB.S.length), r, opts.avoid || {});
    if (!plan.length) throw new GE('Kisi-kisi tidak dapat dipetakan ke bank soal lokal.');
    const allocTxt = a.codes.map((c) => `${c.label} (${alloc[c.code] || 0})`).join('; ');
    await log(1, 'done', `Alokasi ${plan.length * 3} soal: ${allocTxt}.`);
    // 3
    await log(2, 'run');
    const groups = [];
    const avoidTitles = new Set((opts.avoid && opts.avoid.titles) || []);
    for (let i = 0; i < plan.length; i++) {
      const pl = plan[i];
      const gseed = (seed + (i + 1) * 104729) >>> 0;
      if (!isM) { groups.push(buildBIGroup(pl.bank, pl.qs, gseed)); continue; }
      // Konteks stimulus dibuat berbeda dari naskah sumber (variasi) dan dari kelompok lain di naskah ini.
      const taken = new Set([...avoidTitles, ...groups.map((g) => g.stimulus.title)]);
      let g = buildMathGroup(pl.tpl, pl.makers, gseed);
      for (let k = 1; k <= 10 && taken.has(g.stimulus.title); k++) {
        const alt = buildMathGroup(pl.tpl, pl.makers, (gseed + k * 7777) >>> 0);
        if (!taken.has(alt.stimulus.title)) g = alt;
      }
      groups.push(g);
    }
    const kinds = {};
    groups.forEach((g) => { kinds[g.stimulus.kind] = (kinds[g.stimulus.kind] || 0) + 1; });
    await log(2, 'done', `${groups.length} stimulus dibuat: ${Object.entries(kinds).map(([k, v]) => `${v} ${k.toLowerCase()}`).join(', ')}.`);
    // 4
    await log(3, 'run');
    const qs = groups.flatMap((g) => g.questions);
    const tc = {};
    qs.forEach((q) => { tc[q.type] = (tc[q.type] || 0) + 1; });
    await log(3, 'done', `${qs.length} soal tersusun: ${Object.entries(tc).map(([t, v]) => `${v} ${TAX.TYPE_NAME[t]}`).join(', ')}.`);
    // 5
    await log(4, 'run');
    let nk = 0, ne = 0;
    qs.forEach((q) => { if (q.key != null || q.statements) nk++; if (q.explain) ne++; });
    const lv = {}; qs.forEach((q) => { lv[q.level] = (lv[q.level] || 0) + 1; });
    await log(4, 'done', `${nk} kunci jawaban dan ${ne} pembahasan dibuat. Level kognitif: ${Object.entries(lv).map(([k, v]) => `${k} ${v}`).join(', ')}.`);
    // 6
    await log(5, 'run');
    const pkg = {
      id: opts.id || U.uid('pkg'), v: 1, title: opts.title || `Latihan TKA ${sub} ${a.jenjang.label}`,
      subject: a.subject, subjectName: sub, jenjang: a.jenjang.label, durasi: opts.durasi || Math.max(15, qs.length * 2),
      createdAt: Date.now(), updatedAt: Date.now(), engine: opts.engine || 'lokal', seed, kisi: opts.kisi || '',
      analysis: { codes: a.codes.map((c) => ({ code: c.code, label: c.label, el: c.el, weight: c.weight })), alloc, notes: a.notes || [], unknown: a.unknown || [] },
      groups, scoring: 'parsial',
    };
    let v = validate(pkg, a), fixed = 0;
    for (let round = 0; round < 3 && v.summary.fail; round++) {
      pkg.groups.forEach((g, gi) => g.questions.forEach((q, qi) => {
        if ((v.perQ[q.id] || []).some((x) => x.lvl === 'fail')) { const rr = regenQuestion(pkg, gi, qi, seed + round * 31 + qi); if (rr.ok) fixed++; }
      }));
      v = validate(pkg, a);
    }
    pkg.validation = v; v.fixed = fixed;
    await log(5, 'done', `10 pemeriksaan: ${v.summary.ok} lolos, ${v.summary.warn} catatan, ${v.summary.fail} gagal. Perhitungan ulang kunci: ${qs.length} soal. Perbaikan otomatis: ${fixed}.`);
    // 7
    await log(6, 'run');
    await log(6, 'done', `Naskah “${pkg.title}” siap: ${pkg.groups.reduce((s, g) => s + g.questions.length, 0)} soal, ${pkg.groups.length} kelompok stimulus, durasi ${pkg.durasi} menit.`);
    return pkg;
  }
  // versi sinkron (untuk paket contoh)
  function buildSync(a, opts = {}) {
    let out = null;
    const p = runLocal(a, opts, () => {});
    // runLocal tidak benar-benar asinkron tanpa onStep yang menunggu; gunakan then
    return p;
  }

  // ---------------- Penilaian ----------------
  function scoreQuestion(q, ans, mode = 'parsial') {
    const empty = ans == null || (Array.isArray(ans) && (q.type === 'pgk' ? ans.length === 0 : ans.every((x) => x == null)));
    if (empty) return { score: 0, status: 'kosong' };
    if (q.type === 'pg') return ans === q.key ? { score: 1, status: 'benar' } : { score: 0, status: 'salah' };
    if (q.type === 'pgk') {
      const K = new Set(q.key), A = new Set(ans);
      const tp = [...A].filter((x) => K.has(x)).length, fp = [...A].filter((x) => !K.has(x)).length;
      const full = tp === K.size && fp === 0;
      if (full) return { score: 1, status: 'benar' };
      const part = Math.max(0, (tp - fp) / K.size);
      return { score: mode === 'parsial' ? part : 0, status: part > 0 && mode === 'parsial' ? 'sebagian' : 'salah' };
    }
    if (isTab(q.type)) {
      const n = q.statements.length;
      const ok = q.statements.filter((s, i) => ans[i] === s.key).length;
      if (ok === n) return { score: 1, status: 'benar' };
      const part = ok / n;
      return { score: mode === 'parsial' ? part : 0, status: part > 0 && mode === 'parsial' ? 'sebagian' : 'salah' };
    }
    return { score: 0, status: 'salah' };
  }
  function flat(pkg) {
    const out = []; let no = 0;
    pkg.groups.forEach((g, gi) => g.questions.forEach((q, qi) => { no++; out.push({ no, q, g, gi, qi }); }));
    return out;
  }
  function scoreAttempt(pkg, answers, mode) {
    const F = flat(pkg);
    let sum = 0, benar = 0, salah = 0, kosong = 0, sebagian = 0;
    const per = {};
    const items = F.map(({ no, q }) => {
      const r = scoreQuestion(q, answers[q.id], mode || pkg.scoring);
      sum += r.score;
      if (r.status === 'benar') benar++; else if (r.status === 'kosong') kosong++; else { salah++; if (r.status === 'sebagian') sebagian++; }
      const key = q.submateri || q.materi || 'Lainnya';
      const pp = (per[key] = per[key] || { label: key, materi: q.materi || '', code: q.code, n: 0, score: 0 });
      pp.n++; pp.score += r.score;
      return { no, id: q.id, score: r.score, status: r.status };
    });
    const N = F.length || 1;
    const nilai = Math.round((sum / N) * 1000) / 10;
    const answered = benar + salah;
    const perList = Object.values(per).map((x) => Object.assign(x, { pct: Math.round((x.score / x.n) * 100) })).sort((a, b) => a.pct - b.pct);
    const recs = perList.filter((x) => x.pct < 70).map((x) => ({ label: x.label, pct: x.pct, tip: (TAX.byCode[x.code] && TAX.byCode[x.code].tip) || `Pelajari kembali materi ${x.label.toLowerCase()} dan kerjakan latihan serupa.` }));
    return { nilai, benar, salah, kosong, sebagian, total: F.length, akurasi: answered ? Math.round((benar / answered) * 100) : 0, items, per: perList, recs };
  }

  function stats(pkg) {
    const F = flat(pkg);
    const by = (f) => F.reduce((m, x) => { const k = f(x.q); m[k] = (m[k] || 0) + 1; return m; }, {});
    return { n: F.length, groups: pkg.groups.length, types: by((q) => q.type), levels: by((q) => q.level || '-'), forms: by((q) => q.form || (q.variant === 'diagram' ? 'Interpretasi diagram' : q.variant === 'visual' ? 'Interpretasi visual' : '')), materi: by((q) => q.materi || '-'), sub: by((q) => q.submateri || '-') };
  }

  return { TPL, KISI_MTK, KISI_BI, analyze, autoCount, planMath, planBI, buildMathGroup, buildBIGroup, validate, regenQuestion, regenGroup, runLocal, buildSync, STEPS, scoreQuestion, scoreAttempt, flat, stats, CHECKS };
})();

/* ==========================================================================
   70_store.js — penyimpanan lokal (localStorage) dengan cadangan memori.
   ========================================================================== */
const STORE = (() => {
  const NS = 'tkaguru.v1.';
  const mem = {};
  let ok = true;
  try { const k = NS + '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch (e) { ok = false; }
  function raw(k) { try { return ok ? localStorage.getItem(NS + k) : (mem[k] == null ? null : mem[k]); } catch (e) { return mem[k] == null ? null : mem[k]; } }
  function get(k, def) { const v = raw(k); if (v == null) return def; try { return JSON.parse(v); } catch (e) { return def; } }
  function set(k, v) {
    const s = JSON.stringify(v);
    if (!ok) { mem[k] = s; return true; }
    try { localStorage.setItem(NS + k, s); return true; } catch (e) {
      mem[k] = s;
      const err = new Error('Penyimpanan browser penuh. Hapus naskah atau riwayat lama, lalu coba lagi.');
      err.quota = true; throw err;
    }
  }
  function del(k) { try { if (ok) localStorage.removeItem(NS + k); } catch (e) { /* abaikan */ } delete mem[k]; }

  // ---- Paket ----
  const idx = () => get('pkgs', []);
  function summary(p) {
    const n = p.groups.reduce((s, g) => s + g.questions.length, 0);

  function exportQ(q) {
    const o = { bentuk: q.type, pertanyaan: q.text, pembahasan: q.explain };
    if (q.options) { o.opsi = q.options.map((x) => (x.text != null ? x.text : x.alt ? { diagram_alur: String(x.alt).split(' → ') } : '[gambar]')); o.kunci = q.key; }
    if (q.statements) { o.label = q.labels; o.pernyataan = q.statements.map((s) => ({ teks: s.text, kunci: q.labels[s.key] })); }
    return o;
  }

  // ---------------- Pipeline utama ----------------
  async function run(text, opts, hooks, signal) {
    const count = opts.count || 0;
    // 1. Analisis
    hooks.tracks([{ label: 'Menganalisis kisi-kisi dengan AI', subject: null }]);
    hooks.step(0, 0, 'run', 'Mengirim kisi-kisi ke AI…');
    const an = await ask(pAnalisis(text, count), signal, 0.4);
    const paket = (an.paket || []).filter((p) => p && Array.isArray(p.rancangan) && p.rancangan.length && Array.isArray(p.indikator));
    if (!paket.length) throw new AIError('AI tidak menemukan mata pelajaran atau rancangan dari kisi-kisi.');
    const subjOf = (m) => (/indonesia/i.test(m) ? 'bi' : 'mtk');
    hooks.tracks(paket.map((p) => ({ label: `Paket ${p.mapel} — ${p.jenjang || 'Kelas 6 SD/MI'}`, subject: subjOf(p.mapel), subjectName: /indonesia/i.test(p.mapel) ? 'Bahasa Indonesia' : 'Matematika' })));
    paket.forEach((p, ti) => hooks.step(ti, 0, 'done', `${p.indikator.length} indikator dikenali; jenjang ${p.jenjang || 'Kelas 6 SD/MI'}.`));
    const out = [];
    for (let ti = 0; ti < paket.length; ti++) {
      const pk = paket[ti];
      pk.jenjang = pk.jenjang || 'Kelas 6 SD/MI';
      // 2. Kompetensi
      hooks.step(ti, 1, 'run');
      let plan = pk.rancangan.slice(0, count ? Math.round(count / 3) : 12).map((r, i) => Object.assign({ no: i + 1 }, r));
      const meta = {};
      pk.indikator.forEach((x) => { meta[x.kode] = { code: 'AI-' + x.kode, label: x.kompetensi || x.kode, materi: x.materi || pk.mapel, level: x.level }; });
      const used = new Set(plan.flatMap((r) => r.kode_indikator || []));
      hooks.step(ti, 1, 'done', `${plan.length} kelompok stimulus × 3 soal; ${used.size} dari ${pk.indikator.length} indikator masuk rancangan.`);
      // 3. Stimulus (batch 5)
      hooks.step(ti, 2, 'run', 'Meminta AI menulis stimulus…');
      const batches = []; for (let i = 0; i < plan.length; i += 5) batches.push(plan.slice(i, i + 5));
      let doneB = 0;
      const stims = {};
      await pool(batches, 2, async (b) => {
        const res = await ask(pStimulus(pk, b), signal, 0.8);
        (res.stimulus || []).forEach((s, k) => { const no = s.no || b[k] && b[k].no; stims[no] = normStimulus(s); });
        doneB++; hooks.sub(ti, doneB / batches.length);
      }, signal);
      const okPlan = plan.filter((r) => stims[r.no] && (stims[r.no].text || stims[r.no].visuals.length));
      if (!okPlan.length) throw new AIError('AI gagal membuat stimulus.');
      hooks.step(ti, 2, 'done', `${okPlan.length} stimulus dibuat: ${Object.values(stims).map((s) => s.kind.toLowerCase()).slice(0, 10).join(', ')}.`);
      // 4. Soal (per stimulus)
      hooks.step(ti, 3, 'run', 'Menyusun soal untuk setiap stimulus…');
      let doneQ = 0; const fails = [];
      const raws = await pool(okPlan, 3, async (r) => {
        try { const res = await ask(pSoal(pk, r, stims[r.no]), signal, 0.7); doneQ++; hooks.sub(ti, doneQ / okPlan.length); return res.soal || []; } catch (e) { if (e.name === 'AbortError') throw e; fails.push(r.no); doneQ++; return null; }
      }, signal);
      hooks.step(ti, 3, 'done', `${raws.filter(Boolean).reduce((s, x) => s + x.length, 0)} soal tersusun${fails.length ? `; ${fails.length} kelompok gagal dan dilewati` : ''}.`);
      // 5. Kunci & normalisasi
      hooks.step(ti, 4, 'run');
      const groups = [];
      okPlan.forEach((r, i) => {
        if (!raws[i]) return;
        const qs = [];
        raws[i].slice(0, 3).forEach((rq, k) => {
          const kode = rq.kode_indikator || (r.kode_indikator || [])[k];
          const m = meta[kode] || { code: 'AI-' + (kode || 'X'), label: kode || 'Kompetensi', materi: pk.mapel };
          try { const q = normQuestion(rq, m); if ((q.options && q.options.length >= 3 && (q.type === 'pg' ? q.key : q.key.length)) || (q.statements && q.statements.length >= 2)) qs.push(q); } catch (e) { /* lewati */ }
        });
        if (qs.length) groups.push({ id: U.uid('g'), stimulus: stims[r.no], questions: qs, gen: { ai: true, plan: r } });
      });
      if (groups.length < Math.max(1, Math.ceil(okPlan.length / 2))) throw new AIError('Sebagian besar soal dari AI tidak dapat dibaca. Coba lagi.');
      const nq = groups.reduce((s, g) => s + g.questions.length, 0);
      hooks.step(ti, 4, 'done', `${nq} kunci jawaban dan pembahasan dipetakan ke format naskah.`);
      // 6. Validasi silang AI + validasi lokal
      hooks.step(ti, 5, 'run', 'AI memeriksa ulang kunci dan pembahasan…');
      const vb = []; for (let i = 0; i < groups.length; i += 3) vb.push(groups.slice(i, i + 3).map((g, k) => ({ gi: i + k, g })));
      let doneV = 0, fixed = 0, vErr = 0;
      await pool(vb, 3, async (b) => {
        try {
          const payload = b.map(({ gi, g }) => ({ no_kelompok: gi + 1, stimulus: { judul: g.stimulus.title, teks: g.stimulus.text, visual: g.stimulus.visuals.map((v) => (v.type === 'svg' ? '[gambar]' : v)) }, soal: g.questions.map(exportQ) }));
          const res = await ask(pValidasi(pk, payload), signal, 0.2, 1);
          (res.hasil || []).forEach((h) => {
            const g = groups[(h.no_kelompok || 0) - 1]; if (!g) return;
            const qi = (h.no_soal || 0) - 1; const q = g.questions[qi]; if (!q) return;
            if (h.status === 'diperbaiki' && h.soal) {
              try { const nq2 = normQuestion(Object.assign({ bentuk: q.type, kode_indikator: null, level: q.level, indikator_soal: q.indikator }, h.soal), { code: q.code, label: q.submateri, materi: q.materi }); nq2.aiChecked = true; nq2.aiNote = h.catatan || ''; g.questions[qi] = nq2; fixed++; } catch (e) { /* biarkan */ }
            } else q.aiChecked = true;
          });
        } catch (e) { if (e.name === 'AbortError') throw e; vErr++; }
        doneV++; hooks.sub(ti, doneV / vb.length);
      }, signal);
      const pkg = {
        id: U.uid('pkg'), v: 1, title: opts.title || pk.judul || `Latihan TKA ${pk.mapel} ${pk.jenjang}`, subject: subjOf(pk.mapel), subjectName: /indonesia/i.test(pk.mapel) ? 'Bahasa Indonesia' : 'Matematika',
        jenjang: pk.jenjang, durasi: opts.durasi || Math.max(15, nq * 2), createdAt: Date.now(), updatedAt: Date.now(), engine: 'ai', aiModel: lastModel, aiCodes: true, kisi: text,
        analysis: { codes: pk.indikator.map((x) => ({ code: 'AI-' + x.kode, label: x.kompetensi, el: x.materi, weight: 1 })), notes: [] }, groups, scoring: STORE.settings().scoring || 'parsial',
      };
      cleanPackage(pkg);
      const v = ENGINE.validate(pkg, { codes: pkg.analysis.codes });
      v.fixed = fixed; pkg.validation = v;
      hooks.step(ti, 5, 'done', `Validasi silang AI: ${fixed} soal diperbaiki${vErr ? `, ${vErr} batch tidak terperiksa` : ''}. Validasi lokal: ${v.summary.ok} lolos, ${v.summary.warn} catatan, ${v.summary.fail} gagal.`);
      hooks.step(ti, 6, 'run');
      hooks.step(ti, 6, 'done', `Naskah “${pkg.title}” siap: ${nq} soal, ${groups.length} stimulus.`);
      out.push(pkg);
    }
    return out;
  }

  async function regenQuestion(pkg, gi, qi) {
    const g = pkg.groups[gi], q = g.questions[qi];
    const pk = { mapel: pkg.subjectName, jenjang: pkg.jenjang, indikator: [{ kode: 'X', kompetensi: q.submateri || q.indikator || '', materi: q.materi || '', level: q.level }] };
    const prompt = `TAHAP: MENYUSUN SOAL PENGGANTI
${pSoal(pk, { kode_indikator: ['X'], bentuk: [q.type] }, g.stimulus).replace('Buat tepat 3 soal', 'Buat tepat 1 soal')}
Soal lain pada stimulus ini (jangan diulang): ${JSON.stringify(g.questions.filter((x, i) => i !== qi).map((x) => x.text))}
Soal yang diganti: ${JSON.stringify(q.text)}`;
    const res = await ask(prompt, null, 0.9);
    const raw = (res.soal || [])[0];
    if (!raw) return { ok: false, msg: 'AI tidak mengembalikan soal.' };
    const nq = normQuestion(raw, { code: q.code, label: q.submateri, materi: q.materi });
    g.questions[qi] = nq;
    return { ok: true, how: 'Soal dibuat ulang oleh AI.' };
  }
  async function regenGroup(pkg, gi) {
    const g = pkg.groups[gi];
    const inds = g.questions.map((q, i) => ({ kode: 'K' + (i + 1), kompetensi: q.submateri || q.indikator, materi: q.materi, level: q.level }));
    const pk = { mapel: pkg.subjectName, jenjang: pkg.jenjang, indikator: inds };
    const plan = { no: 1, jenis_stimulus: (g.stimulus && g.stimulus.kind) || 'stimulus', ide: 'stimulus baru yang berbeda dari sebelumnya', kode_indikator: inds.map((x) => x.kode), bentuk: g.questions.map((q) => q.type) };
    const sres = await ask(pStimulus(pk, [plan]), null, 0.9);
    const st = normStimulus((sres.stimulus || [])[0] || {});
    if (!st.text && !st.visuals.length) return { ok: false, msg: 'AI tidak mengembalikan stimulus.' };
    const qres = await ask(pSoal(pk, plan, st), null, 0.7);
    const qs = (qres.soal || []).slice(0, 3).map((rq, k) => { const ind = inds[k] || inds[0]; return normQuestion(rq, { code: g.questions[k] ? g.questions[k].code : 'AI-X', label: ind.kompetensi, materi: ind.materi }); });
    if (!qs.length) return { ok: false, msg: 'AI tidak mengembalikan soal.' };
    pkg.groups[gi] = { id: U.uid('g'), stimulus: cleanPackage({ groups: [{ stimulus: st, questions: [] }] }).groups[0].stimulus, questions: qs, gen: { ai: true } };
    return { ok: true, how: 'Stimulus dan soal dibuat ulang oleh AI.' };
  }

var DEFAULT_MODEL = 'gemini-flash-latest';

function doPost(e) {

  const PROXY_CF = `// Proxy TKA GURU untuk Gemini API (Cloudflare Worker).

export default {
  async fetch(request, env) {

    const json = (o) => new Response(JSON.stringify(o), { headers: { ...cors, 'Content-Type': 'application/json' } });

    }

  while (box.children.length >= 2) box.firstChild.remove(); // paling banyak dua notifikasi sekaligus
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 3200);
  setTimeout(() => t.remove(), 3600);
}
function modal(o) {
  return new Promise((resolve) => {
    const root = $('#modal-root');
    const mb = document.createElement('div');
    mb.className = 'mb';
    mb.innerHTML = `<div class="modal ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="mh"><h2 id="mtitle">${esc(o.title || '')}</h2><button class="btn btn-ghost icon-btn" data-m="close" aria-label="Tutup">${ic('x')}</button></div><div class="mbd">${o.body || ''}</div><div class="mf">${(o.actions || [{ label: 'Tutup', value: null }]).map((a, i) => `<button class="btn ${a.kind || ''}" data-m="${i}">${a.icon ? ic(a.icon) : ''}${esc(a.label)}</button>`).join('')}</div></div>`;
    const prev = document.activeElement;
    const close = (v) => { mb.remove(); document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') close(null); };
    mb.addEventListener('click', (e) => {
      if (e.target === mb) return close(null);
      const b = e.target.closest('[data-m]');
      if (!b) return;
      if (b.dataset.m === 'close') return close(null);
      const a = o.actions[+b.dataset.m];
      if (a.onClick) { const r = a.onClick(mb); if (r === false) return; }
      close(a.value !== undefined ? a.value : true);
    });
    document.addEventListener('keydown', onKey);
    root.appendChild(mb);
    if (o.onOpen) o.onOpen(mb);
    const f = mb.querySelector('[autofocus]') || mb.querySelector('.mf .btn-primary') || mb.querySelector('.mf .btn');
    if (f) f.focus();
  });
}
const confirmDlg = (title, body, okLabel = 'Ya, lanjutkan', danger = false) => modal({ title, body: `<p>${body}</p>`, actions: [{ label: 'Batal', value: false }, { label: okLabel, kind: danger ? 'btn-danger' : 'btn-primary', value: true }] });

function download(name, content, mime = 'text/html;charset=utf-8') {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove(); return ok;
  }
}

// ---------------- Sanitasi SVG (untuk konten dari AI / impor / tautan) ----------------
const SAFE_EL = new Set(['svg', 'g', 'defs', 'title', 'desc', 'rect', 'circle', 'ellipse', 'line', 'polyline', 'polygon', 'path', 'text', 'tspan', 'pattern', 'clipPath', 'marker', 'linearGradient', 'radialGradient', 'stop', 'use']);
const SAFE_AT = new Set(['xmlns', 'viewbox', 'width', 'height', 'x', 'y', 'x1', 'y1', 'x2', 'y2', 'cx', 'cy', 'r', 'rx', 'ry', 'd', 'points', 'fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'opacity', 'fill-opacity', 'stroke-opacity', 'transform', 'font-size', 'font-weight', 'font-family', 'font-style', 'text-anchor', 'dominant-baseline', 'id', 'class', 'clip-path', 'marker-end', 'marker-start', 'refx', 'refy', 'markerwidth', 'markerheight', 'orient', 'preserveaspectratio', 'patternunits', 'patterntransform', 'offset', 'stop-color', 'letter-spacing', 'dx', 'dy', 'role', 'aria-label', 'href', 'xlink:href', 'style', 'gradientunits', 'fill-rule', 'clip-rule', 'markerunits']);
function sanitizeSvg(str) {
  if (!str || typeof DOMParser === 'undefined') return '';
  let doc;
  try { doc = new DOMParser().parseFromString(String(str), 'image/svg+xml'); } catch (e) { return ''; }
  const root = doc.documentElement;
  if (!root || root.nodeName.toLowerCase() !== 'svg' || doc.getElementsByTagName('parsererror').length) return '';
  const walk = (el) => {
    Array.from(el.childNodes).forEach((ch) => {
      if (ch.nodeType === 1) { if (!SAFE_EL.has(ch.nodeName)) ch.remove(); else walk(ch); } else if (ch.nodeType !== 3) ch.remove();
    });
    Array.from(el.attributes).forEach((a) => {
      const n = a.name.toLowerCase(), v = a.value;
      if (n.indexOf('on') === 0) return el.removeAttribute(a.name);
      if (n === 'href' || n === 'xlink:href') { if (!/^#[\w-]+$/.test(v)) el.removeAttribute(a.name); return; }
      if (!SAFE_AT.has(n)) return el.removeAttribute(a.name);
      if (/javascript:|expression\(|url\(\s*(?!#)|@import/i.test(v)) el.removeAttribute(a.name);
    });
  };
  walk(root);
  if (!root.getAttribute('viewBox') && root.getAttribute('width') && root.getAttribute('height')) root.setAttribute('viewBox', `0 0 ${parseFloat(root.getAttribute('width')) || 300} ${parseFloat(root.getAttribute('height')) || 150}`);
  // SVG tanpa ukuran akan melebar memenuhi kertas; beri ukuran alami dari viewBox (maks. 480 px).
  const vb = String(root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(parseFloat);
  if ((!root.getAttribute('width') || /%/.test(root.getAttribute('width'))) && vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
    const w = Math.min(480, vb[2]);
    root.setAttribute('width', String(Math.round(w))); root.setAttribute('height', String(Math.round((w * vb[3]) / vb[2])));
  }
  return new XMLSerializer().serializeToString(root);
}
function cleanPackage(p) {
  // dipakai untuk paket dari AI, impor file, atau tautan
  const cs = (v) => { if (v && v.type === 'svg') v.svg = sanitizeSvg(v.svg); return v; };
  (p.groups || []).forEach((g) => {
    if (g.stimulus) (g.stimulus.visuals || []).forEach(cs);
    (g.questions || []).forEach((q) => (q.options || []).forEach((o) => { if (o.svg) o.svg = sanitizeSvg(o.svg); }));
  });
  return p;
}

function tableHTML(v) {
  const heads = (v.headers || []).map((h) => `<th>${mdi(h)}</th>`).join('');
  const rows = (v.rows || []).map((r) => `<tr>${r.map((c) => `<td>${mdi(c)}</td>`).join('')}</tr>`).join('');
  return `<table class="dtable">${v.caption ? `<caption>${mdi(v.caption)}</caption>` : ''}${heads ? `<thead><tr>${heads}</tr></thead>` : ''}<tbody>${rows}</tbody></table>`;
}
function chartSVG(v) {
  try {
    if (v.type === 'bar') return SVG.bar(v);
    if (v.type === 'line') return SVG.lineChart(v);
    if (v.type === 'pie') return SVG.pie(v);
    if (v.type === 'picto') return SVG.picto({ rows: (v.labels || []).map((l, i) => ({ label: l, value: +v.values[i] || 0 })), unitValue: +v.unitValue || 1, unitLabel: v.unitLabel || '', icon: v.icon || 'bintang', title: v.title });
  } catch (e) { return ''; }
  return '';
}
function visHTML(v) {
  if (!v) return '';
  if (v.type === 'table') return tableHTML(v);
  const svg = v.type === 'svg' ? v.svg : chartSVG(v);
  if (!svg) return '';
  return `<figure class="fig">${svg}${v.caption ? `<figcaption>${mdi(v.caption)}</figcaption>` : ''}</figure>`;
}
function visualsHTML(vs) {
  if (!vs || !vs.length) return '';
  const svgs = vs.filter((v) => v.type !== 'table');
  if (svgs.length > 1 && svgs.every((v) => v.caption)) {
    return vs.filter((v) => v.type === 'table').map(visHTML).join('') + `<div class="figs">${svgs.map(visHTML).join('')}</div>`;
  }
  return vs.map(visHTML).join('');
}
function stimHTML(st) {
  if (!st) return '';
  return `<div class="stim">${st.title ? `<div class="stim-title">${mdi(st.title)}</div>` : ''}${st.text ? `<div class="stim-text${st.poem ? ' poem' : ''}">${md(st.text)}</div>` : ''}${visualsHTML(st.visuals)}</div>`;
}
function miniTable(t) {
  return `<table class="otable">${t.headers ? `<tr>${t.headers.map((h) => `<th>${mdi(h)}</th>`).join('')}</tr>` : ''}${(t.rows || []).map((r) => `<tr>${r.map((c, i) => (i === 0 && t.headers ? `<th>${mdi(c)}</th>` : `<td>${mdi(c)}</td>`)).join('')}</tr>`).join('')}</table>`;
}
function optContent(o) {
  if (o.svg) return `<span class="opt-svg">${o.svg}</span>`;
  if (o.table) return miniTable(o.table);
  return mdi(o.text != null ? o.text : '');
}
const typeName = (q) => (q.variant === 'diagram' ? 'Interpretasi Diagram' : q.variant === 'visual' ? 'Interpretasi Visual' : TAX.TYPE_NAME[q.type] || q.type);
function printHint(q) {

  if (TAX.isTable(q.type)) return `Beri tanda centang (✓) pada kolom ${q.labels.map((l) => '“' + l + '”').join(' atau ')} untuk setiap pernyataan.`;

const APP = { cleanup: null, student: null, mode: 'guru', proc: null };

function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  if (APP.cleanup) { try { APP.cleanup(); } catch (e) { /* abaikan */ } APP.cleanup = null; }
  document.body.classList.remove('exam-mode');
  $('#modal-root').innerHTML = '';
  const h = decodeURI(location.hash.replace(/^#/, '')) || '/';
  const R = [
    [/^\/?$/, () => VIEWS.dash()], [/^\/buat$/, () => VIEWS.create()], [/^\/proses$/, () => VIEWS.process()],
    [/^\/naskah\/([^/]+)(?:\/(kunci|analisis))?$/, (m) => VIEWS.doc(m[1], m[2] || 'naskah')], [/^\/edit\/([^/]+)$/, (m) => VIEWS.edit(m[1])],
    [/^\/ujian\/([^/]+)$/, (m) => VIEWS.exam(m[1])], [/^\/hasil\/([^/]+)$/, (m) => VIEWS.result(m[1])],
    [/^\/riwayat$/, () => VIEWS.history()], [/^\/pengaturan$/, () => VIEWS.settings()], [/^\/s\/(.+)$/, (m) => VIEWS.studentLink(m[1])],
  ];
  if (APP.mode === 'siswa' && !/^\/(ujian|hasil|s)\//.test(h)) { location.replace('#/ujian/' + APP.student.id); return; }
  for (const [re, fn] of R) {
    const m = re.exec(h);
    if (m) { renderTopbar(h); const c = fn(m); if (typeof c === 'function') APP.cleanup = c; window.scrollTo(0, 0); return; }
  }
  renderTopbar('/'); VIEWS.dash();
}

      if (!list.length) throw new Error('File tidak berisi paket TKA GURU.');

      route();

};

const elapsedTxt = (t0) => { const s = Math.round((Date.now() - t0) / 1000); return s < 60 ? `${s} detik` : `${Math.floor(s / 60)} menit ${s % 60} detik`; };
function renderProc() {
  const P = APP.proc;
  if (!P || !$('#view') || !/^#\/proses/.test(location.hash)) return;
  const done = P.state === 'done', err = P.state === 'error';
  setView(`<div class="wrap"><div class="proc">

      ${P.state === 'run' && P.engine === 'ai' ? `<button class="btn btn-danger" data-act="proc:cancel">${ic('x')}Batalkan</button>` : ''}</div>

      const nd = t.steps.filter((s) => s.state === 'done').length;
      return `<section class="proc-card"><h2>${t.subject ? subjChip(t) : ''}<span>${esc(t.label)}</span></h2>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((nd / 7) * 100)}"><i style="width:${Math.round(((nd + (t.sub || 0)) / 7) * 100)}%"></i></div>
        <ol class="steps">${ENGINE.STEPS.map((name, si) => { const s = t.steps[si] || { state: 'wait' }; return `<li class="step ${s.state}"><div class="dot">${s.state === 'done' ? ic('check') : s.state === 'err' ? '!' : si + 1}</div><div><div class="st-t">${name}</div>${s.detail ? `<div class="st-d">${esc(s.detail)}</div>` : ''}</div></li>`; }).join('')}</ol>
        ${t.pkgId ? `<div class="row" style="margin-top:14px"><a class="btn btn-primary" href="#/naskah/${t.pkgId}">${ic('eye')}Lihat naskah</a><a class="btn" href="#/ujian/${t.pkgId}">${ic('play')}Mode ujian</a><a class="btn" href="#/edit/${t.pkgId}">${ic('edit')}Edit</a></div>` : ''}
        ${t.error ? `<div class="callout warn" style="margin-top:12px">${esc(t.error)}</div>` : ''}</section>`;
    }).join('') : `<section class="proc-card"><ol class="steps"><li class="step run"><div class="dot">1</div><div><div class="st-t">Menganalisis kisi-kisi</div><div class="st-d">Menyiapkan…</div></div></li></ol></section>`}
    ${err ? `<div class="callout warn"><b>Penyebab:</b> ${esc(P.error || 'Tidak diketahui')}</div><div class="row" style="margin-top:14px"><a class="btn" href="#/buat">${ic('left')}Kembali ke kisi-kisi</a>${P.engine === 'ai' ? `<button class="btn btn-primary" data-act="proc:local">Gunakan generator lokal</button><button class="btn" data-act="proc:retry">${ic('refresh')}Coba lagi dengan AI</button>` : ''}</div>` : ''}
    ${done ? `<div class="row"><a class="btn" href="#/">${ic('home')}Ke beranda</a><a class="btn" href="#/buat">${ic('plus')}Buat naskah lain</a></div>` : ''}
  </div></div>`);
}
async function runProc(P) {
  P.state = 'run';
  const minStep = 260;
  try {
    if (P.engine === 'ai') {
      P.ctrl = new AbortController();
      const pkgs = await AI.run(P.text, P.opts, {
        tracks: (list) => { P.tracks = list.map((x) => ({ label: x.label, subject: x.subject, subjectName: x.subjectName, steps: [] })); renderProc(); },
        step: (ti, si, state, detail) => { const t = P.tracks[ti]; if (!t) return; t.steps[si] = { state, detail }; if (state === 'done') t.sub = 0; renderProc(); },
        sub: (ti, frac) => { const t = P.tracks[ti]; if (t) { t.sub = frac; renderProc(); } },
      }, P.ctrl.signal);
      pkgs.forEach((pkg, i) => { STORE.savePkg(pkg); P.tracks[i].pkgId = pkg.id; });
    } else {
      let analyses, avoid = null;
      if (P.variant) {
        const src = STORE.getPkg(P.variant);
        if (!src) throw new Error('Naskah sumber variasi tidak ditemukan.');
        let a = src.aiCodes ? (src.kisi ? ENGINE.analyze(src.kisi).analyses.find((x) => x.subject === src.subject) : null) : pkgAnalysis(src);
        if (!a || !a.codes.length) throw new Error('Kompetensi naskah ini tidak dikenali generator lokal. Gunakan AI Gemini untuk membuat variasinya.');
        a = Object.assign({}, a, { lines: a.lines || [], notes: [] });
        analyses = [a];
        avoid = {
          tpls: src.groups.map((g) => g.gen && g.gen.tpl).filter(Boolean),
          stimuli: src.groups.map((g) => g.gen && g.gen.bank).filter(Boolean),
          qs: src.groups.flatMap((g) => g.questions.map((q) => (q.gen && q.gen.bank ? q.gen.bank + ':' + q.gen.q : null))).filter(Boolean),
          makers: src.groups.flatMap((g) => g.questions.map((q) => (q.gen && q.gen.tpl ? q.gen.tpl + ':' + q.gen.maker : null))).filter(Boolean),
          titles: src.groups.map((g) => g.stimulus && g.stimulus.title).filter(Boolean),
        };
        P.text = src.kisi || P.text;
      } else analyses = ENGINE.analyze(P.text).analyses;
      if (!analyses.length) throw new Error('Kisi-kisi tidak dikenali oleh generator lokal.');
      P.tracks = analyses.map((a) => ({ label: `Paket ${a.subjectName} — ${a.jenjang.label}`, subject: a.subject, subjectName: a.subjectName, steps: [] }));
      renderProc();
      for (let i = 0; i < analyses.length; i++) {
        const a = analyses[i];
        const t = P.tracks[i];
        const pkg = await ENGINE.runLocal(a, { count: P.opts.count || 0, durasi: P.opts.durasi || 0, avoid, title: P.opts.title ? (analyses.length > 1 ? `${P.opts.title} — ${a.subjectName}` : P.opts.title) : '', kisi: P.text }, async (si, state, detail) => {
          t.steps[si] = { state, detail };
          renderProc();
          await U.sleep(state === 'run' ? 90 : minStep);
        });
        pkg.scoring = STORE.settings().scoring || 'parsial';
        STORE.savePkg(pkg);
        t.pkgId = pkg.id;
        renderProc();
      }
    }
    P.state = 'done';
    renderProc();
    toast(P.tracks.length > 1 ? `${P.tracks.length} naskah selesai disusun.` : 'Naskah selesai disusun.', 'ok');
  } catch (e) {
    P.state = 'error';
    P.error = e.name === 'AbortError' ? 'Proses dibatalkan.' : (e.quota ? e.message : e.message || String(e));
    P.tracks.forEach((t) => { const k = t.steps.findIndex((s) => s && s.state === 'run'); if (k >= 0) t.steps[k] = { state: 'err', detail: P.error }; });
    renderProc();
  }
}
ACT['proc:cancel'] = () => { if (APP.proc && APP.proc.ctrl) APP.proc.ctrl.abort(); };
ACT['proc:local'] = () => { const P = APP.proc; APP.proc = { text: P.text, engine: 'lokal', opts: P.opts, tracks: [], state: 'idle', started: Date.now() }; VIEWS.process(); };
ACT['proc:retry'] = () => { const P = APP.proc; APP.proc = { text: P.text, engine: 'ai', opts: P.opts, tracks: [], state: 'idle', started: Date.now() }; VIEWS.process(); };

/* ==========================================================================
   83_ui_doc.js — Pratinjau naskah (mode naskah A4), kunci & pembahasan,
   kisi-kisi & validasi, cetak, unduh kunci, bagikan, variasi paket.

function pkgAnalysis(p) {
  if (p.kisi) {
    const r = ENGINE.analyze(p.kisi);
    const a = r.analyses.find((x) => x.subject === p.subject);
    if (a && !p.aiCodes) return a;
  }
  const codes = (p.analysis && p.analysis.codes) || [];
  return { subject: p.subject, subjectName: p.subjectName, jenjang: TAX.detectJenjang(p.jenjang || ''), codes: codes.map((c) => Object.assign({ weight: 1 }, c)), lines: [], notes: [], unknown: [] };
}
function kopHTML(p, sub) {
  const s = STORE.settings();
  return `<header class="kop"><div class="s1">${esc(s.school || 'LATIHAN TES KEMAMPUAN AKADEMIK (TKA)')}</div><div class="s2">${esc(p.title)}</div><div class="s3">${esc(sub || `${p.subjectName} • ${p.jenjang}`)}${s.year ? ' • Tahun Pelajaran ' + esc(s.year) : ''}</div></header>`;
}
function groupIntro(p, g, a, b) {
  const nums = a === b ? `nomor ${a}` : `nomor ${a}–${b}`;
  const st = g.stimulus || {};
  const k = String(st.kind || '');
  let verb;
  if (p.subject === 'bi') verb = /infografis/i.test(k) ? 'Perhatikan infografis berikut' : st.poem ? 'Bacalah puisi berikut' : /diagram/i.test(k) ? 'Bacalah teks dan diagram berikut' : /tabel/i.test(k) ? (/pengumuman/i.test(k) ? 'Bacalah pengumuman dan tabel berikut' : 'Bacalah teks dan tabel berikut') : /pengumuman/i.test(k) ? 'Bacalah pengumuman berikut' : /surat/i.test(k) ? 'Bacalah surat berikut' : 'Bacalah teks berikut';
  else if (/piktogram/i.test(k)) verb = 'Perhatikan piktogram berikut';
  else if (/diagram/i.test(k)) verb = 'Perhatikan diagram berikut';
  else if (/ilustrasi|gambar|denah/i.test(k)) verb = 'Perhatikan gambar berikut';
  else if (/tabel|daftar|jadwal/i.test(k)) verb = 'Perhatikan tabel berikut';
  else verb = 'Bacalah informasi berikut';
  return `${verb} untuk menjawab soal ${nums}.`;
}
function docNaskahHTML(p) {
  const F = ENGINE.flat(p);
  const types = new Set(F.map((x) => x.q.type));
  const pet = ['Tulislah nama, kelas, dan nomor absen pada tempat yang tersedia.', 'Bacalah setiap stimulus dengan cermat sebelum menjawab soal yang berkaitan dengannya.'];
  if (types.has('pg')) pet.push('Pilihan ganda: berilah tanda silang (X) pada satu huruf jawaban yang paling tepat.');
  if (types.has('pgk')) pet.push('Pilihan ganda kompleks: jawaban benar lebih dari satu; berilah tanda centang (✓) pada semua jawaban yang benar.');

function slimPkg(p) {
  const c = U.clone(p);
  delete c.kisi; if (c.validation) c.validation = { summary: c.validation.summary, at: c.validation.at, checks: [] };
  if (c.analysis) c.analysis = { codes: c.analysis.codes };
  return c;
}
const b64url = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64url = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
async function encodePkg(p) {
  if (p.builtin && !p.modified) return 'b' + p.builtin;
  const json = JSON.stringify(slimPkg(p));
  if (window.CompressionStream) {
    const cs = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 'z' + b64url(new Uint8Array(await new Response(cs).arrayBuffer()));
  }
  return 'j' + b64url(new TextEncoder().encode(json));
}
async function decodePkg(s) {
  const k = s[0], body = s.slice(1);
  if (k === 'b') return BOOT.demoPkg(body);
  let json;
  if (k === 'z') {
    if (!window.DecompressionStream) throw new Error('Browser ini belum mendukung tautan terkompresi. Gunakan browser Chrome, Edge, Firefox, atau Safari versi terbaru.');
    const ds = new Blob([unb64url(body)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    json = await new Response(ds).text();
  } else if (k === 'j') json = new TextDecoder().decode(unb64url(body));
  else throw new Error('Format tautan tidak dikenali.');
  return cleanPackage(JSON.parse(json));
}
function studentFileHTML(p) {
  const boot = `<script>window.__TKA_BOOT__=${JSON.stringify({ mode: 'siswa', pkg: slimPkg(p) }).replace(/</g, '\\u003c')};<\/script>`;
  return PRISTINE.replace('</head>', boot + '\n</head>');
}

function setPath(o, path, val) { const ks = path.split('.'); for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function markEdited(path) {
  const m = /^groups\.(\d+)\.(questions\.(\d+)|stimulus)/.exec(path);
  if (!m) return;
  const g = ED.pkg.groups[+m[1]];
  if (m[3] != null) { if (!/\.explain$|\.indikator$|\.level$/.test(path)) g.questions[+m[3]].edited = true; } else if (/\.text$|\.visuals/.test(path)) g.questions.forEach((q) => { q.edited = true; });
}

// Bila guru menekan Ctrl+P / menu Cetak browser (bukan tombol Cetak), siapkan
// dokumen cetak sesuai halaman yang sedang dibuka agar hasil cetak tidak kosong.
window.addEventListener('beforeprint', () => {
  const root = $('#print-root');
  if (!root || root.innerHTML.trim()) return;
  const h = decodeURI(location.hash);
  let m;
  try {
    if ((m = /^#\/naskah\/([^/]+)(?:\/(kunci|analisis))?$/.exec(h)) && STORE.getPkg(m[1])) {
      const [html, header] = docPrintParts(STORE.getPkg(m[1]), m[2] || 'naskah'); preparePrint(html, header);
    } else if ((m = /^#\/hasil\/([^/]+)$/.exec(h)) && STORE.getResult(m[1])) {
      const [html, header] = resultPrintParts(STORE.getResult(m[1])); preparePrint(html, header);
    } else preparePrint(`<div class="print-view">${$('#view').innerHTML}</div>`, document.title);
  } catch (e) { /* biarkan browser mencetak apa adanya */ }
});

};

ACT['set:save'] = () => {
