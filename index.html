/* ---------------------------------------------------------------------------
   GEOMETRI 1 — Sifat-sifat bangun datar
--------------------------------------------------------------------------- */
(() => {
  const { pg, pgk, tab, svgV, GE } = MATH;
  const SHP = {
    persegi: { name: 'persegi', sides: 4, par: 2, allEq: true, right: 4, sym: 4, desc: ['memiliki 4 sisi yang sama panjang', 'memiliki 4 sudut siku-siku', 'memiliki 4 sumbu simetri'], conf: ['ppanjang', 'belah', 'layang'] },
    ppanjang: { name: 'persegi panjang', sides: 4, par: 2, allEq: false, right: 4, sym: 2, desc: ['memiliki 2 pasang sisi sejajar', 'sisi yang berhadapan sama panjang, tetapi tidak semua sisinya sama panjang', 'memiliki 4 sudut siku-siku'], conf: ['persegi', 'jajar', 'trap_siku'] },
    jajar: { name: 'jajargenjang', sides: 4, par: 2, allEq: false, right: 0, sym: 0, desc: ['memiliki 2 pasang sisi sejajar', 'sisi yang berhadapan sama panjang', 'tidak memiliki sudut siku-siku', 'tidak memiliki sumbu simetri'], conf: ['ppanjang', 'belah', 'trap_kaki'] },
    belah: { name: 'belah ketupat', sides: 4, par: 2, allEq: true, right: 0, sym: 2, desc: ['memiliki 4 sisi yang sama panjang', 'tidak memiliki sudut siku-siku', 'memiliki 2 sumbu simetri'], conf: ['persegi', 'layang', 'jajar'] },
    trap_siku: { name: 'trapesium siku-siku', sides: 4, par: 1, allEq: false, right: 2, sym: 0, desc: ['memiliki tepat satu pasang sisi sejajar', 'memiliki 2 sudut siku-siku'], conf: ['trap_kaki', 'ppanjang', 'jajar'] },
    trap_kaki: { name: 'trapesium sama kaki', sides: 4, par: 1, allEq: false, right: 0, sym: 1, desc: ['memiliki tepat satu pasang sisi sejajar', 'dua sisi yang tidak sejajar sama panjang', 'memiliki 1 sumbu simetri'], conf: ['trap_siku', 'jajar', 'layang'] },
    layang: { name: 'layang-layang', sides: 4, par: 0, allEq: false, right: 0, sym: 1, desc: ['memiliki 2 pasang sisi berdekatan yang sama panjang', 'tidak memiliki sisi yang sejajar', 'memiliki 1 sumbu simetri'], conf: ['belah', 'trap_kaki', 'persegi'] },
    seg_sk: { name: 'segitiga sama kaki', sides: 3, par: 0, allEq: false, right: 0, sym: 1, desc: ['memiliki 3 sisi', 'tepat dua sisinya sama panjang', 'memiliki 1 sumbu simetri'], conf: ['seg_ss', 'seg_siku', '*segitiga sembarang'] },
    seg_ss: { name: 'segitiga sama sisi', sides: 3, par: 0, allEq: true, right: 0, sym: 3, desc: ['memiliki 3 sisi yang sama panjang', 'setiap sudutnya berukuran 60°', 'memiliki 3 sumbu simetri'], conf: ['seg_sk', 'seg_siku', '*segitiga sembarang'] },
    seg_siku: { name: 'segitiga siku-siku', sides: 3, par: 0, allEq: false, right: 1, sym: 0, desc: ['memiliki 3 sisi', 'salah satu sudutnya siku-siku', 'ketiga sisinya berbeda panjang'], conf: ['seg_sk', 'seg_ss', '*segitiga sembarang'] },
    segi5: { name: 'segi lima beraturan', sides: 5, par: 0, allEq: true, right: 0, sym: 5, desc: ['memiliki 5 sisi yang sama panjang', 'memiliki 5 sumbu simetri'], conf: ['segi6', 'persegi', 'seg_ss'] },
    segi6: { name: 'segi enam beraturan', sides: 6, par: 3, allEq: true, right: 0, sym: 6, desc: ['memiliki 6 sisi yang sama panjang', 'memiliki 3 pasang sisi sejajar'], conf: ['segi5', 'ppanjang', '*segi delapan beraturan'] },
  };
  const KEYS = Object.keys(SHP);
  const LAB = ['P', 'Q', 'R', 'S', 'T', 'U'];
  const nm = (k) => (k[0] === '*' ? k.slice(1) : SHP[k].name);
  MATH.T.push({
    id: 'shapes2d', name: 'Sifat bangun datar', codes: ['GEO-1'],
    params(r) {
      for (let g = 0; g < 200; g++) {
        const pick = r.sample(KEYS, 6);
        const two = pick.filter((k) => SHP[k].par === 2).length;
        if (two < 2 || two > 3) continue;
        if (!pick.some((k) => SHP[k].sym === 0) || !pick.some((k) => SHP[k].sym > 0)) continue;
        return { shapes: pick, target: r.pick(KEYS) };
      }
      throw new GE('param shapes');
    },
    stimulus(p) {
      return {
        title: 'Bangun-Bangun Datar', kind: 'Ilustrasi bangun datar',
        text: 'Perhatikan bangun-bangun datar berikut. Garis kecil yang sama pada sisi menunjukkan sisi-sisi yang sama panjang, sedangkan tanda siku menunjukkan sudut siku-siku.',
        visuals: [svgV(SVG.shapeCells(p.shapes.map((k, i) => ({ shape: k, label: LAB[i] })), { perRow: 3, label: 'Bangun datar P sampai U' }))],
      };
    },
    qs: [
      { id: 'kenali', code: 'GEO-1', level: 'Pemahaman', ind: 'Mengidentifikasi bangun datar berdasarkan gambar',
        make(p, r) {
          const i = r.int(0, 5);
          const others = r.sample([0, 1, 2, 3, 4, 5].filter((j) => j !== i), 3);
          return pg(r, {
            text: `Bangun yang berbentuk ${SHP[p.shapes[i]].name} ditunjukkan oleh huruf ....`,
            correct: LAB[i], wrong: others.map((j) => LAB[j]), order: 'text',
            explain: `Bangun ${LAB[i]} ${SHP[p.shapes[i]].desc.join(', ')}. Ciri-ciri tersebut adalah ciri ${SHP[p.shapes[i]].name}.\nJadi, jawabannya **${LAB[i]}**.`,
          });
        } },
      { id: 'sejajar', code: 'GEO-1', level: 'Penerapan', ind: 'Mengelompokkan bangun datar berdasarkan sisi-sisi yang sejajar',
        make(p, r) {
          const correct = [], wrong = [];
          p.shapes.forEach((k, i) => (SHP[k].par === 2 ? correct : wrong).push(LAB[i]));
          return pgk(r, {
            text: 'Bangun yang memiliki tepat dua pasang sisi sejajar adalah ....',
            correct, wrong, order: 'text',
            explain: p.shapes.map((k, i) => `${LAB[i]} (${SHP[k].name}): ${SHP[k].par === 0 ? 'tidak ada sisi sejajar' : SHP[k].par === 1 ? 'satu pasang sisi sejajar' : SHP[k].par + ' pasang sisi sejajar'}`).join('\n') + `\nJadi, bangun dengan tepat dua pasang sisi sejajar adalah **${correct.join(', ')}**.`,
          });
        } },
      { id: 'sifat', code: 'GEO-1', level: 'Penalaran', ind: 'Menganalisis sifat-sifat bangun datar', type: 'bs',
        make(p, r) {
          const idx = r.sample([0, 1, 2, 3, 4, 5], 4);
          const gens = [
            (k, L) => { const s = SHP[k]; const tr = r.chance(0.5); const v = tr ? s.sym : (s.sym === 0 ? 1 : s.sym === 1 ? 2 : s.sym - 1); return { text: `Bangun ${L} memiliki ${v === 0 ? 'tidak ada' : v} sumbu simetri.`.replace('memiliki tidak ada', 'tidak memiliki'), ans: v === s.sym ? 0 : 1, why: `${s.name} memiliki ${s.sym} sumbu simetri` }; },
            (k, L) => { const s = SHP[k]; return { text: `Semua sisi bangun ${L} sama panjang.`, ans: s.allEq ? 0 : 1, why: `${s.name} ${s.allEq ? 'memiliki sisi yang semuanya sama panjang' : 'tidak semua sisinya sama panjang'}` }; },
            (k, L) => { const s = SHP[k]; return { text: `Bangun ${L} memiliki sudut siku-siku.`, ans: s.right > 0 ? 0 : 1, why: `${s.name} ${s.right > 0 ? 'memiliki ' + s.right + ' sudut siku-siku' : 'tidak memiliki sudut siku-siku'}` }; },
            (k, L) => { const s = SHP[k]; return { text: `Bangun ${L} memiliki tepat satu pasang sisi sejajar.`, ans: s.par === 1 ? 0 : 1, why: `${s.name} ${s.par === 0 ? 'tidak memiliki sisi sejajar' : 'memiliki ' + s.par + ' pasang sisi sejajar'}` }; },
          ];
          const items = idx.map((i, n) => gens[n](p.shapes[i], LAB[i]));
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut berdasarkan gambar!', items });
        } },
      { id: 'ciri', code: 'GEO-1', level: 'Penalaran', ind: 'Menentukan bangun datar berdasarkan ciri-cirinya',
        make(p, r) {
          const s = SHP[p.target];
          return pg(r, {
            text: `Sebuah bangun datar memiliki ciri-ciri berikut.\n${s.desc.map((d) => '- ' + U.cap(d) + '.').join('\n')}\n\nBangun datar tersebut adalah ....`,
            correct: s.name, wrong: s.conf.map(nm), order: 'shuffle',
            explain: `Bangun yang ${s.desc.join(', ')} adalah **${s.name}**.\n${s.conf.filter((k) => k[0] !== '*').map((k) => `${U.cap(SHP[k].name)} tidak sesuai karena ${SHP[k].desc[0]}`).join('. ')}.`,
          });
        } },
      { id: 'simetri', code: 'GEO-1', level: 'Pemahaman', ind: 'Mengelompokkan bangun datar berdasarkan sumbu simetri', type: 'kat',
        make(p, r) {
          const idx = r.sample([0, 1, 2, 3, 4, 5], 4);
          const items = idx.map((i) => ({ text: `Bangun ${LAB[i]}`, ans: SHP[p.shapes[i]].sym > 0 ? 0 : 1, why: `${SHP[p.shapes[i]].name}: ${SHP[p.shapes[i]].sym} sumbu simetri` }));
          return tab(r, { type: 'kat', labels: ['Memiliki sumbu simetri', 'Tidak memiliki sumbu simetri'], text: 'Kelompokkan bangun berikut berdasarkan ada atau tidaknya sumbu simetri!', items });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   GEOMETRI 2 — Susunan kubus: tampak depan, samping, banyak kubus, volume
--------------------------------------------------------------------------- */
(() => {
  const { pg, wrongs, GE } = MATH;
  const J = JSON.stringify;
  MATH.T.push({
    id: 'cubes3d', name: 'Susunan kubus dan tampak', codes: ['GEO-2', 'UKR-7'],
    params(r) {
      for (let g = 0; g < 500; g++) {
        const R = r.pick([2, 3]), C = r.pick([3, 4]);
        const H = Array.from({ length: R }, () => Array.from({ length: C }, () => r.pick([0, 1, 1, 2, 2, 3])));
        const total = H.flat().reduce((a, b) => a + b, 0);
        if (total < 7 || total > 16) continue;
        if (H.some((row) => row.every((v) => v === 0))) continue;
        if ([...Array(C).keys()].some((c) => H.every((row) => row[c] === 0))) continue;
        const F = [...Array(C).keys()].map((c) => Math.max(...H.map((row) => row[c])));
        const S = [...Array(R).keys()].map((i) => Math.max(...H[R - 1 - i]));
        if (Math.max(...F) < 2) continue;
        if (J(F) === J(F.slice().reverse()) || J(S) === J(S.slice().reverse())) continue;
        return { H, R, C, F, S, total, s: r.pick([2, 3, 4, 5]) };
      }
      throw new GE('param kubus');
    },
    stimulus(p) {
      return {
        title: 'Susunan Kubus Satuan', kind: 'Ilustrasi bangun ruang',
        text: 'Gambar 1 menunjukkan bangun yang disusun dari kubus-kubus satuan yang sama besar. Gambar 2 adalah denah tampak atas bangun tersebut. Angka pada setiap kotak menunjukkan banyak kubus yang bertumpuk di kotak itu. Tidak ada kubus yang melayang.',
        visuals: [
          { type: 'svg', caption: 'Gambar 1', svg: SVG.cubes(p.H, { s: 30 }) },
          { type: 'svg', caption: 'Gambar 2 (tampak atas)', svg: SVG.topGrid(p.H, { s: 32 }) },
        ],
      };
    },
    qs: [
      { id: 'depan', code: 'GEO-2', level: 'Penerapan', ind: 'Menentukan tampak depan susunan kubus',
        make(p, r) {
          const cands = [p.F.slice().reverse(), p.S, p.F.map((v, i) => (i === 0 ? v + 1 : v)), p.F.map((v, i) => (i === p.C - 1 && v > 1 ? v - 1 : v)), [...Array(p.C).keys()].map((c) => p.H.reduce((s, row) => s + row[c], 0)), p.F.map((v) => Math.max(1, v - 1))];
          const seen = new Set([J(p.F)]); const wr = [];
          cands.forEach((a) => { if (!seen.has(J(a)) && a.every((v) => v >= 1) && wr.length < 3) { seen.add(J(a)); wr.push(a); } });
          if (wr.length < 3) throw new GE('pengecoh');
          const mh = Math.max(...[p.F, ...wr].flat());
          const o = (a) => ({ svg: SVG.view2D(a, { s: 18, maxH: mh, label: 'Pilihan tampak' }), alt: J(a) });
          return pg(r, {
            text: 'Tampak depan bangun pada Gambar 1 adalah ....',
            correct: o(p.F), wrong: wr.map(o), order: 'shuffle', layout: 'grid',
            explain: `Dilihat dari depan, tinggi yang terlihat pada setiap kolom (dari kiri ke kanan) adalah tumpukan tertinggi pada kolom tersebut: ${p.F.join(', ')} kubus.\nJadi, tampak depan yang benar memiliki tinggi kolom **${p.F.join(', ')}**.`,
          });
        } },
      { id: 'samping', code: 'GEO-2', level: 'Penalaran', ind: 'Menentukan tampak samping kanan susunan kubus',
        make(p, r) {
          const cands = [p.S.slice().reverse(), p.F, p.S.map((v, i) => (i === 0 ? v + 1 : v)), p.S.map((v) => Math.max(1, v - 1)), p.S.map((v, i) => (i === p.R - 1 ? v + 1 : v))];
          const seen = new Set([J(p.S)]); const wr = [];
          cands.forEach((a) => { if (!seen.has(J(a)) && a.every((v) => v >= 1) && wr.length < 3) { seen.add(J(a)); wr.push(a); } });
          if (wr.length < 3) throw new GE('pengecoh');
          const mh = Math.max(...[p.S, ...wr].flat());
          const o = (a) => ({ svg: SVG.view2D(a, { s: 18, maxH: mh, label: 'Pilihan tampak' }), alt: J(a) });
          return pg(r, {
            text: 'Tampak samping kanan bangun pada Gambar 1 adalah ....',
            correct: o(p.S), wrong: wr.map(o), order: 'shuffle', layout: 'grid',
            explain: `Dilihat dari sisi kanan, bagian depan bangun berada di sebelah kiri gambar. Tinggi setiap baris dari depan ke belakang adalah tumpukan tertinggi pada baris itu: ${p.S.join(', ')} kubus.\nJadi, tampak samping kanan memiliki tinggi **${p.S.join(', ')}** (dari kiri ke kanan).`,
          });
        } },
      { id: 'banyak', code: 'GEO-2', level: 'Pemahaman', ind: 'Menentukan banyak kubus satuan penyusun bangun',
        make(p, r) {
          const f = (v) => `${v} kubus`;
          const cells = p.H.flat().filter((v) => v > 0).length;
          return pg(r, {
            text: 'Banyak kubus satuan yang menyusun bangun tersebut adalah ....',
            correct: f(p.total), wrong: wrongs(r, p.total, [p.F.reduce((a, b) => a + b, 0), cells, p.total - 2, p.total + 2, p.S.reduce((a, b) => a + b, 0)], { fmt: f, min: 1, int: true }),
            explain: `Jumlahkan semua angka pada denah tampak atas: ${p.H.flat().filter((v) => v > 0).join(' + ')} = ${p.total}.\nJadi, bangun tersusun atas **${p.total} kubus**.`,
          });
        } },
      { id: 'volume', code: 'UKR-7', level: 'Penerapan', ind: 'Menghitung volume bangun gabungan dari kubus satuan',
        make(p, r) {
          const v = p.total * p.s ** 3;
          const f = (x) => `${U.fmt(x)} cm³`;
          return pg(r, {
            text: `Jika panjang rusuk setiap kubus satuan ${p.s} cm, volume bangun tersebut adalah ....`,
            correct: f(v), wrong: wrongs(r, v, [p.total * p.s ** 2, p.total * p.s * 3, (p.total + 1) * p.s ** 3, (p.total - 1) * p.s ** 3], { fmt: f, min: 1, int: true }),
            explain: `Volume 1 kubus = ${p.s} × ${p.s} × ${p.s} = ${p.s ** 3} cm³.\nVolume bangun = ${p.total} × ${p.s ** 3} = ${U.fmt(v)} cm³.\nJadi, jawabannya **${U.fmt(v)} cm³**.`,
          });
        } },
      { id: 'tambah', code: 'GEO-2', level: 'Penalaran', ind: 'Menentukan banyak kubus tambahan untuk membentuk balok', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const mh = Math.max(...p.F), full = p.C * p.R * mh, need = full - p.total;
          const f = (v) => `${v} kubus`;
          return pg(r, {
            text: `Paling sedikit berapa kubus satuan lagi yang harus ditambahkan agar bangun tersebut menjadi balok berukuran ${p.C} × ${p.R} × ${mh} kubus?`,
            correct: f(need), wrong: wrongs(r, need, [full, p.C * p.R - p.H.flat().filter((v) => v > 0).length, need + 1, need - 1, full - p.F.reduce((a, b) => a + b, 0)], { fmt: f, min: 1, int: true }),
            explain: `Balok ${p.C} × ${p.R} × ${mh} memuat ${p.C} × ${p.R} × ${mh} = ${full} kubus.\nKubus yang sudah ada = ${p.total}.\nKubus yang perlu ditambahkan = ${full} − ${p.total} = ${need}.\nJadi, jawabannya **${need} kubus**.`,
          });

})();

/* ---------------------------------------------------------------------------
   GEOMETRI 3 — Jaring-jaring kubus (dihitung dengan simulasi menggelinding)
--------------------------------------------------------------------------- */
(() => {
  const { pg, pgk, tab, GE } = MATH;
  let NETS = null;
  const key = (cells) => cells.map((c) => c.join(',')).join(';');
  const normalize = (cells) => {
    const mx = Math.min(...cells.map((c) => c[0])), my = Math.min(...cells.map((c) => c[1]));
    return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  };
  const TF = [([x, y]) => [x, y], ([x, y]) => [-x, y], ([x, y]) => [x, -y], ([x, y]) => [-x, -y], ([x, y]) => [y, x], ([x, y]) => [-y, x], ([x, y]) => [y, -x], ([x, y]) => [-y, -x]];
  function fold(cells) {
    const idx = new Map(cells.map((c, i) => [c.join(','), i]));
    const face = new Array(cells.length).fill(null);
    face[0] = 0;
    const st = [[0, { b: 0, t: 1, n: 2, s: 3, e: 4, w: 5 }]];
    let ok = true;
    const MV = [
      [1, 0, (o) => ({ b: o.e, e: o.t, t: o.w, w: o.b, n: o.n, s: o.s })],
      [-1, 0, (o) => ({ b: o.w, w: o.t, t: o.e, e: o.b, n: o.n, s: o.s })],
      [0, -1, (o) => ({ b: o.n, n: o.t, t: o.s, s: o.b, e: o.e, w: o.w })],
      [0, 1, (o) => ({ b: o.s, s: o.t, t: o.n, n: o.b, e: o.e, w: o.w })],
    ];
    while (st.length) {
      const [i, o] = st.pop();
      const [x, y] = cells[i];
      MV.forEach(([dx, dy, f]) => {
        const j = idx.get(x + dx + ',' + (y + dy));
        if (j == null) return;
        const no = f(o);
        if (face[j] == null) { face[j] = no.b; st.push([j, no]); } else if (face[j] !== no.b) ok = false;
      });
    }
    if (!ok || new Set(face).size !== 6) return null;
    return face;
  }
  function nets() {
    if (NETS) return NETS;
    let cur = new Map([['0,0', [[0, 0]]]]);
    for (let n = 1; n < 6; n++) {
      const nx = new Map();
      cur.forEach((cells) => cells.forEach(([x, y]) => [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
        const c = [x + dx, y + dy];
        if (cells.some((q) => q[0] === c[0] && q[1] === c[1])) return;
        const ns = normalize([...cells, c]);
        nx.set(key(ns), ns);
      })));
      cur = nx;
    }
    const canon = (cells) => TF.map((t) => key(normalize(cells.map(t)))).sort()[0];
    const free = new Map();
    cur.forEach((c) => { const k = canon(c); if (!free.has(k)) free.set(k, c); });
    const valid = [], invalid = [];
    free.forEach((c) => {
      const w = Math.max(...c.map((q) => q[0])) + 1, h = Math.max(...c.map((q) => q[1])) + 1;
      if (fold(c)) valid.push(c); else if (Math.max(w, h) <= 5) invalid.push(c);
    });
    NETS = { valid, invalid };
    return NETS;
  }
  const orient = (r, cells) => normalize(cells.map(r.pick(TF)));
  const OPP = (a, b) => (a >> 1) === (b >> 1) && a !== b;
  const LAB = ['P', 'Q', 'R', 'S', 'T'];
  MATH.T.push({
    id: 'cube_nets', name: 'Jaring-jaring kubus', codes: ['GEO-2'],
    nets, fold,
    params(r) {
      const N = nets();
      const nv = r.pick([2, 3]);
      const shown = r.shuffle([...r.sample(N.valid, nv).map((c) => ({ c: orient(r, c), ok: true })), ...r.sample(N.invalid, 4 - nv).map((c) => ({ c: orient(r, c), ok: false }))]);
      const numNet = orient(r, r.pick(N.valid));
      const faces = fold(numNet);
      const nums = r.shuffle([1, 2, 3, 4, 5, 6]);
      const ask = r.int(0, 5);
      const opp = [0, 1, 2, 3, 4, 5].find((j) => OPP(faces[ask], faces[j]));
      return { shown, numNet, faces, nums, ask, opp };
    },
    stimulus(p) {
      const parts = p.shown.map((s, i) => SVG.net(s.c, { s: 22, label: LAB[i] }).svg);
      return {
        title: 'Rangkaian Enam Persegi', kind: 'Ilustrasi bangun ruang',
        text: 'Gambar 1 menunjukkan empat rangkaian yang masing-masing tersusun dari enam persegi yang sama besar. Gambar 2 adalah sebuah jaring-jaring kubus yang perseginya diberi nomor 1 sampai 6.',
        visuals: [
          { type: 'svg', caption: 'Gambar 1', svg: SVG.row(parts, { gap: 26, label: 'Rangkaian P, Q, R, S' }) },
          { type: 'svg', caption: 'Gambar 2', svg: SVG.net(p.numNet, { s: 34, nums: p.nums }).svg },
        ],
      };
    },
    qs: [
      { id: 'jaring', code: 'GEO-2', level: 'Penerapan', ind: 'Mengidentifikasi jaring-jaring kubus',
        make(p, r) {
          const correct = [], wrong = [];
          p.shown.forEach((s, i) => (s.ok ? correct : wrong).push(LAB[i]));
          return pgk(r, {
            text: 'Rangkaian pada Gambar 1 yang merupakan jaring-jaring kubus adalah ....',
            correct, wrong, order: 'text',
            explain: `Rangkaian ${correct.join(', ')} dapat dilipat menjadi kubus tertutup tanpa ada sisi yang bertumpuk. Rangkaian ${wrong.join(', ')} tidak dapat membentuk kubus karena ada persegi yang bertumpuk atau ada sisi kubus yang tidak tertutup saat dilipat.`,
          });
        } },
      { id: 'tutup', code: 'GEO-2', level: 'Penalaran', ind: 'Menentukan sisi yang berhadapan pada kubus dari jaring-jaringnya',
        make(p, r) {
          const a = p.nums[p.ask], b = p.nums[p.opp];
          const others = p.nums.filter((x) => x !== a && x !== b);
          const pairs = [];
          for (let i = 0; i < 6; i++) for (let j = i + 1; j < 6; j++) if (OPP(p.faces[i], p.faces[j])) pairs.push([p.nums[i], p.nums[j]]);
          return pg(r, {
            text: `Jaring-jaring pada Gambar 2 dilipat menjadi kubus. Jika persegi nomor ${a} menjadi alas, persegi yang menjadi tutup (sisi atas) adalah persegi nomor ....`,
            correct: String(b), wrong: r.sample(others, 3).map(String),
            explain: `Saat dilipat, pasangan persegi yang saling berhadapan adalah ${pairs.map((q) => q.join(' dan ')).join('; ')}.\nAlas dan tutup kubus saling berhadapan, sehingga tutupnya adalah persegi nomor **${b}**.`,
          });
        } },
      { id: 'hadap', code: 'GEO-2', level: 'Penalaran', ind: 'Menentukan pasangan sisi berhadapan pada kubus', type: 'bs',
        make(p, r) {
          const pairs = [], adj = [];
          for (let i = 0; i < 6; i++) for (let j = i + 1; j < 6; j++) {
            const pr = [p.nums[i], p.nums[j]].sort((x, y) => x - y);
            if (OPP(p.faces[i], p.faces[j])) { if (!(i === p.ask || j === p.ask)) pairs.push(pr); } else adj.push(pr);
          }
          const items = [...pairs.map((q) => ({ text: `Persegi nomor ${q[0]} berhadapan dengan persegi nomor ${q[1]}.`, ans: 0 })), ...r.sample(adj, 2).map((q) => ({ text: `Persegi nomor ${q[0]} berhadapan dengan persegi nomor ${q[1]}.`, ans: 1, why: 'keduanya bersebelahan setelah dilipat' }))];
          return tab(r, { type: 'bs', text: 'Jaring-jaring pada Gambar 2 dilipat menjadi kubus. Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
    ],
  });
})();

            explain: `${p.minyak} liter = ${p.minyak} × 1.000 ml = ${fmt(p.minyak * 1000)} ml.\nBanyak botol = ${fmt(p.minyak * 1000)} : ${p.botol} = ${n}.\nJadi, jawabannya **${n} botol**.`,
          });
        } },
      { id: 'cek', code: 'UKR-3', level: 'Pemahaman', ind: 'Menggunakan hubungan antarsatuan panjang, berat, dan volume', type: 'bs',
        make(p, r) {
          const m = p.kainCm / 100, kg = p.tepung / 1000;
          const items = [
            r.chance(0.5) ? { text: `${fmt(m)} m = ${p.kainCm} cm.`, ans: 0, why: `1 m = 100 cm` } : { text: `${fmt(m)} m = ${p.kainCm * 10} cm.`, ans: 1, why: `${fmt(m)} m = ${p.kainCm} cm` },
            r.chance(0.5) ? { text: `${fmt(p.gula)} g = ${fmt(p.gula / 1000)} kg.`, ans: 0, why: `1 kg = 1.000 g` } : { text: `${fmt(p.gula)} g = ${fmt(p.gula / 100)} kg.`, ans: 1, why: `${fmt(p.gula)} g = ${fmt(p.gula / 1000)} kg` },
            r.chance(0.5) ? { text: `${p.sirup} dl = ${p.sirup * 100} ml.`, ans: 0, why: `1 dl = 100 ml` } : { text: `${p.sirup} dl = ${p.sirup * 10} ml.`, ans: 1, why: `1 dl = 100 ml, jadi ${p.sirup} dl = ${p.sirup * 100} ml` },
            { text: `${p.mentega} hg = ${p.mentega * 100} g.`, ans: 0, why: `1 hg = 100 g` },
            { text: `${fmt(kg)} kg = ${fmt(kg * 100)} hg.`, ans: 1, why: `1 kg = 10 hg, jadi ${fmt(kg)} kg = ${fmt(kg * 10)} hg` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items, take: 4 });
        } },
      { id: 'banding', code: 'UKR-2', level: 'Penalaran', ind: 'Membandingkan volume dengan satuan yang berbeda', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const minyakMl = p.minyak * 1000, sirupMl = p.sirup * 100;
          const d = Math.abs(minyakMl - sirupMl); const f = (x) => `${fmt(x)} ml`;
          return pg(r, {
            text: 'Selisih volume minyak goreng dan sirup adalah ....',
            correct: f(d), wrong: wrongs(r, d, [Math.abs(p.minyak - p.sirup), Math.abs(minyakMl - p.sirup * 10), minyakMl + sirupMl, Math.abs(minyakMl - p.sirup)], { fmt: f, min: 1 }),
            explain: `Minyak goreng ${p.minyak} liter = ${fmt(minyakMl)} ml. Sirup ${p.sirup} dl = ${fmt(sirupMl)} ml.\nSelisih = ${fmt(Math.max(minyakMl, sirupMl))} − ${fmt(Math.min(minyakMl, sirupMl))} = ${fmt(d)} ml.\nJadi, jawabannya **${fmt(d)} ml**.`,
          });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   PENGUKURAN 2 — Perjalanan: kecepatan dan waktu
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, wrongs, people, GE } = MATH;
  const { clock: C, dur: D, fmt, Fr } = U;
  const CTX = [
    { mode: 'mobil', vs: [40, 50, 60, 70, 80], ts: [90, 120, 150, 180, 210], brk: [15, 20, 30], who: (n) => `Keluarga ${n}`, from: 'Kota Melati', to: 'Kota Kenanga', stop: 'beristirahat di rumah makan', dep: [6 * 60, 8 * 60] },
    { mode: 'sepeda', vs: [10, 12, 15, 16, 18], ts: [40, 45, 60, 75, 90], brk: [10, 15], who: (n) => n, from: 'rumahnya', to: 'Pantai Indah', stop: 'beristirahat di pos ronda', dep: [6 * 60, 7 * 60] },
    { mode: 'bus', vs: [45, 50, 60, 72], ts: [120, 150, 180, 200, 240], brk: [20, 30], who: (n) => `Rombongan siswa ${n}`, from: 'sekolah', to: 'kebun raya', stop: 'singgah di masjid', dep: [6 * 60, 8 * 60] },
  ];
  const durWrong = (t) => { const h = Math.floor(t / 60), m = t % 60; if (!m) return null; const dec = Math.round((m / 60) * 100); return `${h} jam ${dec} menit`; };
  MATH.T.push({
    id: 'travel', name: 'Kecepatan dan waktu tempuh', codes: ['UKR-5', 'UKR-4'],
    params(r) {
      for (let g = 0; g < 400; g++) {
        const c = r.pick(CTX);
        const v = r.pick(c.vs), t = r.pick(c.ts);
        if ((v * t) % 60) continue;
        const s = (v * t) / 60;
        const dep = c.dep[0] + 15 * r.int(0, (c.dep[1] - c.dep[0]) / 15);
        const brk = r.pick(c.brk);
        const t2s = [];
        for (let t2 = 15; t2 <= 2 * t; t2 += 5) if (t2 !== t && (s * 60) % t2 === 0 && Math.abs(t2 - t) >= 15) t2s.push(t2);
        if (!t2s.length) continue;
        const t2 = r.pick(t2s);
        const m1s = [10, 12, 15, 20, 30, 45].filter((m) => (v * m) % 60 === 0 && m < t);
        if (!m1s.length) continue;
        return { c, v, t, s, dep, brk, t2, v2: (s * 60) / t2, m1: r.pick(m1s), name: people(r, 1)[0] };
      }
      throw new GE('param travel');
    },
    stimulus(p) {
      const w = p.c.who(p.name);
      return {
        title: 'Perjalanan', kind: 'Masalah kontekstual',
        text: `${w} pergi dari ${p.c.from} ke ${p.c.to} naik ${p.c.mode}. Jarak yang ditempuh ${fmt(p.s)} km. ${w} berangkat pukul ${C(p.dep)} dengan kecepatan rata-rata ${p.v} km/jam. Di tengah perjalanan, mereka ${p.c.stop} selama ${p.brk} menit.`.replace('mereka beristirahat', p.c.mode === 'sepeda' ? 'ia beristirahat' : 'mereka beristirahat'),
        visuals: [],
      };
    },
    qs: [
      { id: 'lama', code: 'UKR-5', level: 'Penerapan', ind: 'Menghitung waktu tempuh dari jarak dan kecepatan',
        make(p, r) {
          return pg(r, {
            text: 'Lama perjalanan tanpa waktu istirahat adalah ....',
            correct: D(p.t), wrong: wrongs(r, D(p.t), [durWrong(p.t), D(p.t + 30), D(p.t - 15), D(p.t + p.brk), D(p.t + 15)].filter(Boolean)),
            sortBy: (s) => { const m = /(\d+)\s*jam(?:\s*(\d+)\s*menit)?|(\d+)\s*menit/.exec(s); return m ? (m[1] ? +m[1] * 60 + (+m[2] || 0) : +m[3]) : 0; },
            explain: `Waktu = jarak : kecepatan = ${fmt(p.s)} : ${p.v} = ${fmt(p.t / 60)} jam.\n${fmt(p.t / 60)} jam = ${D(p.t)}${p.t % 60 ? ` (karena ${fmt((p.t % 60) / 60)} jam = ${fmt((p.t % 60) / 60)} × 60 menit = ${p.t % 60} menit)` : ''}.\nJadi, jawabannya **${D(p.t)}**.`,
          });
        } },
      { id: 'tiba', code: 'UKR-4', level: 'Penerapan', ind: 'Menentukan waktu tiba dari waktu berangkat dan lama perjalanan', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const arr = p.dep + p.t + p.brk;
          const bad = durWrong(p.t) ? p.dep + Math.floor(p.t / 60) * 60 + Math.round(((p.t % 60) / 60) * 100) + p.brk : null;
          return pg(r, {
            text: `Pukul berapakah mereka tiba di ${p.c.to}?`,
            correct: C(arr), wrong: wrongs(r, arr, [p.dep + p.t, bad, arr + p.brk, arr - 15, arr + 30], { fmt: (x) => C(x) }), order: 'text',
            explain: `Lama perjalanan = ${D(p.t)}, ditambah istirahat ${p.brk} menit, sehingga totalnya ${D(p.t + p.brk)}.\nPukul ${C(p.dep)} + ${D(p.t + p.brk)} = pukul ${C(arr)}.\nJadi, jawabannya **pukul ${C(arr)}**.`,
          });
        } },
      { id: 'pulang', code: 'UKR-5', level: 'Penalaran', ind: 'Menghitung kecepatan rata-rata dari jarak dan waktu', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const f = (x) => `${fmt(x)} km/jam`;
          return pg(r, {
            text: `Pada perjalanan pulang, mereka menempuh jarak yang sama dalam waktu ${D(p.t2)} tanpa istirahat. Kecepatan rata-rata perjalanan pulang adalah ....`,
            correct: f(p.v2), wrong: wrongs(r, p.v2, [p.v, Math.round(p.s / p.t2 * 100) / 100, p.v2 + 10, (p.s * 60) / (p.t2 + p.brk), p.v2 - 5], { fmt: f, min: 1 }),
            explain: `Kecepatan = jarak : waktu.\n${D(p.t2)} = ${fmt(p.t2 / 60)} jam.\nKecepatan = ${fmt(p.s)} : ${fmt(p.t2 / 60)} = ${fmt(p.v2)} km/jam.\nJadi, jawabannya **${fmt(p.v2)} km/jam**.`,
          });
        } },
      { id: 'satuan', code: 'UKR-4', level: 'Pemahaman', ind: 'Mengubah satuan waktu', type: 'bs',
        make(p, r) {
          const items = [
            r.chance(0.5) ? { text: `${D(p.t)} = ${p.t} menit.`, ans: 0, why: `${Math.floor(p.t / 60)} × 60 + ${p.t % 60} = ${p.t}` } : { text: `${D(p.t)} = ${p.t + 20} menit.`, ans: 1, why: `${D(p.t)} = ${p.t} menit` },
            { text: `${p.brk} menit = ${Fr.md(Fr.make(p.brk, 60))} jam.`, ans: 0, why: `${p.brk} : 60 = ${Fr.md(Fr.make(p.brk, 60))}` },
            r.chance(0.5) ? { text: '1,5 jam = 1 jam 50 menit.', ans: 1, why: '0,5 jam = 30 menit, jadi 1,5 jam = 1 jam 30 menit' } : { text: '1,5 jam = 90 menit.', ans: 0, why: '1,5 × 60 = 90' },
            { text: `Lama perjalanan termasuk istirahat lebih dari ${Math.ceil((p.t + p.brk) / 60)} jam.`, ans: 1, why: `${D(p.t + p.brk)} kurang dari ${Math.ceil((p.t + p.brk) / 60)} jam` },
            { text: `Waktu istirahat ${p.brk} menit sama dengan ${p.brk * 60} detik.`, ans: 0, why: `${p.brk} × 60 = ${p.brk * 60}` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items, take: 4 });
        } },
      { id: 'jarak', code: 'UKR-5', level: 'Penerapan', ind: 'Menghitung jarak dari kecepatan dan waktu',
        make(p, r) {
          const v = (p.v * p.m1) / 60;
          const f = (x) => `${fmt(x)} km`;
          return pg(r, {
            text: `Jarak yang ditempuh dalam ${p.m1} menit pertama perjalanan adalah ....`,
            correct: f(v), wrong: wrongs(r, v, [p.v * p.m1, Math.round((p.v / p.m1) * 10) / 10, v + 5, p.v - v, v * 2], { fmt: f, min: 0.5 }),
            explain: `${p.m1} menit = {{${p.m1}/60}} jam = ${Fr.md(Fr.make(p.m1, 60))} jam.\nJarak = kecepatan × waktu = ${p.v} × ${Fr.md(Fr.make(p.m1, 60))} = ${fmt(v)} km.\nJadi, jawabannya **${fmt(v)} km**.`,
          });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   PENGUKURAN 3 — Jadwal kereta (lama perjalanan, kecepatan, tabel)
--------------------------------------------------------------------------- */
(() => {
  const { pg, pgk, tab, wrongs, GE } = MATH;
  const { clock: C, dur: D, fmt } = U;
  const NAMES = ['Kereta Melati', 'Kereta Kenanga', 'Kereta Cempaka', 'Kereta Anggrek', 'Kereta Dahlia', 'Kereta Teratai'];
  MATH.T.push({
    id: 'train', name: 'Jadwal perjalanan kereta', codes: ['UKR-4', 'DAT-2', 'UKR-5'],
    params(r) {
      for (let g = 0; g < 400; g++) {
        const Dk = r.pick([180, 210, 240]);
        const durs = r.sample([105, 120, 135, 150, 165, 180, 195, 210, 240], 4);
        const deps = r.sample([330, 360, 390, 420, 450, 480, 510, 540, 600, 630, 660, 720], 4).sort((a, b) => a - b);
        const names = r.sample(NAMES, 4);
        const trains = names.map((n, i) => ({ n, dep: deps[i], dur: durs[i], arr: deps[i] + durs[i] }));
        const fast = trains.filter((t) => (Dk * 60) % t.dur === 0);
        if (!fast.length) continue;
        const pick = r.pick(fast);
        // jendela untuk pertanyaan syarat
        let win = null;
        for (let k = 0; k < 60 && !win; k++) {
          const X = r.pick(deps) - 15, Y = r.pick(trains.map((t) => t.arr)) + 15;
          const ok = trains.filter((t) => t.dep >= X && t.arr <= Y);
          if (ok.length >= 2 && ok.length < 4) win = { X, Y };
        }
        if (!win) continue;
        return { Dk, trains, sp: pick, win };
      }
      throw new GE('param train');
    },
    stimulus(p) {
      return {
        title: 'Jadwal Kereta Stasiun Sukamaju – Stasiun Harapan', kind: 'Tabel jadwal',
        text: 'Tabel berikut menunjukkan jadwal keberangkatan dan kedatangan beberapa kereta dari Stasiun Sukamaju ke Stasiun Harapan pada hari yang sama.',
        visuals: [{ type: 'table', headers: ['Nama kereta', 'Berangkat', 'Tiba'], rows: p.trains.map((t) => [t.n, C(t.dep), C(t.arr)]) }],
      };
    },
    qs: [
      { id: 'lama', code: 'UKR-4', level: 'Penerapan', ind: 'Menghitung lama perjalanan dari jadwal',
        make(p, r) {
          const t = r.pick(p.trains);
          return pg(r, {
            text: `Lama perjalanan ${t.n} adalah ....`,
            correct: D(t.dur), wrong: wrongs(r, D(t.dur), [D(t.dur + 15), D(t.dur - 15), D(t.dur + 60), D(t.dur - 30)]),
            sortBy: (s) => { const m = /(\d+)\s*jam(?:\s*(\d+)\s*menit)?/.exec(s); return m ? +m[1] * 60 + (+m[2] || 0) : 0; },
            explain: `${t.n} berangkat pukul ${C(t.dep)} dan tiba pukul ${C(t.arr)}.\nLama perjalanan = ${C(t.arr)} − ${C(t.dep)} = ${D(t.dur)}.\nJadi, jawabannya **${D(t.dur)}**.`,
          });
        } },
      { id: 'cepat', code: 'DAT-2', level: 'Penerapan', ind: 'Membandingkan data waktu pada tabel', form: 'Interpretasi data',
        make(p, r) {
          const min = p.trains.reduce((a, b) => (b.dur < a.dur ? b : a));
          return pg(r, {
            text: 'Kereta yang waktu perjalanannya paling singkat adalah ....',
            correct: min.n, wrong: p.trains.filter((t) => t !== min).map((t) => t.n), order: 'shuffle',
            explain: p.trains.map((t) => `${t.n}: ${C(t.arr)} − ${C(t.dep)} = ${D(t.dur)}`).join('\n') + `\nYang paling singkat adalah **${min.n}**.`,
          });
        } },
      { id: 'kecepatan', code: 'UKR-5', level: 'Penalaran', ind: 'Menghitung kecepatan rata-rata dari jadwal dan jarak', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const t = p.sp, v = (p.Dk * 60) / t.dur;
          const f = (x) => `${fmt(x)} km/jam`;
          return pg(r, {
            text: `Jarak Stasiun Sukamaju ke Stasiun Harapan ${p.Dk} km. Kecepatan rata-rata ${t.n} adalah ....`,
            correct: f(v), wrong: wrongs(r, v, [...p.trains.filter((x) => x !== t).map((x) => Math.round((p.Dk * 60) / x.dur)), v + 10, v - 10, Math.round((p.Dk * 60) / (t.dur + 30))], { fmt: f, min: 10 }),
            explain: `Lama perjalanan ${t.n} = ${D(t.dur)}${t.dur % 60 ? ` = ${fmt(t.dur / 60)} jam` : ''}.\nKecepatan = ${p.Dk} : ${fmt(t.dur / 60)} = ${fmt(v)} km/jam.\nJadi, jawabannya **${fmt(v)} km/jam**.`,
          });
        } },
      { id: 'syarat', code: 'UKR-4', level: 'Penalaran', ind: 'Memilih jadwal yang memenuhi syarat waktu', form: 'Interpretasi data',
        make(p, r) {
          const { X, Y } = p.win;
          const ok = p.trains.filter((t) => t.dep >= X && t.arr <= Y), no = p.trains.filter((t) => !(t.dep >= X && t.arr <= Y));
          return pgk(r, {
            text: `Pak Ridwan ingin berangkat tidak sebelum pukul ${C(X)} dan tiba di Stasiun Harapan paling lambat pukul ${C(Y)}. Kereta yang dapat dipilih Pak Ridwan adalah ....`,
            correct: ok.map((t) => t.n), wrong: no.map((t) => t.n), order: 'shuffle',
            explain: p.trains.map((t) => `${t.n}: berangkat ${C(t.dep)}, tiba ${C(t.arr)} → ${t.dep >= X && t.arr <= Y ? 'memenuhi' : 'tidak memenuhi'}`).join('\n'),
          });
        } },
      { id: 'cek', code: 'UKR-4', level: 'Pemahaman', ind: 'Membaca dan membandingkan waktu pada tabel jadwal', type: 'bs',
        make(p, r) {
          const [a, b] = r.sample(p.trains, 2);
          const items = [
            { text: `${a.n} berangkat lebih awal daripada ${b.n}.`, ans: a.dep < b.dep ? 0 : 1, why: `${C(a.dep)} dan ${C(b.dep)}` },
            r.chance(0.5) ? { text: `Lama perjalanan ${b.n} adalah ${D(b.dur)}.`, ans: 0, why: `${C(b.arr)} − ${C(b.dep)} = ${D(b.dur)}` } : { text: `Lama perjalanan ${b.n} adalah ${D(b.dur + 15)}.`, ans: 1, why: `${C(b.arr)} − ${C(b.dep)} = ${D(b.dur)}` },
            { text: `Perjalanan ${a.n} lebih lama ${Math.abs(a.dur - b.dur)} menit daripada ${b.n}.`, ans: a.dur > b.dur ? 0 : 1, why: `${D(a.dur)} dan ${D(b.dur)}` },
            { text: `Ada kereta yang tiba di Stasiun Harapan sebelum pukul ${C(p.trains[0].arr)}.`, ans: p.trains.some((t) => t.arr < p.trains[0].arr) ? 0 : 1, why: `waktu tiba: ${p.trains.map((t) => C(t.arr)).join(', ')}` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut berdasarkan tabel!', items });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   PENGUKURAN 4 — Keliling & luas bangun gabungan (taman L, dinding rumah)
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, wrongs, svgV, GE } = MATH;
  const { fmt, rp } = U;
  const TRIPLES = [[3, 4, 5], [4, 3, 5], [6, 8, 10], [8, 6, 10], [5, 12, 13]];
  MATH.T.push({
    id: 'area', name: 'Keliling dan luas bangun gabungan', codes: ['UKR-6'],
    params(r) {
      if (r.chance(0.55)) {
        for (let g = 0; g < 300; g++) {
          const W = r.int(10, 20), H = r.int(8, 14), w = r.int(3, W - 5), h = r.int(3, H - 4);
          const a = r.int(2, 4), b = r.int(2, 3);
          if (a > W - w - 2 || b > H - h - 2) continue;
          return { v: 'L', W, H, w, h, a, b, area: W * H - w * h, kel: 2 * (W + H), grass: W * H - w * h - a * b, pr: r.pick([20000, 25000, 30000]), fence: r.pick([35000, 40000, 50000]) };
        }
      }
      for (let g = 0; g < 300; g++) {
        const [hb, t, s] = r.pick(TRIPLES), W = 2 * hb;
        if (W > 16) continue;
        const H = r.int(3, 7);
        const area = W * H + (W * t) / 2;
        return { v: 'rumah', W, H, t, s, area, kel: W + 2 * H + 2 * s, cov: r.pick([5, 8, 10]), lis: r.pick([15000, 20000, 25000]) };
      }
      throw new GE('param area');
    },
    stimulus(p) {
      if (p.v === 'L') {
        const { W, H, w, h, a, b } = p;
        const pts = [[0, 0], [W - w, 0], [W - w, h], [W, h], [W, H], [0, H]];
        const k = [[1, H - b - 1], [1 + a, H - b - 1], [1 + a, H - 1], [1, H - 1]];
        return {
          title: 'Denah Taman Sekolah', kind: 'Denah bangun datar',
          text: `Gambar berikut adalah denah taman sekolah. Semua sudut taman berupa sudut siku-siku. Di dalam taman terdapat kolam ikan berbentuk persegi panjang berukuran ${a} m × ${b} m (bagian yang diarsir). Seluruh taman, kecuali kolam, akan ditanami rumput dengan biaya ${rp(p.pr)} per m². Di sekeliling tepi taman akan dipasang pagar dengan biaya ${rp(p.fence)} per meter.`,
          visuals: [svgV(SVG.figure({
            polys: [{ pts }], hatches: [{ pts: k }],
            dims: [{ a: [0, H], b: [W, H], label: `${W} m`, off: 18 }, { a: [0, 0], b: [0, H], label: `${H} m`, off: 22 }, { a: [0, 0], b: [W - w, 0], label: `${W - w} m`, off: -18 }, { a: [W, h], b: [W, H], label: `${H - h} m`, off: -24 }],
            texts: [{ x: 1 + a / 2, y: H - 1 - b / 2, s: 'Kolam', size: 11 }],
            label: 'Denah taman',
          }))],
        };
      }
      const { W, H, t, s } = p;
      const pts = [[0, t], [W / 2, 0], [W, t], [W, t + H], [0, t + H]];
      return {
        title: 'Dinding Depan Pos Ronda', kind: 'Gambar bangun datar',
        text: `Bagian depan sebuah pos ronda berbentuk seperti gambar, yaitu gabungan persegi panjang dan segitiga sama kaki. Bagian depan itu akan dicat. Satu kaleng cat cukup untuk mengecat ${p.cov} m². Di sepanjang tepi luar bagian depan akan dipasang lis kayu dengan harga ${rp(p.lis)} per meter.`,
        visuals: [svgV(SVG.figure({
          polys: [{ pts }, { pts: [[W / 2, 0], [W / 2, t]], fill: 'none', dash: '5 4', sw: 1.4 }],
          dims: [{ a: [0, t + H], b: [W, t + H], label: `${W} m`, off: 18 }, { a: [0, t], b: [0, t + H], label: `${H} m`, off: 22 }, { a: [0, t], b: [W / 2, 0], label: `${s} m`, off: 16 }, { a: [W / 2, 0], b: [W / 2, t], label: `${t} m`, off: -16 }],
          rights: [{ p: [0, t + H], u: [1, 0], v: [0, -1] }, { p: [W, t + H], u: [-1, 0], v: [0, -1] }],
          label: 'Bagian depan pos ronda',
        }))],
      };
    },
    qs: [
      { id: 'luas', code: 'UKR-6', level: 'Penerapan', ind: 'Menghitung luas bangun datar gabungan',
        make(p, r) {
          const f = (x) => `${fmt(x)} m²`;
          if (p.v === 'L') {
            return pg(r, {
              text: 'Luas seluruh taman (termasuk kolam) adalah ....',
              correct: f(p.area), wrong: wrongs(r, p.area, [p.W * p.H, p.kel, p.W * p.H - (p.W - p.w) * (p.H - p.h), p.grass], { fmt: f, min: 1 }),
              explain: `Panjang bagian yang terpotong: ${p.W} − ${p.W - p.w} = ${p.w} m dan ${p.H} − ${p.H - p.h} = ${p.h} m.\nLuas = luas persegi panjang besar − luas bagian terpotong = ${p.W} × ${p.H} − ${p.w} × ${p.h} = ${p.W * p.H} − ${p.w * p.h} = ${p.area} m².\nJadi, jawabannya **${f(p.area)}**.`,
            });
          }
          return pg(r, {
            text: 'Luas bagian depan pos ronda tersebut adalah ....',
            correct: f(p.area), wrong: wrongs(r, p.area, [p.W * p.H + p.W * p.t, p.W * (p.H + p.t), p.W * p.H, p.kel], { fmt: f, min: 1 }),
            explain: `Luas persegi panjang = ${p.W} × ${p.H} = ${p.W * p.H} m².\nLuas segitiga = {{1/2}} × ${p.W} × ${p.t} = ${fmt((p.W * p.t) / 2)} m².\nLuas seluruhnya = ${p.W * p.H} + ${fmt((p.W * p.t) / 2)} = ${fmt(p.area)} m².\nJadi, jawabannya **${f(p.area)}**.`,
          });
        } },
      { id: 'keliling', code: 'UKR-6', level: 'Penerapan', ind: 'Menghitung keliling bangun datar gabungan',
        make(p, r) {
          const f = (x) => `${fmt(x)} m`;
          if (p.v === 'L') {
            const labeled = p.W + p.H + (p.W - p.w) + (p.H - p.h);
            return pg(r, {
              text: 'Keliling taman tersebut adalah ....',
              correct: f(p.kel), wrong: wrongs(r, p.kel, [labeled, p.kel - p.w - p.h, p.area, p.kel + 2 * p.w], { fmt: f, min: 1 }),
              explain: `Sisi yang belum diketahui: ${p.W} − ${p.W - p.w} = ${p.w} m dan ${p.H} − ${p.H - p.h} = ${p.h} m.\nKeliling = ${p.W} + ${p.H} + ${p.W - p.w} + ${p.h} + ${p.w} + ${p.H - p.h} = ${p.kel} m.\nJadi, jawabannya **${f(p.kel)}**.`,
            });
          }
          return pg(r, {
            text: 'Panjang lis kayu yang diperlukan untuk seluruh tepi luar bagian depan pos ronda adalah ....',
            correct: f(p.kel), wrong: wrongs(r, p.kel, [2 * p.W + 2 * p.H, p.W + 2 * p.H + 2 * p.t, p.kel + p.W, p.W + 2 * p.H + p.s], { fmt: f, min: 1 }),
            explain: `Tepi luar terdiri atas alas ${p.W} m, dua sisi tegak masing-masing ${p.H} m, dan dua sisi miring atap masing-masing ${p.s} m.\nKeliling = ${p.W} + ${p.H} + ${p.H} + ${p.s} + ${p.s} = ${p.kel} m.\nJadi, jawabannya **${f(p.kel)}**.`,
          });
        } },
      { id: 'biaya', code: 'UKR-6', level: 'Penalaran', ind: 'Menyelesaikan masalah luas atau keliling dalam konteks biaya', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          if (p.v === 'L') {
            const v = p.grass * p.pr;
            return pg(r, {
              text: 'Biaya yang diperlukan untuk menanam rumput adalah ....',
              correct: rp(v), wrong: wrongs(r, v, [p.area * p.pr, p.W * p.H * p.pr, (p.grass - p.a * p.b) * p.pr, p.kel * p.pr], { fmt: rp, min: 1 }),
              explain: `Luas taman = ${p.area} m², luas kolam = ${p.a} × ${p.b} = ${p.a * p.b} m².\nLuas yang ditanami rumput = ${p.area} − ${p.a * p.b} = ${p.grass} m².\nBiaya = ${p.grass} × ${rp(p.pr)} = ${rp(v)}.\nJadi, jawabannya **${rp(v)}**.`,
            });
          }
          const n = Math.ceil(p.area / p.cov);
          const f = (x) => `${x} kaleng`;
          return pg(r, {
            text: 'Paling sedikit berapa kaleng cat yang harus dibeli untuk mengecat seluruh bagian depan pos ronda?',
            correct: f(n), wrong: wrongs(r, n, [Math.floor(p.area / p.cov) === n ? n - 1 : Math.floor(p.area / p.cov), Math.ceil((p.W * p.H) / p.cov), n + 2, Math.ceil(p.kel / p.cov)], { fmt: f, min: 1, int: true }),
            explain: `Luas bagian depan = ${fmt(p.area)} m².\n${fmt(p.area)} : ${p.cov} = ${fmt(p.area / p.cov)}. Cat dibeli per kaleng, sehingga dibulatkan ke atas.\nJadi, paling sedikit **${n} kaleng**.`,
          });
        } },
      { id: 'cek', code: 'UKR-6', level: 'Penalaran', ind: 'Menganalisis keliling dan luas bangun gabungan', type: 'bs',
        make(p, r) {
          let items;
          if (p.v === 'L') {
            items = [
              r.chance(0.5) ? { text: `Bagian taman yang terpotong berukuran ${p.w} m × ${p.h} m.`, ans: 0, why: `${p.W} − ${p.W - p.w} = ${p.w} dan ${p.H} − ${p.H - p.h} = ${p.h}` } : { text: `Bagian taman yang terpotong berukuran ${p.w + 1} m × ${p.h} m.`, ans: 1, why: `ukurannya ${p.w} m × ${p.h} m` },
              { text: `Keliling taman sama dengan keliling persegi panjang berukuran ${p.W} m × ${p.H} m.`, ans: 0, why: `${p.w} + ${p.h} menggantikan sisi yang terpotong, sehingga kelilingnya tetap 2 × (${p.W} + ${p.H}) = ${p.kel} m` },
              { text: `Luas kolam lebih dari {{1/10}} luas taman.`, ans: p.a * p.b * 10 > p.area ? 0 : 1, why: `{{1/10}} × ${p.area} = ${fmt(p.area / 10)} m², sedangkan luas kolam ${p.a * p.b} m²` },
              { text: `Biaya pagar lebih mahal daripada biaya rumput.`, ans: p.kel * p.fence > p.grass * p.pr ? 0 : 1, why: `pagar ${rp(p.kel * p.fence)}, rumput ${rp(p.grass * p.pr)}` },
            ];
          } else {
            items = [
              { text: `Luas bagian segitiga adalah ${fmt((p.W * p.t) / 2)} m².`, ans: 0, why: `{{1/2}} × ${p.W} × ${p.t}` },
              r.chance(0.5) ? { text: `Luas bagian persegi panjang adalah ${p.W * p.H} m².`, ans: 0, why: `${p.W} × ${p.H}` } : { text: `Luas bagian persegi panjang adalah ${2 * (p.W + p.H)} m².`, ans: 1, why: `${2 * (p.W + p.H)} adalah kelilingnya; luasnya ${p.W} × ${p.H} = ${p.W * p.H} m²` },
              { text: `Biaya lis kayu seluruhnya ${rp(p.kel * p.lis)}.`, ans: 0, why: `${p.kel} × ${rp(p.lis)}` },
              { text: `Luas bagian segitiga lebih besar daripada luas bagian persegi panjang.`, ans: (p.W * p.t) / 2 > p.W * p.H ? 0 : 1, why: `${fmt((p.W * p.t) / 2)} m² dan ${p.W * p.H} m²` },
            ];
          }
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   PENGUKURAN 5 — Volume balok/kubus, liter, debit
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, wrongs, svgV, GE } = MATH;
  const { fmt } = U;
  MATH.T.push({
    id: 'tank', name: 'Volume balok dan kubus', codes: ['UKR-7', 'UKR-2', 'UKR-5'],
    params(r) {
      for (let g = 0; g < 400; g++) {
        const cube = r.chance(0.35);
        const p = cube ? r.pick([50, 60, 70, 80, 90, 100]) : r.pick([60, 80, 100, 120]);
        const l = cube ? p : r.pick([30, 40, 50]);
        const t = cube ? p : r.pick([40, 50, 60]);
        const hw = 10 * r.int(1, t / 10 - 2);
        const V = p * l * t, rem = (p * l * (t - hw)) / 1000;
        const qs = [2, 3, 4, 5, 6, 8, 10, 12].filter((q) => rem % q === 0 && rem / q >= 3 && rem / q <= 60);
        if (!qs.length) continue;
        return { cube, p, l, t, hw, V, L: V / 1000, rem, q: r.pick(qs), obj: cube ? 'bak mandi berbentuk kubus' : r.pick(['akuarium berbentuk balok', 'kolam kecil berbentuk balok', 'tandon air berbentuk balok']) };
      }
      throw new GE('param tank');
    },
    stimulus(p) {
      const sc = 230 / Math.max(p.p + p.l * 0.42, p.t + p.l * 0.42);
      return {
        title: U.cap(p.obj.split(' berbentuk')[0]), kind: 'Ilustrasi bangun ruang',
        text: `Sebuah ${p.obj} memiliki ukuran bagian dalam seperti gambar. ${U.cap(p.obj.split(' berbentuk')[0])} itu sudah berisi air setinggi ${p.hw} cm. Air akan ditambahkan menggunakan selang dengan debit ${p.q} liter per menit hingga penuh.`,
        visuals: [svgV(SVG.boxes([{ x: 0, y: 0, z: 0, p: p.p, l: p.l, t: p.t, labels: { p: `${p.p} cm`, l: `${p.l} cm`, t: `${p.t} cm` } }], { scale: sc, water: { h: p.hw }, label: p.obj }))],
      };
    },
    qs: [
      { id: 'vol', code: 'UKR-7', level: 'Pemahaman', ind: 'Menghitung volume balok atau kubus',
        make(p, r) {
          const f = (x) => `${fmt(x)} cm³`;
          return pg(r, {
            text: `Volume ${p.obj.split(' berbentuk')[0]} tersebut jika penuh adalah ....`,
            correct: f(p.V), wrong: wrongs(r, p.V, [2 * (p.p * p.l + p.p * p.t + p.l * p.t), p.p * p.l * p.hw, p.V / 10, p.p * p.l * (p.t - p.hw)], { fmt: f, min: 1 }),
            explain: `Volume = ${p.cube ? 's × s × s' : 'p × l × t'} = ${p.p} × ${p.l} × ${p.t} = ${fmt(p.V)} cm³.\nJadi, jawabannya **${fmt(p.V)} cm³**.`,
          });
        } },
      { id: 'liter', code: 'UKR-2', level: 'Penerapan', ind: 'Mengubah satuan volume cm³ ke liter',
        make(p, r) {
          const f = (x) => `${fmt(x)} liter`;
          return pg(r, {
            text: `Jika penuh, ${p.obj.split(' berbentuk')[0]} tersebut dapat menampung air sebanyak ....`,
            correct: f(p.L), wrong: wrongs(r, p.L, [p.V / 100, p.L * 10, p.V / 10000, p.L / 10], { fmt: f, min: 0.1 }),
            explain: `Volume = ${fmt(p.V)} cm³. Karena 1 liter = 1 dm³ = 1.000 cm³,\n${fmt(p.V)} cm³ = ${fmt(p.V)} : 1.000 = ${fmt(p.L)} liter.\nJadi, jawabannya **${fmt(p.L)} liter**.`,
          });
        } },
      { id: 'tambah', code: 'UKR-7', level: 'Penalaran', ind: 'Menghitung volume air yang diperlukan untuk mengisi wadah', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const f = (x) => `${fmt(x)} liter`;
          const inside = (p.p * p.l * p.hw) / 1000;
          return pg(r, {
            text: 'Banyak air yang harus ditambahkan hingga penuh adalah ....',
            correct: f(p.rem), wrong: wrongs(r, p.rem, [inside, p.L, p.rem * 10, p.rem + inside / 2], { fmt: f, min: 1 }),
            explain: `Tinggi yang belum terisi = ${p.t} − ${p.hw} = ${p.t - p.hw} cm.\nVolume yang belum terisi = ${p.p} × ${p.l} × ${p.t - p.hw} = ${fmt(p.p * p.l * (p.t - p.hw))} cm³ = ${fmt(p.rem)} liter.\nJadi, jawabannya **${fmt(p.rem)} liter**.`,
          });
        } },
      { id: 'debit', code: 'UKR-5', level: 'Penalaran', ind: 'Menghitung waktu pengisian dari volume dan debit', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const m = p.rem / p.q;
          const f = (x) => `${fmt(x)} menit`;
          return pg(r, {
            text: `Waktu yang diperlukan untuk mengisi ${p.obj.split(' berbentuk')[0]} hingga penuh adalah ....`,
            correct: f(m), wrong: wrongs(r, m, [p.L / p.q, m + 5, Math.round((p.rem / p.q) * 10) / 100 * 10 + 2, m * 2, m - 2].filter((x) => Number.isInteger(x) || Math.round(x * 10) === x * 10), { fmt: f, min: 1 }),
            explain: `Air yang perlu ditambahkan = ${fmt(p.rem)} liter, debit = ${p.q} liter/menit.\nWaktu = volume : debit = ${fmt(p.rem)} : ${p.q} = ${fmt(m)} menit.\nJadi, jawabannya **${fmt(m)} menit**.`,
          });
        } },
      { id: 'satuan', code: 'UKR-2', level: 'Pemahaman', ind: 'Menggunakan hubungan antarsatuan volume', type: 'bs',
        make(p, r) {
          const L = p.L;
          const items = [
            { text: '1 liter = 1.000 cm³.', ans: 0, why: '1 liter = 1 dm³ = 1.000 cm³' },
            r.chance(0.5) ? { text: `${fmt(L)} liter = ${fmt(L / 10)} dal.`, ans: 0, why: `1 dal = 10 liter` } : { text: `${fmt(L)} liter = ${fmt(L * 10)} dal.`, ans: 1, why: `1 dal = 10 liter, jadi ${fmt(L)} liter = ${fmt(L / 10)} dal` },
            r.chance(0.5) ? { text: `${fmt(L)} liter = ${fmt(L * 10)} dl.`, ans: 0, why: `1 liter = 10 dl` } : { text: `${fmt(L)} liter = ${fmt(L * 100)} dl.`, ans: 1, why: `1 liter = 10 dl, jadi ${fmt(L)} liter = ${fmt(L * 10)} dl` },
            { text: `${U.cap(p.obj.split(' berbentuk')[0])} tersebut dapat menampung lebih dari ${fmt(Math.round(L / 100) * 100 || 100)} liter air.`, ans: L > (Math.round(L / 100) * 100 || 100) ? 0 : 1, why: `daya tampungnya ${fmt(L)} liter` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   PENGUKURAN 6 — Volume bangun gabungan (podium juara)
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, wrongs, svgV, GE } = MATH;
  const { fmt } = U;
  MATH.T.push({
    id: 'podium', name: 'Volume bangun ruang gabungan', codes: ['UKR-7'],
    params(r) {
      const P = r.pick([40, 50, 60]), L = r.pick([30, 40, 50]);
      const hs = r.sample([20, 30, 40, 50, 60, 70], 3).sort((a, b) => b - a);
      const [h1, h2, h3] = hs;
      const v = [P * L * h2, P * L * h1, P * L * h3];
      return { P, L, h1, h2, h3, v, total: v[0] + v[1] + v[2], event: r.pick(['lomba lari', 'lomba cerdas cermat', 'lomba pidato', 'lomba tartil Al-Qur\'an']) };
    },
    stimulus(p) {
      const { P, L, h1, h2, h3 } = p;
      const sc = 260 / (3 * P + L * 0.42);
      return {
        title: 'Podium Juara', kind: 'Ilustrasi bangun ruang',
        text: `Panitia ${p.event} membuat podium juara dari kayu yang padat (tidak berongga). Podium terdiri atas tiga balok yang disusun berdampingan seperti gambar. Panjang dan lebar setiap balok sama, yaitu ${P} cm dan ${L} cm. Tinggi podium juara 2 (kiri) ${h2} cm, juara 1 (tengah) ${h1} cm, dan juara 3 (kanan) ${h3} cm.`,
        visuals: [svgV(SVG.boxes([
          { x: 0, y: 0, z: 0, p: P, l: L, t: h2, labels: { p: `${P} cm`, t: `${h2} cm` } },
          { x: P, y: 0, z: 0, p: P, l: L, t: h1, labels: { t: `${h1} cm` } },
          { x: 2 * P, y: 0, z: 0, p: P, l: L, t: h3, labels: { l: `${L} cm`, t: `${h3} cm` } },
        ], { scale: sc, label: 'Podium juara' }))],
      };
    },
    qs: [
      { id: 'total', code: 'UKR-7', level: 'Penerapan', ind: 'Menghitung volume bangun ruang gabungan',
        make(p, r) {
          const f = (x) => `${fmt(x)} cm³`;
          return pg(r, {
            text: 'Volume seluruh podium adalah ....',
            correct: f(p.total), wrong: wrongs(r, p.total, [p.P * p.L * p.h1 * 3, 3 * p.P * p.L * (p.h1 + p.h2 + p.h3), p.P * p.L * (p.h1 + p.h2 + p.h3) / 10, p.total - p.v[2]], { fmt: f, min: 1 }),
            explain: `Volume juara 2 = ${p.P} × ${p.L} × ${p.h2} = ${fmt(p.v[0])} cm³\nVolume juara 1 = ${p.P} × ${p.L} × ${p.h1} = ${fmt(p.v[1])} cm³\nVolume juara 3 = ${p.P} × ${p.L} × ${p.h3} = ${fmt(p.v[2])} cm³\nTotal = ${fmt(p.total)} cm³.\nJadi, jawabannya **${fmt(p.total)} cm³**.`,
          });
        } },
      { id: 'selisih', code: 'UKR-7', level: 'Penerapan', ind: 'Membandingkan volume bagian-bagian bangun gabungan',
        make(p, r) {
          const d = p.v[1] - p.v[2];
          const f = (x) => `${fmt(x)} cm³`;
          return pg(r, {
            text: 'Selisih volume podium juara 1 dan podium juara 3 adalah ....',
            correct: f(d), wrong: wrongs(r, d, [p.v[1] - p.v[0], p.h1 - p.h3, p.P * (p.h1 - p.h3), d * 2], { fmt: f, min: 1 }),
            explain: `Selisih tinggi = ${p.h1} − ${p.h3} = ${p.h1 - p.h3} cm.\nSelisih volume = ${p.P} × ${p.L} × ${p.h1 - p.h3} = ${fmt(d)} cm³ (sama dengan ${fmt(p.v[1])} − ${fmt(p.v[2])}).\nJadi, jawabannya **${fmt(d)} cm³**.`,
          });
        } },
      { id: 'kubus', code: 'UKR-7', level: 'Penalaran', ind: 'Menentukan banyak kubus satuan penyusun bangun gabungan', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const n = p.total / 1000;
          const f = (x) => `${fmt(x)} kubus`;
          return pg(r, {
            text: 'Jika podium itu disusun dari kubus-kubus kayu kecil dengan panjang rusuk 10 cm, banyak kubus kecil yang diperlukan adalah ....',
            correct: f(n), wrong: wrongs(r, n, [p.total / 100, p.total / 10, n / 10, n + p.v[2] / 1000], { fmt: f, min: 1, int: true }),
            explain: `Volume 1 kubus kecil = 10 × 10 × 10 = 1.000 cm³.\nBanyak kubus = ${fmt(p.total)} : 1.000 = ${fmt(n)}.\nJadi, jawabannya **${fmt(n)} kubus**.`,
          });
        } },
      { id: 'cek', code: 'UKR-7', level: 'Penalaran', ind: 'Menganalisis volume bangun ruang gabungan', type: 'bs',
        make(p, r) {
          const items = [
            { text: `Volume podium juara 1 dua kali volume podium juara 3.`, ans: p.v[1] === 2 * p.v[2] ? 0 : 1, why: `${fmt(p.v[1])} dan ${fmt(p.v[2])}` },
            { text: `Volume seluruh podium lebih dari ${fmt(Math.round(p.total / 100000) * 100)} dm³.`, ans: p.total / 1000 > Math.round(p.total / 100000) * 100 ? 0 : 1, why: `${fmt(p.total)} cm³ = ${fmt(p.total / 1000)} dm³` },
            r.chance(0.5) ? { text: `Volume podium juara 2 adalah ${fmt(p.v[0] / 1000)} dm³.`, ans: 0, why: `${fmt(p.v[0])} cm³ = ${fmt(p.v[0] / 1000)} dm³` } : { text: `Volume podium juara 2 adalah ${fmt(p.v[0] / 100)} dm³.`, ans: 1, why: `${fmt(p.v[0])} cm³ = ${fmt(p.v[0] / 1000)} dm³` },
            { text: `Jika tinggi setiap podium ditambah 10 cm, volume seluruh podium bertambah ${fmt(3 * p.P * p.L * 10)} cm³.`, ans: 0, why: `3 × ${p.P} × ${p.L} × 10` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------
   PENGUKURAN 7 — Sudut pada jam
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, wrongs, svgV, GE } = MATH;
  const ang = (h) => 30 * Math.min(h % 12, 12 - (h % 12));
  const kind = (a) => (a < 90 ? 0 : a === 90 ? 1 : 2);
  const KN = ['Lancip', 'Siku-siku', 'Tumpul'];
  MATH.T.push({
    id: 'clock', name: 'Sudut pada jarum jam', codes: ['UKR-8'],
    params(r) {
      const lan = r.pick([1, 2, 10, 11]), siku = r.pick([3, 9]), tum = r.pick([4, 5, 7, 8]);
      const hours = r.shuffle([lan, siku, tum]);

            text: `Besar sudut terkecil yang dibentuk oleh jarum pendek dan jarum panjang pada Jam ${'ABC'[i]} adalah ....`,

            explain: `Jam ${'ABC'[i]} menunjukkan pukul ${String(h).padStart(2, '0')}.00. Satu putaran 360° dibagi 12 angka, sehingga jarak antarangka ${360 / 12}°.\nDari angka 12 ke angka ${h} ada ${Math.min(h, 12 - h)} jarak angka, jadi sudutnya ${Math.min(h, 12 - h)} × 30° = ${a}°.\nJadi, jawabannya **${a}°**.`,
          });
        } },
      { id: 'jenis', code: 'UKR-8', level: 'Penerapan', ind: 'Mengelompokkan jenis sudut pada jarum jam', type: 'kat',
        make(p, r) {
          const items = p.hours.map((h, i) => ({ text: `Sudut terkecil antara kedua jarum pada Jam ${'ABC'[i]}`, ans: kind(ang(h)), why: `${ang(h)}°` }));
          items.push((() => { const h = r.pick([2, 4, 5, 10]); return { text: `Sudut terkecil antara kedua jarum pada pukul 0${h}.00`.replace('010', '10'), ans: kind(ang(h)), why: `${ang(h)}°` }; })());
          return tab(r, { type: 'kat', labels: KN, text: 'Tentukan jenis setiap sudut berikut!', items, allowSame: true });
        } },
      { id: 'putar', code: 'UKR-8', level: 'Penalaran', ind: 'Menentukan besar putaran jarum jam dalam selang waktu tertentu', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const a = 6 * p.m;
          const f = (x) => `${x}°`;
          return pg(r, {
            text: `Jarum panjang jam berputar selama ${p.m} menit. Besar sudut putaran jarum panjang tersebut adalah ....`,
            correct: f(a), wrong: wrongs(r, a, [p.m, p.m / 2, 360 - a, a + 30, 30 * Math.round(p.m / 5)], { fmt: f, min: 5, int: true }),
            explain: `Jarum panjang berputar satu putaran (360°) dalam 60 menit, sehingga setiap menit berputar 360° : 60 = 6°.\nDalam ${p.m} menit: ${p.m} × 6° = ${a}°.\nJadi, jawabannya **${a}°**.`,
          });

      { id: 'cek', code: 'UKR-8', level: 'Penerapan', ind: 'Memeriksa pernyataan tentang sudut jarum jam', type: 'bs',
        make(p, r) {

          const items = [
            { text: `Pada Jam ${'ABC'[i]}, kedua jarum membentuk sudut siku-siku.`, ans: ang(p.hours[i]) === 90 ? 0 : 1, why: `${ang(p.hours[i])}°` },
            { text: `Sudut pada Jam ${'ABC'[j]} lebih besar daripada sudut pada Jam ${'ABC'[i]}.`, ans: ang(p.hours[j]) > ang(p.hours[i]) ? 0 : 1, why: `${ang(p.hours[j])}° dan ${ang(p.hours[i])}°` },
            { text: 'Pada pukul 06.00, kedua jarum membentuk sudut lurus (180°).', ans: 0, why: '6 × 30° = 180°' },

/* ---------------------------------------------------------------------------
   PENGUKURAN 8 — Sudut pada segitiga, garis lurus, dan menaksir sudut
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, wrongs, GE } = MATH;
  MATH.T.push({
    id: 'angles', name: 'Sudut segitiga, sudut lurus, dan taksiran', codes: ['UKR-8', 'UKR-9'],
    params(r) {
      for (let g = 0; g < 200; g++) {
        const A = 5 * r.int(7, 16), B = 5 * r.int(7, 16), Cc = 180 - A - B;
        if (Cc < 30 || Cc === 90) continue;
        const th = 5 * r.int(6, 30);
        if (th === 90) continue;
        const est = r.pick([35, 50, 120, 140, 160]);
        return { A, B, Cc, th, est };
      }
      throw new GE('param angles');
    },
    stimulus(p) {
      return {
        title: 'Mengukur Sudut', kind: 'Ilustrasi sudut',
        text: 'Perhatikan gambar-gambar berikut. Gambar 1 adalah segitiga ABC. Pada Gambar 2, garis PQ adalah garis lurus dan O terletak pada garis PQ. Gambar 3 menunjukkan sudut K yang digambar tanpa busur derajat.',
        visuals: [
          { type: 'svg', caption: 'Gambar 1', svg: SVG.triangleAngles(p.A, p.B) },
          { type: 'svg', caption: 'Gambar 2', svg: SVG.straightAngle(p.th) },
          { type: 'svg', caption: 'Gambar 3', svg: SVG.angleFig(p.est, { label: 'K', rot: p.est > 90 ? 10 : 20 }) },
        ],
      };
    },
    qs: [
      { id: 'segitiga', code: 'UKR-8', level: 'Penerapan', ind: 'Menentukan besar sudut segitiga yang belum diketahui',
        make(p, r) {
          const f = (x) => `${x}°`;
          return pg(r, {
            text: 'Besar sudut C pada Gambar 1 adalah ....',
            correct: f(p.Cc), wrong: wrongs(r, p.Cc, [360 - p.A - p.B, p.A + p.B, 90 - Math.abs(p.A - p.B), p.Cc + 10], { fmt: f, min: 5, int: true }),
            explain: `Jumlah ketiga sudut segitiga adalah 180°.\nSudut C = 180° − ${p.A}° − ${p.B}° = ${p.Cc}°.\nJadi, jawabannya **${p.Cc}°**.`,
          });
        } },
      { id: 'lurus', code: 'UKR-8', level: 'Penerapan', ind: 'Menentukan besar sudut pelurus',
        make(p, r) {
          const v = 180 - p.th;
          const f = (x) => `${x}°`;
          return pg(r, {
            text: 'Besar sudut yang ditandai “?” pada Gambar 2 adalah ....',
            correct: f(v), wrong: wrongs(r, v, [360 - p.th, Math.abs(90 - p.th), p.th, v + 10], { fmt: f, min: 5, int: true }),
            explain: `Sudut-sudut pada garis lurus berjumlah 180°.\nSudut ? = 180° − ${p.th}° = ${v}°.\nJadi, jawabannya **${v}°**.`,
          });
        } },
      { id: 'taksir', code: 'UKR-9', level: 'Penerapan', ind: 'Menaksir besar sudut',
        make(p, r) {
          const opts = [20, 35, 50, 70, 90, 120, 140, 160, 175].filter((x) => Math.abs(x - p.est) >= 30);
          const sup = 180 - p.est;
          const wr = [];
          if (Math.abs(sup - p.est) >= 30) wr.push(sup);
          r.shuffle(opts).forEach((x) => { if (wr.length < 3 && !wr.includes(x)) wr.push(x); });
          const f = (x) => `${x}°`;
          return pg(r, {
            text: 'Taksiran besar sudut K pada Gambar 3 yang paling mendekati adalah ....',
            correct: f(p.est), wrong: wr.map(f),
            explain: `Sudut K ${p.est < 90 ? 'lebih kecil daripada sudut siku-siku (90°), jadi termasuk sudut lancip' : 'lebih besar daripada sudut siku-siku (90°) tetapi lebih kecil daripada sudut lurus (180°), jadi termasuk sudut tumpul'}. Bandingkan dengan sudut siku-siku dan sudut lurus.\nTaksiran yang paling mendekati adalah **${p.est}°**.`,
          });
        } },
      { id: 'cek', code: 'UKR-8', level: 'Penalaran', ind: 'Menganalisis jenis dan besar sudut', type: 'bs',
        make(p, r) {
          const items = [
            { text: 'Sudut C pada Gambar 1 adalah sudut lancip.', ans: p.Cc < 90 ? 0 : 1, why: `sudut C = ${p.Cc}°` },
            { text: `Sudut yang ditandai “?” pada Gambar 2 adalah sudut tumpul.`, ans: 180 - p.th > 90 ? 0 : 1, why: `besarnya ${180 - p.th}°` },
            { text: 'Sudut K pada Gambar 3 lebih besar daripada sudut siku-siku.', ans: p.est > 90 ? 0 : 1, why: `sudut K sekitar ${p.est}°` },
            r.chance(0.5) ? { text: `Jumlah sudut A dan sudut B pada Gambar 1 adalah ${p.A + p.B}°.`, ans: 0, why: `${p.A}° + ${p.B}°` } : { text: `Jumlah sudut A dan sudut B pada Gambar 1 adalah ${p.A + p.B + 10}°.`, ans: 1, why: `${p.A}° + ${p.B}° = ${p.A + p.B}°` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut!', items });
        } },
    ],
  });
})();

/* ---------------------------------------------------------------------------

(() => {
  const { pg, tab, people, svgV, GE } = MATH;

    ['tinggi pintu ruang kelas', '2 m', ['20 m', '20 cm']], ['berat seekor ayam', '2 kg', ['20 kg', '2 g']],
    ['isi satu gelas air minum', '250 ml', ['25 liter', '2 ml']], ['panjang pensil baru', '18 cm', ['18 m', '18 mm']],
    ['berat sebuah buku tulis', '100 g', ['100 kg', '1 g']], ['lama menggosok gigi', '2 menit', ['2 jam', '2 detik']],
    ['tinggi badan siswa kelas 6', '145 cm', ['145 m', '14 cm']], ['berat sekarung beras', '25 kg', ['25 g', '250 kg']],
    ['panjang lapangan sepak bola', '100 m', ['100 km', '100 cm']], ['isi galon air minum', '19 liter', ['19 ml', '190 liter']],
    ['tebal sebuah buku pelajaran', '2 cm', ['2 m', '2 dam']], ['lama perjalanan bus sejauh 120 km', '3 jam', ['3 menit', '3 hari']],
  ];
  const UNITQ = [
    ['panjang ruang kelas', 'meter (m)', ['kilometer (km)', 'milimeter (mm)', 'kilogram (kg)']],

    ['isi sebuah botol obat sirup', 'mililiter (ml)', ['kiloliter (kl)', 'kilogram (kg)', 'sentimeter (cm)']],
    ['jarak antara dua kota', 'kilometer (km)', ['sentimeter (cm)', 'milimeter (mm)', 'gram (g)']],
    ['berat seekor sapi', 'kilogram (kg)', ['gram (g)', 'miligram (mg)', 'liter (l)']],
    ['tebal sebuah koin', 'milimeter (mm)', ['meter (m)', 'kilometer (km)', 'kilogram (kg)']],
  ];
  MATH.T.push({
    id: 'estimate', name: 'Penaksiran ukuran', codes: ['UKR-9', 'UKR-1'],
    params(r) {
      const rows = r.sample(EST, 5).map(([obj, ok, bad]) => (r.chance(0.5) ? { obj, val: ok, ok: true } : { obj, val: r.pick(bad), ok: false }));
      if (rows.every((x) => x.ok) || rows.every((x) => !x.ok)) rows[0] = { obj: rows[0].obj, val: rows[0].ok ? EST.find((e) => e[0] === rows[0].obj)[2][0] : EST.find((e) => e[0] === rows[0].obj)[1], ok: !rows[0].ok };
      const kindO = r.pick(['tiang', 'pohon', 'gedung']);

      return { rows, kindO, ratio, h, name: people(r, 1)[0], uq: r.pick(UNITQ), n: r.pick([19, 21, 29, 31, 39, 41]), w: r.pick([48, 49, 51, 52]) };

        visuals: [
          { type: 'table', headers: ['Benda atau kegiatan', 'Perkiraan'], rows: p.rows.map((x) => [U.cap(x.obj), x.val]) },
          { type: 'svg', caption: `${p.name} dan ${objName}`, svg: SVG.heightScene({ kind: p.kindO, ratio: p.ratio, childLabel: `${p.name} (${U.fmt(p.h)} m)` }) },
        ],
      };
    },
    qs: [
      { id: 'wajar', code: 'UKR-9', level: 'Pemahaman', ind: 'Menilai kewajaran taksiran ukuran benda', type: 'kat',
        make(p, r) {
          const items = p.rows.slice(0, 4).map((x) => ({ text: `${U.cap(x.obj)} sekitar ${x.val}`, ans: x.ok ? 0 : 1, why: x.ok ? 'sesuai ukuran sebenarnya' : `ukuran yang wajar sekitar ${EST.find((e) => e[0] === x.obj)[1]}` }));
          return tab(r, { type: 'kat', labels: ['Masuk akal', 'Tidak masuk akal'], text: 'Tentukan apakah setiap perkiraan pada tabel masuk akal atau tidak masuk akal!', items, shuffle: false, allowSame: false });
        } },
      { id: 'tinggi', code: 'UKR-9', level: 'Penerapan', ind: 'Menaksir tinggi benda menggunakan pembanding',

          const f = (x) => `${U.fmt(x)} m`;
          const cands = [p.h, Math.round(v * 2 * 10) / 10, Math.round(v * 10), Math.round((v / 2) * 10) / 10].filter((x) => Math.abs(x - v) > 0.6);
          const wr = Array.from(new Set(cands.map(f))).slice(0, 3);
          if (wr.length < 3) throw new GE('pengecoh');
          return pg(r, {
            text: `Taksiran tinggi ${objName} yang paling mendekati adalah ....`,

          });
        } },
      { id: 'satuan', code: 'UKR-1', level: 'Pemahaman', ind: 'Memilih satuan baku yang tepat untuk mengukur',
        make(p, r) {
          const [q, ok, bad] = p.uq;
          return pg(r, {
            text: `Satuan yang paling tepat untuk menyatakan ${q} adalah ....`,
            correct: ok, wrong: bad, order: 'shuffle',
            explain: `${U.cap(q)} paling tepat dinyatakan dalam **${ok}** karena ukurannya sesuai dengan besar satuan tersebut; satuan lain terlalu besar, terlalu kecil, atau mengukur besaran yang berbeda.`,
          });
        } },
      { id: 'bulat', code: 'UKR-9', level: 'Penalaran', ind: 'Menaksir hasil pengukuran dengan pembulatan', form: 'Pemecahan masalah kontekstual',
        make(p, r) {
          const nn = Math.round(p.n / 10) * 10, ww = 50, est = nn * ww;
          const f = (x) => `${U.fmt(x)} kg`;
          return pg(r, {
            text: `Pak Darto membeli ${p.n} karung beras. Berat setiap karung sekitar ${p.w} kg. Taksiran berat seluruh beras yang paling mendekati adalah ....`,
            correct: f(est), wrong: [f(est / 10), f(est * 10), f(est / 2)],
            explain: `${p.n} dibulatkan menjadi ${nn} dan ${p.w} kg dibulatkan menjadi ${ww} kg.\nTaksiran = ${nn} × ${ww} = ${U.fmt(est)} kg (hasil sebenarnya ${p.n} × ${p.w} = ${U.fmt(p.n * p.w)} kg).\nJadi, jawabannya **${U.fmt(est)} kg**.`,
          });

/* ---------------------------------------------------------------------------
   DATA 1 — Diagram batang
--------------------------------------------------------------------------- */
(() => {
  const { pg, tab, wrongs, svgV, GE } = MATH;
  const { fmt } = U;
  const CTX = [
    { title: 'Banyak Buku yang Dibaca Siswa Kelas 6', cats: ['Januari', 'Februari', 'Maret', 'April', 'Mei'], short: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei'], unit: 'buku', y: 'Banyak buku', x: 'Bulan', what: 'buku yang dibaca', time: true,
      intro: 'Diagram batang berikut menunjukkan banyak buku yang dibaca siswa kelas 6 selama lima bulan dalam program Gerakan Literasi Sekolah.' },
    { title: 'Pengunjung Perpustakaan Sekolah', cats: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'], short: null, unit: 'orang', y: 'Banyak pengunjung', x: 'Hari', what: 'pengunjung', time: true,
      intro: 'Diagram batang berikut menunjukkan banyak pengunjung perpustakaan sekolah selama satu pekan.' },
    { title: 'Hasil Panen Jagung Kelompok Tani', cats: ['Pak Ali', 'Pak Budi', 'Bu Cici', 'Pak Dodi', 'Bu Eni'], short: null, unit: 'karung', y: 'Banyak karung', x: 'Petani', what: 'karung jagung', time: false,
      intro: 'Diagram batang berikut menunjukkan hasil panen jagung lima petani dalam satu kelompok tani.' },
    { title: 'Sampah Plastik yang Terkumpul', cats: ['Kelas 2', 'Kelas 3', 'Kelas 4', 'Kelas 5', 'Kelas 6'], short: null, unit: 'kg', y: 'Berat (kg)', x: 'Kelas', what: 'sampah plastik', time: false,
      intro: 'Diagram batang berikut menunjukkan berat sampah plastik yang dikumpulkan setiap kelas dalam kegiatan Jumat Bersih.' },
  ];
  MATH.T.push({
    id: 'bar', name: 'Diagram batang', codes: ['DAT-1', 'DAT-2'],
    params(r) {
      for (let g = 0; g < 300; g++) {
        const c = r.pick(CTX), step = r.pick([5, 10]);
        const vals = Array.from({ length: 5 }, () => step * r.int(1, 9));
        const mx = Math.max(...vals), mn = Math.min(...vals);
        if (vals.filter((v) => v === mx).length > 1 || vals.filter((v) => v === mn).length > 1) continue;
        if (new Set(vals).size < 4) continue;
        return { c, step, vals };
      }
      throw new GE('param bar');
    },
    stimulus(p) {
      return {
        title: p.c.title, kind: 'Diagram batang', text: p.c.intro,
        visuals: [svgV(SVG.bar({ labels: p.c.short || p.c.cats, values: p.vals, step: p.step, title: p.c.title, yLabel: p.c.y, xLabel: p.c.x }))],
      };
    },
    qs: [
      { id: 'baca', code: 'DAT-2', level: 'Pemahaman', ind: 'Membaca nilai data pada diagram batang', form: 'Interpretasi data',
        make(p, r) {
          const i = r.int(0, 4), v = p.vals[i];
          const f = (x) => `${fmt(x)} ${p.c.unit}`;
          return pg(r, {
            text: `Banyak ${p.c.what} pada ${p.c.cats[i]} adalah ....`.replace('pada Pak', 'milik Pak').replace('pada Bu', 'milik Bu'),
            correct: f(v), wrong: wrongs(r, v, [v + p.step, v - p.step, v + p.step / 2, p.vals[(i + 1) % 5]], { fmt: f, min: 1 }),
            explain: `Puncak batang ${p.c.cats[i]} sejajar dengan angka ${v} pada sumbu tegak.\nJadi, jawabannya **${f(v)}**.`,
          });
        } },
      { id: 'selisih', code: 'DAT-2', level: 'Penerapan', ind: 'Menghitung selisih data tertinggi dan terendah', form: 'Interpretasi data',
        make(p, r) {
          const mx = Math.max(...p.vals), mn = Math.min(...p.vals), d = mx - mn;
          const f = (x) => `${fmt(x)} ${p.c.unit}`;
          return pg(r, {
            text: `Selisih ${p.c.what} yang paling banyak dan yang paling sedikit adalah ....`,
            correct: f(d), wrong: wrongs(r, d, [mx + mn, mx, d - p.step, d + p.step], { fmt: f, min: 1 }),
            explain: `Paling banyak: ${p.c.cats[p.vals.indexOf(mx)]} (${mx}). Paling sedikit: ${p.c.cats[p.vals.indexOf(mn)]} (${mn}).\nSelisih = ${mx} − ${mn} = ${d}.\nJadi, jawabannya **${f(d)}**.`,
          });
        } },
      { id: 'jumlah', code: 'DAT-2', level: 'Penerapan', ind: 'Menghitung jumlah seluruh data pada diagram batang', form: 'Interpretasi data',
        make(p, r) {
          const s = p.vals.reduce((a, b) => a + b, 0);
          const f = (x) => `${fmt(x)} ${p.c.unit}`;
          return pg(r, {
            text: `Jumlah seluruh ${p.c.what} adalah ....`,
            correct: f(s), wrong: wrongs(r, s, [s - p.vals[4], s + p.step, s - p.step, Math.max(...p.vals) * 5], { fmt: f, min: 1 }),
            explain: `Jumlah = ${p.vals.join(' + ')} = ${s}.\nJadi, jawabannya **${f(s)}**.`,
          });
        } },
      { id: 'simpul', code: 'DAT-2', level: 'Penalaran', ind: 'Menarik kesimpulan dari diagram batang', form: 'Interpretasi data', type: 'bs',
        make(p, r) {
          const v = p.vals, c = p.c.cats;
          const [i, j] = r.sample([0, 1, 2, 3, 4], 2);
          const inc = v[0] < v[1] && v[1] < v[2];
          const items = [
            { text: `Banyak ${p.c.what} pada ${c[i]} dua kali banyak ${p.c.what} pada ${c[j]}.`, ans: v[i] === 2 * v[j] ? 0 : 1, why: `${v[i]} dan ${v[j]}` },
            p.c.time ? { text: `Dari ${c[0]} sampai ${c[2]}, banyak ${p.c.what} selalu bertambah.`, ans: inc ? 0 : 1, why: `${v[0]}, ${v[1]}, ${v[2]}` }
              : { text: `${c[i]} memperoleh lebih banyak daripada ${c[j]}.`, ans: v[i] > v[j] ? 0 : 1, why: `${v[i]} dan ${v[j]}` },
            { text: `Jumlah pada ${c[0]} dan ${c[1]} lebih dari jumlah pada ${c[3]} dan ${c[4]}.`, ans: v[0] + v[1] > v[3] + v[4] ? 0 : 1, why: `${v[0] + v[1]} dan ${v[3] + v[4]}` },
            r.chance(0.5) ? { text: `Selisih ${c[i]} dan ${c[j]} adalah ${Math.abs(v[i] - v[j])} ${p.c.unit}.`, ans: 0, why: `${Math.max(v[i], v[j])} − ${Math.min(v[i], v[j])}` } : { text: `Selisih ${c[i]} dan ${c[j]} adalah ${Math.abs(v[i] - v[j]) + p.step} ${p.c.unit}.`, ans: 1, why: `selisihnya ${Math.abs(v[i] - v[j])}` },
          ];
          return tab(r, { type: 'bs', text: 'Tentukan benar atau salah setiap pernyataan berikut berdasarkan diagram!', items });
        } },
      { id: 'tabel', code: 'DAT-1', level: 'Penerapan', ind: 'Menyajikan data diagram batang ke dalam tabel', form: 'Interpretasi data',
        make(p, r) {
          const lab = p.c.short || p.c.cats;
          const mk = (vals) => ({ table: { headers: [p.c.x, ...lab], rows: [[p.c.y, ...vals.map(String)]] } });
          const v = p.vals;
          const sw = v.slice(); const [a, b] = r.sample([0, 1, 2, 3, 4], 2); [sw[a], sw[b]] = [sw[b], sw[a]];
          const off = v.slice(); const k = r.int(0, 4); off[k] = v[k] + p.step;
          const rev = v.slice().reverse();
          const half = v.map((x, i) => (i === r.int(0, 4) ? x - p.step / 2 : x));
          const cand = [sw, off, rev, half].filter((x) => JSON.stringify(x) !== JSON.stringify(v));

            text: 'Tabel yang sesuai dengan diagram batang tersebut adalah ....',
            correct: mk(v), wrong: wr, order: 'shuffle', layout: 'stack',
            explain: `Baca tinggi setiap batang: ${lab.map((l, i) => `${l} = ${v[i]}`).join(', ')}. Tabel yang memuat nilai-nilai tersebut adalah jawaban yang benar.`,
          });
        } },
    ],
  });
