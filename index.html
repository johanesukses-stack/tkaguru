<style>
/* ==========================================================================
   TKA GURU — gaya tampilan (biru tinta & putih kertas)
   ========================================================================== */
:root {
  --ink: #2747c9;
  --ink-700: #1d3699;
  --ink-900: #13225f;
  --ink-50: #eef2fd;
  --ink-100: #dde5fb;
  --ink-200: #bfcdf5;
  --paper: #ffffff;
  --desk: #edf2f9;
  --line: #dbe2ee;
  --line-2: #c9d4e6;
  --text: #1b2433;
  --muted: #586378;
  --faint: #8792a6;
  --marker: #f2b600;
  --marker-50: #fff5d1;
  --ok: #1d8049;
  --ok-50: #e6f4ec;
  --bad: #c43328;
  --bad-50: #fcebe9;
  --redpen: #d0312d;
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 18px;
  --sh-paper: 0 1px 2px rgba(19, 34, 95, .06), 0 10px 30px rgba(19, 34, 95, .09);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-doc: Cambria, "Charter", "Bitstream Charter", Georgia, "Noto Serif", "Times New Roman", serif;
  --topbar-h: 60px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); color: var(--text); background: var(--desk);
  font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; letter-spacing: -0.01em; }
p { margin: 0 0 .8em; }
:focus-visible { outline: 3px solid rgba(39, 71, 201, .45); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.hide { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Pecahan bertumpuk ---------- */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .86em; line-height: 1.12; margin: -.2em .14em 0; }
.frac .num { border-bottom: 1.3px solid currentColor; padding: 0 .2em; }
.frac .den { padding: 0 .2em; }
.mixed { display: inline-flex; align-items: center; white-space: nowrap; vertical-align: middle; }
.mixed .frac { margin-left: .1em; }

/* ---------- Bilah atas ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
  background: rgba(255, 255, 255, .96); backdrop-filter: saturate(1.4) blur(6px);
  border-bottom: 1px solid var(--line);
}
.topbar .in { max-width: 1180px; margin: 0 auto; height: 100%; display: flex; align-items: center; gap: 18px; padding: 0 18px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink-900); font-weight: 800; font-size: 18px; letter-spacing: .02em; white-space: nowrap; }
.brand .mark { width: 32px; height: 32px; flex: none; }
.brand small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-700); letter-spacing: 0; margin-top: -2px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.nav { display: flex; gap: 2px; margin-left: 8px; }
.nav a { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14.5px; }
.nav a:hover { background: var(--ink-50); color: var(--ink-700); }
.nav a.on { background: var(--ink-50); color: var(--ink-700); }
.nav svg { width: 18px; height: 18px; }
.ai-chip { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); text-decoration: none; white-space: nowrap; }
.ai-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #b6bfcf; }
.ai-chip.on { color: var(--ok); border-color: #bfe3cd; background: var(--ok-50); }
.ai-chip.on .dot { background: var(--ok); }
@media (max-width: 760px) {
  .nav a span { display: none; }
  .nav a { padding: 9px; }
  .ai-chip span.lbl { display: none; }
  .brand small { font-size: 10.5px; max-width: 128px; }
  .topbar .in { gap: 10px; padding: 0 12px; }
}
@media (max-width: 400px) {
  .topbar .in { gap: 6px; padding: 0 10px; }
  .brand { gap: 7px; }
  .brand .mark { width: 30px; height: 30px; }
  .brand small { font-size: 10px; }
  .nav { margin-left: 0; gap: 0; }
  .nav a { padding: 8px; }
}
@media (max-width: 339px) { .brand small { display: none; } .ai-chip { display: none; } }

/* ---------- Tata letak umum ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding: 26px 18px 64px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
.page-head h1 { font-size: clamp(24px, 3.2vw, 32px); margin: 0; color: var(--ink-900); }
.page-head p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.section-title { font-size: 18px; color: var(--ink-900); margin: 30px 0 12px; display: flex; align-items: center; gap: 10px; }
.section-title .count { font-size: 13px; color: var(--muted); font-weight: 600; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px; }
.panel + .panel { margin-top: 16px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spacer { flex: 1; }

/* ---------- Tombol ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px;
  padding: 9px 16px; border-radius: 11px; border: 1px solid var(--line-2); background: #fff;
  font-weight: 650; font-size: 14.5px; cursor: pointer; text-decoration: none; color: var(--text);
  transition: background .15s, border-color .15s, box-shadow .15s, transform .05s;
}
.btn:hover { background: #f6f8fc; border-color: #b4c1d9; }
.btn:active { transform: translateY(1px); }
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; box-shadow: 0 1px 0 rgba(255, 255, 255, .2) inset, 0 6px 16px rgba(39, 71, 201, .22); }
.btn-primary:hover { background: var(--ink-700); border-color: var(--ink-700); }
.btn-soft { background: var(--ink-50); border-color: var(--ink-100); color: var(--ink-700); }
.btn-soft:hover { background: var(--ink-100); border-color: var(--ink-200); }
.btn-danger { color: var(--bad); border-color: #efc5c0; }
.btn-danger:hover { background: var(--bad-50); border-color: #e3a49c; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: rgba(39, 71, 201, .07); color: var(--ink-700); border-color: transparent; }
.btn-sm { min-height: 34px; padding: 6px 11px; font-size: 13.5px; border-radius: 9px; }
.btn-lg { min-height: 50px; padding: 12px 22px; font-size: 16px; border-radius: 13px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.icon-btn { width: 38px; height: 38px; padding: 0; min-height: 0; }

/* ---------- Formulir ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label, .lbl { font-weight: 650; font-size: 14px; color: var(--ink-900); }
.field .hint { font-size: 13px; color: var(--muted); }
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--line-2); border-radius: 10px; background: #fff; padding: 10px 12px; min-height: 42px;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(39, 71, 201, .14); }
textarea.input { resize: vertical; line-height: 1.5; }
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 11px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--ink); color: #fff; }

/* ---------- Chip & badge ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; background: var(--ink-50); color: var(--ink-700); border: 1px solid var(--ink-100); }
.chip.gray { background: #f1f4f8; color: var(--muted); border-color: var(--line); }
.chip.ok { background: var(--ok-50); color: var(--ok); border-color: #bfe3cd; }
.chip.warn { background: var(--marker-50); color: #8a6400; border-color: #f2dc93; }
.chip.bad { background: var(--bad-50); color: var(--bad); border-color: #f0c4be; }
.stamp { display: inline-block; font-weight: 800; font-size: 12px; padding: 3px 8px; border: 2px solid currentColor; border-radius: 6px; transform: rotate(-3deg); letter-spacing: .02em; }
.stamp.mtk { color: var(--ink); }
.stamp.bi { color: #0f7f86; }
.stamp.ipas { color: #2e7d32; }

/* ---------- Beranda ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; align-items: stretch; margin-bottom: 8px; }
.hero-main { padding: 28px 28px 26px; border-radius: 22px; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(140deg, #2b4fd8 0%, #2142b7 55%, #1a3596 100%); }
.hero-main::after { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, .07) 0 1px, transparent 1px 34px); pointer-events: none; }
.hero-main > * { position: relative; z-index: 1; }
.hero-main .greet { font-size: 15px; opacity: .9; margin-bottom: 4px; }
.hero-main h1 { font-size: clamp(25px, 3.4vw, 36px); margin: 0 0 10px; color: #fff; max-width: 18ch; }
.hero-main p { opacity: .92; max-width: 48ch; margin-bottom: 18px; }
.hero-main .btn-primary { background: #fff; color: var(--ink-900); border-color: #fff; box-shadow: 0 8px 22px rgba(10, 20, 70, .25); }
.hero-main .btn-primary:hover { background: #f1f4ff; }
.hero-main .btn-ghost { color: #fff; }
.hero-main .btn-ghost:hover { background: rgba(255, 255, 255, .12); color: #fff; }
.hero-side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; }
.stat b { font-size: 28px; color: var(--ink-900); line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 16px; }
.tile { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, border-color .15s; }
.tile:hover { border-color: var(--ink-200); box-shadow: 0 8px 22px rgba(19, 34, 95, .08); }
.tile-sheet { position: relative; height: 128px; background: #f7f9fd; border-bottom: 1px solid var(--line); padding: 14px 18px; cursor: pointer; overflow: hidden; }
.tile-sheet .mini { position: absolute; left: 22px; right: 22px; top: 18px; bottom: -10px; background: #fff; border: 1px solid var(--line); border-radius: 6px 6px 0 0; box-shadow: 0 4px 14px rgba(19, 34, 95, .07); padding: 12px 12px 0; }
.mini .l { height: 6px; border-radius: 3px; background: #e5ebf5; margin-bottom: 7px; }
.mini .l.t { width: 62%; height: 8px; background: #c9d5ef; }
.mini .l.s { width: 40%; }
.mini .bubs { display: flex; gap: 5px; margin-top: 10px; }
.mini .bubs i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #b9c6e4; }
.mini .bubs i.f { background: var(--ink); border-color: var(--ink); }
.tile-sheet .stamp { position: absolute; right: 30px; top: 30px; background: rgba(255, 255, 255, .9); }
.tile-body { padding: 14px 16px 6px; flex: 1; }
.tile-body h3 { font-size: 16px; margin: 0 0 6px; color: var(--ink-900); cursor: pointer; }
.tile-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--muted); }
.tile-actions { display: grid; grid-template-columns: 1fr 1fr 38px 38px; gap: 6px; padding: 10px 12px 12px; }
.tile-actions .btn { padding-left: 8px; padding-right: 8px; }
.tile-actions .icon-btn { width: 38px; height: 34px; }
.empty { text-align: center; padding: 38px 20px; border: 2px dashed var(--line-2); border-radius: 18px; background: #fff; color: var(--muted); }
.empty h3 { color: var(--ink-900); }
.list { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.list-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .s { font-size: 13px; color: var(--muted); }
.score-pill { font-weight: 800; font-size: 17px; min-width: 56px; text-align: center; padding: 4px 8px; border-radius: 10px; background: var(--ink-50); color: var(--ink-900); }
.score-pill.lo { background: var(--bad-50); color: var(--bad); }
.score-pill.hi { background: var(--ok-50); color: var(--ok); }

/* ---------- Input kisi-kisi ---------- */
.notebook {
  width: 100%; min-height: 380px; border: 1px solid var(--line-2); border-radius: 14px; resize: vertical;
  padding: 14px 18px 14px 58px; font-size: 15.5px; line-height: 28px; background-color: #fff;
  background-image: linear-gradient(90deg, transparent 44px, #f3b6b1 44px, #f3b6b1 46px, transparent 46px), repeating-linear-gradient(180deg, transparent 0 27px, #e3eaf6 27px 28px);
  background-attachment: local; background-position: 0 14px;
}
.notebook:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(39, 71, 201, .14); }
.detect h3 { font-size: 15px; margin-bottom: 10px; color: var(--ink-900); }
.detect .subj { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.detect .subj-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-weight: 700; }
.detect .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.engine-box { border-radius: 12px; padding: 12px 14px; background: #f7f9fd; border: 1px solid var(--line); font-size: 14px; }
.engine-box b { color: var(--ink-900); }
details.adv { border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; background: #fff; }
details.adv summary { cursor: pointer; padding: 12px 0; font-weight: 650; color: var(--ink-900); }
details.adv[open] { padding-bottom: 6px; }

/* ---------- Proses ---------- */
.proc { max-width: 760px; margin: 0 auto; }
.proc-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin-bottom: 16px; }
.proc-card h2 { font-size: 18px; color: var(--ink-900); display: flex; align-items: center; gap: 10px; }
.bar { height: 8px; background: #e6ecf6; border-radius: 99px; overflow: hidden; margin: 6px 0 18px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 99px; transition: width .35s ease; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: st; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 9px 0; position: relative; }
.step::before { content: ""; position: absolute; left: 14px; top: 34px; bottom: -6px; width: 2px; background: #e6ecf6; }
.step:last-child::before { display: none; }
.step .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #cfd8e8; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--faint); background: #fff; position: relative; z-index: 1; }
.step.run .dot { border-color: var(--ink); color: var(--ink); }
.step.run .dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--ink); animation: spin .9s linear infinite; }
.step.done .dot { background: var(--ink); border-color: var(--ink); color: #fff; }
.step.err .dot { background: var(--bad); border-color: var(--bad); color: #fff; }
.step .st-t { font-weight: 650; padding-top: 4px; }
.step.wait .st-t { color: var(--faint); }
.step .st-d { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Naskah (dokumen) ---------- */
.doc-bar { position: sticky; top: var(--topbar-h); z-index: 20; background: rgba(237, 242, 249, .96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.doc-bar .in { max-width: 1180px; margin: 0 auto; padding: 10px 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.doc-title { min-width: 0; flex: 1 1 260px; }
.doc-title h1 { font-size: 18px; margin: 0; color: var(--ink-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-title .tile-meta { margin-top: 2px; }
.tabs { display: flex; gap: 4px; background: #fff; border: 1px solid var(--line); padding: 4px; border-radius: 12px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 7px 12px; border-radius: 9px; text-decoration: none; color: var(--muted); font-weight: 650; font-size: 14px; white-space: nowrap; }
.tabs a.on { background: var(--ink); color: #fff; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); min-width: 250px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(19, 34, 95, .16); padding: 6px; z-index: 40; }
.menu-list button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 9px; cursor: pointer; font-size: 14.5px; }
.menu-list button:hover { background: var(--ink-50); }
.menu-list svg { width: 18px; height: 18px; color: var(--ink-700); }
.valbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; margin: 16px auto 0; max-width: 210mm; font-size: 14px; border: 1px solid; }
.valbar.ok { background: var(--ok-50); border-color: #bfe3cd; color: #1a6a3f; }
.valbar.warn { background: var(--marker-50); border-color: #f0d98a; color: #7a5800; }
.valbar.bad { background: var(--bad-50); border-color: #efc1bb; color: var(--bad); }
.valbar svg { width: 20px; height: 20px; flex: none; }
.desk { padding: 18px 12px 70px; }
.sheet {
  width: 210mm; max-width: 100%; margin: 16px auto 0; background: var(--paper); box-shadow: var(--sh-paper);
  padding: 18mm 17mm 20mm; font-family: var(--font-doc); font-size: 12pt; line-height: 1.55; color: #121826; border-radius: 3px;
}
@media (max-width: 820px) { .sheet { padding: 22px 18px 30px; font-size: 15.5px; overflow-x: auto; } }
@media (max-width: 760px) {
  .doc-bar { position: static; }
  .doc-bar .in { padding: 10px 12px; }
  .doc-bar .tabs { flex: 1 1 100%; }
  .desk { padding: 6px 8px 60px; }
}
.sheet h1, .sheet h2, .sheet h3, .sheet h4 { font-family: var(--font); }
.kop { text-align: center; border-bottom: 3px double #1b2433; padding-bottom: 10px; margin-bottom: 14px; }
.kop .s1 { font-family: var(--font); font-weight: 700; font-size: 11pt; letter-spacing: .04em; color: #333c4f; }
.kop .s2 { font-family: var(--font); font-weight: 800; font-size: 17pt; margin: 2px 0; color: #0f1729; }
.kop .s3 { font-family: var(--font); font-size: 10.5pt; color: #444e63; }
.idbox { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; font-family: var(--font); font-size: 10.5pt; margin: 10px 0 14px; }
.idbox div { display: flex; gap: 8px; }
.idbox span:first-child { min-width: 92px; color: #3c465a; }

.minibars { font-family: var(--font); font-size: 10.5pt; }
.minibars .r { display: grid; grid-template-columns: 170px 1fr 34px; gap: 10px; align-items: center; margin: 4px 0; }

/* ---------- Editor ---------- */

.ed-body { padding: 16px; }
.ed-q { border: 1px solid var(--line); border-radius: 14px; margin-top: 14px; }
.ed-q > summary { list-style: none; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 12px 14px; }
.ed-q > summary::-webkit-details-marker { display: none; }
.ed-q > summary .qno { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
.ed-q > summary .sum { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.ed-q[open] > summary { border-bottom: 1px solid var(--line); }
.ed-q .inner { padding: 14px; }
.opt-ed { display: grid; grid-template-columns: 36px 1fr 38px; gap: 8px; align-items: start; margin-bottom: 8px; }

.vis-ed { border: 1px dashed var(--line-2); border-radius: 12px; padding: 10px; margin-top: 10px; background: #fbfcfe; }

.grid-ed { overflow: auto; }
.grid-ed table { border-collapse: collapse; }
.grid-ed td { padding: 2px; }
.grid-ed input { min-width: 90px; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: 6px; }
.saved { font-size: 13px; color: var(--ok); }
.warnline { font-size: 13px; color: #8a6400; background: var(--marker-50); border: 1px solid #f0d98a; padding: 6px 10px; border-radius: 9px; margin-bottom: 10px; }
.mdhelp { font-size: 12.5px; color: var(--muted); }
.mdhelp code { background: #eef2fb; padding: 1px 5px; border-radius: 5px; }

/* ---------- Ujian ---------- */
body.exam-mode { background: #f2f5fa; }
body.exam-mode .topbar { display: none; }
.ex-top { position: sticky; top: 0; z-index: 25; background: var(--ink-900); color: #fff; }
.ex-top .in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 58px; }
.ex-top .ttl { min-width: 0; flex: 1; }
.ex-top .ttl b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.ex-top .ttl span { font-size: 12.5px; opacity: .8; }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 19px; background: rgba(255, 255, 255, .12); padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 7px; }
.timer svg { width: 18px; height: 18px; }
.timer.low { background: var(--marker); color: #2c2000; }
.timer.crit { background: var(--redpen); color: #fff; animation: pulse 1s ease-in-out infinite; }

.ex-top .btn { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .2); color: #fff; }
.ex-top .btn:hover { background: rgba(255, 255, 255, .2); }
.ex-prog { height: 4px; background: rgba(255, 255, 255, .15); }
.ex-prog i { display: block; height: 100%; background: var(--marker); transition: width .3s; }
.ex-body { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 236px; gap: 16px; align-items: start; }
.ex-body.nostim { grid-template-columns: minmax(0, 1fr) 236px; }
.ex-stim, .ex-q, .ex-nav { background: #fff; border: 1px solid var(--line); border-radius: 16px; }

.ex-stim .lab { font-size: 12.5px; font-weight: 700; color: var(--ink-700); background: var(--ink-50); display: inline-block; padding: 2px 9px; border-radius: 999px; margin-bottom: 8px; }
.ex-stim .stim { border: 0; padding: 0; margin: 0; font-family: var(--font-doc); font-size: 16px; }
.ex-q .qstim { font-family: var(--font-doc); font-size: 16px; line-height: 1.55; margin-bottom: 8px; }
.ex-q .qstim .fig { margin: 6px auto 10px; }
.ex-q { padding: 18px 20px; }
.ex-q .qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.ex-q .qnum { width: 38px; height: 38px; border-radius: 11px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 17px; }
.ex-q .qtext { font-size: 16.5px; line-height: 1.6; font-family: var(--font-doc); }
.ex-q .typehint { font-size: 13.5px; color: var(--ink-700); background: var(--ink-50); border: 1px solid var(--ink-100); padding: 7px 11px; border-radius: 10px; margin: 6px 0 12px; display: flex; gap: 8px; align-items: center; }
.ex-q .typehint svg { width: 17px; height: 17px; flex: none; }
.choice { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; border: 1.5px solid var(--line-2); background: #fff; border-radius: 13px; padding: 12px 14px; margin: 0 0 10px; cursor: pointer; font-size: 16px; line-height: 1.5; transition: border-color .12s, background .12s, box-shadow .12s; font-family: var(--font-doc); }
.choice:hover { border-color: var(--ink-200); background: #fafbff; }
.choice .bub { width: 30px; height: 30px; font-size: 14px; border: 2px solid #9aa7c2; color: #3b4660; margin: 0; }
.choice.on { border-color: var(--ink); background: var(--ink-50); box-shadow: 0 0 0 3px rgba(39, 71, 201, .1); }
.choice.on .bub { background: var(--ink); border-color: var(--ink); color: #fff; }
.choice .ct { flex: 1; min-width: 0; padding-top: 2px; }
.choices.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.xtbl { border-collapse: separate; border-spacing: 0; width: 100%; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; font-size: 15.5px; }
.xtbl th { background: #f2f5fb; font-size: 13px; text-align: center; padding: 9px 8px; border-bottom: 1px solid var(--line-2); }
.xtbl th:first-child { text-align: left; }
.xtbl td { padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; font-family: var(--font-doc); }

.rbtn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #9aa7c2; background: #fff; cursor: pointer; display: inline-grid; place-items: center; }

.ex-foot { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.btn-flag.on { background: var(--marker); border-color: #d9a400; color: #2c2000; }
.ex-nav { padding: 14px; position: sticky; top: 78px; }
.ex-nav h4 { font-size: 14px; margin-bottom: 10px; color: var(--ink-900); }
.navgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.navgrid button { aspect-ratio: 1; border-radius: 10px; border: 1.5px solid var(--line-2); background: #fff; font-weight: 750; cursor: pointer; font-size: 14px; position: relative; padding: 0; }
.navgrid button.ans { background: var(--ink); border-color: var(--ink); color: #fff; }
.navgrid button.flag { background: var(--marker); border-color: #d9a400; color: #2c2000; }
.navgrid button.cur { box-shadow: 0 0 0 3px rgba(39, 71, 201, .35); }
.legend { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); margin: 12px 0; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; border: 1.5px solid var(--line-2); background: #fff; }

.legend i.f { background: var(--marker); border-color: #d9a400; }
.stimtoggle { display: none; }
@media (max-width: 640px) {
  .ex-top .in { flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; min-height: 0; }
  .ex-top .brand { display: none; }
  .ex-top .ttl { flex: 1 1 100%; }

  .ex-top .timer { font-size: 17px; padding: 5px 10px; margin-right: auto; }

}
@media (max-width: 1080px) {
  .ex-body, .ex-body.nostim { grid-template-columns: 1fr; }

}
@media (max-width: 640px) { .ex-q, .ex-stim { scroll-margin-top: 112px; } }
.start-card { max-width: 720px; margin: 30px auto; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 26px; }
.start-card h1 { font-size: 24px; color: var(--ink-900); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
.facts div { background: #f6f8fd; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.facts b { display: block; font-size: 20px; color: var(--ink-900); }
.facts span { font-size: 12.5px; color: var(--muted); }
@media (max-width: 560px) { .facts { grid-template-columns: 1fr 1fr; } }

/* ---------- Hasil ---------- */
.res-hero { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
@media (max-width: 700px) { .res-hero { grid-template-columns: 1fr; text-align: center; } }
.redpen { position: relative; width: 200px; height: 196px; margin: 0 auto; display: grid; place-items: center; padding-bottom: 26px; }
.redpen svg { position: absolute; top: 0; left: 0; width: 200px; height: 170px; }
.redpen .num { position: relative; font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", var(--font-doc); font-size: 64px; font-weight: 800; color: var(--redpen); line-height: 1; transform: rotate(-4deg); }
.redpen .lbl { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
.tiles div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fbfcfe; }
.tiles b { display: block; font-size: 22px; }
.tiles span { font-size: 12.5px; color: var(--muted); }
.tiles .g b { color: var(--ok); } .tiles .r b { color: var(--bad); } .tiles .e b { color: var(--muted); } .tiles .a b { color: var(--ink-900); }
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr 1fr; } }
.pm-row { display: grid; grid-template-columns: minmax(0, 1fr) 160px 46px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.pm-row:last-child { border-bottom: 0; }
.pm-row .tr { height: 10px; background: #e7edf7; border-radius: 9px; overflow: hidden; }
.pm-row .tr i { display: block; height: 100%; border-radius: 9px; }
@media (max-width: 560px) { .pm-row { grid-template-columns: 1fr 64px 40px; } }
.rec { border-left: 4px solid var(--marker); background: var(--marker-50); padding: 10px 14px; border-radius: 0 10px 10px 0; margin-bottom: 8px; }
.rev { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; }
.rev .rh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.rev .qtext { font-family: var(--font-doc); font-size: 15.5px; }
.ropt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); margin: 6px 0; font-family: var(--font-doc); }
.ropt.key { border-color: #9fd4b4; background: var(--ok-50); }
.ropt.pick.wrong { border-color: #ecb3ab; background: var(--bad-50); }
.ropt .tag { margin-left: auto; font-family: var(--font); font-size: 12px; font-weight: 700; white-space: nowrap; }
.ropt.key .tag { color: var(--ok); }
.ropt.wrong .tag { color: var(--bad); }
.rv-ex { background: #f7f9fd; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-top: 10px; font-size: 15px; }
.rv-ex h5 { margin: 0 0 4px; font-size: 13.5px; color: var(--ink-700); }
.rv-ex p { margin: 0 0 .35em; }
.mk-ok { color: var(--ok); font-weight: 800; }
.mk-bad { color: var(--bad); font-weight: 800; }

/* ---------- Modal & toast ---------- */
.mb { position: fixed; inset: 0; background: rgba(12, 22, 52, .45); z-index: 80; display: grid; place-items: center; padding: 16px; animation: fade .15s ease; }
.modal { background: #fff; border-radius: 18px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 30px 80px rgba(10, 20, 60, .35); }
.modal.wide { width: min(760px, 100%); }
.modal .mh { padding: 18px 20px 6px; display: flex; gap: 10px; align-items: flex-start; }
.modal .mh h2 { font-size: 19px; margin: 0; color: var(--ink-900); flex: 1; }
.modal .mbd { padding: 6px 20px 8px; }
.modal .mf { padding: 12px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 90; display: grid; gap: 8px; width: min(440px, calc(100% - 24px)); pointer-events: none; }
.toast { background: #172453; color: #fff; padding: 11px 16px; border-radius: 12px; box-shadow: 0 12px 30px rgba(10, 20, 60, .3); font-size: 14.5px; animation: up .2s ease; }
.toast.ok { background: #145c35; } .toast.bad { background: #9e2a21; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }
pre.code { background: #0f1b3d; color: #dfe7ff; border-radius: 12px; padding: 14px; overflow: auto; font-size: 12.5px; line-height: 1.5; max-height: 340px; }
.steps-guide { padding-left: 20px; }
