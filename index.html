  // ---------------- Analisis ----------------
  function analyze(text) {
    const r = TAX.analyze(text);
    r.analyses.forEach((a) => {
      a.supported = true;
      a.notes = [];
      if (a.jenjang.level !== 'SD/MI') a.notes.push(`Jenjang terdeteksi ${a.jenjang.label}. Generator lokal disusun untuk TKA SD/MI; hubungkan AI agar tingkat kesulitan sesuai jenjang tersebut.`);
      if (a.jenjang.isDefault) a.notes.push('Jenjang tidak disebutkan, sehingga digunakan Kelas 6 SD/MI.');
    });
    return r;
  }
  // banyak pasangan (template, pembuat soal) IPAS yang sesuai cakupan
  const ipaPairs = (scope) => IPA.T.reduce((n, t) => n + t.qs.filter((m) => scope.has(m.code)).length, 0);
  function autoCount(a) {
    const scope = new Set(a.codes.map((c) => c.code));
    if (a.subject === 'ipas') return Math.min(30, Math.max(5, ipaPairs(scope)));
    if (a.subject === 'bi') {
      const n = BIB.S.filter((s) => s.qs.some((q) => scope.has(q.code))).length;
      return 3 * Math.max(3, Math.min(10, n));
    }
    const n = MATH.T.filter((t) => t.qs.some((m) => scope.has(m.code)) && (!t.extra || t.codes.some((c) => scope.has(c)))).length;
    return 3 * Math.max(5, Math.min(10, Math.round(n * 1.5)));
  }

  // ---------------- Rancangan (blueprint) ----------------
  const GRP_ORDER = { BIL: 0, EXT: 1, GEO: 2, UKR: 3, DAT: 4, BI: 0 };
  function planMath(a, G, r0, avoid = {}) {
    inferTypes();
    const inScope = new Set(a.codes.map((c) => c.code));
    const alloc = TAX.allocate(a.codes, G * 3);
    const tpls = MATH.T.filter((t) => t.qs.some((m) => inScope.has(m.code)) && (!t.extra || t.codes.some((c) => inScope.has(c))));
    if (!tpls.length) throw new GE('Tidak ada template yang cocok dengan kisi-kisi ini.');
    let bestPlan = null;
    const trials = 90;
    for (let trial = 0; trial < trials; trial++) {
      const r = U.rng(r0.seed());
      const res = greedyMath(tpls, inScope, alloc, G, r, avoid, trial === 0 ? 0.6 : 1.2 + (trial % 5));
      if (!bestPlan || res.score > bestPlan.score) bestPlan = res;
    }
    const plan = bestPlan.plan;
    const ord = (p) => { const m = TPL[p.tpl].qs.find((q) => q.id === p.makers[0]); const c = TAX.byCode[m.code]; return GRP_ORDER[c.grp] * 100 + MATH.T.indexOf(TPL[p.tpl]); };
    plan.sort((x, y) => ord(x) - ord(y));
    return { plan, alloc };
  }
  function greedyMath(tpls, inScope, alloc, G, r, avoid, jit) {
    const need = Object.assign({}, alloc);
    const used = {}; const usedMakers = {};
    const tcount = { pg: 0, pgk: 0, tab: 0 };
    const covered = {};
    const plan = [];
    for (let g = 0; g < G; g++) {
      let best = null;
      tpls.forEach((t) => {
        const reuse = used[t.id] || 0;
        if (reuse >= 3) return;
        const avoidPen = (avoid.tpls && avoid.tpls.includes(t.id)) ? 10 : 0;
        const tmp = Object.assign({}, need);
        const chosen = [];
        let score = 0;
        for (let k = 0; k < 3; k++) {
          let bm = null, bs = -1e9;
          t.qs.forEach((m) => {
            if (chosen.includes(m)) return;
            let s;
            if (!inScope.has(m.code)) s = -25;
            else s = (tmp[m.code] || 0) > 0 ? 12 + tmp[m.code] * 2 : 2;
            if (inScope.has(m.code) && !covered[m.code] && !chosen.some((c) => c.code === m.code)) s += 14;
            if ((usedMakers[t.id] || []).includes(m.id)) s -= 9;
            if (avoid.makers && avoid.makers.includes(t.id + ':' + m.id)) s -= 3;
            const tc = typeCls(m.type || 'pg');
            const placed = tcount.pg + tcount.pgk + tcount.tab + chosen.length;
            const pgShare = (tcount.pg + chosen.filter((c) => (c.type || 'pg') === 'pg').length) / Math.max(1, placed);
            if (tc !== 'pg' && pgShare > 0.55) s += 4;
            if (tc === 'pg' && pgShare < 0.4) s += 2;
            if (chosen.some((c) => c.level === m.level)) s -= 1.5;
            if (chosen.some((c) => typeCls(c.type || 'pg') === tc && tc !== 'pg')) s -= 3;
            s += r() * jit;
            if (s > bs) { bs = s; bm = m; }
          });
          if (!bm) break;
          chosen.push(bm); score += bs;
          if ((tmp[bm.code] || 0) > 0) tmp[bm.code]--;
        }
        if (chosen.length < 3) return;
        score -= reuse * 14 + avoidPen;
        score += r() * jit * 2;
        if (!best || score > best.score) best = { t, makers: chosen, score };
      });
      if (!best) break;
      plan.push({ tpl: best.t.id, makers: best.makers.map((m) => m.id) });
      used[best.t.id] = (used[best.t.id] || 0) + 1;
      usedMakers[best.t.id] = (usedMakers[best.t.id] || []).concat(best.makers.map((m) => m.id));
      best.makers.forEach((m) => { if ((need[m.code] || 0) > 0) need[m.code]--; covered[m.code] = (covered[m.code] || 0) + 1; tcount[typeCls(m.type || 'pg')]++; });
    }
    const cov = [...inScope].filter((c) => covered[c]).length;
    const left = Object.values(need).reduce((s2, x) => s2 + Math.max(0, x), 0);
    const reuses = Object.values(used).reduce((s2, x) => s2 + Math.max(0, x - 1), 0);
    const tot = tcount.pg + tcount.pgk + tcount.tab || 1;
    const bal = -Math.abs(tcount.pg / tot - 0.55) * 20 - (tcount.pgk ? 0 : 6) - (tcount.tab ? 0 : 6);
    const outScope = plan.reduce((s2, p) => s2 + p.makers.filter((id) => !inScope.has(TPL[p.tpl].qs.find((m) => m.id === id).code)).length, 0);
    return { plan, score: cov * 100 - left * 4 - reuses * 6 - outScope * 30 + bal + r() };
  }
  function planBI(a, G, r, avoid = {}) {
    const inScope = new Set(a.codes.map((c) => c.code));
    const alloc = TAX.allocate(a.codes, G * 3);
    const need = Object.assign({}, alloc);
    const pool = BIB.S.filter((s) => s.qs.some((q) => inScope.has(q.code)));
    const plan = [];
    const tcount = { pg: 0, pgk: 0, tab: 0 };
    const usedSt = new Set();
    const usedQ = new Set(avoid.qs || []);
    const covered = {};
    for (let g = 0; g < G; g++) {
      let best = null;
      pool.forEach((st) => {
        if (usedSt.has(st.id)) return;
        const tmp = Object.assign({}, need);
        const chosen = [];
        let score = 0;
        for (let k = 0; k < 3; k++) {
          let bq = null, bs = -1e9;
          st.qs.forEach((q) => {
            if (chosen.includes(q)) return;
            let s = !inScope.has(q.code) ? -20 : (tmp[q.code] || 0) > 0 ? 12 + tmp[q.code] * 2 : 2;
            if (inScope.has(q.code) && !covered[q.code] && !chosen.some((c) => c.code === q.code)) s += 14;
            if (usedQ.has(st.id + ':' + q.id)) s -= 6;
            const tc = typeCls(q.type);
            const placed = tcount.pg + tcount.pgk + tcount.tab + chosen.length;
            const pgShare = (tcount.pg + chosen.filter((c) => c.type === 'pg').length) / Math.max(1, placed);
            if (tc !== 'pg' && pgShare > 0.55) s += 4;
            if (chosen.some((c) => typeCls(c.type) === tc && tc !== 'pg')) s -= 3;
            if (chosen.some((c) => c.code === q.code)) s -= 2;
            s += r() * 1.2;
            if (s > bs) { bs = s; bq = q; }
          });
          if (!bq) break;
          chosen.push(bq); score += bs;
          if ((tmp[bq.code] || 0) > 0) tmp[bq.code]--;
        }
        if (chosen.length < 3) return;
        if (avoid.stimuli && avoid.stimuli.includes(st.id)) score -= 10;
        score += r() * 2;
        if (!best || score > best.score) best = { st, qs: chosen, score };
      });
      if (!best) break;
      usedSt.add(best.st.id);
      plan.push({ bank: best.st.id, qs: best.qs.map((q) => q.id) });
      best.qs.forEach((q) => { if ((need[q.code] || 0) > 0) need[q.code]--; covered[q.code] = (covered[q.code] || 0) + 1; tcount[typeCls(q.type)]++; });
    }
    const sastra = (p) => (BIB.byId[p.bank].genre === 'Teks Sastra' ? 0 : 1);
    plan.sort((x, y) => sastra(x) - sastra(y) || BIB.S.indexOf(BIB.byId[x.bank]) - BIB.S.indexOf(BIB.byId[y.bank]));
    return { plan, alloc };
  }

  // IPAS: soal mandiri bergambar. Target bentuk PG 50% : PG kompleks 50% (MCMA + tabel Benar/Salah)
  // dan level 30% pemahaman, 40% penerapan, 30% penalaran (format TKAD DIY).
  function ipaTargets(N) {
    const pgN = Math.round(N / 2), pgkN = Math.round((N - pgN) * 0.53);
    const lv1 = Math.round(N * 0.3), lv3 = Math.round(N * 0.3);
    return { types: { pg: pgN, pgk: pgkN, tab: N - pgN - pgkN }, levels: { Pemahaman: lv1, Penerapan: N - lv1 - lv3, Penalaran: lv3 } };
  }
  // bobot stimulus bergambar (sekali hitung per template): gambar 5, tabel 2, teks 0
  function visOf(t) {
    if (t._vis != null) return t._vis;
    let v = 0;
    for (let k = 1; k < 6; k++) {
      try { const st = t.stimulus(t.params(U.rng(k * 131))); const vs = st.visuals || []; v = vs.some((x) => x.type === 'svg') ? 5 : vs.length ? 2 : 0; break; } catch (e) { /* coba lagi */ }
    }
    t._vis = v;
    return v;
  }
  function planIPA(a, N, r0, avoid = {}) {
    const inScope = new Set(a.codes.map((c) => c.code));
    const alloc = TAX.allocate(a.codes, N);
    const cands = [];
    IPA.T.forEach((t) => t.qs.forEach((m) => { if (inScope.has(m.code)) cands.push({ t, m, key: t.id + ':' + m.id, tc: typeCls(m.type), vis: visOf(t) }); }));
    if (!cands.length) throw new GE('Tidak ada template IPAS yang cocok dengan kisi-kisi ini.');
    const tg = ipaTargets(N);
    const avoidM = new Set(avoid.makers || []), avoidT = new Set(avoid.tpls || []);
    let best = null;
    for (let trial = 0; trial < 70; trial++) {
      const r = U.rng(r0.seed());
      const jit = trial === 0 ? 0.5 : 2 + (trial % 6) * 1.5;
      const need = Object.assign({}, alloc), tN = Object.assign({}, tg.types), lN = Object.assign({}, tg.levels);
      const usedPair = {}, usedTpl = {}, usedFam = {}, plan = [];
      for (let k = 0; k < N; k++) {
        let pick = null, ps = -1e9;
        cands.forEach((c) => {
          let s = 0;
          s -= (usedPair[c.key] || 0) * 60;
          s -= (usedTpl[c.t.id] || 0) * 22;
          s -= (usedFam[c.t.fam || c.t.id] || 0) * 8; // gambar yang sama (organ berlabel) cukup sekali bila memungkinkan
          s += (need[c.m.code] || 0) > 0 ? 24 + need[c.m.code] * 3 : -10;
          s += tN[c.tc] > 0 ? 9 + tN[c.tc] : -14;
          s += lN[c.m.level] > 0 ? 6 + lN[c.m.level] * 0.5 : -7;
          s += c.vis; // IPAS identik dengan gambar: utamakan soal bergambar
          if (avoidM.has(c.key)) s -= 8;
          if (avoidT.has(c.t.id)) s -= 3;
          s += r() * jit;
          if (s > ps) { ps = s; pick = c; }
        });
        plan.push(pick);
        usedPair[pick.key] = (usedPair[pick.key] || 0) + 1; usedTpl[pick.t.id] = (usedTpl[pick.t.id] || 0) + 1;
        const fk = pick.t.fam || pick.t.id; usedFam[fk] = (usedFam[fk] || 0) + 1;
        if ((need[pick.m.code] || 0) > 0) need[pick.m.code]--;
        tN[pick.tc]--; lN[pick.m.level]--;
      }
      const dev = Object.values(tN).reduce((x, v) => x + Math.abs(v), 0) * 3 + Object.values(lN).reduce((x, v) => x + Math.abs(v), 0) * 2;
      const left = Object.values(need).reduce((x, v) => x + Math.max(0, v), 0);
      const reuseP = Object.values(usedPair).reduce((x, v) => x + Math.max(0, v - 1), 0);
      const reuseT = Object.values(usedTpl).reduce((x, v) => x + Math.max(0, v - 1), 0);
      const cov = [...inScope].filter((c) => plan.some((x) => x.m.code === c)).length;
      const sc = cov * 50 - left * 6 - dev - reuseP * 30 - reuseT * 8 - plan.filter((x) => avoidM.has(x.key)).length * 4 + r();
      if (!best || sc > best.sc) best = { sc, plan };
    }
    // Template yang sama dan bertanda "share" digabung menjadi satu stimulus; selain itu tiap soal berdiri sendiri.
    const order = (x) => LVR[x.m.level] * 1000 + IPA.T.indexOf(x.t);
    const sorted = best.plan.slice().sort((x, y) => (+x.m.code.slice(4) - +y.m.code.slice(4)) || order(x) - order(y));
    // soal bergambar sama (mis. organ pencernaan berlabel) tidak diletakkan berurutan bila ada pilihan lain dalam kompetensi yang sama
    const fam = (x) => x.t.fam || x.t.id;
    const items = [];
    while (sorted.length) {
      const prev = items[items.length - 1];
      let k = sorted.findIndex((x) => x.m.code === sorted[0].m.code && (!prev || fam(x) !== fam(prev)));
      if (k < 0) k = 0;
      items.push(sorted.splice(k, 1)[0]);
    }
    const out = [];
    items.forEach((x) => {
      const prev = out.find((g) => g.tpl === x.t.id && x.t.share && g.makers.length < 3 && !g.makers.includes(x.m.id));
      if (prev) prev.makers.push(x.m.id); else out.push({ tpl: x.t.id, makers: [x.m.id] });
    });
    return { plan: out, alloc };
  }

  // ---------------- Pembuatan kelompok soal ----------------
  function decorate(q, meta) {
    q.id = U.uid('q');
    q.code = meta.code; q.level = meta.level; q.indikator = meta.ind;
    if (meta.form) q.form = meta.form;
    if (meta.variant) q.variant = meta.variant;
    const c = TAX.byCode[meta.code];
    q.materi = meta.materi || c.el;
    q.submateri = c.label;
    q.gen = meta.gen;
    return q;
  }
  function makeMathQ(tpl, m, p, qseed) {
    let last;
    for (let k = 0; k < 8; k++) {
      try {
        const q = m.make(p, U.rng(qseed + k * 977));
        return decorate(q, { code: m.code, level: m.level, ind: m.ind, form: m.form, variant: m.variant, gen: { tpl: tpl.id, maker: m.id, qseed: qseed + k * 977 } });
      } catch (e) { if (!(e instanceof GE)) throw e; last = e; }
    }
    throw last || new GE('gagal');
  }
  function buildMathGroup(tplId, makerIds, seed) {
    const tpl = TPL[tplId];
    let lastErr;
    for (let att = 0; att < 12; att++) {
      const s = (seed + att * 7919) >>> 0;
      try {
        const p = tpl.params(U.rng(s));
        const st = tpl.stimulus(p);
        const ids = makerIds.slice();
        const qs = [];
        for (let i = 0; i < ids.length; i++) {
          const m = tpl.qs.find((x) => x.id === ids[i]);
          try { qs.push(makeMathQ(tpl, m, p, s * 31 + i * 101)); } catch (e) {
            if (!(e instanceof GE)) throw e;
            // coba pembuat soal lain dari template yang sama
            const rank = (x) => (x.code === m.code ? 0 : 2) + (x.type === m.type ? 0 : 1);
            const alt = tpl.qs.filter((x) => !ids.includes(x.id)).sort((x, y) => rank(x) - rank(y));
            let ok = false;
            for (const am of alt) { try { qs.push(makeMathQ(tpl, am, p, s * 31 + i * 101)); ids[i] = am.id; ok = true; break; } catch (e2) { if (!(e2 instanceof GE)) throw e2; } }
            if (!ok) throw e;
          }
        }
        qs.sort((x, y) => LVR[x.level] - LVR[y.level]);
        return { id: U.uid('g'), stimulus: Object.assign({ id: U.uid('s') }, st), questions: qs, gen: { tpl: tplId, seed: s } };
      } catch (e) { if (!(e instanceof GE)) throw e; lastErr = e; }
    }
    throw lastErr || new GE('kelompok gagal');
  }
  function bankQ(st, q, r) {
    const c = U.clone(q);
    if (c.options && !c.keep) {
      const order = r.shuffle(c.options.map((o, i) => i));
      const keyIdx = (Array.isArray(c.key) ? c.key : [c.key]).map((k) => LET.indexOf(k));
      const opts = order.map((i, j) => Object.assign({}, c.options[i], { id: LET[j] }));
      const newKey = keyIdx.map((ki) => LET[order.indexOf(ki)]).sort();
      c.options = opts;
      c.key = Array.isArray(c.key) ? newKey : newKey[0];
    }
    delete c.keep;
    const meta = { code: q.code, level: q.level, ind: q.ind, variant: q.variant, materi: st.genre, gen: { bank: st.id, q: q.id } };
    delete c.ind; delete c.variant;
    return decorate(c, meta);
  }
  function buildBIGroup(stId, qIds, seed) {
    const st = BIB.byId[stId];
    const r = U.rng(seed);
    const qs = qIds.map((id) => bankQ(st, st.qs.find((q) => q.id === id), r)).sort((x, y) => LVR[x.level] - LVR[y.level]);
    const stim = { id: U.uid('s'), title: st.title, kind: st.kind, genre: st.genre, text: st.text, visuals: U.clone(st.visuals || []), poem: !!st.poem };
    return { id: U.uid('g'), stimulus: stim, questions: qs, gen: { bank: stId, seed } };
  }

  // ---------------- Validasi ----------------
  const CHECKS = [
    ['kisi', 'Kesesuaian dengan kisi-kisi'], ['stimulus', 'Kesesuaian dengan stimulus'], ['jelas', 'Kejelasan kalimat'],
    ['tipe', 'Ketepatan tipe soal'], ['kunci', 'Kebenaran kunci jawaban'], ['bahas', 'Konsistensi pembahasan'],
    ['pengecoh', 'Kelayakan pengecoh'], ['ganda', 'Tidak ada jawaban ganda yang tidak disengaja'],
    ['info', 'Tidak ada informasi yang kurang'], ['duplikat', 'Tidak ada soal duplikat'],
  ];
  const optTxt = (o) => (o.text != null ? o.text : o.alt != null ? o.alt : o.svg ? 'svg' : o.table ? JSON.stringify(o.table) : '');
  function regenSame(q) {
    // menghitung ulang soal dari parameter yang tersimpan (generator lokal)
    if (!q.gen) return null;
    try {
      if (q.gen.tpl) {
        const tpl = TPL[q.gen.tpl]; if (!tpl) return null;
        return { tpl, m: tpl.qs.find((x) => x.id === q.gen.maker) };
      }
    } catch (e) { return null; }
    return null;
  }
  function validate(pkg, a) {
    const res = {}; CHECKS.forEach(([id, name]) => { res[id] = { id, name, status: 'ok', notes: [] }; });
    const flag = (id, level, note) => { const c = res[id]; if (level === 'fail' || (level === 'warn' && c.status === 'ok')) c.status = level; if (note) c.notes.push(note); };
    const scope = new Set((a && a.codes ? a.codes.map((c) => c.code) : (pkg.analysis && pkg.analysis.codes || []).map((c) => c.code)));
    const perQ = {};
    const addQ = (q, msg, lvl = 'warn') => { (perQ[q.id] = perQ[q.id] || []).push({ msg, lvl }); };
    let no = 0;
    const all = [];
    pkg.groups.forEach((g, gi) => {
      if (!g.stimulus || (!U.plain(g.stimulus.text || '').trim() && !(g.stimulus.visuals || []).length)) flag('stimulus', 'fail', `Kelompok ${gi + 1} tidak memiliki stimulus.`);
      if (!g.questions.length) flag('stimulus', 'warn', `Kelompok ${gi + 1} tidak memiliki soal.`);
      const stimTxt = U.plain(g.stimulus && g.stimulus.text || '');
      const nVis = (g.stimulus && g.stimulus.visuals || []).length;
      g.questions.forEach((q) => {
        no++; all.push({ q, no, g });
        const tag = `Soal ${no}`;
        // 1. kisi
        if (scope.size && !scope.has(q.code)) { flag('kisi', 'warn', `${tag} menguji ${TAX.byCode[q.code] ? TAX.byCode[q.code].label : q.code} yang tidak ada di kisi-kisi.`); addQ(q, 'Kompetensi di luar kisi-kisi'); }
        // 3. kejelasan
        const tt = U.plain(q.text || '').trim();
        if (tt.length < 12) { flag('jelas', 'fail', `${tag}: kalimat soal terlalu pendek.`); addQ(q, 'Kalimat soal terlalu pendek', 'fail'); }
        else if (!/(\?|\.{3,4}|[.!:])$/.test(tt)) { flag('jelas', 'warn', `${tag}: kalimat soal tidak diakhiri tanda baca.`); addQ(q, 'Kalimat soal tanpa tanda baca akhir'); }
        if (/ {2,}/.test(q.text || '')) flag('jelas', 'warn', `${tag}: ada spasi ganda.`);
        // 4. tipe
        if (q.type === 'pg') {
          if (!q.options || q.options.length < 3 || q.options.length > 5) { flag('tipe', 'fail', `${tag}: pilihan ganda harus 4–5 opsi.`); addQ(q, 'Jumlah opsi tidak sesuai', 'fail'); }
          if (!q.options || !q.options.some((o) => o.id === q.key)) { flag('tipe', 'fail', `${tag}: kunci tidak ada di opsi.`); addQ(q, 'Kunci tidak ada di opsi', 'fail'); }
        } else if (q.type === 'pgk') {
          const k = Array.isArray(q.key) ? q.key : [];
          if (k.length < 2 || k.length >= (q.options || []).length || !k.every((x) => q.options.some((o) => o.id === x))) { flag('tipe', 'fail', `${tag}: pilihan ganda kompleks harus memiliki ≥2 jawaban benar dan ≥1 pengecoh.`); addQ(q, 'Struktur pilihan ganda kompleks tidak valid', 'fail'); }
        } else if (isTab(q.type)) {
          const ok = q.labels && q.labels.length >= 2 && q.statements && q.statements.length >= 2 && q.statements.every((s) => Number.isInteger(s.key) && s.key >= 0 && s.key < q.labels.length);
          if (!ok) { flag('tipe', 'fail', `${tag}: tabel pernyataan tidak valid.`); addQ(q, 'Tabel pernyataan tidak valid', 'fail'); }
          else if (q.statements.length < 3) flag('tipe', 'warn', `${tag}: sebaiknya minimal 3 pernyataan.`);
        } else { flag('tipe', 'fail', `${tag}: tipe soal tidak dikenal.`); addQ(q, 'Tipe tidak dikenal', 'fail'); }
        // 5. kunci (hitung ulang untuk soal generator lokal)
        if (q.edited) { flag('kunci', 'warn', `${tag} diedit manual; kunci diperiksa oleh guru.`); }
        else if (q.gen && q.gen.tpl) {
          const rs = regenSame(q);
          if (rs && rs.m) {
            try {
              const grp = g.gen && g.gen.tpl === q.gen.tpl ? g.gen : null;
              if (grp) {
                const p = rs.tpl.params(U.rng(grp.seed));
                const q2 = rs.m.make(p, U.rng(q.gen.qseed));
                const same = JSON.stringify([q2.key, (q2.options || []).map(optTxt), (q2.statements || []).map((s) => [s.text, s.key])]) === JSON.stringify([q.key, (q.options || []).map(optTxt), (q.statements || []).map((s) => [s.text, s.key])]);
                if (!same) { flag('kunci', 'fail', `${tag}: kunci berbeda dari hasil perhitungan ulang.`); addQ(q, 'Kunci tidak cocok dengan perhitungan ulang', 'fail'); }
              }
            } catch (e) { flag('kunci', 'warn', `${tag}: perhitungan ulang tidak dapat dijalankan.`); }
          }
        } else if (q.gen && q.gen.bank) {
          // soal bank: cocokkan jawaban dengan bank asli
          const st = BIB.byId[q.gen.bank], oq = st && st.qs.find((x) => x.id === q.gen.q);
          if (oq) {
            const keyTexts = (o) => (Array.isArray(o.key) ? o.key : [o.key]).map((k) => optTxt(o.options.find((x) => x.id === k) || {})).sort().join('|');
            if (q.options && oq.options && keyTexts(q) !== keyTexts(oq)) { flag('kunci', 'fail', `${tag}: kunci tidak sesuai bukti pada teks.`); addQ(q, 'Kunci tidak sesuai bank', 'fail'); }
            if (q.statements && JSON.stringify(q.statements.map((s) => s.key)) !== JSON.stringify(oq.statements.map((s) => s.key))) { flag('kunci', 'fail', `${tag}: kunci tabel tidak sesuai bukti pada teks.`); addQ(q, 'Kunci tabel tidak sesuai bank', 'fail'); }
          }
        } else if (q.ai && !q.aiChecked) { flag('kunci', 'warn', `${tag}: kunci dari AI belum diverifikasi ulang.`); addQ(q, 'Kunci belum diverifikasi ulang'); }
        // 6. pembahasan
        const ex = U.plain(q.explain || '').toLowerCase();
        if (ex.length < 15) { flag('bahas', 'fail', `${tag}: pembahasan kosong atau terlalu singkat.`); addQ(q, 'Pembahasan kosong', 'fail'); }
        else if (q.type === 'pg' && q.options) {
          const ko = q.options.find((o) => o.id === q.key);
          if (ko && ko.text != null) {
            const kt = U.plain(ko.text).toLowerCase().replace(/[“”"]/g, '').trim();
            const kn = U.numVal(ko.text);
            const exn = ex.replace(/[“”"]/g, '');
            const kw = U.words(kt).filter((w) => w.length > 3);
            const overlap = kw.length ? kw.filter((w) => exn.includes(w)).length / kw.length : 0;
            const hit = exn.includes(kt.slice(0, 28)) || overlap >= 0.5 || (kn !== null && (exn.includes(U.fmt(kn).toLowerCase()) || exn.includes(String(kn))));
            if (!hit) { flag('bahas', 'warn', `${tag}: pembahasan tidak menyebut jawaban kunci secara eksplisit.`); }
          }
        }
        // 7. pengecoh
        if (q.options && q.options.length) {
          const texts = q.options.map(optTxt);
          if (texts.some((t) => !U.plain(t).trim())) { flag('pengecoh', 'fail', `${tag}: ada opsi kosong.`); addQ(q, 'Opsi kosong', 'fail'); }
          const lens = q.options.filter((o) => o.text != null).map((o) => U.plain(o.text).length).sort((x, y) => x - y);
          if (lens.length >= 3) {
            const med = lens[Math.floor(lens.length / 2)];
            const keyLen = (Array.isArray(q.key) ? [] : q.options.filter((o) => o.id === q.key && o.text != null).map((o) => U.plain(o.text).length))[0];
            if (keyLen && med > 6 && keyLen > med * 2.4) flag('pengecoh', 'warn', `${tag}: opsi kunci jauh lebih panjang daripada pengecoh.`);
          }
        }
        // 8. jawaban ganda
        if (q.options) {
          const ks = q.options.map((o) => (q.type === 'pgk' ? 't:' + U.norm(optTxt(o)) : U.optKey(optTxt(o))));
          if (new Set(ks).size !== ks.length) { flag('ganda', 'fail', `${tag}: ada opsi yang bernilai sama.`); addQ(q, 'Opsi bernilai sama', 'fail'); }
        }
        if (q.statements) {
          const ks = q.statements.map((s) => U.norm(s.text));
          if (new Set(ks).size !== ks.length) { flag('ganda', 'fail', `${tag}: ada pernyataan kembar.`); addQ(q, 'Pernyataan kembar', 'fail'); }
        }
        // 9. informasi kurang
        const blob = JSON.stringify([q.text, (q.options || []).map((o) => o.text || ''), (q.statements || []).map((s) => s.text), q.explain]);
        if (/undefined|NaN|\bnull\b|\[object|\{\{\s*\}\}/.test(blob)) { flag('info', 'fail', `${tag}: ada teks yang tidak lengkap.`); addQ(q, 'Teks tidak lengkap', 'fail'); }
        if (/gambar 2/i.test(q.text || '') && nVis < 2) { flag('info', 'warn', `${tag} merujuk “Gambar 2”, tetapi stimulus tidak memiliki dua gambar.`); }
        if (/\b(tabel|diagram|piktogram|gambar|infografis|grafik)\b/i.test(q.text || '') && !nVis && !/\b(tabel|diagram|piktogram|gambar|infografis)\b/i.test(stimTxt)) flag('info', 'warn', `${tag} merujuk ilustrasi yang tidak ada pada stimulus.`);
      });
    });
    // 10. duplikat
    const sig = (q) => U.plain(q.text) + ' ' + (q.options || []).map(optTxt).join(' ') + ' ' + (q.statements || []).map((s) => s.text).join(' ');
    for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
      const A = all[i], B = all[j];
      if (A.q.gen && B.q.gen && A.q.gen.tpl && A.q.gen.tpl === B.q.gen.tpl && A.q.gen.maker === B.q.gen.maker) {
        flag('duplikat', 'warn', `Soal ${A.no} dan ${B.no} memakai model soal yang sama.`); addQ(B.q, 'Model soal sama dengan soal lain');
        continue;
      }
      const jac = U.jaccard(sig(A.q), sig(B.q));
      if (jac > 0.82) { flag('duplikat', 'fail', `Soal ${A.no} dan ${B.no} hampir sama.`); addQ(B.q, 'Hampir sama dengan soal lain', 'fail'); }
    }
    // cakupan kisi-kisi
    if (scope.size) {
      const covered = new Set(all.map((x) => x.q.code));
      const miss = [...scope].filter((c) => !covered.has(c));
      if (miss.length) flag('kisi', 'warn', `Belum terwakili: ${miss.map((c) => TAX.byCode[c] ? TAX.byCode[c].label : c).join('; ')}.`);
    }
    const checks = CHECKS.map(([id]) => res[id]);
    return {
      at: Date.now(), checks, perQ,
      summary: { ok: checks.filter((c) => c.status === 'ok').length, warn: checks.filter((c) => c.status === 'warn').length, fail: checks.filter((c) => c.status === 'fail').length, total: no },
    };
  }

  // ---------------- Buat ulang & variasi ----------------
  function regenQuestion(pkg, gi, qi, seed) {
    const g = pkg.groups[gi], q = g.questions[qi];
    seed = seed || U.newSeed();
    if (g.gen && g.gen.tpl) {
      const tpl = TPL[g.gen.tpl];
      const p = tpl.params(U.rng(g.gen.seed));
      const used = g.questions.map((x) => x.gen && x.gen.maker);
      const rank = (m) => (m.code === q.code ? 0 : 2) + (m.type === q.type ? 0 : 1);
      const cands = tpl.qs.filter((m) => !used.includes(m.id)).sort((a, b) => rank(a) - rank(b));
      for (const m of cands) {
        try { const nq = makeMathQ(tpl, m, p, seed); g.questions[qi] = nq; return { ok: true, how: 'Soal diganti dengan model soal lain dari stimulus yang sama.' }; } catch (e) { if (!(e instanceof GE)) throw e; }
      }
      const m0 = tpl.qs.find((m) => m.id === q.gen.maker);
      for (let k = 0; k < 6; k++) {
        try {
          const nq = makeMathQ(tpl, m0, p, seed + k * 13);
          if (JSON.stringify([nq.options, nq.statements]) !== JSON.stringify([q.options, q.statements])) { g.questions[qi] = nq; return { ok: true, how: 'Opsi dan pernyataan soal disusun ulang.' }; }
        } catch (e) { if (!(e instanceof GE)) throw e; }
      }
      return { ok: false, msg: 'Tidak ada variasi lain untuk soal ini. Gunakan “Buat ulang kelompok” atau edit manual.' };
    }
    if (g.gen && g.gen.bank) {
      const st = BIB.byId[g.gen.bank];
      const used = g.questions.map((x) => x.gen && x.gen.q);
      const cands = st.qs.filter((x) => !used.includes(x.id)).sort((a, b) => (a.code === q.code ? 0 : 1) - (b.code === q.code ? 0 : 1));
      if (!cands.length) return { ok: false, msg: 'Semua soal cadangan untuk bacaan ini sudah dipakai. Gunakan “Buat ulang kelompok” atau hubungkan AI.' };
      g.questions[qi] = bankQ(st, cands[0], U.rng(seed));
      return { ok: true, how: 'Soal diganti dengan soal cadangan untuk bacaan yang sama.' };
    }
    return { ok: false, msg: 'Soal ini dibuat oleh AI atau ditambahkan manual. Buat ulang memerlukan koneksi AI.', needAI: true };
  }
  function regenGroup(pkg, gi, seed) {
    const g = pkg.groups[gi];
    seed = seed || U.newSeed();
    if (g.gen && g.gen.tpl) {
      const makers = g.questions.map((q) => q.gen && q.gen.maker).filter(Boolean);
      const ng = buildMathGroup(g.gen.tpl, makers.length ? makers : TPL[g.gen.tpl].qs.slice(0, 3).map((m) => m.id), seed);
      if (g.solo) ng.solo = true;
      pkg.groups[gi] = ng;
      return { ok: true, how: 'Stimulus dan soal dibuat ulang dengan konteks dan angka baru.' };
    }
    if (g.gen && g.gen.bank) {
      const usedSt = pkg.groups.map((x) => x.gen && x.gen.bank);
      const codes = g.questions.map((q) => q.code);
      const cands = BIB.S.filter((s) => !usedSt.includes(s.id)).map((s) => ({ s, sc: s.qs.filter((q) => codes.includes(q.code)).length })).sort((a, b) => b.sc - a.sc);
      if (!cands.length) return { ok: false, msg: 'Semua bacaan di bank lokal sudah dipakai dalam naskah ini. Hubungkan AI untuk membuat bacaan baru.' };
      const st = cands[0].s, r = U.rng(seed);
      const picks = [];
      codes.forEach((c) => { const q = st.qs.find((x) => x.code === c && !picks.includes(x)); if (q) picks.push(q); });
      r.shuffle(st.qs).forEach((q) => { if (picks.length < g.questions.length && !picks.includes(q)) picks.push(q); });
      pkg.groups[gi] = buildBIGroup(st.id, picks.slice(0, Math.max(1, g.questions.length)).map((q) => q.id), seed);
      return { ok: true, how: `Bacaan diganti dengan “${st.title}”.` };

    return { ok: false, msg: 'Kelompok ini dibuat oleh AI atau manual. Buat ulang kelompok memerlukan koneksi AI.', needAI: true };
  }

  // ---------------- Pipeline lokal (7 langkah) ----------------
  const STEPS = ['Menganalisis kisi-kisi', 'Menentukan kompetensi', 'Membuat stimulus', 'Menyusun pertanyaan', 'Membuat kunci jawaban', 'Memvalidasi soal', 'Menyelesaikan naskah'];
  async function runLocal(a, opts = {}, onStep = async () => {}) {
    const seed = opts.seed || U.newSeed();
    const r = U.rng(seed);
    const count = opts.count || autoCount(a);
    const G = Math.max(1, Math.round(count / 3));
    const log = (i, state, detail) => onStep(i, state, detail);
    // 1
    await log(0, 'run');
    const sub = a.subjectName;
    await log(0, 'done', `${sub}: ${a.codes.length} kompetensi dikenali dari ${a.lines.length} baris kisi-kisi. Jenjang: ${a.jenjang.label}.`);
    // 2
    await log(1, 'run');
    const isI = a.subject === 'ipas';
    const isM = a.subject === 'mtk' || isI;
    const { plan, alloc } = isI ? planIPA(a, count, r, opts.avoid || {}) : a.subject === 'mtk' ? planMath(a, G, r, opts.avoid || {}) : planBI(a, Math.min(G, BIB.S.length), r, opts.avoid || {});
    if (!plan.length) throw new GE('Kisi-kisi tidak dapat dipetakan ke bank soal lokal.');
    const allocTxt = a.codes.map((c) => `${c.label} (${alloc[c.code] || 0})`).join('; ');
    const nPlan = isI ? plan.reduce((n, pl) => n + pl.makers.length, 0) : plan.length * 3;
    if (isI) {
      const tg = ipaTargets(nPlan);
      await log(1, 'done', `Alokasi ${nPlan} soal mandiri: ${allocTxt}. Target bentuk: ${tg.types.pg} pilihan ganda dan ${tg.types.pgk + tg.types.tab} pilihan ganda kompleks (MCMA dan tabel Benar/Salah); level ${tg.levels.Pemahaman} pemahaman, ${tg.levels.Penerapan} penerapan, ${tg.levels.Penalaran} penalaran.`);
    } else await log(1, 'done', `Alokasi ${nPlan} soal: ${allocTxt}.`);
    // 3
    await log(2, 'run');
    const groups = [];
    const avoidTitles = new Set((opts.avoid && opts.avoid.titles) || []);
    for (let i = 0; i < plan.length; i++) {
      const pl = plan[i];
      const gseed = (seed + (i + 1) * 104729) >>> 0;
      if (!isM) { groups.push(buildBIGroup(pl.bank, pl.qs, gseed)); continue; }
      if (isI) { const g = buildMathGroup(pl.tpl, pl.makers, gseed); if (g.questions.length === 1) g.solo = true; groups.push(g); continue; }

      const taken = new Set([...avoidTitles, ...groups.map((g) => g.stimulus.title)]);
      let g = buildMathGroup(pl.tpl, pl.makers, gseed);
      for (let k = 1; k <= 10 && taken.has(g.stimulus.title); k++) {
        const alt = buildMathGroup(pl.tpl, pl.makers, (gseed + k * 7777) >>> 0);
        if (!taken.has(alt.stimulus.title)) g = alt;
      }
      groups.push(g);
    }
    const kinds = {};
    groups.forEach((g) => { kinds[g.stimulus.kind] = (kinds[g.stimulus.kind] || 0) + 1; });
    const nSolo = groups.filter((g) => g.solo).length;
    if (isI) await log(2, 'done', `${groups.length} stimulus dibuat (${nSolo} soal mandiri dengan stimulus sendiri): ${Object.entries(kinds).map(([k, v]) => `${v} ${k.toLowerCase()}`).join(', ')}. Gambar disusun dari pustaka gambar IPA bawaan.`);
    else await log(2, 'done', `${groups.length} stimulus dibuat: ${Object.entries(kinds).map(([k, v]) => `${v} ${k.toLowerCase()}`).join(', ')}.`);
    // 4
    await log(3, 'run');
    const qs = groups.flatMap((g) => g.questions);
    const tc = {};
    qs.forEach((q) => { tc[q.type] = (tc[q.type] || 0) + 1; });
    await log(3, 'done', `${qs.length} soal tersusun: ${Object.entries(tc).map(([t, v]) => `${v} ${TAX.TYPE_NAME[t]}`).join(', ')}.`);
    // 5
    await log(4, 'run');
    let nk = 0, ne = 0;
    qs.forEach((q) => { if (q.key != null || q.statements) nk++; if (q.explain) ne++; });
    const lv = {}; qs.forEach((q) => { lv[q.level] = (lv[q.level] || 0) + 1; });
    await log(4, 'done', `${nk} kunci jawaban dan ${ne} pembahasan dibuat. Level kognitif: ${Object.entries(lv).map(([k, v]) => `${k} ${v}`).join(', ')}.`);
    // 6
    await log(5, 'run');
    const pkg = {
      id: opts.id || U.uid('pkg'), v: 1, title: opts.title || (isI ? `Latihan TKAD IPAS ${a.jenjang.label}` : `Latihan TKA ${sub} ${a.jenjang.label}`),
      subject: a.subject, subjectName: sub, jenjang: a.jenjang.label, durasi: opts.durasi || (isI ? (qs.length >= 30 ? 90 : Math.max(15, qs.length * 3)) : Math.max(15, qs.length * 2)),
      createdAt: Date.now(), updatedAt: Date.now(), engine: opts.engine || 'lokal', seed, kisi: opts.kisi || '',
      analysis: { codes: a.codes.map((c) => ({ code: c.code, label: c.label, el: c.el, weight: c.weight })), alloc, notes: a.notes || [], unknown: a.unknown || [] },
      groups, scoring: 'parsial',
    };
    if (isI) pkg.format = 'mandiri';
    let v = validate(pkg, a), fixed = 0;
    for (let round = 0; round < 3 && v.summary.fail; round++) {
      pkg.groups.forEach((g, gi) => g.questions.forEach((q, qi) => {
        if ((v.perQ[q.id] || []).some((x) => x.lvl === 'fail')) { const rr = regenQuestion(pkg, gi, qi, seed + round * 31 + qi); if (rr.ok) fixed++; }
      }));
      v = validate(pkg, a);
    }
    pkg.validation = v; v.fixed = fixed;
    await log(5, 'done', `10 pemeriksaan: ${v.summary.ok} lolos, ${v.summary.warn} catatan, ${v.summary.fail} gagal. Perhitungan ulang kunci: ${qs.length} soal. Perbaikan otomatis: ${fixed}.`);
    // 7
    await log(6, 'run');
    await log(6, 'done', `Naskah “${pkg.title}” siap: ${pkg.groups.reduce((s, g) => s + g.questions.length, 0)} soal, ${pkg.groups.length} kelompok stimulus, durasi ${pkg.durasi} menit.`);
    return pkg;
  }
  // versi sinkron (untuk paket contoh)
  function buildSync(a, opts = {}) {
    let out = null;
    const p = runLocal(a, opts, () => {});
    // runLocal tidak benar-benar asinkron tanpa onStep yang menunggu; gunakan then
    return p;
  }

  // ---------------- Penilaian ----------------
  function scoreQuestion(q, ans, mode = 'parsial') {
    const empty = ans == null || (Array.isArray(ans) && (q.type === 'pgk' ? ans.length === 0 : ans.every((x) => x == null)));
    if (empty) return { score: 0, status: 'kosong' };
    if (q.type === 'pg') return ans === q.key ? { score: 1, status: 'benar' } : { score: 0, status: 'salah' };
    if (q.type === 'pgk') {
      const K = new Set(q.key), A = new Set(ans);
      const tp = [...A].filter((x) => K.has(x)).length, fp = [...A].filter((x) => !K.has(x)).length;
      const full = tp === K.size && fp === 0;
      if (full) return { score: 1, status: 'benar' };
      const part = Math.max(0, (tp - fp) / K.size);
      return { score: mode === 'parsial' ? part : 0, status: part > 0 && mode === 'parsial' ? 'sebagian' : 'salah' };
    }
    if (isTab(q.type)) {
      const n = q.statements.length;
      const ok = q.statements.filter((s, i) => ans[i] === s.key).length;
      if (ok === n) return { score: 1, status: 'benar' };
      const part = ok / n;
      return { score: mode === 'parsial' ? part : 0, status: part > 0 && mode === 'parsial' ? 'sebagian' : 'salah' };
    }
    return { score: 0, status: 'salah' };
  }
  function flat(pkg) {
    const out = []; let no = 0;
    pkg.groups.forEach((g, gi) => g.questions.forEach((q, qi) => { no++; out.push({ no, q, g, gi, qi }); }));
    return out;
  }
  function scoreAttempt(pkg, answers, mode) {
    const F = flat(pkg);
    let sum = 0, benar = 0, salah = 0, kosong = 0, sebagian = 0;
    const per = {};
    const items = F.map(({ no, q }) => {
      const r = scoreQuestion(q, answers[q.id], mode || pkg.scoring);
      sum += r.score;
      if (r.status === 'benar') benar++; else if (r.status === 'kosong') kosong++; else { salah++; if (r.status === 'sebagian') sebagian++; }
      const key = q.submateri || q.materi || 'Lainnya';
      const pp = (per[key] = per[key] || { label: key, materi: q.materi || '', code: q.code, n: 0, score: 0 });
      pp.n++; pp.score += r.score;
      return { no, id: q.id, score: r.score, status: r.status };
    });
    const N = F.length || 1;
    const nilai = Math.round((sum / N) * 1000) / 10;
    const answered = benar + salah;
    const perList = Object.values(per).map((x) => Object.assign(x, { pct: Math.round((x.score / x.n) * 100) })).sort((a, b) => a.pct - b.pct);
    const recs = perList.filter((x) => x.pct < 70).map((x) => ({ label: x.label, pct: x.pct, tip: (TAX.byCode[x.code] && TAX.byCode[x.code].tip) || `Pelajari kembali materi ${x.label.toLowerCase()} dan kerjakan latihan serupa.` }));
    return { nilai, benar, salah, kosong, sebagian, total: F.length, akurasi: answered ? Math.round((benar / answered) * 100) : 0, items, per: perList, recs };
  }

  function stats(pkg) {
    const F = flat(pkg);
    const by = (f) => F.reduce((m, x) => { const k = f(x.q); m[k] = (m[k] || 0) + 1; return m; }, {});
    return { n: F.length, groups: pkg.groups.length, types: by((q) => q.type), levels: by((q) => q.level || '-'), forms: by((q) => q.form || (q.variant === 'diagram' ? 'Interpretasi diagram' : q.variant === 'visual' ? 'Interpretasi visual' : '')), materi: by((q) => q.materi || '-'), sub: by((q) => q.submateri || '-') };

  return { TPL, KISI_MTK, KISI_BI, KISI_IPA, analyze, autoCount, planMath, planBI, planIPA, ipaTargets, buildMathGroup, buildBIGroup, validate, regenQuestion, regenGroup, runLocal, buildSync, STEPS, scoreQuestion, scoreAttempt, flat, stats, CHECKS };
})();

/* ===== 70_store.js ===== */
/* ==========================================================================
   70_store.js — penyimpanan lokal (localStorage) dengan cadangan memori.
   ========================================================================== */
const STORE = (() => {
  const NS = 'tkaguru.v1.';
  const mem = {};
  let ok = true;
  try { const k = NS + '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch (e) { ok = false; }
  function raw(k) { try { return ok ? localStorage.getItem(NS + k) : (mem[k] == null ? null : mem[k]); } catch (e) { return mem[k] == null ? null : mem[k]; } }
  function get(k, def) { const v = raw(k); if (v == null) return def; try { return JSON.parse(v); } catch (e) { return def; } }
  function set(k, v) {
    const s = JSON.stringify(v);
    if (!ok) { mem[k] = s; return true; }
    try { localStorage.setItem(NS + k, s); return true; } catch (e) {
      mem[k] = s;
      const err = new Error('Penyimpanan browser penuh. Hapus naskah atau riwayat lama, lalu coba lagi.');
      err.quota = true; throw err;
    }
  }
  function del(k) { try { if (ok) localStorage.removeItem(NS + k); } catch (e) { /* abaikan */ } delete mem[k]; }

  // ---- Paket ----
  const idx = () => get('pkgs', []);
  function summary(p) {
    const n = p.groups.reduce((s, g) => s + g.questions.length, 0);
    return { id: p.id, title: p.title, subject: p.subject, subjectName: p.subjectName, jenjang: p.jenjang, n, groups: p.groups.length, durasi: p.durasi, engine: p.engine, createdAt: p.createdAt, updatedAt: p.updatedAt, builtin: p.builtin || null, val: p.validation ? p.validation.summary : null };
  }
  function listPkgs() { return idx().slice().sort((a, b) => b.createdAt - a.createdAt); }
  function getPkg(id) { return get('pkg.' + id, null); }
  function savePkg(p, touch = true) {
    if (touch) p.updatedAt = Date.now();
    set('pkg.' + p.id, p);
    const list = idx().filter((x) => x.id !== p.id);
    list.push(summary(p));
    set('pkgs', list);
    return p;
  }
  function delPkg(id) { del('pkg.' + id); set('pkgs', idx().filter((x) => x.id !== id)); del('attempt.' + id); }

  // ---- Pengaturan ----
  const DEF = { name: '', school: '', year: '', scoring: 'parsial', ai: { url: '', token: '', verifiedAt: 0, model: '' }, demoSeeded: false, hidden: [] };
  function settings() { return Object.assign({}, DEF, get('settings', {}), { ai: Object.assign({}, DEF.ai, (get('settings', {}) || {}).ai || {}) }); }
  function saveSettings(s) { set('settings', s); return s; }

  // ---- Hasil ujian ----
  function results() { return get('results', []); }
  function addResult(r) { const l = results().filter((x) => x.id !== r.id); l.unshift(r); set('results', l.slice(0, 150)); }
  function getResult(id) { return results().find((x) => x.id === id) || null; }
  function delResult(id) { set('results', results().filter((x) => x.id !== id)); }

  // ---- Percobaan berjalan ----
  const getAttempt = (key) => get('attempt.' + key, null);
  const setAttempt = (key, a) => set('attempt.' + key, a);
  const clearAttempt = (key) => del('attempt.' + key);

  function exportAll() {
    return { app: 'TKA GURU', v: 1, exportedAt: Date.now(), settings: Object.assign({}, settings(), { ai: Object.assign({}, settings().ai, { token: '' }) }), packages: listPkgs().map((s) => getPkg(s.id)).filter(Boolean), results: results() };
  }
  function clearAll() {
    try { if (ok) Object.keys(localStorage).filter((k) => k.indexOf(NS) === 0).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* abaikan */ }
    Object.keys(mem).forEach((k) => delete mem[k]);
  }
  return { ok: () => ok, get, set, del, listPkgs, getPkg, savePkg, delPkg, settings, saveSettings, results, addResult, getResult, delResult, getAttempt, setAttempt, clearAttempt, exportAll, clearAll };
})();

/* ==========================================================================
   72_ai.js — Integrasi AI Gemini melalui proxy aman (Apps Script atau
   Cloudflare Worker). Kunci API TIDAK pernah disimpan di file HTML ini:
   aplikasi hanya mengenal URL proxy (dan token akses opsional).
   Alur: analisis kisi-kisi → stimulus → soal → normalisasi kunci →
   validasi silang AI + validasi lokal → naskah.
   ========================================================================== */
const AI = (() => {
  class AIError extends Error {}
  const LET = ['A', 'B', 'C', 'D', 'E', 'F'];
  const cfg = () => STORE.settings().ai || {};
  const ready = () => { const c = cfg(); return !!(c.url && c.verifiedAt); };

  async function post(body, signal, timeoutMs = 170000, override) {
    const c = override || cfg();
    if (!c.url) throw new AIError('AI belum terhubung. Isi URL proxy di Pengaturan.');
    if (!/^https:\/\//i.test(c.url)) throw new AIError('URL proxy harus diawali https://');
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), timeoutMs);
    const onAbort = () => ctrl.abort();
    if (signal) signal.addEventListener('abort', onAbort, { once: true });

      res = await fetch(c.url, { method: 'POST', body: JSON.stringify(Object.assign({ token: c.token || '' }, body)), signal: ctrl.signal, redirect: 'follow', credentials: 'omit' });
    } catch (e) {

    } finally { clearTimeout(to); if (signal) signal.removeEventListener('abort', onAbort); }

    let data;
    try { data = JSON.parse(txt); } catch (e) { throw new AIError(`Respons proxy bukan JSON (HTTP ${res.status}). Pastikan URL yang dipakai adalah URL web app yang berakhiran /exec.`); }
    if (!data.ok) throw classify(new AIError(data.error || 'Proxy mengembalikan galat.'), data);
    return data;
  }
  // ---- Batas pemakaian Gemini (HTTP 429) ----
  // Batas per menit: aplikasi menunggu sesuai waktu yang diminta Google, lalu melanjutkan.
  // Batas harian: proses dihentikan dengan pesan yang jelas (tidak diakali dengan kunci lain).
  const RATE_RE = /quota|rate.?limit|resource.?exhausted|too many requests|\b429\b/i;
  const DAY_RE = /per.?day|perday|daily|harian/i;
  function secondsOf(str) {
    const m = /(?:(\d+)\s*h)?\s*(?:(\d+)\s*m(?!s))?\s*(?:([\d.]+)\s*s)?/i.exec(String(str || '').trim());
    if (!m || !(m[1] || m[2] || m[3])) return 0;
    return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + Math.ceil(parseFloat(m[3] || 0));
  }

  const BUSY_RE = /high demand|overload|unavailable|try again later|\b50[0234]\b|internal error|backend error|deadline exceeded/i;

      er.message = `Server Gemini sedang sibuk${st ? ` (HTTP ${st})` : ''}. Ini gangguan sementara di pihak Google, bukan masalah API key atau kuota, dan biasanya pulih dalam beberapa menit. Coba lagi nanti, atau gunakan generator lokal. Pesan Google: “${msg.slice(0, 160)}”`;
      return er;
    }
    if (!(st === 429 || RATE_RE.test(msg))) return er;
    er.rate = true;
    if (/limit:\s*0\b/i.test(msg)) {
      const mdl = (data && data.model) || ((/model:\s*([\w.\-]+)/i.exec(msg) || [])[1]) || 'yang dipakai';
      er.daily = true;
      er.message = `Model ${mdl} tidak tersedia untuk API key ini pada paket gratis (kuotanya 0, bukan gangguan sementara). Ganti GEMINI_MODEL di Script Properties Apps Script ke model lain yang tersedia, misalnya gemini-flash-lite-latest, lalu klik Lanjutkan dengan AI.`;

    }
    const hint = (data && data.retryDelay) || ((/retry in\s+([\dhms.\s]+?)(?:\.\s|\.?$|\n)/i.exec(msg) || [])[1]) || '';

    const t = setTimeout(resolve, ms);

  });

  function noteWait(sec, busy) {
    const now = Date.now();

      pk.indikator.forEach((x) => { meta[x.kode] = { code: 'AI-' + x.kode, label: x.kompetensi || x.kode, materi: x.materi || pk.mapel, level: x.level }; });
      const used = new Set(plan.flatMap((r) => r.kode_indikator || []));
      hooks.step(ti, 1, 'done', `${plan.length} kelompok stimulus × 3 soal; ${used.size} dari ${pk.indikator.length} indikator masuk rancangan.`);
      // 3–4. Stimulus + soal: dua kelompok per permintaan (hemat kuota API key gratis)
      hooks.step(ti, 2, 'run', `Menulis stimulus dan soal (${Math.ceil(plan.length / PER_CALL)} permintaan, ${PER_CALL} kelompok per permintaan)…`);
      const chunks = []; for (let i = 0; i < plan.length; i += PER_CALL) chunks.push(plan.slice(i, i + PER_CALL));
      const stims = {}, raws = {}; const fails = [];
      let doneC = 0;
      const fatal = (e) => e.name === 'AbortError' || e.rate || e.busy;
      // Mengambil hasil per kelompok; mengembalikan rancangan yang belum berhasil.
      const take = (res, items) => {
        const list = Array.isArray(res && res.kelompok) ? res.kelompok : [];
        return items.filter((r, k) => {
          const item = list.find((x) => +x.no === r.no) || (list.length === items.length ? list[k] : null);
          if (!item) return true;
          const st = normStimulus(item.stimulus || item);
          if (!(st.text || st.visuals.length) || !Array.isArray(item.soal) || !item.soal.length) return true;
          stims[r.no] = st; raws[r.no] = item.soal; return false;
        });
      };
      const single = async (r) => {
        try { if (take(await ask(pKelompok(pk, [r]), signal, 0.75, 1, true), [r]).length) fails.push(r.no); } catch (e) { if (fatal(e)) throw e; fails.push(r.no); }
      };
      await pool(chunks, 2, async (b) => {
        let missing;
        // Permintaan gabungan tidak diulang bila gagal (mis. batas waktu ±60 detik Apps Script);
        // kelompok yang belum jadi langsung diminta satu per satu.
        try { missing = take(await ask(pKelompok(pk, b), signal, 0.75, b.length > 1 ? 0 : 2, true), b); } catch (e) { if (fatal(e)) throw e; missing = b; }
        for (const r of missing) { if (b.length > 1) await single(r); else fails.push(r.no); }
        doneC++; hooks.sub(ti, doneC / chunks.length);
      }, signal);
      const okPlan = plan.filter((r) => stims[r.no]);
      if (!okPlan.length) throw new AIError('AI gagal membuat stimulus dan soal.');
      hooks.step(ti, 2, 'done', `${okPlan.length} stimulus dibuat: ${okPlan.map((r) => stims[r.no].kind.toLowerCase()).slice(0, 10).join(', ')}.`);
      hooks.step(ti, 3, 'done', `${okPlan.reduce((n, r) => n + Math.min(3, raws[r.no].length), 0)} soal tersusun${fails.length ? `; ${fails.length} kelompok gagal dan dilewati` : ''}.`);
      // 5. Kunci & normalisasi
      hooks.step(ti, 4, 'run');
      const groups = [];
      okPlan.forEach((r) => {
        const qs = [];
        (raws[r.no] || []).slice(0, 3).forEach((rq, k) => {
          const kode = rq.kode_indikator || (r.kode_indikator || [])[k];
          const m = meta[kode] || { code: 'AI-' + (kode || 'X'), label: kode || 'Kompetensi', materi: pk.mapel };
          try { const q = normQuestion(rq, m); if ((q.options && q.options.length >= 3 && (q.type === 'pg' ? q.key : q.key.length)) || (q.statements && q.statements.length >= 2)) qs.push(q); } catch (e) { /* lewati */ }
        });
        if (qs.length) groups.push({ id: U.uid('g'), stimulus: stims[r.no], questions: qs, gen: { ai: true, plan: r } });
      });
      if (groups.length < Math.max(1, Math.ceil(okPlan.length / 2))) throw new AIError('Sebagian besar soal dari AI tidak dapat dibaca. Coba lagi.');
      const nq = groups.reduce((n, g) => n + g.questions.length, 0);
      hooks.step(ti, 4, 'done', `${nq} kunci jawaban dan pembahasan dipetakan ke format naskah.`);
      // 6. Validasi silang AI (satu permintaan untuk seluruh naskah) + validasi lokal
      hooks.step(ti, 5, 'run', 'AI memeriksa ulang kunci dan pembahasan seluruh soal…');
      let fixed = 0, vErr = 0;
      try {
        const payload = groups.map((g, gi) => ({ no_kelompok: gi + 1, stimulus: { judul: g.stimulus.title, teks: g.stimulus.text, visual: g.stimulus.visuals.map((v) => (v.type === 'svg' ? '[gambar]' : v)) }, soal: g.questions.map(exportQ) }));
        const res = await ask(pValidasi(pk, payload), signal, 0.2, 1, true);
        (res.hasil || []).forEach((hh) => {
          const g = groups[(hh.no_kelompok || 0) - 1]; if (!g) return;
          const qi = (hh.no_soal || 0) - 1; const q = g.questions[qi]; if (!q) return;
          if (hh.status === 'diperbaiki' && hh.soal) {
            try { const nq2 = normQuestion(Object.assign({ bentuk: q.type, kode_indikator: null, level: q.level, indikator_soal: q.indikator }, hh.soal), { code: q.code, label: q.submateri, materi: q.materi }); nq2.aiChecked = true; nq2.aiNote = hh.catatan || ''; g.questions[qi] = nq2; fixed++; } catch (e) { /* biarkan */ }
          } else q.aiChecked = true;
        });
      } catch (e) { if (e.name === 'AbortError') throw e; vErr++; }
      hooks.sub(ti, 1);
      const pkg = {
        id: U.uid('pkg'), v: 1, title: opts.title || pk.judul || `Latihan TKA ${pk.mapel} ${pk.jenjang}`, subject: subjOf(pk.mapel), subjectName: /indonesia/i.test(pk.mapel) ? 'Bahasa Indonesia' : 'Matematika',
        jenjang: pk.jenjang, durasi: opts.durasi || Math.max(15, nq * 2), createdAt: Date.now(), updatedAt: Date.now(), engine: 'ai', aiModel: lastModel, aiCodes: true, kisi: text,
        analysis: { codes: pk.indikator.map((x) => ({ code: 'AI-' + x.kode, label: x.kompetensi, el: x.materi, weight: 1 })), notes: [] }, groups, scoring: STORE.settings().scoring || 'parsial',
      };
      cleanPackage(pkg);
      const v = ENGINE.validate(pkg, { codes: pkg.analysis.codes });
      v.fixed = fixed; pkg.validation = v;
      hooks.step(ti, 5, 'done', `Validasi silang AI: ${fixed} soal diperbaiki${vErr ? ' (pemeriksaan AI dilewati karena gagal; validasi lokal tetap berjalan)' : ''}. Validasi lokal: ${v.summary.ok} lolos, ${v.summary.warn} catatan, ${v.summary.fail} gagal.`);
      hooks.step(ti, 6, 'run');
      hooks.step(ti, 6, 'done', `Naskah “${pkg.title}” siap: ${nq} soal, ${groups.length} stimulus.`);
      out.push(pkg);
    }
    cacheClear(); // proses selesai: cache bagian tidak diperlukan lagi
    const last = out.length - 1, lp = out[last];
    hooks.step(last, 6, 'done', `Naskah “${lp.title}” siap. Total permintaan AI: ${reqStat.sent}${reqStat.cached ? ` (+${reqStat.cached} bagian dipakai ulang dari proses sebelumnya)` : ''}${Object.keys(reqStat.models).length > 1 ? `; model: ${Object.keys(reqStat.models).join(', ')}` : ''}.`);
    return out;
  }

  async function regenQuestion(pkg, gi, qi) {
    const g = pkg.groups[gi], q = g.questions[qi];
    const pk = { mapel: pkg.subjectName, jenjang: pkg.jenjang, indikator: [{ kode: 'X', kompetensi: q.submateri || q.indikator || '', materi: q.materi || '', level: q.level }] };
    const prompt = `TAHAP: MENYUSUN SOAL PENGGANTI
${pSoal(pk, { kode_indikator: ['X'], bentuk: [q.type] }, g.stimulus).replace('Buat tepat 3 soal', 'Buat tepat 1 soal')}
Soal lain pada stimulus ini (jangan diulang): ${JSON.stringify(g.questions.filter((x, i) => i !== qi).map((x) => x.text))}
Soal yang diganti: ${JSON.stringify(q.text)}`;
    const res = await ask(prompt, null, 0.9);
    const raw = (res.soal || [])[0];
    if (!raw) return { ok: false, msg: 'AI tidak mengembalikan soal.' };
    const nq = normQuestion(raw, { code: q.code, label: q.submateri, materi: q.materi });
    g.questions[qi] = nq;
    return { ok: true, how: 'Soal dibuat ulang oleh AI.' };
  }
  async function regenGroup(pkg, gi) {
    const g = pkg.groups[gi];
    const inds = g.questions.map((q, i) => ({ kode: 'K' + (i + 1), kompetensi: q.submateri || q.indikator, materi: q.materi, level: q.level }));
    const pk = { mapel: pkg.subjectName, jenjang: pkg.jenjang, indikator: inds };
    const plan = { no: 1, jenis_stimulus: (g.stimulus && g.stimulus.kind) || 'stimulus', ide: 'stimulus baru yang berbeda dari sebelumnya', kode_indikator: inds.map((x) => x.kode), bentuk: g.questions.map((q) => q.type) };
    const res = await ask(pKelompok(pk, [plan]), null, 0.85);
    const item = (res.kelompok || [])[0] || {};
    const st = normStimulus(item.stimulus || {});
    if (!st.text && !st.visuals.length) return { ok: false, msg: 'AI tidak mengembalikan stimulus.' };
    const qs = (item.soal || []).slice(0, 3).map((rq, k) => { const ind = inds[k] || inds[0]; return normQuestion(rq, { code: g.questions[k] ? g.questions[k].code : 'AI-X', label: ind.kompetensi, materi: ind.materi }); });
    if (!qs.length) return { ok: false, msg: 'AI tidak mengembalikan soal.' };
    pkg.groups[gi] = { id: U.uid('g'), stimulus: cleanPackage({ groups: [{ stimulus: st, questions: [] }] }).groups[0].stimulus, questions: qs, gen: { ai: true } };
    return { ok: true, how: 'Stimulus dan soal dibuat ulang oleh AI.' };
  }

const SAFE_EL = new Set(['svg', 'g', 'defs', 'title', 'desc', 'rect', 'circle', 'ellipse', 'line', 'polyline', 'polygon', 'path', 'text', 'tspan', 'pattern', 'clipPath', 'marker', 'linearGradient', 'radialGradient', 'stop', 'use']);
const SAFE_AT = new Set(['xmlns', 'viewbox', 'width', 'height', 'x', 'y', 'x1', 'y1', 'x2', 'y2', 'cx', 'cy', 'r', 'rx', 'ry', 'd', 'points', 'fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'opacity', 'fill-opacity', 'stroke-opacity', 'transform', 'font-size', 'font-weight', 'font-family', 'font-style', 'text-anchor', 'dominant-baseline', 'id', 'class', 'clip-path', 'marker-end', 'marker-start', 'refx', 'refy', 'markerwidth', 'markerheight', 'orient', 'preserveaspectratio', 'patternunits', 'patterntransform', 'offset', 'stop-color', 'letter-spacing', 'dx', 'dy', 'role', 'aria-label', 'href', 'xlink:href', 'style', 'gradientunits', 'fill-rule', 'clip-rule', 'markerunits']);
function sanitizeSvg(str) {
  if (!str || typeof DOMParser === 'undefined') return '';

  try { doc = new DOMParser().parseFromString(String(str), 'image/svg+xml'); } catch (e) { return ''; }
  const root = doc.documentElement;
  if (!root || root.nodeName.toLowerCase() !== 'svg' || doc.getElementsByTagName('parsererror').length) return '';
  const walk = (el) => {
    Array.from(el.childNodes).forEach((ch) => {
      if (ch.nodeType === 1) { if (!SAFE_EL.has(ch.nodeName)) ch.remove(); else walk(ch); } else if (ch.nodeType !== 3) ch.remove();
    });
    Array.from(el.attributes).forEach((a) => {
      const n = a.name.toLowerCase(), v = a.value;
      if (n.indexOf('on') === 0) return el.removeAttribute(a.name);
      if (n === 'href' || n === 'xlink:href') { if (!/^#[\w-]+$/.test(v)) el.removeAttribute(a.name); return; }
      if (!SAFE_AT.has(n)) return el.removeAttribute(a.name);
      if (/javascript:|expression\(|url\(\s*(?!#)|@import/i.test(v)) el.removeAttribute(a.name);
    });
  };
  walk(root);
  if (!root.getAttribute('viewBox') && root.getAttribute('width') && root.getAttribute('height')) root.setAttribute('viewBox', `0 0 ${parseFloat(root.getAttribute('width')) || 300} ${parseFloat(root.getAttribute('height')) || 150}`);
  // SVG tanpa ukuran akan melebar memenuhi kertas; beri ukuran alami dari viewBox (maks. 480 px).
  const vb = String(root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(parseFloat);
  if ((!root.getAttribute('width') || /%/.test(root.getAttribute('width'))) && vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
    const w = Math.min(480, vb[2]);
    root.setAttribute('width', String(Math.round(w))); root.setAttribute('height', String(Math.round((w * vb[3]) / vb[2])));
  }
  return new XMLSerializer().serializeToString(root);
}

  // dipakai untuk paket dari AI, impor file, atau tautan
  const cs = (v) => { if (v && v.type === 'svg') v.svg = sanitizeSvg(v.svg); return v; };
  (p.groups || []).forEach((g) => {

}

        ${t.error ? `<div class="callout warn" style="margin-top:12px">${esc(t.error)}</div>` : ''}</section>`;

async function runProc(P) {

  try {
    if (P.engine === 'ai') {
      // IPAS selalu disusun generator lokal (gambar dari pustaka bawaan); mata pelajaran lain oleh AI.
      const loc = ENGINE.analyze(P.text).analyses;
      const ipas = P.ipasDone ? [] : loc.filter((a) => a.subject === 'ipas');
      const needAI = !loc.length || loc.some((a) => a.subject !== 'ipas');

          step: (ti, si, state, detail) => { const t = P.tracks[base + ti]; if (!t) return; t.steps[si] = { state, detail }; if (state === 'done') t.sub = 0; renderProc(); },

        avoid = {
          tpls: src.groups.map((g) => g.gen && g.gen.tpl).filter(Boolean),
          stimuli: src.groups.map((g) => g.gen && g.gen.bank).filter(Boolean),
          qs: src.groups.flatMap((g) => g.questions.map((q) => (q.gen && q.gen.bank ? q.gen.bank + ':' + q.gen.q : null))).filter(Boolean),
          makers: src.groups.flatMap((g) => g.questions.map((q) => (q.gen && q.gen.tpl ? q.gen.tpl + ':' + q.gen.maker : null))).filter(Boolean),
          titles: src.groups.map((g) => g.stimulus && g.stimulus.title).filter(Boolean),
        };
        P.text = src.kisi || P.text;
      } else analyses = ENGINE.analyze(P.text).analyses.filter((a) => !(P.ipasDone && a.subject === 'ipas'));
      if (!analyses.length) throw new Error('Kisi-kisi tidak dikenali oleh generator lokal.');
      const total = analyses.length + (P.ipasDone ? 1 : 0);
      P.tracks = [];
      for (const a of analyses) await localTrack(P, a, total, avoid, minStep);
    }
    P.state = 'done';
    renderProc();
    toast(P.tracks.length > 1 ? `${P.tracks.length} naskah selesai disusun.` : 'Naskah selesai disusun.', 'ok');
  } catch (e) {
    P.state = 'error';
    P.error = e.name === 'AbortError' ? 'Proses dibatalkan.' : (e.quota ? e.message : e.message || String(e));
    P.tracks.forEach((t) => { const k = t.steps.findIndex((s) => s && s.state === 'run'); if (k >= 0) t.steps[k] = { state: 'err', detail: P.error }; });
    renderProc();
  }
}
// Satu paket dari generator lokal (dipakai juga untuk IPAS ketika mesin AI dipilih).
async function localTrack(P, a, nTracks, avoid, minStep) {
  const t = { label: `Paket ${a.subjectName} — ${a.jenjang.label}`, subject: a.subject, subjectName: a.subjectName, steps: [], local: P.engine === 'ai' };
  P.tracks.push(t);
  renderProc();
  const pkg = await ENGINE.runLocal(a, { count: P.opts.count || 0, durasi: P.opts.durasi || 0, avoid, title: P.opts.title ? (nTracks > 1 ? `${P.opts.title} — ${a.subjectName}` : P.opts.title) : '', kisi: P.text }, async (si, state, detail) => {
    t.steps[si] = { state, detail };
    renderProc();
    await U.sleep(state === 'run' ? 90 : minStep);
  });
  pkg.scoring = STORE.settings().scoring || 'parsial';
  STORE.savePkg(pkg);
  t.pkgId = pkg.id;
  renderProc();
  return pkg;
}
ACT['proc:cancel'] = () => { if (APP.proc && APP.proc.ctrl) APP.proc.ctrl.abort(); };
ACT['proc:local'] = () => { const P = APP.proc; APP.proc = { text: P.text, engine: 'lokal', opts: P.opts, tracks: [], state: 'idle', started: Date.now(), ipasDone: P.ipasDone }; VIEWS.process(); };
ACT['proc:retry'] = () => { const P = APP.proc; APP.proc = { text: P.text, engine: 'ai', opts: P.opts, tracks: [], state: 'idle', started: Date.now(), ipasDone: P.ipasDone }; VIEWS.process(); };

function pkgAnalysis(p) {
  if (p.kisi) {
    const r = ENGINE.analyze(p.kisi);
    const a = r.analyses.find((x) => x.subject === p.subject);
    if (a && !p.aiCodes) return a;
  }
  const codes = (p.analysis && p.analysis.codes) || [];
  return { subject: p.subject, subjectName: p.subjectName, jenjang: TAX.detectJenjang(p.jenjang || ''), codes: codes.map((c) => Object.assign({ weight: 1 }, c)), lines: [], notes: [], unknown: [] };
}
function kopHTML(p, sub) {
  const s = STORE.settings();
  return `<header class="kop"><div class="s1">${esc(s.school || (p.subject === 'ipas' ? 'LATIHAN TES KEMAMPUAN AKADEMIK DAERAH (TKAD)' : 'LATIHAN TES KEMAMPUAN AKADEMIK (TKA)'))}</div><div class="s2">${esc(p.title)}</div><div class="s3">${esc(sub || `${p.subjectName} • ${p.jenjang}`)}${s.year ? ' • Tahun Pelajaran ' + esc(s.year) : ''}</div></header>`;
}
function groupIntro(p, g, a, b) {
  const nums = a === b ? `nomor ${a}` : `nomor ${a}–${b}`;
  const st = g.stimulus || {};
  const k = String(st.kind || '');
  let verb;
  if (p.subject === 'bi') verb = /infografis/i.test(k) ? 'Perhatikan infografis berikut' : st.poem ? 'Bacalah puisi berikut' : /diagram/i.test(k) ? 'Bacalah teks dan diagram berikut' : /tabel/i.test(k) ? (/pengumuman/i.test(k) ? 'Bacalah pengumuman dan tabel berikut' : 'Bacalah teks dan tabel berikut') : /pengumuman/i.test(k) ? 'Bacalah pengumuman berikut' : /surat/i.test(k) ? 'Bacalah surat berikut' : 'Bacalah teks berikut';
  else if (/piktogram/i.test(k)) verb = 'Perhatikan piktogram berikut';
  else if (/diagram/i.test(k)) verb = 'Perhatikan diagram berikut';
  else if (/ilustrasi|gambar|denah/i.test(k)) verb = 'Perhatikan gambar berikut';
  else if (/tabel|daftar|jadwal/i.test(k)) verb = 'Perhatikan tabel berikut';
  else verb = 'Bacalah informasi berikut';
  return `${verb} untuk menjawab soal ${nums}.`;
}

const cssStr = (s) => String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/[\n\r]/g, ' ');

function slimPkg(p) {
  const c = U.clone(p);
  delete c.kisi; if (c.validation) c.validation = { summary: c.validation.summary, at: c.validation.at, checks: [] };
  if (c.analysis) c.analysis = { codes: c.analysis.codes };

// ---------------- Hasil & pembahasan ----------------
function statusChip(st) {
  return { benar: '<span class="chip ok">Benar</span>', sebagian: '<span class="chip warn">Benar sebagian</span>', salah: '<span class="chip bad">Salah</span>', kosong: '<span class="chip gray">Tidak dijawab</span>' }[st] || '';
}
function reviewHTML(q, no, ans, st, stimLabel) {
  let body = '';
  if (q.type === 'pg' || q.type === 'pgk') {
    const keys = q.type === 'pg' ? [q.key] : q.key;
    const picks = q.type === 'pg' ? (ans ? [ans] : []) : (ans || []);
    body = q.options.map((o) => {
      const k = keys.includes(o.id), pk = picks.includes(o.id);
      return `<div class="ropt ${k ? 'key' : ''} ${pk ? 'pick' : ''} ${pk && !k ? 'wrong' : ''}"><span class="bub ${q.type === 'pgk' ? 'sq' : ''}">${o.id}</span><div style="flex:1;min-width:0">${optContent(o)}</div><span class="tag">${k && pk ? '✓ Jawabanmu benar' : k ? '✓ Kunci' : pk ? '✗ Jawabanmu' : ''}</span></div>`;
    }).join('');
  } else {
    const arr = ans || [];
    body = `<table class="xtbl"><thead><tr><th>Pernyataan</th><th>Jawabanmu</th><th>Kunci</th></tr></thead><tbody>${q.statements.map((s, i) => {
      const ok = arr[i] === s.key;
      return `<tr><td>${mdi(s.text)}</td><td class="c" style="width:120px"><span class="${arr[i] == null ? 'muted' : ok ? 'mk-ok' : 'mk-bad'}">${arr[i] == null ? '—' : esc(q.labels[arr[i]]) + (ok ? ' ✓' : ' ✗')}</span></td><td class="c" style="width:120px"><b>${esc(q.labels[s.key])}</b></td></tr>`;
    }).join('')}</tbody></table>`;
  }
  return `<article class="rev"><div class="rh"><span class="qnum" style="width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800">${no}</span>${statusChip(st)}<span class="chip gray">${esc(typeName(q))}</span><span class="small muted">${esc(q.submateri || '')}</span></div>
    ${stimLabel || ''}<div class="qtext">${md(q.text)}</div>${body}
    <div class="rv-ex"><h5>Pembahasan</h5>${md(q.explain || 'Pembahasan belum tersedia.')}</div></article>`;
}
function redPen(n) {
  return `<div class="redpen"><svg viewBox="0 0 200 170" aria-hidden="true"><path d="M104 20 C 160 14, 192 50, 186 90 C 180 134, 138 156, 94 152 C 44 148, 10 120, 15 82 C 20 44, 56 20, 112 25" fill="none" stroke="#D0312D" stroke-width="5" stroke-linecap="round"/><path d="M70 140 C 95 146, 120 146, 140 138" fill="none" stroke="#D0312D" stroke-width="3" stroke-linecap="round" opacity=".6"/></svg><div class="num">${U.fmt(n, 1)}</div><div class="lbl">Nilai akhir (0–100)</div></div>`;
}
function resultSummaryText(r) {
  const s = r.score;
  return [`Hasil Latihan ${r.subject === 'ipas' ? 'TKAD' : 'TKA'} — ${r.pkgTitle}`, `Nama: ${r.student.name}${r.student.kelas ? ' (' + r.student.kelas + ')' : ''}`, `Waktu: ${U.dateFmt(r.finishedAt, true)}`,
    `Nilai: ${U.fmt(s.nilai, 1)} | Benar: ${s.benar} | Salah: ${s.salah}${s.sebagian ? ` (${s.sebagian} benar sebagian)` : ''} | Kosong: ${s.kosong} | Akurasi: ${s.akurasi}%`,
    'Capaian per materi:', ...s.per.slice().sort((a, b) => a.label.localeCompare(b.label)).map((x) => `- ${x.label}: ${x.pct}%`),
    s.recs.length ? 'Perlu dipelajari kembali: ' + s.recs.map((x) => x.label).join('; ') : 'Semua materi tuntas (≥ 70%).'].join('\n');
}
function resultBlockHTML(r, p, forPrint) {
  const s = r.score;
  const used = Math.max(1, Math.round((r.finishedAt - r.startedAt) / 60000));
  const color = (pct) => (pct >= 80 ? 'var(--ok)' : pct >= 60 ? 'var(--ink)' : 'var(--bad)');
  const F = p ? ENGINE.flat(p) : [];
  const stale = p && r.pkgUpdated && p.updatedAt !== r.pkgUpdated;
  let lastG = -1;
  const reviews = F.map(({ no, q, g, gi }) => {
    const it = s.items.find((x) => x.id === q.id) || { status: 'kosong' };
    const lab = isSolo(g) ? (lastG = gi, soloLeadHTML(g.stimulus)) : gi !== lastG ? (lastG = gi, `<details style="margin:6px 0 8px"><summary class="small" style="cursor:pointer;color:var(--ink-700);font-weight:650">Lihat stimulus: ${esc((g.stimulus && g.stimulus.title) || 'stimulus')}</summary>${stimHTML(g.stimulus)}</details>`) : '';
    return reviewHTML(q, no, r.answers[q.id], it.status, forPrint ? '' : lab);
  }).join('');
  return `<section class="res-hero">${redPen(s.nilai)}<div>
      <div class="row" style="margin-bottom:4px">${p ? subjChip(p) : ''}<span class="small muted">${U.dateFmt(r.finishedAt, true)} • ${used} menit</span></div>
      <h1 style="font-size:22px;margin:0;color:var(--ink-900)">${esc(r.student.name)}${r.student.kelas ? ` <span class="muted" style="font-weight:600">• ${esc(r.student.kelas)}</span>` : ''}</h1>
      <div class="muted">${esc(r.pkgTitle)}</div>
      <div class="tiles"><div class="g"><b>${s.benar}</b><span>Benar</span></div><div class="r"><b>${s.salah}</b><span>Salah${s.sebagian ? ` (${s.sebagian} sebagian)` : ''}</span></div><div class="e"><b>${s.kosong}</b><span>Kosong</span></div><div class="a"><b>${s.akurasi}%</b><span>Akurasi jawaban</span></div></div>
    </div></section>
    <div class="grid-2" style="margin-top:16px">
      <section class="panel"><h2 style="font-size:17px;color:var(--ink-900)">Analisis performa per materi</h2>
        ${s.per.map((x) => `<div class="pm-row"><div><div style="font-weight:650">${esc(x.label)}</div><div class="small muted">${esc(x.materi)} • ${x.n} soal</div></div><div class="tr"><i style="width:${x.pct}%;background:${color(x.pct)}"></i></div><b style="text-align:right">${x.pct}%</b></div>`).join('')}
      </section>
      <section class="panel"><h2 style="font-size:17px;color:var(--ink-900)">Rekomendasi belajar</h2>
        ${s.recs.length ? s.recs.map((x) => `<div class="rec"><b>${esc(x.label)}</b> <span class="small muted">(${x.pct}%)</span><div class="small" style="margin-top:2px">${esc(x.tip)}</div></div>`).join('') : '<div class="callout ok">Semua materi sudah tuntas (capaian 70% atau lebih). Pertahankan dengan latihan variasi soal yang lebih menantang.</div>'}
        <p class="small muted" style="margin-top:10px">Nilai = rata-rata skor semua soal × 100. ${p && p.scoring === 'penuh' ? 'Soal kompleks dan tabel bernilai 1 hanya jika semua bagiannya tepat.' : 'Soal kompleks dan tabel diberi skor sebagian sesuai bagian yang tepat.'} Akurasi = soal benar dibagi soal yang dijawab.</p>
      </section>
    </div>
    <h2 class="section-title">Jawaban, kunci, dan pembahasan</h2>
    ${stale ? '<div class="callout warn" style="margin-bottom:12px">Naskah sudah diubah setelah latihan ini dikerjakan. Pembahasan di bawah mengikuti versi naskah terbaru.</div>' : ''}
    ${p ? reviews : '<div class="callout warn">Naskah untuk hasil ini tidak tersedia lagi di perangkat ini, sehingga hanya ringkasan nilai yang dapat ditampilkan.</div>'}`;
}

ACT['res:copy'] = async (el) => { const r = STORE.getResult(el.dataset.id); const ok = await copyText(resultSummaryText(r)); toast(ok ? 'Ringkasan hasil disalin. Tempel di WhatsApp untuk dikirim ke guru.' : 'Gagal menyalin.', ok ? 'ok' : 'bad'); };
function resultPrintParts(r) {
  const p = exPkg(r.pkgId);
  return [`<article class="sheet" style="font-family:var(--font)">${p ? kopHTML(p, 'Laporan Hasil Latihan') : ''}${resultBlockHTML(r, p, true)}</article>`, `Hasil latihan — ${r.student.name}`];

ACT['res:print'] = (el) => {

// Bila guru menekan Ctrl+P / menu Cetak browser (bukan tombol Cetak), siapkan
// dokumen cetak sesuai halaman yang sedang dibuka agar hasil cetak tidak kosong.
window.addEventListener('beforeprint', () => {
  const root = $('#print-root');
  if (!root || root.innerHTML.trim()) return;
  const h = decodeURI(location.hash);
  let m;
  try {
    if ((m = /^#\/naskah\/([^/]+)(?:\/(kunci|analisis))?$/.exec(h)) && STORE.getPkg(m[1])) {
      const [html, header] = docPrintParts(STORE.getPkg(m[1]), m[2] || 'naskah'); preparePrint(html, header);
    } else if ((m = /^#\/hasil\/([^/]+)$/.exec(h)) && STORE.getResult(m[1])) {
      const [html, header] = resultPrintParts(STORE.getResult(m[1])); preparePrint(html, header);
    } else preparePrint(`<div class="print-view">${$('#view').innerHTML}</div>`, document.title);
  } catch (e) { /* biarkan browser mencetak apa adanya */ }
});

VIEWS.studentLink = (payload) => {
  setView('<div class="wrap"><div class="empty"><h3>Membuka ujian…</h3></div></div>');
  decodePkg(payload).then((p) => {
    if (!p || !p.groups) throw new Error('Isi tautan tidak valid.');
    try { STORE.set('spkg.' + p.id, p); } catch (e) { /* abaikan bila penuh */ }
    APP.mode = 'siswa'; APP.student = p;
    location.replace('#/ujian/' + p.id);
  }).catch((e) => {
    setView(`<div class="wrap"><div class="empty"><h3>Tautan ujian tidak dapat dibuka</h3><p>${esc(e.message)}</p><p class="small">Minta guru mengirim ulang tautan atau file ujian siswa (.html).</p></div></div>`);
  });
};

// Mengenali isian yang sering tertukar sebelum menghubungi proxy.
function proxyHint(url, token) {
  const EX = 'https://script.google.com/macros/s/…/exec';
  if (/AIza[0-9A-Za-z_\-]{20,}/.test(url) || /AIza[0-9A-Za-z_\-]{20,}/.test(token)) {
    return { clear: true, msg: 'Yang ditempel adalah kunci API Gemini. Kunci ini tidak boleh diisi di aplikasi; simpan di Script Properties Apps Script dengan nama GEMINI_API_KEY. Kolom URL proxy diisi alamat web app, contoh: ' + EX };
  }
  if (/^(gen-lang-client-)?\d{5,}$/i.test(url)) return { msg: 'Itu tampaknya nomor proyek dari Google AI Studio, bukan URL proxy. URL proxy baru didapat setelah Apps Script di-deploy sebagai Web app, bentuknya: ' + EX };
  if (!/^https:\/\//i.test(url)) return { msg: 'URL proxy harus berupa alamat lengkap yang diawali https://, contoh: ' + EX };
  if (/script\.google\.com/i.test(url) && !/\/exec\/?(\?.*)?$/i.test(url)) {
    return { msg: /\/dev\/?(\?.*)?$/i.test(url) ? 'URL berakhiran /dev hanya untuk uji coba pemilik skrip. Gunakan Web app URL yang berakhiran /exec (Deploy → Manage deployments).' : 'Itu alamat editor Apps Script, bukan alamat web app. Klik Deploy → Manage deployments, lalu salin Web app URL yang berakhiran /exec.' };
  }
  return null;
}
ACT['ai:test'] = async (el) => {
  const url = $('#aiUrl').value.trim(), token = $('#aiTok').value.trim();
  const msg = $('#aiMsg');
  if (!url) { msg.innerHTML = '<span style="color:var(--bad)">Isi URL proxy terlebih dahulu.</span>'; return; }
  const hint = proxyHint(url, token);
  if (hint) {
    if (hint.clear) { $('#aiUrl').value = ''; $('#aiTok').value = ''; }
    msg.innerHTML = `<span style="color:var(--bad)">${esc(hint.msg)}</span>`;
    return;
  }
  el.disabled = true; msg.textContent = 'Menghubungi proxy…';
  try {
    const d = await AI.test(url, token);
    const s = STORE.settings(); s.ai = { url, token, verifiedAt: Date.now(), model: d.model || '', fallback: d.fallback || '', proxyV: +d.version || 1 }; STORE.saveSettings(s);
    toast('AI terhubung.', 'ok'); VIEWS.settings(); renderTopbar('/pengaturan');
  } catch (e) {
    const s = STORE.settings(); s.ai = { url, token, verifiedAt: 0, model: '' }; STORE.saveSettings(s);
    msg.innerHTML = `<span style="color:var(--bad)">Gagal: ${esc(e.message)}</span>`; renderTopbar('/pengaturan');
  } finally { el.disabled = false; }
};
ACT['ai:off'] = () => { const s = STORE.settings(); s.ai = { url: '', token: '', verifiedAt: 0, model: '' }; STORE.saveSettings(s); APP.engineChoice = 'lokal'; toast('Koneksi AI diputuskan.'); VIEWS.settings(); renderTopbar('/pengaturan'); };
ACT['ai:copy'] = async (el) => { const ok = await copyText(el.dataset.k === 'cf' ? AI.PROXY_CF : AI.PROXY_GAS); toast(ok ? 'Kode disalin.' : 'Gagal menyalin.', ok ? 'ok' : 'bad'); };
ACT['data:export'] = () => download(`TKA_GURU_cadangan_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(STORE.exportAll()), 'application/json');
ACT['data:clear'] = async () => {
  const ok = await confirmDlg('Hapus semua data?', 'Semua naskah, riwayat, dan pengaturan di browser ini akan dihapus. Ekspor terlebih dahulu bila masih diperlukan.', 'Hapus semua', true);
  if (!ok) return;
  STORE.clearAll(); const s = STORE.settings(); s.demoSeeded = true; s.demoKeys = BOOT.DEMO_KEYS.slice(); STORE.saveSettings(s);
  toast('Semua data dihapus.'); go('#/');
};
ACT['demo:restore'] = async () => {
  const s = STORE.settings(); s.hidden = []; STORE.saveSettings(s);
  const n = await BOOT.seedDemos(true);
  toast(n ? `${n} paket contoh dipulihkan.` : 'Paket contoh sudah tersedia.', 'ok');
  go('#/');
};

/* ===== 99_boot.js ===== */
/* ==========================================================================
   99_boot.js — paket contoh, mode siswa (file/tautan), dan mulai aplikasi.
   ========================================================================== */
const BOOT = (() => {
  const DEMOS = {
    mtk: { kisi: ENGINE.KISI_MTK, seed: 2026, title: 'Contoh — Latihan TKA Matematika Kelas 6 SD/MI' },
    bi: { kisi: ENGINE.KISI_BI, seed: 2026, title: 'Contoh — Latihan TKA Bahasa Indonesia Kelas 6 SD/MI' },
    ipas: { kisi: ENGINE.KISI_IPA, seed: 2026, title: 'Contoh — Latihan TKAD IPAS Kelas 6 SD/MI' },
  };
  const DEMO_KEYS = ['bi', 'mtk', 'ipas'];
  async function demoPkg(key) {
    const d = DEMOS[key];
    if (!d) throw new Error('Paket contoh tidak dikenal.');
    const a = ENGINE.analyze(d.kisi).analyses[0];
    const pkg = await ENGINE.runLocal(a, { seed: d.seed, title: d.title, kisi: d.kisi, engine: 'contoh', id: 'contoh-' + key }, async () => {});
    pkg.builtin = key; pkg.modified = false; pkg.updatedAt = pkg.createdAt;
    return pkg;
  }
  async function seedDemos(force) {
    const s = STORE.settings();
    // Paket contoh yang pernah dibuat tidak dibuat ulang (kecuali dipulihkan); paket contoh baru,
    // misalnya IPAS, ditambahkan satu kali untuk pengguna lama.
    const done = new Set(s.demoKeys || (s.demoSeeded ? ['bi', 'mtk'] : []));
    let n = 0;
    const t0 = Date.now();
    for (const key of DEMO_KEYS) {
      if (!force && (done.has(key) || (s.hidden || []).includes(key))) continue;
      done.add(key);
      if (STORE.getPkg('contoh-' + key)) continue;
      const p = await demoPkg(key);
      p.createdAt = p.updatedAt = t0 + DEMO_KEYS.indexOf(key);
      STORE.savePkg(p, false); n++;
    }
    const s2 = STORE.settings(); s2.demoSeeded = true; s2.demoKeys = Array.from(done); STORE.saveSettings(s2);
    return n;
  }
  async function start() {
    const boot = window.__TKA_BOOT__;
    if (boot && boot.mode === 'siswa' && boot.pkg) {
      APP.mode = 'siswa';
      APP.student = cleanPackage(boot.pkg);
      if (!/^#\/(ujian|hasil)\//.test(location.hash)) location.replace('#/ujian/' + APP.student.id);
    } else if (!/^#\/s\//.test(location.hash)) {
      try { await seedDemos(false); } catch (e) { console.error('Gagal membuat paket contoh', e); }
    }
    window.addEventListener('hashchange', route);
    route();
  }
  return { start, demoPkg, seedDemos, DEMO_KEYS };
})();
BOOT.start();

})();

</script>
